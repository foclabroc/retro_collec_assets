<script>const D={"systems": [{"id": "mastersystem", "name": "Master System", "count": 100, "pack": "packs/mastersystem.zip", "hash": "982103d48416", "size": 2484436, "shots_pack": "packs/mastersystem_shots.zip", "shots_hash": "bfdf7b56620a", "shots_size": 2660652}, {"id": "nes", "name": "NES", "count": 100, "pack": "packs/nes.zip", "hash": "51f5e20a1080", "size": 2642544, "shots_pack": "packs/nes_shots.zip", "shots_hash": "5ef4b8329098", "shots_size": 2243792}, {"id": "snes", "name": "Super Nintendo", "count": 100, "pack": "packs/snes.zip", "hash": "c0c2f96b2058", "size": 1708894, "shots_pack": "packs/snes_shots.zip", "shots_hash": "d39600f46fd8", "shots_size": 2108990}, {"id": "n64", "name": "Nintendo 64", "count": 100, "pack": "packs/n64.zip", "hash": "7c4d8dba3442", "size": 1623872, "shots_pack": "packs/n64_shots.zip", "shots_hash": "3273865747e9", "shots_size": 1783714}, {"id": "psx", "name": "PlayStation", "count": 100, "pack": "packs/psx.zip", "hash": "a8e843b9d48a", "size": 1952088, "shots_pack": "packs/psx_shots.zip", "shots_hash": "8a4e7bde86b0", "shots_size": 2212604}, {"id": "gba", "name": "Game Boy Advance", "count": 100, "pack": "packs/gba.zip", "hash": "f86c6c6ccc9c", "size": 2368446, "shots_pack": "packs/gba_shots.zip", "shots_hash": "3b7eb9f428eb", "shots_size": 2095360}, {"id": "megadrive", "name": "Mega Drive", "count": 100, "pack": "packs/megadrive.zip", "hash": "651a4bd2d36a", "size": 2955908, "shots_pack": "packs/megadrive_shots.zip", "shots_hash": "2c647b27500f", "shots_size": 2947614}, {"id": "gbc", "name": "Game Boy Color", "count": 100, "pack": "packs/gbc.zip", "hash": "138ec2c11625", "size": 2181296, "shots_pack": "packs/gbc_shots.zip", "shots_hash": "97c3e7bf07a1", "shots_size": 1700644}, {"id": "switch", "name": "Switch", "count": 100, "pack": "packs/switch.zip", "hash": "d4df6caeed31", "size": 2511592, "shots_pack": "packs/switch_shots.zip", "shots_hash": "98c7cfb60584", "shots_size": 2038976}, {"id": "neogeo", "name": "Neo Geo", "count": 100, "pack": "packs/neogeo.zip", "hash": "d1844eac70fe", "size": 2737798, "shots_pack": "packs/neogeo_shots.zip", "shots_hash": "7a09343e71bd", "shots_size": 2235914}], "cards": [{"id": "mastersystem_001", "s": "mastersystem", "n": 1, "t": "After Burner", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Shoot'em Up", "r": 1, "img": "mastersystem/001.webp", "shot": "shots/mastersystem/001.webp", "d": "Directement issu des salles d'arcade, After Burner sur Master System vous permet de vous installer dans le cockpit d'un F-14 Thunder Cat pour une série de missions en haute altitude. Ce shoot'em up vous donne accès à tout l'armement que l'on peut attendre d'un avion de combat dont les précieux missiles."}, {"id": "mastersystem_002", "s": "mastersystem", "n": 2, "t": "Aladdin", "y": 1994, "dv": "Nexa", "p": "Sega", "g": "Plateforme", "r": 0, "img": "mastersystem/002.webp", "shot": "shots/mastersystem/002.webp", "d": "Reprenant les différentes séquences du film d'animation de Disney, Aladdin sur Master System permet de retrouver tous les personnages de l'histoire. Ce jeu de plates-formes propose effectivement de suivre Aladdin des rues d'Agrabah aux couloirs du palais royal en passant bien sûr par la célèbre caverne aux merveilles. Le Génie est aussi de la partie et permet de gagner des bonus."}, {"id": "mastersystem_003", "s": "mastersystem", "n": 3, "t": "Alex Kidd : High-Tech World", "y": 1989, "dv": "Sega", "p": "Sega", "g": "Plateforme", "r": 0, "img": "mastersystem/003.webp", "shot": "shots/mastersystem/003.webp", "d": "Alex Kidd : High-Tech World est un jeu de plates-formes sur Master System. Le joueur incarne le petit Alex Kidd qui doit retrouver huit fragments de carte pour aller jouer dans une toute nouvelle salle d'arcade. Le jeu est décomposé en des phases d'action, des combats en forêts contre des ninjas hargneux, et des séquences d'aventures où Alex doit discuter avec les autochtones pour retrouver les fragments et résoudre diverses énigmes."}, {"id": "mastersystem_004", "s": "mastersystem", "n": 4, "t": "Alex Kidd : The Lost Stars", "y": 1989, "dv": "Sega", "p": "Sega", "g": "Plateforme", "r": 1, "img": "mastersystem/004.webp", "shot": "shots/mastersystem/004.webp", "d": "Dark Ninja revient pour tenter de prendre le contrôle de Miracle World. Quelqu'un doit l'arrêter! Devinez qui ose relever le défi ? Vous êtes Alex Kidd, le prince qui ne connaît pas la peur. Une jolie fille a été kidnappée et sa vie est en danger! Tenant son otage, le Dark Ninja prévoit d'exécuter son plan diabolique."}, {"id": "mastersystem_005", "s": "mastersystem", "n": 5, "t": "Alex Kidd in Miracle World", "y": 1986, "dv": "Sega", "p": "Sega", "g": "Plateforme / Run Jump, Action, Plateforme", "r": 4, "img": "mastersystem/005.webp", "shot": "shots/mastersystem/005.webp", "d": "Dans le pays de Raxadian, Janken le Grand fait régner la terreur. Prince du royaume, Alex Kidd décide de partir lutter contre lui afin de sauver son peuple mais aussi son frère. Ce jeu de plates-formes sur Master System offre 17 niveaux dans lesquels Alex Kidd doit combattre de nombreux ennemis, et acheter de nouveaux véhicules et vies supplémentaires. Originalité : les combats contre les Boss se jouent à pierre-feuille-ciseau !"}, {"id": "mastersystem_006", "s": "mastersystem", "n": 6, "t": "Alex Kidd in Shinobi World", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "mastersystem/006.webp", "shot": "shots/mastersystem/006.webp", "d": "Après un bannissement de dix mille ans, le Ninja noir est de retour. Il va à nouveau essayer de conquérir le Monde des miracles. Quelqu'un doit l'arrêter! Avez-vous deviné qui va oser relever le défi? Le Kidd en personne, le prince sans peur. C'est le seul qui peut le battre!"}, {"id": "mastersystem_007", "s": "mastersystem", "n": 7, "t": "Astérix", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Plateforme", "r": 2, "img": "mastersystem/007.webp", "shot": "shots/mastersystem/007.webp", "d": "Panoramix, le druide dont la potion magique a sauvé le village des attaques de César, a été kidnappé! Joignez-vous à Astérix et Obélix et aidez-les à le libérer et à écarter tout danger du village."}, {"id": "mastersystem_008", "s": "mastersystem", "n": 8, "t": "Astérix and the Secret Mission", "y": 1993, "dv": "Sega", "p": "Sega", "g": "Plateforme", "r": 2, "img": "mastersystem/008.webp", "shot": "shots/mastersystem/008.webp", "d": "Panoramix, le druide, est à court de potion magique! Si César vient à l'apprendre, c'est à coup sûr l'invasion... Pour éviter cela, Astérix et Obélix doivent trouver les herbes nécessaires pour faire la potion. Mission dangereuse! Il leur faudra traverser des mers et des fleuves, des forêts et des déserts, des temples et des ruines, tous infestés de Romains."}, {"id": "mastersystem_009", "s": "mastersystem", "n": 9, "t": "Ayrton Senna's Super Monaco GP II", "y": 1992, "dv": "Sega", "p": "Sega", "g": "Course, Conduite", "r": 0, "img": "mastersystem/009.webp", "shot": "shots/mastersystem/009.webp", "d": "Défiez le sextuple vainqueur du GP de Monaco et triple champion du monde des pilotes dans Ayrton Senna's Super Monaco GP II sur Master System. Faites-vous un nom parmi les autres compétiteurs, sur les 16 circuits du championnat du monde FIA à travers le mode World Championship ou tentez votre chance en face-à-face contre Ayrton Senna lui-même, grâce au Senna GP."}, {"id": "mastersystem_010", "s": "mastersystem", "n": 10, "t": "Aztec Adventure : The Golden Road to Paradise", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Action, Action / Aventure, Stratégie, Puzzle-Game", "r": 0, "img": "mastersystem/010.webp", "shot": "shots/mastersystem/010.webp", "d": "Bienvenue chez les anciens Aztèques, où l'argent est fait loi et où tous ennemis peuvent être achetés. Votre objectif: atteindre le \"Paradis Aztèque\", où des gages de fortune et de bonheur vous attendent."}, {"id": "mastersystem_011", "s": "mastersystem", "n": 11, "t": "Batman Returns", "y": 1993, "dv": "Aspect Co", "p": "Sega", "g": "Plateforme, Action, Combat, Shoot'em Up, Sport", "r": 0, "img": "mastersystem/011.webp", "shot": "shots/mastersystem/011.webp", "d": "Dans Batman Returns sur Master System, vous défendez Gotham City et tentez de faire échouer les plans du Pingouin et ses hommes. Vous évoluez sur terre ainsi que dans les airs grâce aux gadgets que vous assignez à la ceinture de Batman."}, {"id": "mastersystem_012", "s": "mastersystem", "n": 12, "t": "Black Belt", "y": 1986, "dv": "Sega", "p": "Sega", "g": "Action, Beat'em All", "r": 1, "img": "mastersystem/012.webp", "shot": "shots/mastersystem/012.webp", "d": "L'histoire se déroule dans les années 1990 sur une terre ravagée par une guerre nucléaire. Dans ce désert post-apocalyptique, vous jouez un Maitre du Hokuto Shinken nommé Kenshiro, dit Ken, votre fiancée a été kidnappée par Raoh votre frère adoptif, et pour la sauver, vous devez traverser une armée infatigable d'ennemis."}, {"id": "mastersystem_013", "s": "mastersystem", "n": 13, "t": "Bomber Raid", "y": 1988, "dv": "Sanritsu", "p": "Sega", "g": "Action, Shoot'em Up", "r": 0, "img": "mastersystem/013.webp", "shot": "shots/mastersystem/013.webp", "d": "Bomber Raid sur Master System est un shoot'em up où vous pilotez un avion de chasse et affrontez des chasseurs aériens, sous-marins, ainsi que des hélicoptères. Chacune des cinq missions est ponctuée par l'affrontement avec l'objectif principal, indiqué lors du briefing."}, {"id": "mastersystem_014", "s": "mastersystem", "n": 14, "t": "Bubble Bobble", "y": 1986, "dv": "Taito", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "mastersystem/014.webp", "shot": "shots/mastersystem/014.webp", "d": "Bubble Bobble sur Master System est un jeu d'action dans lequel on incarne Bub et Bob, deux enfants transformés en dinosaures qui vont devoir sauver leurs fiancées des griffes de Bubbla. Le jeu se déroule sur des tableaux dans lesquels apparaissent des ennemis qu'il faut emprisonner dans des bulles avant de les faire exploser pour récupérer des points, tout en prenant en compte les courants d'air susceptibles de faire dévier les bulles, le tout sur une centaine de niveaux."}, {"id": "mastersystem_015", "s": "mastersystem", "n": 15, "t": "California Games", "y": 1989, "dv": "Epyx", "p": "Sega", "g": "Sport", "r": 0, "img": "mastersystem/015.webp", "shot": "shots/mastersystem/015.webp", "d": "Avec California Games sur Master System revivez les années 80 avec ce jeu de sport multi-épreuves (ou \"jeu de sport à plusieurs séries d'épreuves\"). Exercez-vous au surf, au skateboard, au roller, au lancer de disque et à bien d'autres activités, seul ou contre vos amis (sept maximum). De quoi vous amuser pendant un moment !"}, {"id": "mastersystem_016", "s": "mastersystem", "n": 16, "t": "Captain Silver", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "mastersystem/016.webp", "shot": "shots/mastersystem/016.webp", "d": "Dans Captain Silver sur Master System, incarnez Jim, un jeune homme ayant le goût de l'aventure qui embarque dans une expédition à la recherche d'un trésor secret. Durant son voyage, traversez villages, jungles et bateaux pour atteindre les mers de l'est dans un jeu de plates-formes où le fait de collecter toutes les lettres de Captain Silver donne une vie supplémentaire. En avant, moussaillon !"}, {"id": "mastersystem_017", "s": "mastersystem", "n": 17, "t": "Castle of Illusion Starring Mickey Mouse", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 3, "img": "mastersystem/017.webp", "shot": "shots/mastersystem/017.webp", "d": "Castle of Illusion starring Mickey Mouse sur Master System est un jeu de plates-formes où vous devez sauver Minnie des griffes de la sorcière Mizrabel. Incarnez Mickey dans cette aventure où chacune des portes du château renferme bien des surprises."}, {"id": "mastersystem_018", "s": "mastersystem", "n": 18, "t": "Champions of Europe", "y": 1992, "dv": "Tecmagik", "p": "Tecmagik", "g": "Sport / Football, Sport", "r": 0, "img": "mastersystem/018.webp", "shot": "shots/mastersystem/018.webp", "d": "Champions of Europe sur Master System est un jeu de football où vous pouvez prendre les commandes d'une des équipes participant au championnat d'Europe des nations. En match amical ou lors des phases finales, emmenez votre équipe favorite vers la victoire."}, {"id": "mastersystem_019", "s": "mastersystem", "n": 19, "t": "Choplifter", "y": 1986, "dv": "Sega", "p": "Sega", "g": "Action", "r": 0, "img": "mastersystem/019.webp", "shot": "shots/mastersystem/019.webp", "d": "Choplifter sur Master System est un jeu d'action qui vous met aux commandes d'un hélicoptère d'attaque. Votre mission est de franchir les lignes ennemies et de sauver 16 otages par niveau. Soyer prudent, les chars et avions ennemis feront tout pour vous arrêter."}, {"id": "mastersystem_020", "s": "mastersystem", "n": 20, "t": "Cloud Master", "y": 1989, "dv": "Opera House", "p": "Sega", "g": "Action, Shoot'em Up", "r": 0, "img": "mastersystem/020.webp", "shot": "shots/mastersystem/020.webp", "d": "Dans le shoot'em up Cloud Master sur Master System, vous incarnez un petit personnage perché sur un nuage qui doit envoyer des boules de feu sur ses nombreux ennemis. Les adversaires sont aussi variés que des bols de nouilles ou des ours armés ! Des visites régulières dans une boutique permettront au héros d'améliorer son attaque et sa défense."}, {"id": "mastersystem_021", "s": "mastersystem", "n": 21, "t": "Cyborg Hunter", "y": 1998, "dv": "Sega", "p": "Sega", "g": "Action, Aventure", "r": 0, "img": "mastersystem/021.webp", "shot": "shots/mastersystem/021.webp", "d": "Cybor Hunter sur Master System est un jeu de plates-formes se déroulant en 2242. Les cyborgs sont sur le point de prendre le contrôle de la galaxie. Vous incarnez Paladin qui se rend à la forteresse des cyborgs et tente, sept niveax durant, de stopper l'invasion. Tout au long du jeu, Paladin est doté d'un plan de la forteresse et d'un radar permettant de repérer les cyborgs."}, {"id": "mastersystem_022", "s": "mastersystem", "n": 22, "t": "Danan : The Jungle Fighter", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Action, Aventure", "r": 0, "img": "mastersystem/022.webp", "shot": "shots/mastersystem/022.webp", "d": "Danan, le nouveau né qui fût sauvé des restes d'un avion écrasé par Jimba, un membre d'une tribu amazone, rentrait un jour de la chasse lorsqu'il trouva son gardien mortellement blessé! Qu'était-il arrivé à Jimba? Qui ferait une chose pareille? Aidez Danan à trouver les réponses, à s'enfoncer dans la jungle chaude et humide de l'Amazone, en reconstituant le puzzle petit à petit et vengez la mort de Jimba!"}, {"id": "mastersystem_023", "s": "mastersystem", "n": 23, "t": "Dead Angle", "y": 1989, "dv": "Sega", "p": "Sega", "g": "Action, Tir Avec Accessoire", "r": 0, "img": "mastersystem/023.webp", "shot": "shots/mastersystem/023.webp", "d": "Dead Angle sur Master System est un jeu de tir à la première personne. Le joueur incarne un individu dont la petite amie a été kidnappée par la mafia. Fort logiquement, il décide de tuer tous les hommes de main qu'il croise sur son chemin afin de retrouver sa bien aimée. Chaque niveau est limité dans le temps et se ponctue par un affrontement face à l'un des gros bonnets du gang."}, {"id": "mastersystem_024", "s": "mastersystem", "n": 24, "t": "Deep Duck Trouble Starring Donald Duck", "y": 1993, "dv": "Sega", "p": "Sega", "g": "Action, Sport, Plateforme", "r": 0, "img": "mastersystem/024.webp", "shot": "shots/mastersystem/024.webp", "d": "Dans le jeu de plates-formes Deep Duck Trouble sur Master System, le joueur doit suivre le carnet de bord de Picsou pour inverser la malédiction qui le fait flotter dans les airs tel un ballon. En compagnie de Donald, traversez îles, jungles et volcans et battez un boss à chaque fin de niveau."}, {"id": "mastersystem_025", "s": "mastersystem", "n": 25, "t": "Desert Strike", "y": 1992, "dv": "The Kremlin", "p": "Domark", "g": "Shoot'em Up", "r": 0, "img": "mastersystem/025.webp", "shot": "shots/mastersystem/025.webp", "d": "Desert Strike : Return to the Gulf sur Master System est le premier jeu de la série Strike. L'histoire prend place un an après la guerre du Golfe alors qu'un général tyrannique menace le Moyen-Orient et les Etats-Unis. Le président vous charge d'abattre le général Kilbaba et ses terroristes, avant qu'ils n'engagent un conflit nucléaire mondial. Vous pilotez un hélicoptère Apache et vos objectifs sont divers : porter secours, détruire des objectifs, détourner des missiles..."}, {"id": "mastersystem_026", "s": "mastersystem", "n": 26, "t": "Double Dragon", "y": 1990, "dv": "Arc System Works", "p": "Sega", "g": "Action, Beat'em All", "r": 2, "img": "mastersystem/026.webp", "shot": "shots/mastersystem/026.webp", "d": "Double Dragon sur Master System est un beat'em all se déroulant dans un New York chaotique, au coeur des années 90. Seul ou à 2, vous incarnez Billy et Jim Lee, deux frères enseignant les arts martiaux. L'histoire débute lorsque la petite amie de Billy est kidnappée par un gang urbain. Les deux frères décident alors d'aller directement en découdre avec la bande adverse."}, {"id": "mastersystem_027", "s": "mastersystem", "n": 27, "t": "Dragon Crystal", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Jeu De Rôles", "r": 0, "img": "mastersystem/027.webp", "shot": "shots/mastersystem/027.webp", "d": "Dragon Crystal sur Master System est un jeu de rôle. Vous combattez vos ennemis au tour par tour, en traversant des niveaux où l'objectif initial est de trouver un téléporteur qui vous mènera au niveau suivant. Un oeuf vous accompagne, à vous de le choyer pour qu'il devienne un puissant dragon !"}, {"id": "mastersystem_028", "s": "mastersystem", "n": 28, "t": "Dynamite Dux", "y": 1989, "dv": "Am2", "p": "Sega", "g": "Beat'em All", "r": 0, "img": "mastersystem/028.webp", "shot": "shots/mastersystem/028.webp", "d": "Dynamite Düx sur Master System est un beat'em up dans un univers cartoon, coloré et décalé. L'objectif est de sauver Lucy, la petite amie du héros, enlevée par Archaca. Le joueur incarne Bin, un canard et doit affronter des adversaires inhabituels aux modèles du genre. En effet, en lieu et place des traditionnels bandits, ce sont des vaches et crocodiles qu'il faut battre."}, {"id": "mastersystem_029", "s": "mastersystem", "n": 29, "t": "Ecco the Dolphin", "y": 1993, "dv": "Novotrade", "p": "Sega", "g": "Action, Aventure", "r": 0, "img": "mastersystem/029.webp", "shot": "shots/mastersystem/029.webp", "d": "Ecco the Dolphin sur Master System est un jeu d'action qui a l'originalité de mettre le joueur aux commandes d'un dauphin. L'histoire débute lorsque Ecco assiste impuissant à la disparition de tout l'écosystème, emporté par une mystérieuse tempête. 25 niveaux durant, explorez les abîmes et résolvez de nombreuses énigmes afin de ramener le calme au sein de la crique."}, {"id": "mastersystem_030", "s": "mastersystem", "n": 30, "t": "Enduro Racer", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Course, Conduite", "r": 1, "img": "mastersystem/030.webp", "shot": "shots/mastersystem/030.webp", "d": "Enduro Racer sur Master System est un jeu de courses où vous prenez les commandes d'une moto tout terrain. Les courses se déroulent dans des environnements variés tels que la forêt, la montagne, une île ou le désert. A moto ou en voiture, les adversaires rencontrés ne vous font pas de cadeau et chaque véhicule doublé rapporte des points convertibles en amélioration de votre moto."}, {"id": "mastersystem_031", "s": "mastersystem", "n": 31, "t": "Fantasy Zone", "y": 1986, "dv": "Sega", "p": "Sega", "g": "Action, Shoot'em Up", "r": 2, "img": "mastersystem/031.webp", "shot": "shots/mastersystem/031.webp", "d": "Fantasy Zone est un shoot'em up sur Master System. Vous incarnez un vaisseau spatial, assailli par de nombreux ennemis volants non identifiés. Le jeu n'est pas linéaire et vous permet de vous déplacer vers la droite ou la gauche pour aller traquer de l'alien. Le design est coloré et les monstres originaux."}, {"id": "mastersystem_032", "s": "mastersystem", "n": 32, "t": "Fantasy Zone II : The Tears of Opa-Opa", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Shoot'em Up", "r": 2, "img": "mastersystem/032.webp", "shot": "shots/mastersystem/032.webp", "d": "Fantasy Zone II sur Master System est un jeu de tir dans lequel vous contrôlez un vaisseau spatial. Muni de différentes armes telles que des bombes ou des missiles, évitez ou anéantissez les ennemis pour rester en vie et finir le niveau."}, {"id": "mastersystem_033", "s": "mastersystem", "n": 33, "t": "Gauntlet", "y": 1990, "dv": "Tiertex", "p": "Us Gold", "g": "Action", "r": 0, "img": "mastersystem/033.webp", "shot": "shots/mastersystem/033.webp", "d": "Gauntlet sur Master System est un jeu d'action hack and slash dont l'objectif est de tuer tous ses assaillants dans un labyrinthe et d'atteindre le niveau suivant. Pour ce faire, le joueur a le choix entre quatre personnages différents. Chacun possède ses propres caractéristiques et correspond à un style de combat particulier. Gauntlet peut être joué à deux simultanément en coopératif."}, {"id": "mastersystem_034", "s": "mastersystem", "n": 34, "t": "Ghostbusters", "y": 1989, "dv": "Compile", "p": "Sega", "g": "Action", "r": 0, "img": "mastersystem/034.webp", "shot": "shots/mastersystem/034.webp", "d": "GhostBusters sur Master System est un jeu d'action basé sur le film S.O.S. Fantômes. Vous incarnez la fine équipe de chasseurs de fantômes et vous vous attaquez à toutes formes d'activités paranormales. Armé de votre fusil à protons, capturez tous les revenants indésirables de New York et mettez Guzer, le dieu summérien, hors d'état de nuire."}, {"id": "mastersystem_035", "s": "mastersystem", "n": 35, "t": "Ghouls'n Ghosts", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action", "r": 0, "img": "mastersystem/035.webp", "shot": "shots/mastersystem/035.webp", "d": "Ghouls'n Ghost sur Master system est un jeu d'action se déroulant dans un univers médiéval. L'histoire débute lorsque des revenants attaquent le royaume et capturent la petite amie du chevalier Arthur. Incarnez ce dernier et partez en croisade contre les envahisseurs avant qu'ils ne sacrifient sa dulcinée pour ressusciter un démon terrifiant."}, {"id": "mastersystem_036", "s": "mastersystem", "n": 36, "t": "Golden Axe Warrior", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Jeu De Rôles, Aventure", "r": 3, "img": "mastersystem/036.webp", "shot": "shots/mastersystem/036.webp", "d": "Golden Axe Warrior est un beat'em up sur Master System se déroulant des années après les événements du premier opus. L'histoire débute lorsqu'un proche du roi le trahit en volant les 9 cristaux pour les donner à Death Adder, un géant maléfique. Votre mission consiste à récupérer les cristaux cachés dans 9 donjons, pour éviter que le royaume ne sombre."}, {"id": "mastersystem_037", "s": "mastersystem", "n": 37, "t": "Golvellius", "y": 1988, "dv": "Compile", "p": "Sega", "g": "Aventure", "r": 1, "img": "mastersystem/037.webp", "shot": "shots/mastersystem/037.webp", "d": "Golvellius : Valley of Doom sur Master System est un jeu d'action/aventure dans lequel vous incarnez le guerrier Kenesis chargé de sauver la princesse des griffes de Golvellius. Pour le retrouver, Kenesis doit tuer 7 démons cloîtrés dans des donjons lugubres. Afin de faciliter sa quête, il peut récupérer de l'or tout au long de son aventure et l'échanger contre des potions diverses."}, {"id": "mastersystem_038", "s": "mastersystem", "n": 38, "t": "Great Volleyball", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Sport / Volleyball, Sport", "r": 0, "img": "mastersystem/038.webp", "shot": "shots/mastersystem/038.webp", "d": "Dans Great Volleyball sur Master System, créez votre équipe de six joueurs et emmenez-la aux quatre coins du monde participer aux plus grands tournois. En amont, un mode Entraînement est proposé pour prendre en main toutes les subtilités propres au volley, sport collectif par excellence."}, {"id": "mastersystem_039", "s": "mastersystem", "n": 39, "t": "Hang-On", "y": 1985, "dv": "Sega", "p": "Sega", "g": "Course, Conduite", "r": 1, "img": "mastersystem/039.webp", "shot": "shots/mastersystem/039.webp", "d": "Hang-On sur Master System est un jeu de courses vous mettant aux commandes d'une moto surpuissante. Le principe est d'atteindre les checkpoints le plus rapidement possible tout en évitant les véhicules et obstacles divers sur votre chemin. Le temps joue contre vous et vous n'avez pas une seconde à perdre. A vos marques..."}, {"id": "mastersystem_040", "s": "mastersystem", "n": 40, "t": "Indiana Jones and the Last Crusade", "y": 1990, "dv": "Tiertex", "p": "Us Gold", "g": "Plateforme", "r": 0, "img": "mastersystem/040.webp", "shot": "shots/mastersystem/040.webp", "d": "Indiana Jones and the Last Crusade sur Master System est un jeu de plates-formes tiré du film éponyme. 4 niveaux durant, vivez les aventures du célèbre archéologue et combattez les nazis au poing ou avec votre fouet. Au-delà de la quête principale, à savoir la recherche du Graal, Indiana traverse différentes scènes du film dans lesquelles il doit trouver la croix de Conorado, un bouclier ainsi que son journal."}, {"id": "mastersystem_041", "s": "mastersystem", "n": 41, "t": "Kenseiden", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action", "r": 1, "img": "mastersystem/041.webp", "shot": "shots/mastersystem/041.webp", "d": "Vous êtes Hayato un guerrier Samurai absolument sans peur. Vous devez retrouver l'épée qui a été volée et les parchemins... et vaincre tous les démons qui vous attendent dans le Château Noir."}, {"id": "mastersystem_042", "s": "mastersystem", "n": 42, "t": "Kung Fu Kid", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Action, Beat'em All", "r": 0, "img": "mastersystem/042.webp", "shot": "shots/mastersystem/042.webp", "d": "Kung Fu Kid sur Master System est un jeu d'action où vous devez traverser 7 niveaux avant d'atteindre le boss final. Vous avez 99 secondes pour accomplir chaque round, chacun vous opposant à plusieurs acolytes et à un boss. Des points bonus vous sont accordés à chaque fin de round en fonction de votre énergie restante et du temps non utilisé."}, {"id": "mastersystem_043", "s": "mastersystem", "n": 43, "t": "Land of Illusion Starring Mickey Mouse", "y": 1992, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 2, "img": "mastersystem/043.webp", "shot": "shots/mastersystem/043.webp", "d": "Accompagnez Mickey dans des châteaux hantés en ruines, des cavernes sombres, une forêt enchantée et un magasin de jouets complètement fou! Utilisez votre intelligence et la magie de Mickey pour éviter les pièges, explorer les passages secrets et rétablir la paix et la joie dans Land of Illusion!"}, {"id": "mastersystem_044", "s": "mastersystem", "n": 44, "t": "Le Livre de la Jungle", "y": 1994, "dv": "Syrox Developments", "p": "Virgin Interactive Entertainment", "g": "Course, Conduite", "r": 0, "img": "mastersystem/044.webp", "shot": "shots/mastersystem/044.webp", "d": "Le Livre de la Jungle est l'adaptation du film de Disney de 1967, lui-même inspiré du livre écrit par Rudyard Kipling. Vous incarnez Mowgli et devez ramasser des fruits, grimper aux arbres et combattre les ennemis de l'histoire comme Sher Khan. Le jeu permet de replonger dans l'univers d'un des classiques de Disney en retrouvant tous ses personnages et ses décors."}, {"id": "mastersystem_045", "s": "mastersystem", "n": 45, "t": "Le Roi Lion", "y": 1994, "dv": "Syrox Developments", "p": "Virgin", "g": "Plateforme", "r": 0, "img": "mastersystem/045.webp", "shot": "shots/mastersystem/045.webp", "d": "Le Roi Lion est l'adaptation sur Master System du film de Disney sorti en 1994. Vous parcourez la savane avec Simba, de son plus jeune âge jusqu'à son retour dans la tribu des lions à l'âge adulte. Tous les personnages et passages du film sont présents, de même que les musiques qui permettent aux nostalgiques de plonger pleinement dans l'univers d'un des classiques de Disney."}, {"id": "mastersystem_046", "s": "mastersystem", "n": 46, "t": "Lemmings", "y": 1991, "dv": "Probe", "p": "Sega", "g": "Stratégie, Course, Conduite", "r": 1, "img": "mastersystem/046.webp", "shot": "shots/mastersystem/046.webp", "d": "Votre tâche dans Lemmings sur Master System est de secourir les petites créatures aux cheveux verts sur 120 niveaux. Un pourcentage d'individus à maintenir en vie vous est indiqué pour chaque mission. A vous de vous adapter à la configuration du terrain de jeu en assignant des tâches telles que creuser, construire un escalier ou encore bloquer le passage dans l'optique de ramener à bon port vos infatigables Lemmings."}, {"id": "mastersystem_047", "s": "mastersystem", "n": 47, "t": "Les Schtroumpfs", "y": 1994, "dv": "Bit Managers", "p": "Infogrames", "g": "Plateforme", "r": 0, "img": "mastersystem/047.webp", "shot": "shots/mastersystem/047.webp", "d": "Dans Les Schtroumpfs sur Master System vous incarnez un habitant du village, désigné pour aller porter secours à trois de ses amis, capturés par le diabolique Gargamel. Tracez votre route à travers les forêts, montagnes, marais et autres grottes dans ce jeu de plates-formes au visuel fidèle à la BD."}, {"id": "mastersystem_048", "s": "mastersystem", "n": 48, "t": "Lord of the Sword", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Jeu De Rôles, Aventure", "r": 0, "img": "mastersystem/048.webp", "shot": "shots/mastersystem/048.webp", "d": "Lord of the Sword sur Master System est un jeu d'action se déroulant dans le monde Balinja emporté par le désordre et la terreur. Incarnez Landau, un guerrier sans peur ni reproches qui tente de retrouver la couronne du royaume et ramener la paix. Pour ce faire, il doit passer avec succès trois épreuves, à savoir trouver un arbre magique, tuer un Goblin et détruire une statue maléfique."}, {"id": "mastersystem_049", "s": "mastersystem", "n": 49, "t": "Master of Darkness", "y": 1988, "dv": "Sims", "p": "Sega", "g": "Action", "r": 1, "img": "mastersystem/049.webp", "shot": "shots/mastersystem/049.webp", "d": "L'ombre de Dracula plane sur l'Angleterre victorienne. Combattez les monstres de Dracula dans les rues étranges et dangereuses et les entrepôts sombres. Trouvez Dracula, le maître des ténèbres, et sauvez l'Angleterre!"}, {"id": "mastersystem_050", "s": "mastersystem", "n": 50, "t": "Mercs", "y": 1991, "dv": "Tiertex", "p": "Sega", "g": "Action", "r": 0, "img": "mastersystem/050.webp", "shot": "shots/mastersystem/050.webp", "d": "Mercs est un jeu d'action sur Master System. Vous êtes un soldat d'une unité antiterroriste et votre mission est de sauver le Président, otage d'un groupuscule d'Afrique Centrale. Il faudra éliminer un maximum d'ennemis au cours des huit niveaux que compte le jeu. Plusieurs armes différentes peuvent être ramassées en route et un boss vous attend à chaque fin de niveau."}, {"id": "mastersystem_051", "s": "mastersystem", "n": 51, "t": "Miracle Warriors : Seal of the Dark Lord", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Jeu De Rôles", "r": 1, "img": "mastersystem/051.webp", "shot": "shots/mastersystem/051.webp", "d": "Miracle Warriors sur Master System est un jeu de rôle dans lequel vous incarnez un guerrier chargé de retrouver un sceau en or. Recrutez trois compagnons d'armes et traversez les cinq mondes magiques afin d'arracher le sceau des griffes du terrible seigneur Terranin. Durant votre aventure, récoltez de l'argent en tuant des créatures afin d'acheter divers équipements dans les villages."}, {"id": "mastersystem_052", "s": "mastersystem", "n": 52, "t": "Mortal Kombat", "y": 1993, "dv": "Probe", "p": "Arena Entertainment", "g": "Action, Combat", "r": 1, "img": "mastersystem/052.webp", "shot": "shots/mastersystem/052.webp", "d": "Battez vos adversaires pour défier le guerrier Shokan nommé Goro, champion du tournoi depuis plus de 500 ans. Adaptation du célébrissime jeu d'arcade, Mortal Kombat sur Master System vous permet d'incarner 8 prétendants à la victoire finale, dont les protégés du seigneur Raiden, seuls remparts contre la menace qui pèse sur le Royaume de la Terre."}, {"id": "mastersystem_053", "s": "mastersystem", "n": 53, "t": "My Hero", "y": 1986, "dv": "Sega", "p": "Sega", "g": "Action, Beat'em All", "r": 0, "img": "mastersystem/053.webp", "shot": "shots/mastersystem/053.webp", "d": "My Hero sur Master System est un beat'em all dans lequel vous incarnez un jeune homme parti à la rescousse de sa petite amie, kidnappée par un gang. Voyous, chiens d'attaque, grenouilles, tels seront les ennemis auxquels vous devrez vous confronter avant d'atteindre le chef du gang, le redoutable mohikan."}, {"id": "mastersystem_054", "s": "mastersystem", "n": 54, "t": "Ninja Gaiden", "y": 1990, "dv": "Sims", "p": "Sega", "g": "Plateforme, Action", "r": 1, "img": "mastersystem/054.webp", "shot": "shots/mastersystem/054.webp", "d": "Ninja Gaiden (Shadow Warriors sur d'autres supports) est un beat'em all sorti sur Master System. Vous êtes Ryu, un ninja moderne, et vous devez partir en Amérique pour découvrir qui a tué votre père. Vos recherches vous conduiront dans un scénario surnaturel."}, {"id": "mastersystem_055", "s": "mastersystem", "n": 55, "t": "Operation Wolf", "y": 1990, "dv": "Taito", "p": "SEGA", "g": "Action, Tir Avec Accessoire", "r": 0, "img": "mastersystem/055.webp", "shot": "shots/mastersystem/055.webp", "d": "Operation Wolf est un jeu de tir sur Master System adapté de la célèbre borne d'arcade. Vous êtes un mercenaire envoyé dans la jungle par le gouvernement américain pour sauver des otages retenus par des guérilleros locaux. Traversez 6 missions et sauvez un maximum de gens avec votre mitrailleuse et vos grenades pour obtenir la meilleure fin possible et la plus grosse prime remise par le Président des États-Unis himself !"}, {"id": "mastersystem_056", "s": "mastersystem", "n": 56, "t": "Out Run", "y": 1987, "dv": "Am R&D Dept. #2", "p": "Sega", "g": "Course, Conduite", "r": 1, "img": "mastersystem/056.webp", "shot": "shots/mastersystem/056.webp", "d": "OutRun sur Master System est l'adaptation de la célébrissime version arcade. Vous êtes au volant d'une rutilante Ferrari Testarossa, avec à vos côtés une jolie blonde que vous tenterez d'épater grâce à vos talents de pilote."}, {"id": "mastersystem_057", "s": "mastersystem", "n": 57, "t": "Out Run Europa", "y": 1991, "dv": "Probe Software Ltd.", "p": "Us Gold", "g": "Course, Conduite", "r": 0, "img": "mastersystem/057.webp", "shot": "shots/mastersystem/057.webp", "d": "OutRun Europa sur Master System reprend la recette qui a fait le succès du précédent volet. Les courses se déroulent en Europe et vous pouvez désormais piloter d'autres véhicules que la Ferrari pour boucler le parcours dans le temps qui vous est imparti."}, {"id": "mastersystem_058", "s": "mastersystem", "n": 58, "t": "Penguin Land", "y": 1992, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "mastersystem/058.webp", "shot": "shots/mastersystem/058.webp", "d": "Bienvenue à Penguin Land. Votre mission: des œufs bien fragiles sont perdus en terre étrangère et vous devez les ramener chez eux sains et saufs. Le voyage que vous allez entreprendre vous fera traverser de mystérieuses cavernes où des animaux dangereux sont prêts à vous attaquer et à détruire vos œufs."}, {"id": "mastersystem_059", "s": "mastersystem", "n": 59, "t": "Phantasy Star", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Action / Labyrinthe, Jeu De Rôles", "r": 3, "img": "mastersystem/059.webp", "shot": "shots/mastersystem/059.webp", "d": "Phantasy Star sur Master System est un jeu de rôle dans lequel vous incarnez une jeune fille nommée Alis. L'histoire débute lorsque son frère est assassiné par Lassic. Alis se lance alors dans une quête pour stopper Lassic et, par la même occasion, sauver le monde. Les combats se déroulent en tour par tour et certains environnements sont visibles en 3 dimensions."}, {"id": "mastersystem_060", "s": "mastersystem", "n": 60, "t": "Populous", "y": 1991, "dv": "Bullfrog", "p": "Tecmagik", "g": "Stratégie", "r": 1, "img": "mastersystem/060.webp", "shot": "shots/mastersystem/060.webp", "d": "Populous sur Master System est un jeu de stratégie qui vous propose de vous mettre dans la peau du Créateur. Commandez une civilisation et venez à bout des populations sous la joute de dieux adverses. En tant que Dieu, vous pouvez modeler les reliefs à votre aise, jeter des sorts, commander vos troupes et fabriquer des héros pour influencer les masses, et ce, dans plus de 500 mondes."}, {"id": "mastersystem_061", "s": "mastersystem", "n": 61, "t": "Power Strike", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Shoot'em Up", "r": 2, "img": "mastersystem/061.webp", "shot": "shots/mastersystem/061.webp", "d": "Power Strike sur Master System est un shoot'em up dans lequel vous prenez les commandes d'un avion de chasse futuriste. Six niveaux durant, vous partez en croisade contre les envahisseurs extraterrestres. Sur terre ou dans les airs, détruisez tout ce qui bouge et renvoyez les aliens sur leur planète originelle."}, {"id": "mastersystem_062", "s": "mastersystem", "n": 62, "t": "Power Strike II", "y": 1993, "dv": "Compile", "p": "Sega", "g": "Action, Shoot'em Up", "r": 0, "img": "mastersystem/062.webp", "shot": "shots/mastersystem/062.webp", "d": "Power Strike II sur Master System est un shoot'em up dans lequel vous prenez les commandes d'un avion de chasse futuriste. Six niveaux durant, vous partez en croisade contre les envahisseurs extraterrestres. Sur terre ou dans les airs, détruisez tout ce qui bouge et renvoyez les aliens sur leur planète originelle."}, {"id": "mastersystem_063", "s": "mastersystem", "n": 63, "t": "Prince of Persia", "y": 1992, "dv": "Domark", "p": "Domark", "g": "Action, Plateforme", "r": 1, "img": "mastersystem/063.webp", "shot": "shots/mastersystem/063.webp", "d": "Prince of Persia sur Master System est un jeu de plates-formes se déroulant dans le Moyen-Orient. Le joueur contrôle le Prince de Perse qui peut marcher, courir, se baisser, sauter, s'accrocher et combattre à l'épée. Le but est de terminer tous les niveaux pour libérer la princesse dans le temps imparti, c'est-à-dire une heure. Chaque niveau consiste en un donjon de plus en plus grand et parsemé d'embûches (précipices, dalles se dérobant sous les pieds, pics sortant du sol)."}, {"id": "mastersystem_064", "s": "mastersystem", "n": 64, "t": "Psychic World", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "mastersystem/064.webp", "shot": "shots/mastersystem/064.webp", "d": "Psychic World sur Master System vous met dans la peau de l'assistante d'un scientifique, dotée de pouvoirs télékinétiques. Vous avez échappé à l'explosion d'une partie du laboratoire d'expériences, duquel des monstres se sont échappés. Votre mission est de retrouver la deuxième assistante du professeur."}, {"id": "mastersystem_065", "s": "mastersystem", "n": 65, "t": "Psycho Fox", "y": 1989, "dv": "Tokai Engineering", "p": "Sega", "g": "Action, Puzzle-Game", "r": 3, "img": "mastersystem/065.webp", "shot": "shots/mastersystem/065.webp", "d": "Psycho Fox est un jeu d'aventure centré sur les escapades amusantes et mouvementées d'un renard très spécial. Psycho Fox s'aventure dans des mondes bizarres pour terrasser les bêtes étranges et les monstres en chef qu'il rencontre."}, {"id": "mastersystem_066", "s": "mastersystem", "n": 66, "t": "Quartet", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "mastersystem/066.webp", "shot": "shots/mastersystem/066.webp", "d": "Dans le jeu d'action Quartet sur Master System vous devez récupérer des clés sur les boss de fin de niveau afin d'aller au prochain niveau. Seulement c'est sans compter sur les autochtones locaux qui feront tout pour vous empêcher d'y arriver. Enfournez votre jetpack, armez votre pistolet et en route vers l'aventure."}, {"id": "mastersystem_067", "s": "mastersystem", "n": 67, "t": "R-Type", "y": 1988, "dv": "Compile", "p": "Sega", "g": "Action, Shoot'em Up", "r": 2, "img": "mastersystem/067.webp", "shot": "shots/mastersystem/067.webp", "d": "R-Type sur Master System est un shoot'em up retraçant les guerres intersidérales entre les terriens et l'empire Bydo. Vous contrôlez un vaisseau spatial, le R 9 et débutez armé d'un simple canon apte pour détruire les ennemis les plus fragiles. Par la suite, vous installez différents canons sur votre vaisseau, chacun étant recommandé pour un type de structure particulière."}, {"id": "mastersystem_068", "s": "mastersystem", "n": 68, "t": "Rampage", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action", "r": 1, "img": "mastersystem/068.webp", "shot": "shots/mastersystem/068.webp", "d": "Rampage sur Master System est un jeu d'action ou à proprement parler un véritable défouloir. Le joueur incarne l'une des trois créatures géantes au choix (gorille, lézard ou loup garou). L'objectif est de mettre une ville à sac en rasant les immeubles et en piétinant les forces de l'ordre qui osent se mettre sur votre chemin. Bon carnage."}, {"id": "mastersystem_069", "s": "mastersystem", "n": 69, "t": "Rastan", "y": 1988, "dv": "Taito", "p": "Taito", "g": "Action, Plateforme", "r": 1, "img": "mastersystem/069.webp", "shot": "shots/mastersystem/069.webp", "d": "Rastan sur Master System est un jeu d'action où le combat prédomine. Vous devez sauver les Terres de Lograth d'une fin obscure en combattant à l'aide de haches et d'épées, chimères et autres démons menaçants. Vous aurez la possibilité d'améliorer la puissance de vos armes et de votre bouclier grâce aux bonus disséminés dans les niveaux."}, {"id": "mastersystem_070", "s": "mastersystem", "n": 70, "t": "Secret Command", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Action, Tir, Tir / Run And Gun", "r": 0, "img": "mastersystem/070.webp", "shot": "shots/mastersystem/070.webp", "d": "Rambo : First Blood Part II sur Master System (également connu sous le nom de Secret Commando) est un jeu d'action où vous incarnez le célèbre guerrier sans peur ni reproches, John Rambo. Seul ou à 2 joueurs, attaquez des camps ennemis au Vietnam et libérez vos compatriotes faits prisonniers."}, {"id": "mastersystem_071", "s": "mastersystem", "n": 71, "t": "Sensible Soccer", "y": 1993, "dv": "Eurocom Entertainment Software", "p": "Sony Imagesoft", "g": "Sport / Football, Sport", "r": 0, "img": "mastersystem/071.webp", "shot": "shots/mastersystem/071.webp", "d": "La mouture European Champions de Sensible Soccer sur Master System inclut les noms des joueurs présents en clubs européens lors de la saison 92/93. Vous pouvez aussi participer aux qualifications pour la Coupe du Monde 94. L'un des arguments majeurs du jeu à l'époque était la prise en compte des cartons."}, {"id": "mastersystem_072", "s": "mastersystem", "n": 72, "t": "Shadow Dancer", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Beat'em All", "r": 0, "img": "mastersystem/072.webp", "shot": "shots/mastersystem/072.webp", "d": "Shadow Dancer : The Secret of Shinobi est un beat'em all sur Master System. L'histoire se déroule à New York en 1997 et le Maître Ninja Shinobi doit faire face à une nouvelle menace. La discrétion et la rapidité sont des armes redoutables mais Shinobi peut aussi utiliser la magie tandis que son chien le protège contre de nombreux assaillants. Chaque niveau se termine par l'affrontement d'un boss et plusieurs bonus peuvent être ramassés en cours de route."}, {"id": "mastersystem_073", "s": "mastersystem", "n": 73, "t": "Shinobi", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 2, "img": "mastersystem/073.webp", "shot": "shots/mastersystem/073.webp", "d": "Shinobi sur Master System est un jeu d'action dans lequel vous incarnez un guerrier ninja. L'objectif est de libérer des otages qui deviennent jouables par la suite. Chaque guerrier possédant son propre style de combat, le joueur peut donc diversifier sa stratégie à son aise en fonction des spécificités du niveau à accomplir."}, {"id": "mastersystem_074", "s": "mastersystem", "n": 74, "t": "Slap Shot", "y": 1990, "dv": "Sims", "p": "Sega", "g": "Sport / Hockey, Sport", "r": 0, "img": "mastersystem/074.webp", "shot": "shots/mastersystem/074.webp", "d": "Slap Shot sur Master System est un jeu de Hockey comportant 32 équipes internationales jouables en championnat ou en match d'exhibition. Les matchs alternent entre différents types de phases de jeu et se ponctuent par des petits combats entre joueurs."}, {"id": "mastersystem_075", "s": "mastersystem", "n": 75, "t": "Sonic Chaos", "y": 1993, "dv": "Aspect", "p": "Sega", "g": "Plateforme", "r": 1, "img": "mastersystem/075.webp", "shot": "shots/mastersystem/075.webp", "d": "Dr. Robotnik a volé l'Émeraude Rouge du Chaos, et Sonic le hérisson est chargé de la récupérer! Vous êtes Sonic ou Tails le renard à deux queues, et allez parcourir comme une flèche les Zones, grâce à votre démarche rapide et votre esprit encore plus vif, pour ramasser des anneaux et échapper au dernier groupe de créatures de Robotnik!"}, {"id": "mastersystem_076", "s": "mastersystem", "n": 76, "t": "Sonic Spinball", "y": 1993, "dv": "Sega", "p": "Sega", "g": "Flipper", "r": 1, "img": "mastersystem/076.webp", "shot": "shots/mastersystem/076.webp", "d": "Accompagné de son ami Tails, Sonic le hérisson bleu le plus rapide de la galaxie doit à nouveau affronter le Dr Robotnik dans Sonic Spinball sur Master System. Le quartier général ennemi est installé en haut d'un volcan, et le mécanisme qui le protège est similaire à celui d'un flipper. Mettez-vous en boule et escaladez le Mont Mobius pour libérer les animaux transformés en robots par votre pire ennemi."}, {"id": "mastersystem_077", "s": "mastersystem", "n": 77, "t": "Sonic the Hedgehog", "y": 1991, "dv": "Ancient", "p": "Sega", "g": "Action, Plateforme", "r": 4, "img": "mastersystem/077.webp", "shot": "shots/mastersystem/077.webp", "d": "Brisez la barrière de la vitesse avec 'Sonic The Hedgehog'. Faites chauffer la gomme avant d'exploser vos ennemis avec l'attaque tournoyante supersonique. Plongez dans les tunnels et tournoyez dans les airs. Rebondissez jusqu'à ce que vous soyez étourdi dans un flipper. Vous n'avez jamais rien vu de pareil!"}, {"id": "mastersystem_078", "s": "mastersystem", "n": 78, "t": "Sonic The Hedgehog 2", "y": 1992, "dv": "Aspect", "p": "Sega", "g": "Action, Plateforme", "r": 3, "img": "mastersystem/078.webp", "shot": "shots/mastersystem/078.webp", "d": "Conduisez un wagonnet, traversez avec votre parapente l'orage qui fait rage et filez dans un dédale de tuyaux sinueux pour essayer, avec \"Sonic The Hedgehog\", de sauver Tails et ses amis des mains du méchant Dr Robotnik!"}, {"id": "mastersystem_079", "s": "mastersystem", "n": 79, "t": "Space Harrier", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Action, Tir Avec Accessoire, Shoot'em Up", "r": 1, "img": "mastersystem/079.webp", "shot": "shots/mastersystem/079.webp", "d": "Space Harrier sur Master System est un shoot'em up. Le personnage dirigé à la troisième personne peut courir ou voler, et doit éviter les obstacles et tirs ennemis. Faites preuve d'adresse pour arriver au terme des 18 niveaux, chacun se terminant par un affrontement avec un boss."}, {"id": "mastersystem_080", "s": "mastersystem", "n": 80, "t": "SpellCaster", "y": 1989, "dv": "Sega", "p": "Sega", "g": "Aventure", "r": 0, "img": "mastersystem/080.webp", "shot": "shots/mastersystem/080.webp", "d": "Vous incarnez Kane, le jeune apprenti de Daikak, le moine du temple de la montagne. Ce dernier vous a initié aux arcanes du combat et de la magie en ce Moyen Age japonais. Un jour, il vous demande d'aller enquêter sur une attaque qui a eu lieu dans un temple voisin. Vous découvrirez qu'il n'y a aucun survivant. C'est là que commence l'aventure, vous serez par la suite confronté à un vaste complot qu'il va vous falloir élucider sous peine de voir le monde courir à sa perte."}, {"id": "mastersystem_081", "s": "mastersystem", "n": 81, "t": "Spider-Man vs. The Kingpin", "y": 1991, "dv": "Technopop", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "mastersystem/081.webp", "shot": "shots/mastersystem/081.webp", "d": "Spider-Man vs. The Kingpin sur Master System est un jeu d'action/plates-formes dans lequel vous incarnez l'homme-araignée. Wilson Fisk alias The Kingpin déclare à la presse qu'une bombe placée quelque part dans New York va exploser d'ici 24 heures. Il accuse directement Spider-Man, qui se retrouve avec la police sur le dos. Vous devez trouver la bombe et redorer votre blason, mais Octopus, Electro et Mysterio tenteront de vous barrer la route."}, {"id": "mastersystem_082", "s": "mastersystem", "n": 82, "t": "Streets of Rage", "y": 1991, "dv": "Ancient", "p": "Sega", "g": "Action, Beat'em All", "r": 1, "img": "mastersystem/082.webp", "shot": "shots/mastersystem/082.webp", "d": "Streets of Rage sur Master System vous propose de suivre l'histoire de trois jeunes agents de police aux prises avec une organisation criminelle, ménée de main de fer par un certain Mr.X. Le jeu consiste à éliminer tous vos opposants grâce à divers coups, pour progresser dans le niveau et défier le boss. Chaque combattant dispose de ses propres qualités et désavantages."}, {"id": "mastersystem_083", "s": "mastersystem", "n": 83, "t": "Streets of Rage II", "y": 1992, "dv": "Japan System House", "p": "Sega", "g": "Action, Beat'em All", "r": 1, "img": "mastersystem/083.webp", "shot": "shots/mastersystem/083.webp", "d": "Un an après avoir défait Mr. X, les policiers Axel, Blaze et Adam ont repris le cours normal de leur existence, jusqu'à ce que ce dernier ne soit enlevé. Tel est le point de départ de Streets of Rage 2 sur Master System. Le jeu demeure un beat'em all classique, mais s'enrichit grandement en termes de jouabilité par rapport à son prédécesseur, ainsi qu'en termes d'interactivité des environnements."}, {"id": "mastersystem_084", "s": "mastersystem", "n": 84, "t": "Strider", "y": 1991, "dv": "Tiertex", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "mastersystem/084.webp", "shot": "shots/mastersystem/084.webp", "d": "Strider est un jeu d'action/plates-formes sur Mster System. En l'an 2089, le Grand Maître Meio a mis au point un plan diabolique pour conquérir l'univers tout entier. Vous incarnez Hiryu, un Strider de premier ordre avec pour mission de mettre un terme aux agissements de Meio. Il faudra courir, sauter et tuer vos ennemis grâce à votre épée plasma au cours des cinq niveaux que compte le jeu."}, {"id": "mastersystem_085", "s": "mastersystem", "n": 85, "t": "Super Monaco GP", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Course, Conduite", "r": 0, "img": "mastersystem/085.webp", "shot": "shots/mastersystem/085.webp", "d": "Super Monaco GP sur Master System est l'adaptation du jeu arcade du même nom. Le jeu inclut les séances de qualifications, dans lesquelles il vous faut briller pour prendre le départ de la course en bonne position. Seul ou à 2 joueurs en écran partagé, testez vos réflexes sur les circuits officiels du championnat du monde FIA de l'époque."}, {"id": "mastersystem_086", "s": "mastersystem", "n": 86, "t": "Teddy Boy", "y": 1986, "dv": "Sega", "p": "Sega", "g": "Action, Divers", "r": 0, "img": "mastersystem/086.webp", "shot": "shots/mastersystem/086.webp", "d": "Teddy Boy est un jeu d'action sorti dans un premier temps sur bornes d'arcade, puis adapté sur Master System. Le joueur incarne un jeune garçon nommé Teddy qui doit survivre à des labyrinthes remplis de monstres. Pour se défendre, Teddy peut faire usage de son pistolet. Lorsque les monstres sont touchés, ils se transforment en boules qu'il faut collecter le plus rapidement possible."}, {"id": "mastersystem_087", "s": "mastersystem", "n": 87, "t": "The Lucky Dime Caper Starring Donald Duck", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Action, Combat, Shoot'em Up", "r": 0, "img": "mastersystem/087.webp", "shot": "shots/mastersystem/087.webp", "d": "La diabolique Miss Tick a volé les pièces porte-bonheur et a capturé Riri, Fifi et Loulou! Partez à l'aventure dans six territoires perfides avec Donald pour sauver ses neveux et récupérér les pièces porte-bonheur!"}, {"id": "mastersystem_088", "s": "mastersystem", "n": 88, "t": "The Ninja", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Action", "r": 1, "img": "mastersystem/088.webp", "shot": "shots/mastersystem/088.webp", "d": "Dans The Ninja sur Master System, incarnez un guerrier et sauvez une princesse faite prisonnière dans le château Okhami par le terrible Gyokuro. Votre avatar peut se défendre au corps-à-corps grâce à ses techniques de combat, mais aussi à distance en jetant des étoiles sur ses ennemis."}, {"id": "mastersystem_089", "s": "mastersystem", "n": 89, "t": "TransBot", "y": 1986, "dv": "Sega", "p": "Sega", "g": "Action, Shoot'em Up", "r": 0, "img": "mastersystem/089.webp", "shot": "shots/mastersystem/089.webp", "d": "Transbot sur Master System est un jeu de tir. Après une guerre nucléaire, l'humanité décide de relever la tête et de reconstruire une nouvelle civilisation. Mais Dalaus, intelligence artificielle de cette période a ses propres plans pour le monde. A vous de le stopper. Pour cela, vous pilotez le CA-214 plus connu sous le nom de Transbot, un avion de chasse ultra-performant, équipé des dernières technologies."}, {"id": "mastersystem_090", "s": "mastersystem", "n": 90, "t": "Vigilante", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Beat'em All", "r": 0, "img": "mastersystem/090.webp", "shot": "shots/mastersystem/090.webp", "d": "Vigilante sur Master System est un beat'em all adapté du jeu d'arcade du même nom. Le joueur commande un héros anonyme en guerre contre le gang qui a kidnappé Maria, sa petite amie. A mains nues ou armé d'une chaîne, combattez les gangsters dans les rues de la ville."}, {"id": "mastersystem_091", "s": "mastersystem", "n": 91, "t": "Wimbledon II", "y": 1992, "dv": "Sims", "p": "Sega", "g": "Sport / Tennis, Sport", "r": 0, "img": "mastersystem/091.webp", "shot": "shots/mastersystem/091.webp", "d": "Vous débutez en fin de liste, un nom inconnu parmi une armée de joueurs talentueux. Mais vous améliorez votre classement en Amérique, en Australie et finalement en France. Aujourd'hui, c'est le jour décisif... le jour où vous allez affronter les meilleurs joueurs de tennis dans la Coupe de l'Open de Wimbledon!"}, {"id": "mastersystem_092", "s": "mastersystem", "n": 92, "t": "Wonder Boy", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 2, "img": "mastersystem/092.webp", "shot": "shots/mastersystem/092.webp", "d": "Bravez les forêts profondes. Traversez les océans infinis et les déserts arides. Tout cela en affrontant créatures dangereuses et catastrophes naturelles... jusqu'à ce que vous la trouviez. Jusqu'à ce que vous sauviez votre amie Tanya des griffes d'un roi brutal."}, {"id": "mastersystem_093", "s": "mastersystem", "n": 93, "t": "Wonder Boy III : The Dragon's Trap", "y": 1989, "dv": "Westone", "p": "Sega", "g": "Plateforme", "r": 3, "img": "mastersystem/093.webp", "shot": "shots/mastersystem/093.webp", "d": "Wonder Boy a été victime d'un sortilège! Il l'a mortellement blessé mais le dernier souffle de l'affreux monstre a transformé Wonder Boy en Homme-Lézard! Le jeune combattant doit maintenant partir à la recherche de la Croix de la Salamandre, la seule force dans tout l'Univers qui est capable de lui rendre sa forme humaine. Mais il faut d'abord qu'il la trouve..."}, {"id": "mastersystem_094", "s": "mastersystem", "n": 94, "t": "Wonder Boy in Monster Land", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 2, "img": "mastersystem/094.webp", "shot": "shots/mastersystem/094.webp", "d": "Wonder Boy est de retour! Mais cette fois il joue sa vie. Finies les jolies poupées, les fruits ou le lait. Maintenant, ce sont des épées, des armures, des boucliers, des labyrinthes et des dragons crachant le feu. Aidez Wonder Boy à franchir les 12 niveaux périlleux et remplis de monstres de son aventure exaltante."}, {"id": "mastersystem_095", "s": "mastersystem", "n": 95, "t": "Wonder Boy in Monster World", "y": 1993, "dv": "Shimada Kikaku", "p": "Sega", "g": "Jeu De Rôles", "r": 0, "img": "mastersystem/095.webp", "shot": "shots/mastersystem/095.webp", "d": "Dans Wonder Boy in Monster World sur Master System, vous incarnez Shion et devez sauver votre monde de l'invasion des monstres. Ce jeu de plates-formes intègre des éléments de jeu de rôle tels que la possibilité de communiquer avec les habitants, le fait d'acheter des équipements et d'améliorer les caractéristiques de votre personnage."}, {"id": "mastersystem_096", "s": "mastersystem", "n": 96, "t": "World Games", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Sport", "r": 0, "img": "mastersystem/096.webp", "shot": "shots/mastersystem/096.webp", "d": "World Games sur Master System est une compilation de jeux supposés représenter le sport national d'une pléthore de nations. Sorti à l'origine sur Nes, il vous faudra passer par des épreuves désopilantes comme le saut de tonneaux, le slalom ou encore les plongeons."}, {"id": "mastersystem_097", "s": "mastersystem", "n": 97, "t": "World Grand Prix", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Simulation, Course, Conduite", "r": 0, "img": "mastersystem/097.webp", "shot": "shots/mastersystem/097.webp", "d": "World Grand Prix sur Master System est un jeu de courses de formule 1 dans lequel il faut se battre contre-la-montre et ses adversaires. De bonnes performances en course permettent d'améliorer ses équipements, notamment la tenue de route, l'accélération et la vitesse de pointe."}, {"id": "mastersystem_098", "s": "mastersystem", "n": 98, "t": "Ys : The Vanished Omens", "y": 1989, "dv": "Sega", "p": "Sega", "g": "Jeu De Rôles", "r": 2, "img": "mastersystem/098.webp", "shot": "shots/mastersystem/098.webp", "d": "Ys : The Vanished Omens sur Master System est un jeu de rôle dans lequel vous incarnez Aron, un aventurier expert en maniement d'épées. La quête à accomplir consiste à retrouver les six livres d'Ys et de découvrir le secret qu'ils renferment avant que Dull Dekt ne s'en serve à des fins personnelles."}, {"id": "mastersystem_099", "s": "mastersystem", "n": 99, "t": "Zillion", "y": 1987, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 1, "img": "mastersystem/099.webp", "shot": "shots/mastersystem/099.webp", "d": "Etes-vous prêt pour le danger ultime ? Zillion sur Master System vous propose d'incarner JJ l'agent secret. Votre objectif étant d'infiltrer secrètement les bâtiments de l'empire Norsa et de voler leurs plans avant qu'ils ne dominent le monde. Pour ce faire, vous partez équipé d'un kit ultra speed qui accélère temporairement la vitesse de votre avatar et d'un pistolet laser, précieux en cas d'embuscade."}, {"id": "mastersystem_100", "s": "mastersystem", "n": 100, "t": "Zillion II : The Tri Formation", "y": 1988, "dv": "Sega", "p": "Sega", "g": "Plateforme", "r": 1, "img": "mastersystem/100.webp", "shot": "shots/mastersystem/100.webp", "d": "Dans le jeu d'action/plates-formes Zillion II : The Tri Formation sur Master System, le redoutable empire Norva attaque de nouveau, plus menaçant que jamais. Repartez à l'assaut mais cette fois-ci, le baron Ricks vous attend de pied ferme. Serez-vous à la hauteur une seconde fois ?"}, {"id": "nes_001", "s": "nes", "n": 1, "t": "Adventures of Lolo", "y": 1991, "dv": "Hal Laboratory", "p": "Hal Laboratory", "g": "Stratégie, Action, Puzzle-Game", "r": 0, "img": "nes/001.webp", "shot": "shots/nes/001.webp", "d": "En visite à Eden, un pays d'amour et de paix, le Prince Lolo de Gentryland passe d'agréables journées en compagnie de la princesse Lala. Mais un jour, Egger, le Roi des ténèbres, qui a décidé de conquérir Eden, kidnappe la princesse sous les yeux de Lolo. Après un voyage long et difficile, Lolo arrive au maléfique Château du labyrinthe. Le château est gardé par une armée de monstres retors à la solde d'Egger. Lolo peut-il résoudre les énigmes sans fin du château et sauver Lala? Lolo n'est pas doué de force ou d'agilité, mais a du courage et de la patience. Maintenant, la bataille de l'esprit commence. Bonne chance, Lolo."}, {"id": "nes_002", "s": "nes", "n": 2, "t": "Alien 3", "y": 1993, "dv": "Probe Software Ltd.", "p": "Acclaim", "g": "Tir", "r": 0, "img": "nes/002.webp", "shot": "shots/nes/002.webp", "d": "Alien 3 sur NES vous plonge directement après la fin du film \"Aliens\". Ellen Ripley, personnage principal de la saga, est en sommeil cryogénique à bord du Sulaco. Un alien s'est infiltré à bord, décimant l'équipage et provoquant le crash du vaisseau sur la planète Fiorina 161. Aidez Ripley à survivre et sauvez les prisonniers des griffes des aliens en attendant que les secours arrivent."}, {"id": "nes_003", "s": "nes", "n": 3, "t": "Bad Dudes vs. Dragon Ninja", "y": 1990, "dv": "Data East", "p": "Data East", "g": "Beat'em All", "r": 0, "img": "nes/003.webp", "shot": "shots/nes/003.webp", "d": "Le Président des Etats-Unis a été kidnappé par des ninjas surentraînés. Saurez-vous être un mauvais garçon et taper du vilain pour le libérer ? Telle sera votre mission dans Bad Dudes vs Dragon Ninja sur Nes, beat'em all classique en scrolling 2D."}, {"id": "nes_004", "s": "nes", "n": 4, "t": "Balloon Fight", "y": 1986, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 0, "img": "nes/004.webp", "shot": "shots/nes/004.webp", "d": "Balloon Fight sur Nes est un shoot dans lequel vous dirigez un bonhomme perché dans les airs dont le but est d'exploser le ballon de ses adversaires afin de les faire chuter à l'eau ou dans la bouche d'un poisson affamé. Acharnez-vous sur vos adversaires qui ont des parachutes, affrontez un ami dans le mode deux joueurs ou tentez de survivre sur un écran à défilement horizontal en mode Balloon Trip."}, {"id": "nes_005", "s": "nes", "n": 5, "t": "Barker Bill's Trick Shooting", "y": 1991, "dv": "Nintendo", "p": "Nintendo", "g": "Tir", "r": 0, "img": "nes/005.webp", "shot": "shots/nes/005.webp", "d": "Barker Bill's Trick Shooting est un jeu de tir sur Nes. Le principe est simple : vous devez tirer avec votre zapper sur des ballons tout en évitant des chiens qui vous attaquent. A chaque fois que vous complétez un niveau, les challenges deviennent de plus en plus difficiles."}, {"id": "nes_006", "s": "nes", "n": 6, "t": "Batman : The Video Game", "y": 1990, "dv": "Sunsoft", "p": "Sunsoft", "g": "Plateforme, Action", "r": 1, "img": "nes/006.webp", "shot": "shots/nes/006.webp", "d": "Batman sur NES est un jeu d'action/plates-formes s'inspirant du film Batman sorti en 1989. Six niveaux sont disponibles (dont deux avec des phases de tir), parmi lesquels Gotham City, le Musée Flugelheim ou encore la Cathédrale. Battez-vous et utilisez les nombreux gadgets de Batman pour vous hisser jusqu'au Joker et lui faire mordre la poussière."}, {"id": "nes_007", "s": "nes", "n": 7, "t": "Battletoads", "y": 1993, "dv": "Rareware", "p": "Tradewest", "g": "Action, Beat'em All", "r": 2, "img": "nes/007.webp", "shot": "shots/nes/007.webp", "d": "Battletoads sur NES vous met dans la peau de Zitz, crapaud aux pouvoirs qui sortent de l'ordinaire. Votre but : sauver vos deux frères enlevés par la Reine Noire. Débarrassez-vous de vos adversaires à travers diverses phases de jeu passant par la conduite de véhicules, le simple combat rapproché ou le jeu de plates-formes."}, {"id": "nes_008", "s": "nes", "n": 8, "t": "Bionic Commando", "y": 1990, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 1, "img": "nes/008.webp", "shot": "shots/nes/008.webp", "d": "Voici deux ans que votre peuple lutte contre des attaques incessantes et des invasions. Votre armée est décimée, votre artillerie est pratiquement anéantie, toute résistance semble désormais impossible. Mais une équipe de savants cachés dans un laboratoire souterrain vient enfin de mettre au point un nouveau type d'engin de guerre: un bras bionique qui se déploie et se replie, disposant d'une puissance et d'une maniabilité jusqu'alors inconnues. Associé à un arsenal d'armes à tir rapide capables de percer les blindages et de détecter les sources de chaleur, ce bras mettra la puissance d'une armée entre les mains d'un seul homme... un soldat choisi avec soin, possédant toutes les qualités pour appartenir à une nouvelle race de commando que rien ne peut arrêter... un Bionic Commando. Vous êtes ce soldat!"}, {"id": "nes_009", "s": "nes", "n": 9, "t": "Blaster Master", "y": 1991, "dv": "Sunsoft", "p": "Sunsoft", "g": "Plateforme, Action", "r": 1, "img": "nes/009.webp", "shot": "shots/nes/009.webp", "d": "Sur Terre, il existe un peuple mutant, dirigé par un certain Plutiniom Boss. A vous de tout détruire ! Le jeu comporte deux partie nettement distinctes. La première se déroule dans votre véhicule alors que dans la seconde, vous dirigez le jeune héros de l'affaire, à travers des salles aux mille et un pièges. Varié et bien fait, il mérite le détour. Note de Console + : 91%"}, {"id": "nes_010", "s": "nes", "n": 10, "t": "Blue Shadow", "y": 1991, "dv": "Natsume", "p": "Natsume", "g": "Plateforme, Action", "r": 0, "img": "nes/010.webp", "shot": "shots/nes/010.webp", "d": "Blue Shadow sur NES est un jeu d'action se déroulant au 21ème siècle. Vous incarnez Hayate ou Kaede qui cherchent à libérer la ville du contrôle du démoniaque Garuda. Le jeu possède 5 niveaux, eux-mêmes divisés en 4 parties au bout desquelles vous devrez affronter un boss. Un mode 2 joueurs en coopération est disponible."}, {"id": "nes_011", "s": "nes", "n": 11, "t": "Bubble Bobble", "y": 1990, "dv": "Taito", "p": "Taito", "g": "Action", "r": 1, "img": "nes/011.webp", "shot": "shots/nes/011.webp", "d": "Bubble Bobble sur Nes est un jeu d'action dans lequel on incarne Bub et Bob, deux enfants transformés en dinosaures qui vont devoir sauver leurs fiancées des griffes de Bubbla. Le jeu se déroule sur des tableaux dans lesquels apparaissent des ennemis qu'il faut emprisonner dans des bulles avant de les faire exploser pour récupérer des points, tout en prenant en compte les courants d'air susceptibles de faire dévier les bulles, le tout sur une centaine de niveaux."}, {"id": "nes_012", "s": "nes", "n": 12, "t": "Burai Fighter", "y": 1990, "dv": "Taxan Usa Corp.", "p": "Taxan Usa Corp.", "g": "Shoot'em Up", "r": 0, "img": "nes/012.webp", "shot": "shots/nes/012.webp", "d": "Burai Fighter est un jeu d'action et de tir sur Nes. Le soft vous propose de combattre à bord de votre vaisseau pour repousser des hordes d'aliens assoiffés de chair humaine qui ont décidé d'envahir la terre pour leurs prochains repas. Vous avez un arsenal complet à votre disposition tel que des lasers, des missiles et des bombes destructrices. Le soft ne propose pas de mode multijoueur."}, {"id": "nes_013", "s": "nes", "n": 13, "t": "Castlevania", "y": 1988, "dv": "Konami", "p": "Konami", "g": "Action", "r": 3, "img": "nes/013.webp", "shot": "shots/nes/013.webp", "d": "À vos risques et périls! Si vous trouvez le monde extérieur effrayant, attendez de voir l'intérieur. Vous entrez dans la plus longue nuit de votre vie. Fantômes, lutins, démons, loups, chauve-souris - des créatures cachées dans les moindres recoins. Soyez vigilant, c'est votre unique chance de trouver une arme ou deux. Car lorsque enfin vous rencontrerez le Comte, il n'aura qu'un seul objectif: votre jugulaire. Alors gardez votre pieu aiguisé."}, {"id": "nes_014", "s": "nes", "n": 14, "t": "Castlevania II : Simon's Quest", "y": 1990, "dv": "Nintendo", "p": "Konami", "g": "Aventure, Action", "r": 1, "img": "nes/014.webp", "shot": "shots/nes/014.webp", "d": "Castlevania était une promenade de santé comparé à cette sanglante malédiction. Vous pensiez avoir défait le Prince des Ténèbres - hein, Simon Belmont? Eh bien, détrompez-vous, car selon une demoiselle en détresse, le diabolique comte Dracula a laissé une horrible malédiction dans son sillage. Et le seul espoir que vous ayez de mettre fin à la terreur est de détruire les restes de son corps! Dans votre effrayante quête, fouillez un labyrinthe de demeures, de cimetières et de forêts sombres et étranges - chacune gardée par des loups-garous mangeurs d'hommes, des zombies cracheurs de feu et d'autres démons diaboliques. Vos maigres chances reposent sur les lâches villageois de Transylvanie, offrant des indices sur l'endroit où se trouvent les restes de Dracula. Et où vous achèterez des armes magiques, couteaux en argent et fouets enflammés. Mais méfiez-vous de la nuit. Car lorsque le soleil disparaît, la malédiction de Dracula devient plus mortelle. Et vos chances deviennent de plus en plus faibles."}, {"id": "nes_015", "s": "nes", "n": 15, "t": "Castlevania III : Dracula's Curse", "y": 1992, "dv": "Konami", "p": "Konami", "g": "Action", "r": 2, "img": "nes/015.webp", "shot": "shots/nes/015.webp", "d": "Il n'y a que vous qui puissiez empêcher Dracula de faire couler le sang! Conduit par l'immortel comte Dracula, une armée diabolique, la plus gigantesque qui ait jamais été rassemblée, se tient prête à enterrer l'humanité dans une tombe de terreur. La destruction de cette légion composée de Dragons des Marais, de Squelettes balafreurs et de monstrueux démons ne pourra être assurée que par un combat suprême mené par le plus rusé des guerriers. L'histoire se situe cent ans avant la naissance de Simon Belmont. Dracula est jeune et il faudra plus qu'un pieu pour neutraliser ce démon. Heureusement, vous incarnez Trevor, l'aïeul de Simon, celui qui fut le premier de la lignée des Seigneurs Belmont."}, {"id": "nes_016", "s": "nes", "n": 16, "t": "Chip 'N Dale : Rescue Rangers", "y": 1991, "dv": "Capcom", "p": "Capcom", "g": "Plateforme", "r": 1, "img": "nes/016.webp", "shot": "shots/nes/016.webp", "d": "Le diabolique Catox menace de prendre le contrôle de la ville. Joignez vite vos efforts à ceux des Rangers du Risque et de Tic et Tac pour déjouer sa maléfique tentative... Tic et Tac, ces détectives minuscules mais courageux ont reçu un autre SOS désespéré. Gadget a été kidnappée par le diabolique Catox qui veut s'emparer de la ville. Joignez-vous aux Rangers et participez à leur passionnante recherche dans les noires profondeurs des égouts gluants et sur les cimes frémissantes des fils téléphoniques! Seul ou à deux, découvrez les quartiers généraux de Catox et déjouez son dessein diabolique!"}, {"id": "nes_017", "s": "nes", "n": 17, "t": "Clu Clu Land", "y": 1987, "dv": "Nintendo", "p": "Nintendo", "g": "Stratégie", "r": 0, "img": "nes/017.webp", "shot": "shots/nes/017.webp", "d": "Clu Clu Land est un jeu de puzzle sur NES dans lequel vous incarnez une sorte de poisson et explorez les divers terrains de jeu. Le but est de ramasser des barres d'or pour former une image au fur et à mesure. Des ennemis viennent souvent vous compliquer la tâche mais vous pouvez utiliser une vague d'énergie pour les faire disparaître temporairement et continuer de compléter votre puzzle."}, {"id": "nes_018", "s": "nes", "n": 18, "t": "Darkwing Duck", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Plateforme, Action", "r": 0, "img": "nes/018.webp", "shot": "shots/nes/018.webp", "d": "Vivons dangereusement! Les barons du crime sont encore prêts à frapper! F.O.W.L (Forfaiture Obscure Double Véreuse de Larcins), une mystérieuse organisation criminelle, a mis sur pied un plan pour prendre contrôle de la charmante petite ville de Bourg-les-Canards. Six de ses acolytes les plus abominables mettent la cité à feu et à sang. Seul Mystermask (Darkwing) le téméraire canard peut les traîner devant les tribunaux! Joignez-vous à Mystermask, alors qu'il explore les bois en vue de contrecarrer le plan diabolique de Moudugenou. Fouillez les entrepôts des quais pour trouver MegaVolt et mettre fin à ses agissements. Pourchassez les 6 criminels rusés de F.O.W.L. et soyez prêt quand Mystermask lance son offensive contre le sinistre Bec d'Acier et sa forteresse volante!"}, {"id": "nes_019", "s": "nes", "n": 19, "t": "Donkey Kong", "y": 1986, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 0, "img": "nes/019.webp", "shot": "shots/nes/019.webp", "d": "Pouvez-vous sauver la petite amie de Mario des prises de Donkey Kong? Vous devez aider Mario à libérer Pauline avant qu'il ne soit trop tard. Vous aurez à éviter des barils piégés, des boules de feu et tout ce que Donkey Kong vous lancera pour essayer de vous en empêcher. Alors, si vous cherchez de l'action, mettez fin aux singeries!"}, {"id": "nes_020", "s": "nes", "n": 20, "t": "Donkey Kong Jr.", "y": 1987, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 0, "img": "nes/020.webp", "shot": "shots/nes/020.webp", "d": "Mario en méchant, qui l'eut cru ? C'est pourtant le scénario improbable de Donkey Kong Jr. sur NES. Eh oui, le vilain moustachu a enfermé Donkey Kong dans une cage et il revient donc à son rejeton de le tirer des griffes de ce plombier décidément retors. Notre sympathique primate va devoir grimper le long de lianes pour atteindre le sommet du plateau, tout en évitant les divers objets que Mario croit bon de lui envoyer à la figure."}, {"id": "nes_021", "s": "nes", "n": 21, "t": "Double Dragon", "y": 1988, "dv": "Technos Japan Corp.", "p": "Tradewest", "g": "Beat'em All", "r": 1, "img": "nes/021.webp", "shot": "shots/nes/021.webp", "d": "Double Dragon, c'est l'histoire de Billy et Jimmy Lee, deux frères jumeaux qui ont appris à se battre dans les rues froides et impitoyables de leur ville. Leur connaissance exceptionnelle des arts martiaux combinée à leurs tactiques des rues a fait d'eux de redoutables machines de combat. Mais voilà que Billy doit faire face à un formidable défi. Marion, son amie, a été kidnappée par les Guerriers Noirs, la bande sauvage à la solde du mystérieux Shadow Boss! En se servant de toutes les armes qu'il peut trouver - couteaux, fouets, battes, rochers, bidons d'huile, et même dynamite - Billy doit poursuivre la bande dans les taudis, les usines, et les environs boisés de la ville, afin d'atteindre la cachette où se déroulera son ultime bagarre avec le Shadow Boss, Jimmy, son frère!"}, {"id": "nes_022", "s": "nes", "n": 22, "t": "Double Dragon II : The Revenge", "y": 1990, "dv": "Technos Japan Corp.", "p": "Acclaim", "g": "Beat'em All, Action", "r": 2, "img": "nes/022.webp", "shot": "shots/nes/022.webp", "d": "Les double dragons - Billy et Jimmy Lee - sont de retour pour se venger de la perte de Marion. Le duo de champions d'arts martiaux affrontent les sauvages Guerriers de l'ombre en 9 périlleuses missions, face à d'impitoyables gangs des rues, des ninjas armés de nunchakus et des guerriers mutants géants! Au cours de leur quête inlassable, ils passent par des chantiers de construction, des ruelles et des cachettes sous-marines, où les attendent des ascenseurs secrets, des plafonds armés de piques et des robots aux griffes acérées. Lors d'une mission inédite, les craintes les plus terribles du valeureux duo se réalisent tandis qu'ils livrent la grande bataille du bien contre le mal. Il en va non seulement de leur vie , mais du sort du monde entier!"}, {"id": "nes_023", "s": "nes", "n": 23, "t": "Dr. Mario", "y": 1990, "dv": "Nintendo", "p": "Nintendo", "g": "Stratégie", "r": 1, "img": "nes/023.webp", "shot": "shots/nes/023.webp", "d": "Dr Mario - une ordonnance pas ordinaire. Dr Mario propose un défi à rendre malade! Mario lance des capsules de vitamines multicolores dans une bouteille contenant divers virus laids et méchants. Les capsules doivent être attrapées dans leur chute. Pour se débarrasser d'un virus, on doit le recouvrir d'une ligne d'au moins quatre capsules d'une même couleur. Une fois tous les virus de la bouteille éliminés, on passe à l'étape suivante où l'épidémie menace."}, {"id": "nes_024", "s": "nes", "n": 24, "t": "Duck Hunt", "y": 1987, "dv": "Nintendo", "p": "Nintendo", "g": "Tir Avec Accessoire", "r": 1, "img": "nes/024.webp", "shot": "shots/nes/024.webp", "d": "Duck Hunt sur NES est un jeu de tir qui se joue avec le Zapper Light Gun. Vous devez tirer sur les canards que votre chien effraie en faisant bien attention à ne pas le blesser! A chaque round, le chien effraie un certain nombre de canards, vous devez alors les toucher avant qu'ils ne sortent de l'écran, mais attention, vous avez peu de balles alors vous n'avez pas le droit à l'erreur!"}, {"id": "nes_025", "s": "nes", "n": 25, "t": "DuckTales", "y": 1990, "dv": "Capcom", "p": "Capcom", "g": "Action, Plateforme", "r": 2, "img": "nes/025.webp", "shot": "shots/nes/025.webp", "d": "Saperlipopette! Toujours en quête d'émotions, l'Oncle Picsou. Ne décrochera-t'il donc jamais? Avec son esprit aventurier, Picsou se prépare à relever le plus grand de tous les défis: découvrir les cinq légendaires Trésors Perdus, et devenir le \"Canard le plus riche du monde\". Rejoignez Picsou et l'équipe de DuckTales: Flagada l'as volant, les neveux Riri, Fifi, Loulou et la petite Zaza dans leur recherche. À pied, ils doivent traverser la traîtresse jungle amazonnienne, descendre dans les mines de diamants en Afrique, et même atteindre la lune! Vous sentez-vous assez brave pour vous joindre à eux dans cette aventure? Venez au quartier général de Donaldville et voyez par vous-même!"}, {"id": "nes_026", "s": "nes", "n": 26, "t": "DuckTales 2", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Plateforme", "r": 0, "img": "nes/026.webp", "shot": "shots/nes/026.webp", "d": "Oh là, là! Le voilà de retour! Oncle Picsou est sur la piste de l'aventure la plus fructueuse qu'il ait jamais entreprise. Des morceaux de la carte du Trésor Perdu de McDuck ont été éparpillés tout autour du monde et Oncle Picsou doit les retrouver avant Gripsou, ce gredin avide au coeur de pierre. Parions que la compétition sera rude sur la ligne d'arrivée: tous deux veulent retrouver le trésor à tout prix pour devenir le plus riche canard du monde! Rejoignez l'équipe formée par Oncle Picsou et ses neveux. Explorez avec eux les anciennes pyramides d'Egypte ou combattez les pirates dans le triangle des Bermudes. Aidez-les dans leurs recherches tout au long des couloirs hantés d'un ancestral château écossais et escaladez les rocs qui entourent les chutes vertigineuses du Niagara. Aidez Oncle Picsou dans sa poursuite du secret de l'île de Mu et vous découvrirez le dernier indice qui vous permettra de découvrir l'emplacement du Trésor de McDuck!"}, {"id": "nes_027", "s": "nes", "n": 27, "t": "Excitebike", "y": 1986, "dv": "Nintendo", "p": "Nintendo", "g": "Course, Conduite, Sport", "r": 1, "img": "nes/027.webp", "shot": "shots/nes/027.webp", "d": "Excitebike sur Nes est un jeu de motocross où vous faite la course contre plusieurs adversaires. Dans ce titre à défilement horizontal, foncez sur la piste boueuse et débarrassez-vous de vos concurrents pour remporter la victoire ! Vous pouvez aussi créer votre propre circuit de motocross avant de vous élancer sur la piste. Enclenchez le turbo sur les rampes pour sauter encore plus loin, mais faites attention à votre angle de réception pour ne pas mordre la poussière."}, {"id": "nes_028", "s": "nes", "n": 28, "t": "Faxanadu", "y": 1990, "dv": "Nihon Falcom", "p": "Nintendo", "g": "Jeu De Rôles", "r": 1, "img": "nes/028.webp", "shot": "shots/nes/028.webp", "d": "Vous êtes un aventurier originaire de la cité des Elfes, et vous rentrez chez vous après un long voyage. Hélas, à votre arrivée, vous remarquez que tout a bien changé ! Le village des Elfes, qui connaissait autrefois paix et prospérité, n'offre plus que désastre et désolation. Une météorite s'est abattue sur l'Arbre du Monde, transformant l'eau de la fontaine des Elfes, source de vie, en un terrible poison avant de se tarir. Les Nains qui habitaient dans l'Arbre sont devenus fous. Pour ramener la paix, il faut pénétrer dans l'Arbre du Monde et vaincre le Démon qui y a élu domicile. Beaucoup d'hommes sont partis l'en déloger, mais aucun n'est revenu. Vous êtes le dernier espoir des Elfes."}, {"id": "nes_029", "s": "nes", "n": 29, "t": "Felix the
