 plus de sa massue, Sam peut pousser éliminer les dinosaures en criant."}, {"id": "snes_049", "s": "snes", "n": 49, "t": "Prince of Persia", "y": 1993, "dv": "Arsys", "p": "Konami", "g": "Action, Plateforme", "r": 0, "img": "snes/049.webp", "shot": "shots/snes/049.webp", "d": "Prince of Persia sur Super Nintendo est un jeu de plates-formes se déroulant dans le Moyen-Orient. Le joueur contrôle le Prince de Perse qui peut marcher, courir, se baisser, sauter, s'accrocher et combattre à l'épée. Le but est de terminer tous les niveaux pour libérer la princesse dans le temps imparti, c'est-à-dire une heure. Chaque niveau consiste en un donjon de plus en plus grand et parsemé d'embûches (précipices, dalles se dérobant sous les pieds, pics sortant du sol)."}, {"id": "snes_050", "s": "snes", "n": 50, "t": "R-Type III", "y": 1994, "dv": "Jaleco", "p": "Irem", "g": "Shoot'em Up", "r": 0, "img": "snes/050.webp", "shot": "shots/snes/050.webp", "d": "R-Type III : The Third Lightening sur Super Nes est un shoot'em up avec une vue de côté où vous pilotez un vaisseau en environnement hostile. Repoussez l'envahisseur en vous servant de votre arsenal améliorable grâce aux objets disposés dans les niveaux, couplés aux modules de force dont vous disposez pour une puissance de feu accrue. Affrontez vos ennemis et des boss gigantesques dans des décors spatiaux en mouvement."}, {"id": "snes_051", "s": "snes", "n": 51, "t": "Rock n' Roll Racing", "y": 1994, "dv": "Silicon & Synapse", "p": "Interplay", "g": "Course, Conduite", "r": 0, "img": "snes/051.webp", "shot": "shots/snes/051.webp", "d": "Avant de devenir Blizzard, les créateurs de Warcraft se nommaient Silicon & Synapse, on leur doit Rock N' Roll Racing sur Super Nintendo, un jeu de courses dont la particularité est de disposer d'une bande-son composée de titres phare du répertoire Heavy Metal."}, {"id": "snes_052", "s": "snes", "n": 52, "t": "Secret of Evermore", "y": 1996, "dv": "Square Enix", "p": "Square Enix", "g": "Jeu De Rôles", "r": 1, "img": "snes/052.webp", "shot": "shots/snes/052.webp", "d": "Secret of Evermore sur Super Nintendo est un jeu de rôle ayant la particularité de commencer dans une époque contemporaine. Alors qu'il sort d'une salle de cinéma, le héros rentre dans un manoir mystérieux pour récupérer son chien attiré par un chat errant. Il découvre que le manoir appartenait à un scientifique qui a laissé ses engins en état. L'un d'eux transporte le jeune homme à Evermore. Il parcourra par la suite quatre périodes de l'histoire accompagné de différents personnages."}, {"id": "snes_053", "s": "snes", "n": 53, "t": "Secret of Mana", "y": 1994, "dv": "Square", "p": "Square", "g": "Jeu De Rôles", "r": 3, "img": "snes/053.webp", "shot": "shots/snes/053.webp", "d": "Secret of Mana est le deuxième épisode de la série Seiken Densetsu sur Super Nintendo. Un jeune garçon fait une chute près d'une cascade de son village. A son réveil, il découvre une épée plantée dans un rocher. Lorsqu'il retourne au village, les habitants sont attaqués par des monstres et l'arme du garçon est désignée responsable de ces agression. Le jeune homme est alors chassé et livré à lui-même dans une grande aventure qui l'amènera à rencontrer de nombreux autres personnages."}, {"id": "snes_054", "s": "snes", "n": 54, "t": "Shadowrun", "y": 1993, "dv": "Data East", "p": "Beam Software", "g": "Jeu De Rôles", "r": 0, "img": "snes/054.webp", "shot": "shots/snes/054.webp", "d": "Shadowrun sur Super Nintendo est inspiré du jeu de rôle sur table du même nom. Bien qu'il en reprenne l'univers futuriste, le jeu vidéo diffère beaucoup de l'original. Vous contrôlez Jake qui se réveille avec une grave amnésie après une fusillade à Seattle en 2050. Vous allez découvrir en même temps que lui comment les Nains, les Orcs et les Humains cohabitent dans les grandes villes et apprendrez à survivre malgré les dangers qui vous attendent à chaque coin de rue."}, {"id": "snes_055", "s": "snes", "n": 55, "t": "Shanghai II : Dragon's Eye", "y": 1993, "dv": "Hot-B", "p": "Activision", "g": "Jeu De Societe Asiatique", "r": 0, "img": "snes/055.webp", "shot": "shots/snes/055.webp", "d": "Shanghai II : Dragon's Eye est un jeu de réflexion sur Super NES. Le but, dans ce jeu de Mah-Jong, est de faire des paires à l'aide des différentes pièces disposées aléatoirement par l'ordinateur. Le jeu propose douze dispositions différentes basées sur les signes du zodiaque chinois. Un mode deux joueurs est également disponible dans lequel il est nécessaire de tout faire pour gêner son adversaire."}, {"id": "snes_056", "s": "snes", "n": 56, "t": "SimCity", "y": 1992, "dv": "Maxis Software", "p": "Nintendo", "g": "Simulation", "r": 0, "img": "snes/056.webp", "shot": "shots/snes/056.webp", "d": "SimCity sur Super Nintendo est l'un des premiers jeux conçus par Will Wright, connu pour Les Sims. Vous incarnez le maire d'une ville et devez rendre les habitants heureux afin que ceux-ci ne vous virent pas. Le premier mode de jeu vous fait partir de zéro, avec tous les bâtiments et infrastructures à construire. Dans le mode Catastrophe, vous prenez les commandes d'une cité déjà construite et devez faire face aux catastrophes naturelles, ainsi qu'à des émeutes et autres événements inattendus."}, {"id": "snes_057", "s": "snes", "n": 57, "t": "Soul Blazer", "y": 1994, "dv": "Quintet", "p": "Enix", "g": "Jeu De Rôles", "r": 0, "img": "snes/057.webp", "shot": "shots/snes/057.webp", "d": "Dans le jeu de rôle Soul Blazer sur Super Nintendo, le Roi Magridd a passé un accord avec Deathtoll, le Roi du Mal, pour échanger l'âme de chaque être vivant contre une pièce d'or. Vous incarnez le héros envoyé par le Maître pour libérer toutes les âmes et battre Deathtoll. Avec son épée et rejoint par un magicien, vous devez éliminer les monstres qui gardent les âmes des êtres vivants. En les récupérant, les personnes sauvées vous donneront des indices pour continuer l'aventure."}, {"id": "snes_058", "s": "snes", "n": 58, "t": "Spider-Man", "y": 1995, "dv": "Western Technologies", "p": "Ljn", "g": "Action, Plateforme", "r": 0, "img": "snes/058.webp", "shot": "shots/snes/058.webp", "d": "Spider-Man est une nouvelle adaptation du comics de Marvel sur Super Nintendo. Le Bouffon vert, Octopus et Smythe se sont évadés de prison. Peter Parker enfile son costume de Spider-Man pour les retrouver et les y renvoyer. En le contrôlant, vous pouvez utiliser sa toile comme une liane pour traverser des obstacles où en faire des missiles pour éliminer les ennemis. La toile est cependant limitée et il faut trouver des recharges au préalable pour ne pas risquer de tomber à sec en pleine bagarre."}, {"id": "snes_059", "s": "snes", "n": 59, "t": "Spider-Man & Venom : Maximum Carnage", "y": 1994, "dv": "Software Creations", "p": "Ljn", "g": "Beat'em All", "r": 0, "img": "snes/059.webp", "shot": "shots/snes/059.webp", "d": "Spider-Man & Venom : Maximum Carnage est un beat'em all sur Super Nintendo. Le jeu commence alors que Carnage s'échappe de l'asile de fous et que Spider-Man fait tout pour le remettre dans sa camisole. Vous incarnez donc Spider-Man (mais il est possible de jouer avec Venom à certains moments du jeu) et il faudra faire le ménage dans les niveaux en se débarrassant des multiples ennemis qui débarquent à l'écran."}, {"id": "snes_060", "s": "snes", "n": 60, "t": "Starwing", "y": 1993, "dv": "Nintendo", "p": "Nintendo", "g": "Shoot'em Up", "r": 2, "img": "snes/060.webp", "shot": "shots/snes/060.webp", "d": "Vous êtes Fox McCloud, commandant de l'escadron StarFox, une unité aérienne de l'armée de la planète Corneria, qui utilise des avions révolutionnaires mais encore à l'état de prototypes, les Arwings. Avec vos 3 équipiers Peppi, Slippy et Falco, vous avez pour mission de vous rendre sur la planète Venom, où Andross, un scientifique banni de Corneria, a établi sa base. Votre objectif : le tuer, et mettre un terme à ses recherches, trop dangereuses pour la galaxie. Le problème, c'est qu'il s'est déjà établi sur toutes les planètes du système, et votre chemin sera semé d'embûches... Révolutionnaire à l'époque, Starfox (Starwing en France) utilise un moteur de 3D polygonal, ce qui donne au jeu un rendu assez exceptionnel, bien que, aujourd'hui, totalement dépassé. Graphiquement, c'est donc assez intéressant. Les musiques et les bruitages sont tout simplement superbes. Niveau gameplay, c'est du grand classique : un bouton pour tirer, un pour le coup de boost, un pour le coup de frein, un pour la super bombe. Les gâchettes permettent de placer l'avion en position verticale, ce qui permet une plus grande amplitude de virage. Vous avez 3 circuits différents, qui correspondent chacun à un…"}, {"id": "snes_061", "s": "snes", "n": 61, "t": "Street Fighter II Turbo", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Combat", "r": 3, "img": "snes/061.webp", "shot": "shots/snes/061.webp", "d": "Street Fighter II Turbo : Hyper Fighting sur Super NES vous lance dans l'arène pour cette nouvelle déclinaison de la saga de Capcom. Dans ce jeu de baston, vous retrouvez huit combattants de légende ainsi que les boss jouables (Balrog, Sagat, Vega et M. Bison). Maîtrisez chacune des techniques propres aux personnages dans ce titre à la jouabilité nerveuse et aux coups ravageurs."}, {"id": "snes_062", "s": "snes", "n": 62, "t": "Street Racer", "y": 1994, "dv": "Vivid Image", "p": "Ubisoft", "g": "Course, Conduite", "r": 0, "img": "snes/062.webp", "shot": "shots/snes/062.webp", "d": "Street Racer est un jeu de courses sur Super Nintendo dans lequel tous les coups sont permis. Huit personnages sont proposés, avec des caractéristiques différentes pour leur véhicule. Certains seront plus rapides alors que d'autres seront plus résistants aux attaques adverses. En plus des courses où l'important est de gagner, quelle que soit la manière, d'autres modes sont disponibles en solo ou à plusieurs : Rumble (bagarre) et Soccer (football)."}, {"id": "snes_063", "s": "snes", "n": 63, "t": "Stunt Race FX", "y": 1994, "dv": "Argonaut", "p": "Nintendo", "g": "Course, Conduite", "r": 0, "img": "snes/063.webp", "shot": "shots/snes/063.webp", "d": "Stunt Race FX est un jeu de courses en 3D sur Super Nintendo. Trois véhicules sont disponibles, ayant chacun leurs caractéristiques concernant la vitesse, l'accélération et la solidité. En plus des courses contre trois autres concurrents où il faut bien évidemment terminer premier, deux autres modes sont proposés. En Stunt Trax, vous devrez collecter toutes les étoiles dans le temps imparti, alors que Battle Trax est un duel entre deux joueurs où il faut terminer la course devant l'autre."}, {"id": "snes_064", "s": "snes", "n": 64, "t": "Sunset Riders", "y": 1993, "dv": "Konami", "p": "Konami", "g": "Action", "r": 0, "img": "snes/064.webp", "shot": "shots/snes/064.webp", "d": "Sunset Riders vous envoie vous et votre Super Nintendo dans le Far West américain, à l'époque des cow-boys et des chasseurs de prime. Richard Rose, l'un des plus grands bandits, a décidé de tout contrôler pour devenir le maître de l'Ouest. Seul les Sunset Riders, quatre justiciers rapides de la gâchette, peuvent l'en empêcher. Vous avez le choix parmi Steve, Bob, Billy et Cormano pour éliminer tous les sous-fifres de Rose. Chacun possède une arme différente, revolver ou fusil."}, {"id": "snes_065", "s": "snes", "n": 65, "t": "Super Adventure Island", "y": 1992, "dv": "Hudson", "p": "Hudson", "g": "Action, Plateforme", "r": 0, "img": "snes/065.webp", "shot": "shots/snes/065.webp", "d": "Super Adventure Island sur Super Nintendo vous envoie sur l'île paradisiaque de Waku-Waku. Higgins y vit paisiblement en compagnie de sa petite amie, jusqu'au moment où un sorcier la transforme en pierre. Higgins, quant à lui, est envoyé à l'autre bout de l'île. Il doit faire au plus vite pour tenter de sauver sa bien-aimée. Les niveaux sont chronométrés, il faut les terminer avant que le compteur ne tombe à zéro. Pour aller plus vite, Higgins peut utiliser un skate dans certaines situations."}, {"id": "snes_066", "s": "snes", "n": 66, "t": "Super Aleste", "y": 1992, "dv": "Toho Company", "p": "Compile", "g": "Shoot'em Up", "r": 0, "img": "snes/066.webp", "shot": "shots/snes/066.webp", "d": "Super Aleste, connu également sous le nom Space Megaforce, est le seul épisode Super Nintendo de la série Aleste. En pilotant un vaisseau avec une vue traditionnelle à la Space Invaders, vous devez détruire une armada d'aliens. La particularité est le nombre de missiles disponibles au cours du jeu. Il y en a huit types différents ayant chacun six améliorations. Le mode shortgame apporte des niveaux supplémentaires où il faut survivre le plus longtemps possible."}, {"id": "snes_067", "s": "snes", "n": 67, "t": "Super Bomberman", "y": 1993, "dv": "Hudson", "p": "Hudson", "g": "Puzzle-Game, Action", "r": 2, "img": "snes/067.webp", "shot": "shots/snes/067.webp", "d": "Super Bomberman est l'apparition sur Super Nintendo du célèbre poseur de bombes qui a fait le tour des consoles dans les années 80 et 90. Une nouvelle fois, il faut faire exploser les ennemis présents à l'écran pour progresser dans les niveaux et atteindre des boss à éliminer. A noter qu'il s'agit de l'un des premiers jeux à utiliser le Super MultiTap pour pouvoir jouer à quatre, ce qui ajoute un grand intérêt au mode battle où le but est d'éliminer les autres poseurs de bombes."}, {"id": "snes_068", "s": "snes", "n": 68, "t": "Super Bomberman 2", "y": 1995, "dv": "Hudson", "p": "Hudson", "g": "Puzzle-Game, Action", "r": 0, "img": "snes/068.webp", "shot": "shots/snes/068.webp", "d": "Super Bomberman est un nouvel épisode de la série Bomberman sur Super Nintendo. Toujours la même recette pour ce deuxième opus, avec un bon mélange entre mode solo et mode multijoueur. De nouveaux niveaux et boss sont disponibles en mode historie alors que de nouveaux terrains de jeu alimenteront les passionnés du mode battle."}, {"id": "snes_069", "s": "snes", "n": 69, "t": "Super Castlevania IV", "y": null, "dv": "Konami", "p": "Konami", "g": "Action, Plateforme", "r": 2, "img": "snes/069.webp", "shot": "shots/snes/069.webp", "d": "Lorsque l'horreur dépasse l'imagination, que les caveaux s'ouvrent sous vos pas et vous engloutissent... Voici Castlevania, l'aventure d'outre-tombe. Voici venue la fin d'un siècle de tranquillité pour le peuple de Transylvanie. Une fois de plus, les cris angoissés des villageois sans espoir font vibrer le sol tandis qu'ils luttent contre les nouvelles horreurs cauchemardesques dispensées par le Prince des Ténèbres, le Comte Dracula. Et cette fois-ci, une pierre tombale est gravée à votre nom: Simon Belmont. Vous devez descendre dans le terrifiant Château des morts-vivants et ses bas-fonds horribles... 11 terribles niveaux de labyrinthes vous attendent. Vous serez aux prises avec le donjon pivotant, les Ruines enfouies des Esprits perdus, les salles de torture et des grottes grouillant de diverses créatures."}, {"id": "snes_070", "s": "snes", "n": 70, "t": "Super Double Dragon", "y": 1993, "dv": "Tecmo", "p": "Tradewest", "g": "Action, Beat'em All", "r": 1, "img": "snes/070.webp", "shot": "shots/snes/070.webp", "d": "La légende continue... Retrouvez les deux plus grands héros de tous les temps, spécialistes des arts martiaux, plongés dans de nouvelles aventures! Leurs nouvelles techniques de combat sont redoutables, leurs missions vraiment impossibles et littéralement surprenantes. Quant aux ennemis... ils ont de quoi vous faire dresser les cheveux sur la tête! Marian, une femme policier de toute beauté, s'est initiée à l'art du Kung Fu. Elle occupe à mi-temps le poste d'assistant-instructeur à l'école d'entraînement des arts martiaux dirigée par Billy et Jimmy Lee. Chargée d'une investigation sur la drogue, elle a disparu en tentant d'infiltrer le gang tristement célèbre des Guerriers Ombres Noires (Black Shadow Warriors). Votre incomparable savoir-faire et votre incroyable maîtrise des techniques de combat seront bien nécessaires pour retrouver et libérer Marian. Seul ou avec l'aide de votre frère, vous devez confronter l'assaut impitoyable des Guerriers de l'Ombres avec la puissance et la férocité légendaires de Double Dragon!"}, {"id": "snes_071", "s": "snes", "n": 71, "t": "Super Hockey", "y": 1993, "dv": "Sculptured Software", "p": "Nintendo", "g": "Sport", "r": 0, "img": "snes/071.webp", "shot": "shots/snes/071.webp", "d": "NHL Stanley Cup est un jeu de hockey sur glace sur Super Nintendo. Lancez-vous dans la saison complète pour emmener votre équipe favorite jusqu'à la victoire. Gérez vos joueurs comme vous l'entendez et effectuez des transferts pour améliorer vos statistiques générales. Diverses options permettent de gérer au mieux la tactique de votre équipe."}, {"id": "snes_072", "s": "snes", "n": 72, "t": "Super Mario All-Stars", "y": 1993, "dv": "Nintendo", "p": "Nintendo", "g": "Action, Compilation, Plateforme", "r": 0, "img": "snes/072.webp", "shot": "shots/snes/072.webp", "d": "Super Mario All-Stars est une compilation sur Super Nintendo de tous les jeux de plates-formes comprenant Mario sortis sur Nintendo. Y figurent donc : Super Mario Bros. 1, 2 et 3 ainsi que Super Mario Bros. : The Lost Levels, jusqu'alors jamais édité en Europe. Plus qu'une simple compilation, le jeu apporte des graphismes améliorés et la possibilité de sauvegarder sa progression. Les nostalgiques de la première console Nintendo ont de quoi être satisfaits."}, {"id": "snes_073", "s": "snes", "n": 73, "t": "Super Mario Kart", "y": 1993, "dv": "Nintendo", "p": "Nintendo", "g": "Course, Conduite, Course Vue 3Eme Pers.", "r": 3, "img": "snes/073.webp", "shot": "shots/snes/073.webp", "d": "Mesdames et Messieurs... faites chauffer vos moteurs! Un plaisr intense vous attend sur les circuits de Super Mario Kart! Adoptez la conduite exceptionnelle de Mario, Luigi et de la Princesse! Mesurez-vous à un adversaire de poids: Donkey Kong Jr! Percutez le Roi des Koopas! Frottez-vous au pare-chocs de Yoshi! Les graphismes exceptionnels, obtenus grâce au Mode 7, et le double affichage à l'écran, vous permettent de découvrir la joie de la compétition, contre un ami ou l'ordinateur. Avez-vous les qualités nécessaires pour gagner le trophée d'or dans la Coupe des Étoiles? En tout cas, il est aussi amusant de participer que de gagner! Si vous avez plus envie de stratégie que de vitesse, tentez votre chance en Mode Combat! Sur quatre circuits différents, vous aurez à votre disposition toute une série d'armes loufoques (Carapaces de Koopa, Peaux de Banane, Supers Eclairs, etc) pour faire éclater les ballons de vos adversaires et triompher!"}, {"id": "snes_074", "s": "snes", "n": 74, "t": "Super Mario World", "y": 1992, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme", "r": 4, "img": "snes/074.webp", "shot": "shots/snes/074.webp", "d": "Découvrez un monde nouveau avec Mario et Yoshi! Mario s'embarque dans la plus passionnante de ses aventures... Mais cette fois-ci, il est venu avec un ami. Yoshi le dinosaure lui sera très utile pour affronter à nouveau le terrible Bowser. Sachez utiliser les nouveaux pouvoirs de Mario et l'appétit vorace de Yoshi pour compléter les 96 niveaux remplis de monstres et d'obstacles. Escaladez les montagnes, traversez les rivières et explorez les grottes. Détruisez les 7 châteaux Koopa et découvrez les clés menant aux niveaux secrets."}, {"id": "snes_075", "s": "snes", "n": 75, "t": "Super Mario World 2 : Yoshi's Island", "y": 1995, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme", "r": 3, "img": "snes/075.webp", "shot": "shots/snes/075.webp", "d": "Yoshi vient à la rescousse de Bébé Mario dans la suite de Super Mario World! Kamek, un Magikoopa retors veut kidnapper Bébé Mario. Dans cette suite de Super Mario World, vous incarnez Yoshi. Vous devez ramener Bébé Mario auprès de ses parents, dans le royaume des Champignons. Vous devez aussi éviter les larbins de Kamek ainsi que ses pièges infernaux. Dépêchez-vous d'atteindre votre objectif, mais prenez le temps d'admirer les décors variés de l'Ile de Yoshi. Yoshi sera t'il à la hauteur de l'immense tâche qui lui incombe? À vous de l'aider à lancer des oeufs, à manipuler des objets inédits et à résoudre des casse-tête chinois! Mais quoi qu'il en soit, tentez tout!"}, {"id": "snes_076", "s": "snes", "n": 76, "t": "Super Metroid", "y": 1994, "dv": "Nintendo", "p": "Nintendo", "g": "Aventure, Action", "r": 3, "img": "snes/076.webp", "shot": "shots/snes/076.webp", "d": "Associez-vous avec la puissance de Samus pour un choc Super Metroid! Prenez à parti la légion des pirates de l'espace et endossez une nouvelle force Métroïde alors que vous progressez dans le monde souterrain de la planète Zèbes! C'est à vous et à Samus qu'il incombe de retrouver la larve Métroïde avant que des forces maléfiques utilisent à mauvais escient son énergie. Chaque recoin vicieux, chaque passage dissimulé de la planète Zèbes renferment des créatures menaçantes prêtes au combat... y compris l'horrible Ridley et le lézard géant, Kraid. Au moyen de votre saut périlleux létal, faites mordre la poussière aux ennemis. Utilisez un rayon électrique au trvers des interstices. Personne ne vous arrêtera, ni vous ni Samus. Mais attention! Il semble que Mother Brain soit de retour..."}, {"id": "snes_077", "s": "snes", "n": 77, "t": "Super Probotector : Alien Rebels", "y": 1992, "dv": "Konami", "p": "Konami", "g": "Tir, Tir / Run And Gun", "r": 2, "img": "snes/077.webp", "shot": "shots/snes/077.webp", "d": "Le combat est sur le point de recommencer! Nous sommes en 2636 et la Terre est confrontée à la menace d'une invasion massive d'extra-terrestres. Ces rebelles mutants, méchants et déments, sont de retour et veulent se venger en détruisant la race humaine! Ils ont récupéré leurs forces et disposent de toute une armée composée, en partie, d'Extra-terrestres métalliques, de Motards de l'enfer, de Fusées Ninja et même de Chiens mutants pour les aider à vaincre. Ils sont bien décidés à ne pas subir une autre défaite humiliante et sont prêts, une fois de plus, à livrer bataille contre les Probotectors les plus puissants, RD008 et RC011. Qui sera le vainqueur de ce combat à mort? Probotector peut-il encore une fois sauver la mise?"}, {"id": "snes_078", "s": "snes", "n": 78, "t": "Super Punch-Out!!", "y": 1995, "dv": "Nintendo", "p": "Nintendo", "g": "Sport", "r": 2, "img": "snes/078.webp", "shot": "shots/snes/078.webp", "d": "Super Punch-Out!! est un jeu de boxe sur Super Nintendo. Le look hilarant des personnages tentera de vous faire perdre votre concentration dans les matches que vous disputerez pour tenter de remporter le titre de champion WVBA. Vous contrôlez votre boxeur avec une vue à la troisième personne, pour enchaîner les uppercuts et les crochets afin de mettre K.O. votre adversaire. A la fin des matches, les coups que vous aurez donné seront comptabilisés pour déterminer le nombre de points gagnés."}, {"id": "snes_079", "s": "snes", "n": 79, "t": "Super R-Type", "y": 1992, "dv": "Irem", "p": "Nintendo", "g": "Shoot'em Up", "r": 0, "img": "snes/079.webp", "shot": "shots/snes/079.webp", "d": "Super R-Type sur Super Nintendo est un shoot'em up spatial. Défendez la Terre contre le despotique Bydo à la tête d'une flotte d'extraterrestres belliqueux. Aux commandes du vaisseau expérimental R-9, le seul capable de sauver la situation, repoussez l'envahisseur et défendez la Planète Bleue."}, {"id": "snes_080", "s": "snes", "n": 80, "t": "Super Star Wars", "y": 1993, "dv": "Sculptured Software", "p": "Jvc", "g": "Action, Plateforme", "r": 0, "img": "snes/080.webp", "shot": "shots/snes/080.webp", "d": "Super Star Wars est un jeu d'action/plates-formes sur Super Nintendo basé sur le film Un Nouvel Espoir de la saga La Guerre des Etoiles. Incarnez Luke Skywalker pour sauver les droïdes sur la planète Tatooine et usez de votre sabre laser ou de votre blaster pour vous défaire des Stormtroopers. Suivez les enseignements d'Obi-Wan Kenobi et découvrez les innombrables pouvoirs de la Force."}, {"id": "snes_081", "s": "snes", "n": 81, "t": "Super Star Wars : Return of the Jedi", "y": 1995, "dv": "Sculptured Software", "p": "Jvc", "g": "Action, Plateforme", "r": 0, "img": "snes/081.webp", "shot": "shots/snes/081.webp", "d": "Super Star Wars : Return of the Jedi est un jeu d'action/plates-formes sur Super Nintendo basé sur le film le Retour du Jedi de la saga La Guerre des Etoiles. Incarnez Luke Skywalker, Han Solo, Princesse Leia ou encore Chewbacca et revivez les moments-clés du célèbre film de George Lucas : affrontez Jabba, contrôlez des motos ultra-rapides dans les forêts d'Endor, prêtez main forte aux Ewok et affrontez Dark Vador."}, {"id": "snes_082", "s": "snes", "n": 82, "t": "Super Star Wars : The Empire Strikes Back", "y": 1993, "dv": "Sculptured Software", "p": "Jvc", "g": "Action, Plateforme", "r": 0, "img": "snes/082.webp", "shot": "shots/snes/082.webp", "d": "Super Star Wars : The Empire Strikes Back est un jeu d'action/plates-formes sur Super Nintendo basé sur le film l'Empire Contre-Attaque de la saga La Guerre des Etoiles. Incarnez Luke Skywalker et revivez les moments-clés du célèbre film de George Lucas : retrouvez votre chemin sur la planète Hoth, affrontez les créatures de Dagobah, montez à bord du Faucon Millénium et affrontez le terrible Dark Vador."}, {"id": "snes_083", "s": "snes", "n": 83, "t": "Super Street Fighter II", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Action, Combat", "r": 2, "img": "snes/083.webp", "shot": "shots/snes/083.webp", "d": "Super Street Fighter II : The New Challengers est une variante de Street Fighter II sortie en 1993 sur Super NES. Quatre nouveaux personnages sont au programme, en plus des boss cachés dans le jeu original, portant le nombre de personnages à un total de 16. Les fonctions multijoueurs apportent également des nouveautés, avec le mode élimination et le mode tournoi à huit. Enfin, il est toujours possible de jouer en solo, en affrontant un à un, tous les personnages du jeu."}, {"id": "snes_084", "s": "snes", "n": 84, "t": "Super SWIV", "y": 1993, "dv": "Sci Games", "p": "Time Warner Interactive", "g": "Shoot'em Up", "r": 0, "img": "snes/084.webp", "shot": "shots/snes/084.webp", "d": "Super SWIV est un jeu d'action sur Super Nintendo. Sur une île de l'océan Atlantique, des véhicules de l'armée ont été volés par des robots avec un seul objectif, détruire tout ce qui se trouve sur leur passage. L'armée vous envoie pour infiltrer leur base et découvrir leurs plans. Vous avez le choix entre un hélicoptère et une Jeep. L'hélicoptère permet d'éviter les ennemis au sol alors que l'avantage de la Jeep est de pouvoir tirer dans toutes les directions."}, {"id": "snes_085", "s": "snes", "n": 85, "t": "Super Tennis", "y": 1992, "dv": "Tokyo Shoseki", "p": "Nintendo", "g": "Sport", "r": 1, "img": "snes/085.webp", "shot": "shots/snes/085.webp", "d": "Super Tennis est un jeu de sport sur Super Nintendo. Le circuit mondial de tennis vous attend. Sélectionnez un joueur parmi 20 et lancez-vous dans des matchs à couper le souffle. De plus, à chaque victoire vous remportez des points pour améliorer vos statistiques."}, {"id": "snes_086", "s": "snes", "n": 86, "t": "Super Turrican", "y": 1993, "dv": "Factor 5", "p": "Hudson", "g": "Action, Plateforme", "r": 0, "img": "snes/086.webp", "shot": "shots/snes/086.webp", "d": "Avec autant de puisance de tir au bout des doigts vous pensez gagner, n'est-ce pas? Détrompez-vous! Même avec un super rayon, des bombes malignes et des lignes de puissance comme armes sensas à votre disposition, vos ennemis feront tout pour que vous soyez confronté à l'ultime terreur! Essayer donc de survivre aux 13 niveaux de mondes les plus étranges encore jamais découverts grâce à un armement de haute technologie sensationnel."}, {"id": "snes_087", "s": "snes", "n": 87, "t": "Super Turrican 2", "y": 1995, "dv": "Ocean", "p": "Ocean", "g": "Action, Plateforme", "r": 0, "img": "snes/087.webp", "shot": "shots/snes/087.webp", "d": "Un shoot'em up similaire à Contra (Probotector en Europe). Vous êtes un soldat, et vous disposez d'une arme, d'un rayon, d'un grappin mécanique et de quelques bombes, pour tabasser les vilains pas beaux et sauver la galaxie. Des items vous permettent de changer d'armes : l'arme de départ possède un rayon d'action étendu, mais est peu puissante ; le rayon laser, puissant mais fin et en ligne droite uniquement ; les boules de feu, puissance moyenne, rebondissent sur les murs, pratique ; le lance-flamme, très puissant, mais portée réduite (comprendre pas illimitée, contrairement aux autres armes, mais ça reste largement suffisant)... Plus vous prenez de nombre du même item d'arme, plus l'arme sera puissante. Les super bombes sont en usage limité, logique, mais on en trouve pas mal. Pour finir, la difficulté est bien dosée, mais le je reste, à l'instar de Probotector, relativement compliqué. Pour ceux qui voudraient le finir vite fait, l'archive contient une version cheatée, vous pouvez choisir les codes à activer (énergie illimitée, vies illimitées, intouchable, etc.). À télécharger, c'est du très bon ^^ Vid&eacute;o:"}, {"id": "snes_088", "s": "snes", "n": 88, "t": "Terranigma", "y": 1996, "dv": "Quintet", "p": "Enix", "g": "Action / Aventure, Action, Jeu De Rôles", "r": 1, "img": "snes/088.webp", "shot": "shots/snes/088.webp", "d": "Terranigma est un jeu de rôle orienté action sur Super Nintendo. Vous incarnez Ark, un jeune homme qui, incapable de résister à sa curiosité, ouvre une boîte interdite qui transforme tous les habitants du village en pierre. Il devra partir à l'aventure à la recherche des Cinq Tours pour trouver une solution à ce terrible problème."}, {"id": "snes_089", "s": "snes", "n": 89, "t": "Tetris & Dr. Mario", "y": 1995, "dv": "Nintendo", "p": "Nintendo", "g": "Compilation, Puzzle-Game", "r": 0, "img": "snes/089.webp", "shot": "shots/snes/089.webp", "d": "Tetris & Dr. Mario est une réédition des deux puzzle-games sortis sur NES et Gameboy quelques années plus tôt. La compilation apporte des graphismes améliorés tout en conservant le principe de jeu. Dans cette version de Tetris, un mode deux joueurs a été ajouté tandis que le mode Mixed Match permet de faire un tournoi entre deux joueurs avec des manches aléatoires de Tetris et de Dr. Mario."}, {"id": "snes_090", "s": "snes", "n": 90, "t": "Tetris Attack", "y": 1996, "dv": "Nintendo", "p": "Nintendo", "g": "Puzzle-Game", "r": 1, "img": "snes/090.webp", "shot": "shots/snes/090.webp", "d": "Tetris Attack est un puzzle-game sur Super Nintendo. L'univers du jeu sort tout droit du monde joyeux de Yoshi. Une bonne dose d'astuce et de sang-froid sera de mise pour progresser dans les différents niveaux. Le système est simple, des blocs tombent du ciel et il faut les empiler correctement pour les faire disparaître. Bien sûr plus le jeu avance et plus la vitesse augmente..."}, {"id": "snes_091", "s": "snes", "n": 91, "t": "The Adventures of Batman & Robin", "y": 1994, "dv": "Konami", "p": "Konami", "g": "Action, Plateforme, Beat'em All", "r": 0, "img": "snes/091.webp", "shot": "shots/snes/091.webp", "d": "The Adventures of Batman & Robin est un jeu d'action/plates-formes sur SNES dans lequel vous dirigez le justicier masqué de Gotham dans une série de missions au cours desquelles vous rencontrerez les plus grands ennemis de Batman. A vous de défaire leurs plans en combattant leurs sbires à l'aide de vos gadgets."}, {"id": "snes_092", "s": "snes", "n": 92, "t": "The Legend of Zelda : A Link to the Past", "y": 1992, "dv": "Nintendo", "p": "Nintendo", "g": "Action / Aventure, Aventure", "r": 4, "img": "snes/092.webp", "shot": "shots/snes/092.webp", "d": "Imaginaire et réalité se cotoient dans un pays enchanté. Retournez à Hyrule, à l'âge des héros et de la magie. Les ancêtres de Link et de Zelda affrontent des monstres en progression alors qu'un magicien redoutable envahit le royaume. Il veut détruire le pays d'Hyrule: vous seul pouvez faire échouer son plan diabolique. Au long de votre quête, vous allez vous aventurer dans des labyrinthes tortueux, des donjons, des palais et des forêts ombreuses. Eprouvez votre courage au moyen d'épées puissantes et d'armes magiques. Soulevez un rocher que vous lancerez sur vos ennemis. Si rien ne va plus, plongez dans une rivière et fuyez en nageant! Apprenez des sorts imparables, trouvez des objets magiques; résolvez les énigmes du magicien diabolique et du royaume caché d'Hyrule."}, {"id": "snes_093", "s": "snes", "n": 93, "t": "The Lost Vikings", "y": 1993, "dv": "Silicon & Synapse", "p": "Interplay", "g": "Plateforme, Puzzle-Game", "r": 1, "img": "snes/093.webp", "shot": "shots/snes/093.webp", "d": "Un jour ordinaire dans le froid du grand Nord. Pillage et navigation sont au rendez-vous! Soudain, Erik the Swift, Baleog the Fierce et Olaf the Stout sont aspirés à l'intérieur d'un vaisseau spatial extraterrestre. Et c'est à vous que revient le devoir de les aider à revenir chez eux. Mais chaque porte mystérieuse que vous les aidez à franchir les projette dans différentes époques du temps et leur fait rencontrer de nouveaux ennemis! Baleog arrivera-t'il à vaincre Elmo, le Dinosaure de la Préhistoire? Olaf parviendra-t'il à se protéger des momies des Grandes Pyramides d'Égypte? Quant à Erik, viendra-t'il à bout de la scie à refendre de la Grande Usine? Pressez-vous! Ce n'est qu'à ce prix que vous arriverez à libérer les Vikings évaporés dans l'espace de l'emprise de leurs ravisseurs extraterrestres."}, {"id": "snes_094", "s": "snes", "n": 94, "t": "The Magical Quest Starring Mickey Mouse", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Action, Plateforme", "r": 0, "img": "snes/094.webp", "shot": "shots/snes/094.webp", "d": "The Magical Quest Starring Mickey Mouse est un jeu de plates-formes et d'aventure sur Super Nintendo. Alors que Mickey joue à la Balle avec Pluto et Dingo, son fidèle chien se perd. Mickey part à sa recherche et apprend qu'il a été capturé par Pat Hibulaire un terrible mage noir ! Mickey décide alors d'aller sauver son ami et à l'aide de pouvoirs magiques conférés par un magicien il devra terrasser ses ennemis. On découvre différents équipements pour Mickey durant l'aventure."}, {"id": "snes_095", "s": "snes", "n": 95, "t": "Top Gear", "y": 1992, "dv": "Kemco", "p": "Gremlin Interactive", "g": "Course, Conduite", "r": 0, "img": "snes/095.webp", "shot": "shots/snes/095.webp", "d": "Top Gear est un jeu de courses de voitures sur Super Nintendo. 4 véhicules sont disponibles, chacun avec ses avantages et ses inconvénients (vitesse maximum, consommation d'essence, turbo et tenue de route). Le joueur devra espérer arriver parmi les 5 premiers sur les 32 circuits que compte le jeu pour éviter le Game Over. Un système de mots de passe permet de reprendre sa progression où on l'avait arrêté. Un mode deux joueurs en écran partagé est aussi de la partie."}, {"id": "snes_096", "s": "snes", "n": 96, "t": "Top Gear 2", "y": 1993, "dv": "Gremlin Interactive", "p": "Kemco", "g": "Course, Conduite", "r": 0, "img": "snes/096.webp", "shot": "shots/snes/096.webp", "d": "Top Gear 2 est un jeu de course de voitures sur Super NES. Le joueur doit l'emporter dans 16 championnats différents, chacun comptant 4 circuits dont certains sortent tout droit de la réalité comme le circuit Monza de l'Ayers Rock. Se placer parmi les premiers dans ces championnats est synonyme d'argent débloqué pour pouvoir améliorer et réparer ses véhicules. Un système de mots de passe permet de garder sa progression en mémoire."}, {"id": "snes_097", "s": "snes", "n": 97, "t": "Ultimate Mortal Kombat 3", "y": 1996, "dv": "Midway", "p": "Midway", "g": "Action, Combat", "r": 0, "img": "snes/097.webp", "shot": "shots/snes/097.webp", "d": "Les combattants de l'extrême débarquent sur Super Nintendo avec Ultimate Mortal Kombat 3. Retrouvez le jeu de combat en 2D avec de la violence, du sang et les fameux \"Finish Him\" qui permettent d'achever un adversaire de manière gore. Retrouvez aussi les protagonistes de la série comme Scorpion, Sub-Zero, Raiden, Liu Kang ou encore Kitana pour des affrontements d'anthologie."}, {"id": "snes_098", "s": "snes", "n": 98, "t": "Unirally", "y": 1995, "dv": "Dma Design", "p": "Psygnosis", "g": "Course, Conduite", "r": 1, "img": "snes/098.webp", "shot": "shots/snes/098.webp", "d": "Unirally sur Super Nintendo est un jeu de courses dans lequel le joueur dirige un monocycle. Le but est autant d'aller très vite et finir premier que de faire les figures les plus improbables possible. En mode Courses, le but est d'arriver en tête, et chaque figure correctement réalisée vous fait gagner de la vitesse. Un mode Figures permet de se concentrer uniquement sur les tricks, dans ce cas il faut marquer plus de points que son adversaire pour espérer l'emporter."}, {"id": "snes_099", "s": "snes", "n": 99, "t": "Wild Guns", "y": 1996, "dv": "Natsume", "p": "Titus", "g": "Action", "r": 0, "img": "snes/099.webp", "shot": "shots/snes/099.webp", "d": "Wild Guns sur Super Nintendo est un jeu de tir qui mélange un univers western avec de la science-fiction. Le joueur peut choisir entre Clint et Annie. L'histoire commence à Carson City et s'étalera sur six niveaux (qui sont divisés en trois sous-niveaux chacun). Il est possible de ramasser des bonus tout au long du jeu pour améliorer ses armes. Le joueur devra faire preuve d'adresse pour viser juste tout en évitant les tirs ennemis."}, {"id": "snes_100", "s": "snes", "n": 100, "t": "Zombies", "y": 1994, "dv": "Lucasarts", "p": "Konami", "g": "Action", "r": 0, "img": "snes/100.webp", "shot": "shots/snes/100.webp", "d": "Zombies (ou Zombies Ate My Neighbors) sur Super Nintendo est un jeu d'action où il est possible d'incarner un garçon (Zeke) ou une fille (Julia). Il faut sauver un maximum de gens au cours de la cinquantaine de niveaux du jeu tout en combattant les vampires, momies et autres zombies. Plusieurs armes sont disponibles dont un pistolet à eau et un bazooka. Un mode coopératif permet de faire l'intégralité du jeu avec un ami."}, {"id": "n64_001", "s": "n64", "n": 1, "t": "Army Men - Sarge's Heroes", "y": 2000, "dv": "Panasonic", "p": "Panasonic", "g": "Tir, Tir / Run And Gun, Shoot'em Up", "r": 0, "img": "n64/001.webp", "shot": "shots/n64/001.webp", "d": "Army Men : Sarge's Heroes sur Nintendo 64 est un jeu d'action à la troisième personne. Vous incarnez le soldat (en plastique vert !) Sarge, et devez livrer bataille contre les Beige, sur leur territoire. Vous combattez l'infanterie mais aurez aussi à éliminer l'artillerie lourde et les engins volants."}, {"id": "n64_002", "s": "n64", "n": 2, "t": "Banjo-Kazooie", "y": 1998, "dv": "Rareware", "p": "Nintendo", "g": "Plateforme, Action / Aventure, Action", "r": 3, "img": "n64/002.webp", "shot": "shots/n64/002.webp", "d": "De l'action, des puzzles, des ours, quelle histoire! Il y a un os dans le pâté du côté de la Montagne Perchée... Gruntilda la sorcière a décidé de voler la beauté de Tooty l'ourse! Il ne lui fallut que deux secondes pour enlever la jeune fille et se réfugier dans son repère. Ameutés par ce tintouin, Banjo, le grand frère de Tooty, et son amie Kazooie se sont jurés de rétablir l'ordre, l'amitié, l'amour et tout ça... Aidés par le mystérieux marabout Mumbo Jumbo, nos deux amis devront braver de sombres marais, des déserts hostiles, des montagnes arides et de lugubres manoirs... Mille dangers les attendent jusqu'au sommet du repère de Gruntilda l'affreuse moche pas belle."}, {"id": "n64_003", "s": "n64", "n": 3, "t": "Banjo-Tooie", "y": 2001, "dv": "Rareware", "p": "Nintendo", "g": "Action / Aventure, Plateforme, Action, Simulation", "r": 2, "img": "n64/003.webp", "shot": "shots/n64/003.webp", "d": "Banjo-Tooie sur Nintendo 64 est le deuxième volet des aventures de l'ours débonnaire et l'oiseau cynique, toujours orienté plates-formes. Terrassée lors du premier épisode, la sorcière Gruntilda n'importune plus la Montagne Spirale. Le monde vit paisiblement mais c'est sans compter sur les deux soeurs de Gruntilda qui sont bien décidées à la ressusciter. Les deux soeurs s'échappent en détruisant la maison de Banjo et en tuant Bottles, son ami. La vengeance commence..."}, {"id": "n64_004", "s": "n64", "n": 4, "t": "Beetle Adventure Racing!", "y": 1999, "dv": "Electronic Arts", "p": "Electronic Arts", "g": "Course, Conduite", "r": 0, "img": "n64/004.webp", "shot": "shots/n64/004.webp", "d": "Beetle Adventure Racing sur Nintendo 64 est un jeu de courses dans lequel vous piloterez des New Beetle. Le jeu est orienté arcade et vous transportera dans différents circuits très différents les uns des autres, où tous les moyens sont bons pour passer devant vos adversaires."}, {"id": "n64_005", "s": "n64", "n": 5, "t": "Blast Corps", "y": 1997, "dv": "Rareware", "p": "Nintendo", "g": "Puzzle-Game, Action, Course, Conduite", "r": 1, "img": "n64/005.webp", "shot": "shots/n64/005.webp", "d": "Blast Corps est un jeu d'action sur Nintendo 64. Utilisez des bulldozers, des robots de construction, des hommes fusées et des camions pour détruire des villes entières. Vous avez à votre disposition de nombreuses armes pour assouvir votre soif de chaos."}, {"id": "n64_006", "s": "n64", "n": 6, "t": "Body Harvest", "y": 1998, "dv": "Dma Design", "p": "Gremlin Interactive", "g": "Action / Aventure, Action, Tir, Tir / 3Eme Personne, Simulation", "r": 1, "img": "n64/006.webp", "shot": "shots/n64/006.webp", "d": "Body Harvest est un jeu d'aventure sur Nintendo 64. En l'an 2050, de violents aliens ont envahi la Terre et la quasi-totalité des êtres humains se sont faits dévorer. Cependant une poignée de résistants travaille sur un plan désespéré : envoyer un soldat génétiquement modifié dans le passé afin d'empêcher l'invasion. Parcourez un monde recouvert de terres désertes et de ruines antiques pour sauver la Terre."}, {"id": "n64_007", "s": "n64", "n": 7, "t": "Bomberman 64", "y": 1997, "dv": "Racjin", "p": "Nintendo", "g": "Plateforme, Action / Aventure, Action", "r": 1, "img": "n64/007.webp", "shot": "shots/n64/007.webp", "d": "Altair l'affreux utilise l'Omni Cube pour vider les réserves d'énergie de la planète Bomber. Aidez Bomberman à livrer bataille dans 24 niveaux différents. Affrontez les sbires d'Altair, détruisez les bases ennemies et rétablissez la paix sur la planète. Le mode multi-joueurs vous offrira des heures de rire et d'action."}, {"id": "n64_008", "s": "n64", "n": 8, "t": "Bomberman Hero", "y": 1998, "dv": "Hudson", "p": "Hudson", "g": "Plateforme, Action", "r": 1, "img": "n64/008.webp", "shot": "shots/n64/008.webp", "d": "La princesse Millian est en danger! Lentement la nuit recouvre de son noir manteau la paisible planète Bomber Star. Soudain, un cri perçant venu du néant brise le silence comme un verre de cristal et une explosion colossale illumine les cieux. Se ruant jusqu'au lieu du drame, Bomberman découvre alors les restes d'un vaisseau spatial en lambeaux. Son seul occupant, un gentil petit robot, gît sur le sol... Très vite, il livre son secret à notre héros: les sbires de l'Empire Garaden ont semé trouble et désolation sur Primus Star et ont kidnappé la princesse Millian. C'est une mission pour Bomberman! Grâce aux précieux Bomber Copter, Bomber Slider, Bomber Jet et Bomber Marine, notre vaillant ami décimera sans peine les troupes de l'Empire maléfique."}, {"id": "n64_009", "s": "n64", "n": 9, "t": "Buck Bumble", "y": 1999, "dv": "Ubisoft", "p": "Argonaut Games", "g": "Tir, Action, Aventure, Puzzle-Game", "r": 0, "img": "n64/009.webp", "shot": "shots/n64/009.webp", "d": "Buck Bumble est un jeu d'aventure sorti sur Nintendo 64 dans lequel vous incarnez Buck Bumble la seule abeille à ne pas être devenue maléfique après un déversement de produits chimiques sur la ruche. Buck va donc partir en guerre contre ses congénères pour tenter de sauver le monde de la destruction totale. Le jeu propose un mode multijoueur."}, {"id": "n64_010", "s": "n64", "n": 10, "t": "Bust-A-Move 2: Arcade Edition", "y": 1998, "dv": "Probe Software Ltd.", "p": "Acclaim", "g": "Action, Puzzle-Game", "r": 0, "img": "n64/010.webp", "shot": "shots/n64/010.webp", "d": "Dans Bust A Move 2 sur Nintendo 64, vous devez faire disparaître toutes les billes en regroupant celles de même couleur, par groupe de 3 ou plus. Ce second opus intègre un mode deux joueurs dans lequel chaque joueur doit défier une intelligence artificielle de plus en plus coriace."}, {"id": "n64_011", "s": "n64", "n": 11, "t": "Castlevania", "y": 1999, "dv": "Konami", "p": "Konami", "g": "Plateforme, Action / Aventure, Action, Aventure", "r": 1, "img": "n64/011.webp", "shot": "shots/n64/011.webp", "d": "Castlevania, au cœur de la Transylvanie, le royaume de Dracula. Après un long sommeil de 100 ans le prince des ténèbres, le terriblement célèbre Comte Dracula revient pour régner... Deux personnages différents, deux scénarios distincts et une multitude de rencontres peu amicales... Êtes-vous réellement prêt à retourner dans la Transylvanie du 19ème siècle?"}, {"id": "n64_012", "s": "n64", "n": 12, "t": "Castlevania : Legacy of Darkness", "y": 2000, "dv": "Konami", "p": "Konami", "g": "Plateforme, Action / Aventure, Action", "r": 1, "img": "n64/012.webp", "shot": "shots/n64/012.webp", "d": "Bien avant l'avènement du sinistre Dracula, un autre héritier des ténèbres avait fait parler de lui. Mais, à cette époque c'est un puissant loup-garou, prénommé Cornell, qui s'était dressé devant lui... Apprêtez-vous à replonger dans les méandres du mal avec ce nouvel épisode du mythe Castlevania. Préparez-vous au pire, il n'en sera que meilleur!"}, {"id": "n64_013", "s": "n64", "n": 13, "t": "Centre Court Tennis", "y": 1999, "dv": "Bigben Interactive", "p": "Hudson", "g": "Sport / Tennis, Sport", "r": 0, "img": "n64/013.webp", "shot": "shots/n64/013.webp", "d": "\"Centre Court Tennis\" est un jeu de tennis qui ne se prend pas trop au sérieux. Après avoir créé votre personnage à la manière d'un LEGO, vous êtes prêt à jouer ! Le jeu de base comprend un mode multijoueur (jusqu'à 4 joueurs), un mode tournoi et un mode exhibition. Vous avez aussi quatre mini-jeux, \"Tennis Court Bingo\", \"Burning Barrels\", \"Run and Gun\" & Knock'em Down\", où votre but est de frapper certains objets dans le terrain de tennis. Vous pouvez gagner des prix spéciaux en obtenant suffisamment de points. De plus, vous disposez d'un mode de défi spécial où vous devez jouer contre votre adversaire dans des conditions bizarres - votre terrain de tennis peut être en rotation, fait de glace ou sur le point d'exploser, pour n'en nommer que quelques-uns. Battez votre adversaire et vous serez récompensé avec un vêtement ou un article de votre choix dans le vestiaire de votre adversaire. Perdez et vous perdrez un objet que votre adversaire a choisi. Continuez à perdre et vous devrez jouer à vos jeux en ne portant rien d'autre que vos sous-vêtements, ce qui rend le jeu comme une sorte de \"strip-tennis\" convivial pour toute la famille."}, {"id": "n64_014", "s": "n64", "n": 14, "t": "Chameleon Twist", "y": 1998, "dv": "Sunsoft", "p": "Japan System Supply", "g": "Plateforme, Aventure, Action", "r": 0, "img": "n64/014.webp", "shot": "shots/n64/014.webp", "d": "Chameleon Twist est un jeu de plates-formes sur Nintendo 64. Le héros du jeu, Davy, qui est à la poursuite d'un lapin prend une forme humanoïde. L'intrigue implique bien sûr Davy mais aussi ses amis Jack, Fred et Linda. Ainsi vous vous élancez à travers six mondes de magie pour retrouver votre ancienne forme."}, {"id": "n64_015", "s": "n64", "n": 15, "t": "Command & Conquer", "y": 1999, "dv": "Nintendo", "p": "Westwood Studios", "g": "Stratégie", "r": 0, "img": "n64/015.webp", "shot": "shots/n64/015.webp", "d": "Découvrez les premiers faits d'armes entre le NOD et le GDI dans le tout premier volet de Command & Conquer, un jeu de stratégie sur N64. Choisissez votre camp entre les deux factions puis partez à l'assaut des nombreuses missions du jeu. Il vous faudra extraire du minerai pour produire de nouvelles unités et multiplier vos bâtiments."}, {"id": "n64_016", "s": "n64", "n": 16, "t": "Conker's Bad Fur Day", "y": 2001, "dv": "Rareware", "p": "Rareware", "g": "Action", "r": 2, "img": "n64/016.webp", "shot": "shots/n64/016.webp", "d": "Chez Rare, nous n'avons pas été sages du tout cette fois... Le lendemain de la fête pour son 21ème anniversaire, Conker se réveille avec la pire des gueules de bois et il ne retrouve plus son chemin pour rentrer chez lui. Préparez-vous à tituber au milieu de scènes grivoises, pleines de mauvaises manières et d'un humour décalé porté sur les flatulences. Si vous n'aimez pas les gros mots et les sous-entendus quelque peu lestes, évitez ce jeu à tout prix!"}, {"id": "n64_017", "s": "n64", "n": 17, "t": "Cruis'n USA", "y": 1998, "dv": "Midway", "p": "Nintendo", "g": "Course, Conduite", "r": 0, "img": "n64/017.webp", "shot": "shots/n64/017.webp", "d": "Cruis'n USA est un jeu de courses sur Nintendo 64. Arpentez les États-Unis au volant de bolides de courses, en faisant attention à arriver dans les temps aux points de contrôles. Il faut également éviter la circulation, très dense, pour remporter les nombreuses épreuves du titre."}, {"id": "n64_018", "s": "n64", "n": 18, "t": "Cruis'n World", "y": 1998, "dv": "Eurocom", "p": "Eurocom", "g": "Course, Conduite", "r": 0, "img": "n64/018.webp", "shot": "shots/n64/018.webp", "d": "Cruis'n World est un jeu de courses sur Nintendo 64. Partez en voyage sur les pittoresques routes d'Amérique et participez à des courses passionnantes à souhait. Affrontez vos adversaires sur des pistes aux paysages réalistes et authentiques."}, {"id": "n64_019", "s": "n64", "n": 19, "t": "Diddy Kong Racing", "y": 1997, "dv": "Rareware", "p": "Nintendo", "g": "Aventure, Course, Conduite, Action", "r": 2, "img": "n64/019.webp", "shot": "shots/n64/019.webp", "d": "Les parents de Timber le petit tigre ont choisi le bon moment pour partir en vacances. Une fois de retour, ils trouveront leur île dans un état pitoyable, contrôlée entièrement par Wizpig le sorcier-porc de l'espace. Une fois de plus, Diddy Kong et ses amis se doivent de sauver la situation! Serez-vous capable de relever le défi?"}, {"id": "n64_020", "s": "n64", "n": 20, "t": "Donald Duck: Cou@k Att@ck ?*!", "y": 2000, "dv": "Disney Interactive", "p": "Ubisoft", "g": "Aventure, Plateforme", "r": 0, "img": "n64/020.webp", "shot": "shots/n64/020.webp", "d": "Daisy, reporter sans frontières, se fait enlever par le diabolique Merlock. Donald décide de partir à sa rescousse. Mais Gontran veut aussi la sauver, Donald doit donc se dépêcher! Grâce à une invention géniale de Géo Trouvetou, Donald est téléporté à travers le monde, puis jusqu'au temple de Merlock pour sauver Daisy."}, {"id": "n64_021", "s": "n64", "n": 21, "t": "Donkey Kong 64", "y": 1999, "dv": "Rareware", "p": "Nintendo", "g": "Plateforme, Aventure, Action", "r": 2, "img": "n64/021.webp", "shot": "shots/n64/021.webp", "d": "Donkey Kong 64 sur Nintendo 64 est jeu d'action/aventure où l'on incarne tous les membres de la bande à Donkey Kong : Diddy Kong, Tiny Kong, Lanky Kong et Chunky Kong. Le clan va de nouveau affronter le Roi K'Rool et ses Kremlings qui menacent de détruire leur île avec une arme secrète en plus de piller la précieuse réserve de bananes d'or de nos amis primates."}, {"id": "n64_022", "s": "n64", "n": 22, "t": "Doom 64", "y": 1997, "dv": "Midway", "p": "Id Software", "g": "Tir / 1Ere Personne, Tir, Action, Shoot'em Up", "r": 0, "img": "n64/022.webp", "shot": "shots/n64/022.webp", "d": "Doom 64 sur Nintendo 64 est un jeu de tir à la première personne. La planète Mars est envahie par des créatures de l'enfer à la suite de plusieurs expériences scientifiques. Vous incarnez un Space Marine qui a été condamné à des travaux forcés sur la planète rouge. Se retrouvant seul dans la base humaine, il tente de survivre en éliminant tous les monstres autour de lui."}, {"id": "n64_023", "s": "n64", "n": 23, "t": "Duke Nukem 64", "y": 1997, "dv": "Eurocom", "p": "3D Realms", "g": "Tir / 1Ere Personne, Tir, Action", "r": 0, "img": "n64/023.webp", "shot": "shots/n64/023.webp", "d": "Duke Nukem arrive pour en découdre! Es-tu prêt à devenir le plus grand nettoyeur d'aliens de tous les temps? Sois digne du légendaire Duke Nukem et détruis tout sur ton passage, des rues de Los Angeles jusqu'à la lune elle même."}, {"id": "n64_024", "s": "n64", "n": 24, "t": "Excitebike 64", "y": 2001, "dv": "Nintendo", "p": "Left Field Productions", "g": "Course, Conduite / Moto, Course, Conduite, Sport", "r": 1, "img": "n64/024.webp", "shot": "shots/n64/024.webp", "d": "Excitebike 64 est un jeu de courses de motocross sur Nintendo 64. Amateur du genre, vous aurez à coeur de parcourir 20 différents parcours en indoor et outdoor. De plus, vous pourrez voir votre marge d'évolution grâce aux trois niveaux de difficultés qu'offre le titre. Enfin, défiez vos amis grâce au mode multijoueur jouable jusqu'à 4 en écran partagé."}, {"id": "n64_025", "s": "n64", "n": 25, "t": "Extreme-G", "y": 1997, "dv": "Probe Entertainment Ltd.", "p": "Acclaim", "g": "Course, Conduite", "r": 0, "img": "n64/025.webp", "shot": "shots/n64/025.webp", "d": "Extreme-G est un jeu de courses futuriste sur Nintendo 64. Ejectez vos adversaires de la piste à l'aide de canons laser, missiles, mines, bombes et une foultitude d'autres armes destructrices lors de courses à plus de 300km/h. Divers modes de jeu sont présents dont un mode Championnat, un mode Multijoueur ainsi qu'un mode Tournoi jouable jusqu'à 16 participants."}, {"id": "n64_026", "s": "n64", "n": 26, "t": "F-1 World Grand Prix", "y": 1999, "dv": "Paradigm Entertainment", "p": "Video System", "g": "Course, Conduite", "r": 0, "img": "n64/026.webp", "shot": "shots/n64/026.webp", "d": "F1 World Grand Prix est une simulation de courses de Formule 1 sur Nintendo 64. Le jeu se base sur le championnat de 1998 et inclut les pilotes et écuries officiels. Les modes classiques Championship, Time Trial et Single Race sont présents. Le Match Race vous permet de vous mesurer à des adversaires via Internet."}, {"id": "n64_027", "s": "n64", "n": 27, "t": "F-Zero X", "y": 1998, "dv": "Nintendo", "p": "Nintendo", "g": "Course, Conduite", "r": 2, "img": "n64/027.webp", "shot": "shots/n64/027.webp", "d": "Le compte à rebours est lancé... Dans quelques instants la plus spectaculaire, rapide, intense et cruelle des courses du 22ème siècle va commencer. Aux commandes d'une machine futuriste vous découvrirez des parcours fantastiques regorgeant de loopings, de sauts et de chicanes diaboliques! Laissez-vous griser par la vitesse, prenez place dans cette techno-course délirante!"}, {"id": "n64_028", "s": "n64", "n": 28, "t": "F1 Racing Championship", "y": 2000, "dv": "Video System", "p": "Ubisoft", "g": "Course, Conduite", "r": 0, "img": "n64/028.webp", "shot": "shots/n64/028.webp", "d": "Revivez la saison 1999 de F1 dans Racing Championship sur Nintendo 64. Retrouvez tous les circuits, tous les pilotes et leurs écuries respectives. Faites des essais privés afin de peaufiner vos réglages de pré-saison et lancez-vous dans un championnat complet !"}, {"id": "n64_029", "s": "n64", "n": 29, "t": "Fighting Force 64", "y": 1999, "dv": "Core Design", "p": "Crave Entertainment", "g": "Beat'em All, Combat", "r": 0, "img": "n64/029.webp", "shot": "shots/n64/029.webp", "d": "Le combat est partout! FF64 vous garantit de l'action sans précédent et des tonnes de mouvements d'attaque. Utilisez les éléments du décor: détruisez une barricade anti-char, renversez ce qui se trouve sur votre chemin pour trouver des armes cachées..."}, {"id": "n64_030", "s": "n64", "n": 30, "t": "Gauntlet Legends", "y": 1999, "dv": "Atari", "p": "Midway", "g": "Jeu De Rôles", "r": 0, "img": "n64/030.webp", "shot": "shots/n64/030.webp", "d": "Gauntlet Legends est un jeu de rôle et d'action sur N64. L'originalité du titre tient dans la possibilité d'effectuer l'aventure jusqu'à quatre joueurs simultanément. Votre quête est de retrouver des pierres runiques, toutes dangereusement gardées, qui une fois réunies vous ouvriront les portes du temple du démon Skorne que vous devrez éliminer."}, {"id": "n64_031", "s": "n64", "n": 31, "t": "Gex 3 : Deep Cover Gecko", "y": 1999, "dv": "Eidos Interactive", "p": "Crave Entertainment", "g": "Plateforme, Action", "r": 0, "img": "n64/031.webp", "shot": "shots/n64/031.webp", "d": "Gex 3 : Deep Cover Gecko est un jeu de plates-formes sorti sur Nintendo 64. Vous incarnez Gex, un Gecko qui doit sauver les siens d'une terrible menace. Le jeu propose de nombreux environnements variés tels que des paysages enneigés ou des égouts."}, {"id": "n64_032", "s": "n64", "n": 32, "t": "Glover", "y": 1998, "dv": "Hasbro Interactive", "p": "Hasbro Interactive", "g": "Plateforme, Aventure, Action", "r": 0, "img": "n64/032.webp", "shot": "shots/n64/032.webp", "d": "Glover est un jeu de réflexion/plates-formes sur Nintendo 64. Vous jouez le rôle de Glover, un gant qui évolue dans un univers en 3D. A votre disposition vous avez une balle, et vous deux réunis, une grande panoplie de mouvements vous est offerte. Au long des différents niveaux vous devez éliminer des ennemis, ramasser des bonus, casser des murs et beaucoup d'autres actions sont possibles pour parvenir à vos fins."}, {"id": "n64_033", "s": "n64", "n": 33, "t": "GoldenEye 007", "y": 1997, "dv": "Rareware", "p": "Nintendo", "g": "Tir / 1Ere Personne, Tir, Action", "r": 3, "img": "n64/033.webp", "shot": "shots/n64/033.webp", "d": "Votre nom est Bond, James Bond. Vous êtes désigné pour couvrir les opérations en relation avec le satellite armé Golden Eye. Votre mission débutera dans le complexe du barrage de Byelomorye en URSS. Soyez aussi silencieux que meurtrier. La sécurité internationale dépend de vous, Agent 00. Il est temps d'utiliser votre permis de tuer!"}, {"id": "n64_034", "s": "n64", "n": 34, "t": "Hexen", "y": 1997, "dv": "Raven Software", "p": "Gt Interactive", "g": "Tir / 1Ere Personne, Tir", "r": 0, "img": "n64/034.webp", "shot": "shots/n64/034.webp", "d": "Hexen est un jeu d'action à la première personne sur Nintendo 64. Un empire maléfique a décidé d'éliminer tous ses opposants pour régner en maître sur la terre, vous allez devoir les en empêcher. Vous pouvez incarner 3 personnages : un guerrier, un mage ou un clerc. Chaque personnage possède des capacités uniques."}, {"id": "n64_035", "s": "n64", "n": 35, "t": "Hybrid Heaven", "y": 1999, "dv": "Konami", "p": "Konami", "g": "Jeu De Rôles", "r": 0, "img": "n64/035.webp", "shot": "shots/n64/035.webp", "d": "Hybrid Heaven est un jeu vidéo d'action/RPG développé par Konami sur Nintendo 64 qui mélange les genres en combinant l'exploration des jeux d'aventure avec les affrontements au tour par tour des RPG. Vous êtes l'agent Diaz empêtré dans un immense complot perpétré par des aliens qui cherchent à prendre le pouvoir en clonant le président des États-Unis."}, {"id": "n64_036", "s": "n64", "n": 36, "t": "International Superstar Soccer 64", "y": 1997, "dv": "Kceo", "p": "Konami", "g": "Sport / Football, Sport", "r": 0, "img": "n64/036.webp", "shot": "shots/n64/036.webp", "d": "International Superstar Soccer 64 est un jeu de football sur Nintendo 64. Ce titre offre une expérience de jeu 3D réaliste qui présente une licence d'équipes et de stades, ainsi qu'un authentique annonceur. Le soft est jouable à 4 simultanément."}, {"id": "n64_037", "s": "n64", "n": 37, "t": "International Superstar Soccer 98", "y": 1998, "dv": "Kceo", "p": "Konami", "g": "Sport / Football, Sport", "r": 0, "img": "n64/037.webp", "shot": "shots/n64/037.webp", "d": "International Superstar Soccer 98 est un jeu de football de la série ISS, suivant \"International Superstar Soccer 64\" et précédant \"International Superstar Soccer 2000\". Le jeu est centré sur la coupe du Monde de 1998 en France et propose 56 équipes nationales ainsi que 6 équipes all stars à débloquer en mode \"world league\". Le jeu propose 6 modes de jeu, la possibilité de créer ses joueurs, 9 stades, 4 environnements météorologiques, match en journée et en nuit. Il également truffé d'ester eggs et très technique, vous pouvez faire des roulettes, des une-deux, des lobs, etc.."}, {"id": "n64_038", "s": "n64", "n": 38, "t": "Jet Force Gemini", "y": 1999, "dv": "Nintendo", "p": "Rareware", "g": "Action, Shoot'em Up", "r": 1, "img": "n64/038.webp", "shot": "shots/n64/038.webp", "d": "Menace insectoïde! Seule la Jet Force peut venir à bout des plans de Mizar-le-dégueu! Action et dégommages dans la galaxie!"}, {"id": "n64_039", "s": "n64", "n": 39, "t": "Killer Instinct Gold", "y": 1997, "dv": "Rareware", "p": "Nintendo", "g": "Action, Sport", "r": 0, "img": "n64/039.webp", "shot": "shots/n64/039.webp", "d": "Killer Instinct Gold est un jeu de combat sur Nintendo 64. La société Ultratech, spécialiste dans la fabrication et la vente d'armes, organise un grand tournoi à mort entre plusieurs candidats pour tester ses armes. Vous avez le choix parmi 11 combattants pour tenter de gagner le tournoi. Chacun d'entre eux possède une grande variété de coups et contrairement à la plupart des jeux de combats, les matches se disputent en un seul round."}, {"id": "n64_040", "s": "n64", "n": 40, "t": "Kirby 64 : The Crystal Shards", "y": 2001, "dv": "Nintendo", "p": "Hal Laboratory", "g": "Action", "r": 1, "img": "n64/040.webp", "shot": "shots/n64/040.webp", "d": "Les Éclats de Cristal Aidez Kirby à combattre l'ignoble Morph Noir et à retrouver les Éclats de Cristal. Il aspire et avale ses ennemis comme personne! Aspirez vos adversaires et absorbez leurs pouvoirs! Visitez six mondes et plus de 25 niveaux!"}, {"id": "n64_041", "s": "n64", "n": 41, "t": "Lylat Wars", "y": 1997, "dv": "Nintendo", "p": "Nintendo", "g": "Action, Shoot'em Up", "r": 2, "img": "n64/041.webp", "shot": "shots/n64/041.webp", "d": "Lylat Wars sur Nintendo 64 est un shoot'em up dans lequel vous incarnez le renard pilote Fox McCloud et son équipe pour des combats à bord de vaisseaux futuristes. Traversez quinze niveaux à la difficulté croissante pour arriver au bastion final de Venom et défaire le professeur Andross. Remportez les médailles des missions pour accroître votre score et affrontez jusqu'à trois de vos amis dans le mode multijoueur."}, {"id": "n64_042", "s": "n64", "n": 42, "t": "Mario Golf", "y": 1999, "dv": "Camelot Software", "p": "Nintendo", "g": "Sport / Golf, Sport", "r": 1, "img": "n64/042.webp", "shot": "shots/n64/042.webp", "d": "Mario Golf est un jeu de sport sorti sur Nintendo 64. Vous êtes plongé directement dans l'univers de Mario : couleurs vives, ambiance cartoon, musiques de crèche etc. Dans l'interface, rien d'une grosse simulation sérieuse et précise comme on en a l'habitude. Mario Golf se veut éclectique et offre pas moins de 7 modes de jeu. Ces modes comprennent un Tournoi et un mode Entraînement."}, {"id": "n64_043", "s": "n64", "n": 43, "t": "Mario Kart 64", "y": 1997, "dv": "Nintendo", "p": "Nintendo", "g": "Sport, Course, Conduite", "r": 3, "img": "n64/043.webp", "shot": "shots/n64/043.webp", "d": "3… 2… 1… Partez! Jouez jusqu'à quatre joueurs en même temps en mode Vs, ou défiez l'ordinateur en mode Championnat... Combattez vos amis en mode Battle ou améliorez vos records en mode Contre la Montre. Et si l'envie vous en prend, utilisez l'option du \"fantôme\" et faites la course contre vous-même!!!"}, {"id": "n64_044", "s": "n64", "n": 44, "t": "Mario Party", "y": 1998, "dv": "Hudson", "p": "Nintendo", "g": "Stratégie, Action", "r": 2, "img": "n64/044.webp", "shot": "shots/n64/044.webp", "d": "Mario Party est un jeu de société vous proposant de participer à une foule de mini-jeux sur Nintendo 64. En effet, vous jouez au tour par tour, au rythme de vos lancers de dés et des petites épreuves qui vous opposeront aux autres participants, qu'ils soient dirigés par des joueurs humains ou par l'ordinateur."}, {"id": "n64_045", "s": "n64", "n": 45, "t": "Mario Party 2", "y": 2000, "dv": "Hudson", "p": "Nintendo", "g": "Jeu De Societe / Plateau, Action", "r": 2, "img": "n64/045.webp", "shot": "shots/n64/045.webp", "d": "Mario Party 2 est un party-game sur Nintendo 64 qui peut accueillir jusqu'à quatre participants en multijoueur. Retrouvez Toad, Bowser, Boo et d'autres personnages dans plus de 60 mini-jeux (fabriquer des gâteaux, garder l'équilibre sur une plate-forme bombardée...) répartis en cinq environnements différents."}, {"id": "n64_046", "s": "n64", "n": 46, "t": "Mario Party 3", "y": 2001, "dv": "Hudson", "p": "Nintendo", "g": "Action, Casual Game", "r": 2, "img": "n64/046.webp", "shot": "shots/n64/046.webp", "d": "Mario Party 3 est un jeu party-game sur Nintendo 64. Rejoignez Mario et ses fidèles amis dans un jeu de plateau rempli de mini-games. En effet, vous jouez au tour par tour, au rythme de vos lancers de dés. Le mode Duel vous permet de défier également vos amis."}, {"id": "n64_047", "s": "n64", "n": 47, "t": "Mario Tennis", "y": 2000, "dv": "Camelot Software", "p": "Nintendo", "g": "Sport / Tennis, Sport", "r": 1, "img": "n64/047.webp", "shot": "shots/n64/047.webp", "d": "Vous l'avez deviné, Mario Tennis est un jeu de tennis sur Nintendo 64. Vous avez le choix entre 14 personnages dès le départ et de nombreux modes de jeu : Simple, Double, Exhibition, ou Tournoi. Des variantes sont également proposées, comme le Ring Shot, le Piranha Challenge et le Bowser Stage. Différents revêtements sont de la partie (rapide, dur, gazon, terre battue)."}, {"id": "n64_048", "s": "n64", "n": 48, "t": "Mischief Makers", "y": 1997, "dv": "Treasure", "p": "Enix", "g": "Aventure, Action", "r": 1, "img": "n64/048.webp", "shot": "shots/n64/048.webp", "d": "Mischief Makers est un jeu d'action sur Nintendo 64. Vous incarnez un robot de nettoyage Marina nommé pour une mission de sauvetage. Son créateur vient d'être enlevé par un professeur maléfique. Vous allez devoir tout faire pour le retrouver et contrecarrer les plans démoniaques du scientifique fou."}, {"id": "n64_049", "s": "n64", "n": 49, "t": "Mortal Kombat 4", "y": 1998, "dv": "Eurocom", "p": "Midway", "g": "Combat, Action", "r": 0, "img": "n64/049.webp", "shot": "shots/n64/049.webp", "d": "Mortal Kombat 4 est le dernier opus de la série sorti sur N64. C'est le premier épisode à ne pas utiliser des images 2D numérisées mais plutôt des personnages modélisés en 3 dimensions. Les développeurs conservent toutefois le gameplay 2D. L'expérience est donc presque identique aux précédentes versions à l'opposé des jeux de combat du moment intégralement en 3D. Il y a un millier d'années, à la suite d'une guerre avec le Dieu corrompu connu sous le nom de Shinnok, Raiden était tenu comme responsable de la mort d'une civilisation entière. Pour éviter que cela se reproduise à nouveau, ainsi que pour protéger tous les royaumes contre la menace de Shinnok, Raiden a fait une campagne brutale et, au prix de lourds sacrifices, a exilé son rival dans un sombre endroit connu sous le nom de Netherealm. Quelques années avant le tournoi de 1992, Sub-Zero a aidé le nécromancien Quan Chi à obtenir l'amulette de Shinnok, la source de puissance de ce dernier (comme cela est raconté dans Mortal Kombat Mythologies: Sub-Zero). Cinq ans plus tard, en 1997, Quan Chi s'est allié à Shinnok et a aidé le dieu à s'échapper de ses confins. Avec l'aide d'un traître d'Edenian, ils entrèrent dans les cieux et…"}, {"id": "n64_050", "s": "n64", "n": 50, "t": "Mortal Kombat Trilogy", "y": 1996, "dv": "Midway", "p": "Midway", "g": "Combat, Action, Course, Conduite", "r": 0, "img": "n64/050.webp", "shot": "shots/n64/050.webp", "d": "Mortal Kombat Trilogy est le premier épisode de la serie Mortal Kombat sur Nintendo 64. Il est considéré la dernière mise à jour de Mortal Kombat 3, dont la première et précédente est Ultimate Mortal Kombat 3. Ces deux premiers opus étant tous deux sortis sur SNES. Mortal Kombat Trilogy sera suivi par Mortal Kombat Mythologies: Sub-Zero et Mortal Kombat 4 sur N64. Shao Kahn, défait par Liu Kang pendant le tournoi Mortal Kombat (qui aurait dû être la dixième victoire consécutive des serviteurs de Shao Kahn, ce qui lui aurait permis d'investir la Terre)met en place un nouveau plan depuis l'Outworld. Il demande à Shang Tsung, aidé des prêtres de l'ombre, de ressusciter son ancienne reine Sindel, inopinément morte dans son jeune âge. Ancienne impératrice de l'Outworld, elle possède la capacité de se rendre sur Terre, talent dont Shao Kahn va se servir pour faire du Royaume de la Terre une partie de l'Outworld. Des millions d'êtres humains seront immédiatement tués. Cependant, quelques-uns pourront être protégés par Raiden, dieu protecteur du royaume de la Terre. Perdant ses pouvoirs au fur et à mesure de la fusion avec l'Outworld, les guerriers de la Terre doivent vaincre Shao Kahn au…"}, {"id": "n64_051", "s": "n64", "n": 51, "t": "Mystical Ninja Starring Goemon", "y": 1998, "dv": "Konami", "p": "Konami", "g": "Action, Action / Aventure, Aventure, Sport", "r": 0, "img": "n64/051.webp", "shot": "shots/n64/051.webp", "d": "Mystical Ninja : Starring Goemon est un jeu d'action sur Nintendo 64. Vous suivez attentivement l'histoire de Goemon alors qu'il se bat contre le gang des Shoguns de la Montagne Pêche. En effet, cette bande de truands s'est mis dans la tête de transformer le Japon en un théâtre de beaux-arts. Ainsi vous traversez des scènes de comédie musicale et des combats entre des robots."}, {"id": "n64_052", "s": "n64", "n": 52, "t": "Operation WinBack", "y": 2000, "dv": "Omega Force", "p": "Koei", "g": "Tir, Tir / 3Eme Personne, Divers, Shoot'em Up", "r": 0, "img": "n64/052.webp", "shot": "shots/n64/052.webp", "d": "Operation Win Back est un jeu d'action sur Nintendo 64. Un groupe de terroristes vient de s'emparer de l'arme la plus puissante de la planète, un satellite en orbite géostationnaire capable d'un déluge de feu toutes les 3 heures. Leurs revendications sont claires : libérer le petit pays Saroczia. Vous faites partie de la meilleure unité d'élite de la planète : le S.C.A.T et vous êtes la dernière chance pour reprendre le centre de contrôle du satellite."}, {"id": "n64_053", "s": "n64", "n": 53, "t": "Paper Mario", "y": 2001, "dv": "Nintendo", "p": "Intelligent Systems", "g": "Jeu De Rôles", "r": 2, "img": "n64/053.webp", "shot": "shots/n64/053.webp", "d": "Paper Mario est un jeu de rôle sur Nintendo 64. Vous incarnez le célèbre plombier moustachu, représenté en 2D, et évoluez dans un univers en 3D. La princesse Peach a été kidnappée par Bowser. Vous incarnez Mario et perdez face au maléfique Bowser qui s'est emparé de la baguette étoile pour dominer le monde. Votre mission sera donc de retrouver les esprits des étoiles séquestrées par Bowser et de sauver la princesse Peach."}, {"id": "n64_054", "s": "n64", "n": 54, "t": "Perfect Dark", "y": 2000, "dv": "Rareware", "p": "Nintendo", "g": "Tir, Tir / 1Ere Personne, Action, Shoot'em Up", "r": 3, "img": "n64/054.webp", "shot": "shots/n64/054.webp", "d": "Perfect Dark est un jeu de tir à la première personne sur N64. Vous jouez le rôle de Joanna Dark alias Perfect Dark, une jeune espionne de 23 ans, membre des forces d'élite. Tout débute avec l'appel au secours d'une scientifique de la DataDyne Corporation. Notre jeune héroïne va se rendre compte que la multinationale possède des activités bien louches. Vous allez devoir mener votre enquête pour découvrir les sombres secrets que renferme DataDyne. Le titre est jouable à 4 en écran séparé."}, {"id": "n64_055", "s": "n64", "n": 55, "t": "Pilotwings 64", "y": 1997, "dv": "Nintendo", "p": "Nintendo", "g": "Simulation, Stratégie", "r": 1, "img": "n64/055.webp", "shot": "shots/n64/055.webp", "d": "Pilotwings 64 est un jeu de simulateur de vol sur Nintendo 64. Comme dans son prédécesseur, le joueur doit remplir une série de missions en utilisant différents véhicules aériens (jetpack, hélicoptère, deltaplane, parachute...). Les points gagnés dans chaque mission sont attribués en fonction du temps, des dommages, du carburant, de la précision, de l'atterrissage et quelques autres critères."}, {"id": "n64_056", "s": "n64", "n": 56, "t": "Pokemon Puzzle League", "y": 2001, "dv": "Nintendo", "p": "Intelligent Systems Co", "g": "Puzzle-Game", "r": 0, "img": "n64/056.webp", "shot": "shots/n64/056.webp", "d": "Pokémon Puzzle League est un puzzle-game sur Nintendo 64. Ash, Brock, Misty et de nombreux autres personnages de la série se retrouvent au Village Puzzle pour savoir lequel d'entre eux deviendra le Pokémon Puzzle Master. Les règles du jeu sont simples : associer trois blocs de la même couleur. Six modes de jeu (dont un mode histoire) offrent des expériences variées et prenantes, surtout en multijoueur."}, {"id": "n64_057", "s": "n64", "n": 57, "t": "Pokémon Snap", "y": 2000, "dv": "Nintendo", "p": "Hal Laboratory", "g": "Simulation", "r": 1, "img": "n64/057.webp", "shot": "shots/n64/057.webp", "d": "Pokémon Snap sur Nintendo 64 vous propose un safari dans le monde de Pokémon. A bord d'un chariot monté sur rails, traversez l'univers des petits monstres de poche pour les surprendre dans leur habitat naturel et les photographier. Débusquez les plus peureux d'entre eux, débloquez des appâts pour les attirer et les avoir en gros plan pour de meilleures notes. Composez ainsi le recueil photo Pokémon le plus complet possible."}, {"id": "n64_058", "s": "n64", "n": 58, "t": "Pokémon Stadium", "y": 2000, "dv": "Nintendo", "p": "Creatures, Inc.", "g": "Combat, Stratégie", "r": 2, "img": "n64/058.webp", "shot": "shots/n64/058.webp", "d": "Pokémon Stadium est un jeu d'action sur Nintendo 64. Choisissez un groupe de six Pokémon et essayez de vaincre tous les dresseurs d'une même arène. A chaque match, vous devez choisir les trois d'entre eux qui vous accompagneront, en fonction des caractéristiques des Pokémon adverses."}, {"id": "n64_059", "s": "n64", "n": 59, "t": "Pokémon Stadium 2", "y": 2001, "dv": "Nintendo", "p": "Creatures, Inc.", "g": "Combat, Stratégie", "r": 1, "img": "n64/059.webp", "shot": "shots/n64/059.webp", "d": "Pokémon Stadium 2 est un jeu de stratégie sur Nintendo 64. Choisissez un groupe de six Pokémon et parvenez à vaincre tous les dresseurs d'une même arène. A chaque match, vous devez choisir les trois d'entre eux qui vous accompagneront, en fonction des caractéristiques des Pokémon adverses."}, {"id": "n64_060", "s": "n64", "n": 60, "t": "Quake", "y": 1998, "dv": "Midway", "p": "Midway", "g": "Tir / 1Ere Personne, Action, Tir", "r": 0, "img": "n64/060.webp", "shot": "shots/n64/060.webp", "d": "Quake 64 est un jeu de tir à la première personne sur N64. L'humanité a réussi à inventer la téléportation. Cependant, de grosses voies sont ouvertes à des univers parallèles et des démons venus des profondeurs de l'enfer ont emprunté ces voies. Dans la peau d'un space-marine vous devez rassembler quatre runes magiques dans le but de repousser les étrangers. Plusieurs modes multijoueurs sont disponibles."}, {"id": "n64_061", "s": "n64", "n": 61, "t": "Quake II", "y": 1999, "dv": "Raster Productions", "p": "Activision", "g": "Tir / 1Ere Personne, Tir", "r": 0, "img": "n64/061.webp", "shot": "shots/n64/061.webp", "d": "Quake II est un FPS sur Nintendo 64. Votre mission : infiltrer la planète envahie par les extraterrestres et tous les envoyer hors de la galaxie en abaissant leurs défenses afin qu'une attaque aérienne finale puisse être amorcée."}, {"id": "n64_062", "s": "n64", "n": 62, "t": "Rampage - World Tour", "y": 1998, "dv": "Saffire", "p": "Midway", "g": "Action, Puzzle-Game", "r": 0, "img": "n64/062.webp", "shot": "shots/n64/062.webp", "d": "Rampage : World Tour sur Nintendo 64 est un jeu d'action ou à proprement parler un véritable défouloir. Le joueur incarne l'une des trois créatures géantes au choix (gorille, lézard ou loup-garou). L'objectif est de mettre une ville à sac en rasant les immeubles et en piétinant les forces de l'ordre qui osent se mettre sur votre chemin. Bon carnage."}, {"id": "n64_063", "s": "n64", "n": 63, "t": "Rayman 2 - The Great Escape", "y": 1999, "dv": "Ubisoft", "p": "Ubisoft", "g": "Action / Aventure, Action", "r": 1, "img": "n64/063.webp", "shot": "shots/n64/063.webp", "d": "Rayman 2 : The Great Escape sur N64 est un classique du jeu de plates-formes en 3D. Vous incarnez le célèbre personnage sans bras, ni cou, ni jambes, sorti de l'imagination de Michel Ancel. Armé de vos poings, vous devez débarrasser le monde des robots-pirates. Le jeu est d'une grande richesse et regorge de surprises."}, {"id": "n64_064", "s": "n64", "n": 64, "t": "Re-Volt", "y": 1999, "dv": "Acclaim", "p": "Acclaim", "g": "Course, Conduite", "r": 0, "img": "n64/064.webp", "shot": "shots/n64/064.webp", "d": "Re-Volt sur Nintendo 64 est un jeu de courses de voitures radio-commandées. De nombreux véhicules aux spécificités propres sont disponibles. Les courses se déroulent dans des environnements très variés, à l'échelle de votre petit véhicule. Vous disposez de nombreux bonus vous permettant de mettre quelques bâtons dans les roues de vos adversaires."}, {"id": "n64_065", "s": "n64", "n": 65, "t": "Resident Evil 2", "y": 2000, "dv": "Virgin", "p": "Capcom", "g": "Action / Aventure, Action", "r": 1, "img": "n64/065.webp", "shot": "shots/n64/065.webp", "d": "Le survival-horror Resident Evil 2 sur Nintendo 64 se déroule quelques mois après les événements de son prédécesseur. Le virus-T a réussi à se propager et la ville entière est désormais contaminée. Vous contrôlez Leon S. Kennedy et Claire Redfield, et devrez tenter de survivre et de percer le secret de l'organisation Umbrella."}, {"id": "n64_066", "s": "n64", "n": 66, "t": "Ridge Racer 64", "y": 2000, "dv": "Nintendo", "p": "Nintendo", "g": "Course, Conduite", "r": 0, "img": "n64/066.webp", "shot": "shots/n64/066.webp", "d": "Ridge Racer 64 est un jeu de courses sur Nintendo 64. Ce soft vous propose une vingtaine de circuits dont trois entièrement inédits, une bonne vingtaine de bolides avec chacun ses propres caractéristiques techniques, 4 modes de jeu plus un mode multijoueur à 4 en écran séparé ainsi que la possibilité de sauvegarder sur la cartouche."}, {"id": "n64_067", "s": "n64", "n": 67, "t": "Road Rash 64", "y": 1999, "dv": "Pacific Coast Power & Light", "p": "Thq", "g": "Course, Conduite", "r": 0, "img": "n64/067.webp", "shot": "shots/n64/067.webp", "d": "Road Rash 64 est un jeu de courses-action sur Nintendo 64. Vous êtes juché sur une une moto et vous traversez les Etats-Unis à travers plusieurs courses endiablées. La particularité du titre vient du fait que vous pouvez frapper vos adversaires, une fois que vous êtes à côté d'eux avec vos poings bien sûr, mais aussi avec des armes, de la matraque électrique à la chaîne en métal. Attention toutefois à ne pas vous faire épingler par la police !"}, {"id": "n64_068", "s": "n64", "n": 68, "t": "Rocket - Robot on Wheels", "y": 1999, "dv": "Sucker Punch Productions", "p": "Sucker Punch Productions", "g": "Plateforme, Action", "r": 0, "img": "n64/068.webp", "shot": "shots/n64/068.webp", "d": "Disponible sur Nintendo 64, Rocket : Robot On Wheels est un jeu d'action qui vous place dans la peau de Rocket, le robot de maintenance du parc à thèmes Whoopie World. Lorsque l'une des 2 mascottes, Jojo le raton laveur se rebelle et capture la seconde, Whoopie le morse, notre héros doit se mettre en route pour sauver son ami, libérer les animaux du parc et récupérer les tickets que Jojo a semé aux quatre coins des attractions."}, {"id": "n64_069", "s": "n64", "n": 69, "t": "San Francisco Rush - Extreme Racing", "y": 1997, "dv": "Atari", "p": "Midway", "g": "Course, Conduite", "r": 0, "img": "n64/069.webp", "shot": "shots/n64/069.webp", "d": "San Francisco Rush sur Nintendo 64 est un jeu de courses futuriste. Il vous faudra rallier l'arrivée en tête tout en évitant des crashs meurtriers. De nombreux raccourcis parsèment les circuits vertigineux, à vous de les découvrir. Le mode multijoueur quant à lui, permet à quatre participants de s'opposer."}, {"id": "n64_070", "s": "n64", "n": 70, "t": "San Francisco Rush 2049",
