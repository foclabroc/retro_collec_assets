 LucasArts l'a bien compris et c'est ainsi qu'est né Star Wars Episode I : Racer sur Gameboy. Participez à des courses aux quatre coins de la galaxie pour remporter un maximum d'argent et améliorer votre bolide ultra rapide. Contrairement à la version PC, les courses de cette version Gameboy se déroulent en un contre un."}, {"id": "gbc_078", "s": "gbc", "n": 78, "t": "Stranded Kids", "y": null, "dv": "Konami", "p": "Konami", "g": "Jeu De Rôles", "r": 0, "img": "gbc/078.webp", "shot": "shots/gbc/078.webp", "d": "Stranded Kids sur Game boy Color, Le jeu dispose d'une structure ouverte qui présente au joueur plusieurs façons de progresser dans le jeu, le tout à son propre rythme. vous échouez sur une île déserte, et devez explorer l'île tout en surveillant vos niveau de vie, faim et soif. A vous de manger / boire / dormir quand il le faut pour rester en forme."}, {"id": "gbc_079", "s": "gbc", "n": 79, "t": "Street Fighter Alpha : Warriors' Dreams", "y": 2000, "dv": "Capcom", "p": "Capcom", "g": "Action, Combat", "r": 0, "img": "gbc/079.webp", "shot": "shots/gbc/079.webp", "d": "C'est Street Fighter comme vous vous en souvenez toujours, avec de nouveaux mouvements, personnages et systèmes de combo, ainsi qu'un look et une ergonomie plus travaillés. Les nouveaux coups disponibles pour chaque combattant, appelés Super coups, leur permettent de déclencher des coups très puissants. Une barre en bas de l'écran représente la puissance que vous devez utiliser pour les coups. Vous commencez le premier tour sur 0, et chaque attaque que vous faites ajoute de la puissance à la barre. Une fois que vous atteignez le niveau 3, vous pouvez déclencher les attaques spéciales, qui peuvent parfois mettre KO l'adversaire. L'autre changement majeur par rapport à la série Street Fighter 2 sont les contres Alpha. Ceux-ci peuvent être utilisés pour contrer une attaque qui arrive après le blocage."}, {"id": "gbc_080", "s": "gbc", "n": 80, "t": "Super Mario Bros. Deluxe", "y": 1999, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 3, "img": "gbc/080.webp", "shot": "shots/gbc/080.webp", "d": "Super Mario Bros. Deluxe est un jeu de plates-formes sur Gameboy. La princesse Toadstool a été enlevée par le terrible Bowser. A vous de la délivrer. Mais, pour cela, vous devez franchir moult pièges tendus par vos ennemis, et traverser de nombreux niveaux, de plates-formes en escaliers, et de tuyaux en falaises escarpées."}, {"id": "gbc_081", "s": "gbc", "n": 81, "t": "Supreme Snowboarding", "y": null, "dv": "Infogrames", "p": "Infogrames", "g": "Sport", "r": 0, "img": "gbc/081.webp", "shot": "shots/gbc/081.webp", "d": "Supreme Snowboarding est un jeu de sport sur Gameboy. Choisissez l'un des snowboarders disponibles et partez à l'assaut des pistes enneigées. Il est possible de participer à plusieurs modes de compétition tels que la Course classique et le Contre-la-montre mais vous pouvez aussi vous essayer au Free Style dans des Half-Pipe, dont le but est de réaliser des figures."}, {"id": "gbc_082", "s": "gbc", "n": 82, "t": "Tarzan", "y": 1999, "dv": "Digital Eclipse", "p": "Activision", "g": "Plateforme", "r": 1, "img": "gbc/082.webp", "shot": "shots/gbc/082.webp", "d": "Tarzan est un jeu de plates-formes retraçant les événements tirés du film d'animation du même nom, sorti en 1999. Vous jouez bien évidemment le rôle de Tarzan, futur roi de la jungle, dans des niveaux où l'objectif sera de récolter des objets tels que des pièces, des parties de plan et des lettres correspondant au nom de notre héros."}, {"id": "gbc_083", "s": "gbc", "n": 83, "t": "Tetris DX", "y": 1999, "dv": "Nintendo", "p": "Nintendo", "g": "Puzzle-Game", "r": 2, "img": "gbc/083.webp", "shot": "shots/gbc/083.webp", "d": "Tetris DX est un puzzle-game sur Gameboy Color. Si cette version gagne en couleur, elle conserve le principe du jeu. Vous devez empiler des briques afin de constituer des lignes qui s'effaceront au fur et à mesure de votre progression. La difficulté augmente au fil de votre avancée."}, {"id": "gbc_084", "s": "gbc", "n": 84, "t": "TG Rally 2", "y": 2000, "dv": "Vision Works", "p": "Kemco", "g": "Course, Conduite, Sport", "r": 0, "img": "gbc/084.webp", "shot": "shots/gbc/084.webp", "d": "Une autre manche de rallye Top Gear sur la GBC. A cette occasion, en fonction de l'endroit où vous terminez chaque course, des points vous sont attribués. Ces points servent ensuite à améliorer les statistiques de la voiture de rallye que vous utilisez (vitesse, freinage, accélération et vitesse maximale). Les championnats sont divisés en saisons, plus dures les unes que les autres. Vous pouvez choisir de changer les conditions météorologiques (jour, nuit, soleil, pluie, neige) ou vous entraîner sur la piste pour vous habituer aux virages et au timing. Vous pouvez également jouer contre un ami en mode deux joueurs."}, {"id": "gbc_085", "s": "gbc", "n": 85, "t": "The Fish Files", "y": null, "dv": "7Th Sense", "p": "Microïds", "g": "Aventure, Puzzle-Game", "r": 0, "img": "gbc/085.webp", "shot": "shots/gbc/085.webp", "d": "The Fish Files est un jeu d'aventure sur Gameboy. Vous incarnez à tour de rôle Dante, Korsellos et Fritz, 3 collégiens. Les professeurs ont confié à chacun des élèves la garde d'un poisson rouge afin de les responsabiliser. Malheureusement, un matin, stupeur générale : tous les poissons rouges ont disparu. Vous menez l'enquête pour retrouver les poissons, certainement enlevés."}, {"id": "gbc_086", "s": "gbc", "n": 86, "t": "The Legend of Zelda : Oracle of Ages", "y": 2001, "dv": "Flagship", "p": "Nintendo", "g": "Action, Action / Aventure", "r": 3, "img": "gbc/086.webp", "shot": "shots/gbc/086.webp", "d": "The Legend of Zelda : Oracle of Ages est un jeu d'action et d'aventure sur Gameboy. Veran, la Sorcière des Ombres, a capturé l'Ordre des Ages afin d'utiliser ses pouvoirs pour semer la destruction dans l'univers. Vous incarnez Link et venez d'être invoqué en Labrynna par la Triforce. Réparez la trame temporelle et sauvez l'Oracle."}, {"id": "gbc_087", "s": "gbc", "n": 87, "t": "The Legend of Zelda : Oracle of Seasons", "y": 2001, "dv": "Flagship", "p": "Nintendo", "g": "Action, Action / Aventure", "r": 3, "img": "gbc/087.webp", "shot": "shots/gbc/087.webp", "d": "The Legend of Zelda : Oracle of Seasons est un jeu d'action et d'aventure sur Gameboy. Onox, le général des ténèbres, a capturé l'Oracle des Saisons afin de vider le royaume de toute vie. Les saisons sont en désordre et les forces du chaos grandissent. Vous incarnez donc Link et devez maîtriser le pouvoir des saisons afin de vaincre les forces maléfiques."}, {"id": "gbc_088", "s": "gbc", "n": 88, "t": "The Legend of Zelda: Link's Awakening DX", "y": 1998, "dv": "Nintendo Ead", "p": "Nintendo", "g": "Aventure", "r": 3, "img": "gbc/088.webp", "shot": "shots/gbc/088.webp", "d": "The Legend of Zelda : Link's Awakening DX est un jeu d'action et d'aventure sur Gameboy. Vous incarnez le jeune Link, qui revient dans son pays natal d'Hyrule. Après d'extraordinaires aventures, notre héros rêve d'un repos mérité. Alors qu'il est sur le bateau qui le ramène au pays, une tempête se déchaîne, le bateau est abîmé et s'échoue sur une île mystérieuse nommée Cocolint. Vous apprenez alors que pour sortir de cet enfer, il vous faudra réveiller le mystique Poisson Rêve."}, {"id": "gbc_089", "s": "gbc", "n": 89, "t": "Toki Tori", "y": 2002, "dv": "Two Tribes B.V.", "p": "Capcom", "g": "Action, Puzzle-Game", "r": 1, "img": "gbc/089.webp", "shot": "shots/gbc/089.webp", "d": "Toki Tori sur Gameboy Color est un puzzle-game qui comporte quelques éléments empruntés au genre plate-forme. Donnant son titre au jeu, Toki Tori est un jeune poulet qui part à la rescousse de ses jeunes frères encore dans leurs oeufs. Pour franchir chaque niveau, le joueur doit réfléchir et se servir de nouveaux éléments introduits petit à petit pour récolter tous les oeufs présents."}, {"id": "gbc_090", "s": "gbc", "n": 90, "t": "Tomb Raider", "y": 2000, "dv": "Core Design", "p": "Eidos Interactive", "g": "Action, Puzzle-Game", "r": 0, "img": "gbc/090.webp", "shot": "shots/gbc/090.webp", "d": "Tomb Raider est un jeu de plates-formes sur Gameboy Color. Vous incarnez la douce et plantureuse Lara Croft. Vous allez voyager au coeur de la jungle péruvienne, pour vous rendre dans un temple oublié et retrouver une Pierre maléfique. Sur votre chemin, vous affronterez des squelettes, des serpents géants et beaucoup d'autres créatures redoutables."}, {"id": "gbc_091", "s": "gbc", "n": 91, "t": "Tomb Raider : Curse of the Sword", "y": 2001, "dv": "Core Design", "p": "Activision", "g": "Plateforme, Action", "r": 0, "img": "gbc/091.webp", "shot": "shots/gbc/091.webp", "d": "Tomb Raider : La Malédiction de L'Epée est un jeu d'aventure sur Gameboy où vous vous glissez dans la peau de la belle Lara Croft. Vous visitez un musée en compagnie d'une amie quand soudain, un groupe armé envahit les lieux et dérobe un sabre mystique. Prenez votre courage à deux mains et partez à la poursuite des assaillants. Dans le feu de l'action, vous vous coupez avec le sabre qui scellera votre destin."}, {"id": "gbc_092", "s": "gbc", "n": 92, "t": "Tonka Raceway", "y": 1999, "dv": "Morning Star Multimedia", "p": "Hasbro Interactive", "g": "Course, Conduite", "r": 0, "img": "gbc/092.webp", "shot": "shots/gbc/092.webp", "d": "Les Tonka viennent sur la Game Boy Color pour quelques courses sur TONKA RACEWAY. Vous pouvez choisir parmi quatre véhicules différents, dont un camion à benne basculante, un 4X4, une voiture de course et un bulldozer. Après avoir choisi le véhicule parfait, montez sur l'une des trois pistes : \"Paradis tropical\", \"Désert brûlant\" ou \"Pays des merveilles de l'hiver\". Votre plus grand défi sera d'essayer de rester loin des murs et en tête. Une fois que vous avez franchi la ligne d'arrivée, vous recevez des points que vous pouvez utiliser pour améliorer votre véhicule dans quatre secteurs différents : pneus, amortisseurs, turbo, et moteur. Grâce aux capacités de grondement intégrées, vous ressentirez toutes les secousses et les secousses du jeu. Essayez de devenir un champion de conduite sur TONKA RACEWAY."}, {"id": "gbc_093", "s": "gbc", "n": 93, "t": "Tony Hawk's Pro Skater", "y": 2000, "dv": "Natsume", "p": "Activision", "g": "Sport", "r": 1, "img": "gbc/093.webp", "shot": "shots/gbc/093.webp", "d": "C'est la première version portable du jeu de skate-board populaire de Tony Hawk. Il ne ressemble guère à la version originale de Playstation. Il est en fait composé de deux épreuves différentes, une épreuve de half-pipe et un mode course. Le mode half-pipe est vu d'un point de vue latéral, un peu comme le jeu classique Skate or Die. Vous réalisez des figures pour obtenir un score élevé. Le mode course est abordé d'un point de vue descendant, où votre objectif est d'exécuter des figures et d'arriver à la fin le plus rapidement possible."}, {"id": "gbc_094", "s": "gbc", "n": 94, "t": "Toy Story 2", "y": 2000, "dv": "Tiertex", "p": "Thq", "g": "Plateforme", "r": 0, "img": "gbc/094.webp", "shot": "shots/gbc/094.webp", "d": "Toy Story 2 sur Gameboy est un jeu de plates-formes dans lequel vous incarnez Buzz l'éclair, un Ranger de l'espace. Vous avez du pain sur la planche car Woody a été enlevé par un collectionneur de jouets sans scrupules. Sautez, tournoyez et utilisez les accessoires à disposition (laser, jet boots) dans un univers directement adapté du long métrage de Disney/Pixar."}, {"id": "gbc_095", "s": "gbc", "n": 95, "t": "Turok 3 : Shadow of Oblivion", "y": 2000, "dv": "Bit Managers", "p": "Acclaim", "g": "Action, Tir", "r": 0, "img": "gbc/095.webp", "shot": "shots/gbc/095.webp", "d": "Turok 3 : Shadow Of Oblivion est un jeu d'action sur Gameboy Color. Vous incarnez Turok et votre mission est de botter les fesses au dinosoïdes qui tentent d'éradiquer la race humaine. Vous allez devoir utiliser votre arsenal pour renvoyer les sauriens dans leur dimension. Ce soft est exclusivement solo."}, {"id": "gbc_096", "s": "gbc", "n": 96, "t": "V-Rally : Championship Edition", "y": null, "dv": "Velez & Dubail", "p": "Infogrames", "g": "Course, Conduite", "r": 0, "img": "gbc/096.webp", "shot": "shots/gbc/096.webp", "d": "V-Rally est un jeu de courses sur Gameboy. Faites votre choix entre 4 bolides : Peugeot 306 Maxi, Subaru Impreza, Ford Escort V-Rally, et Mitsubishi Lancer. Lancez-vous en mode Arcade ou Championnat dans les principaux endroits où se déroule le vrai Championnat du Monde des rallyes : Corse, Nouvelle Zélande, Italie, Les Alpes, Indonésie, Argentine, Grèce, Angleterre, Suède..."}, {"id": "gbc_097", "s": "gbc", "n": 97, "t": "Wario Land 3", "y": 2000, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 3, "img": "gbc/097.webp", "shot": "shots/gbc/097.webp", "d": "Wario Land 3 est un jeu de plates-formes et d'aventure sur Gameboy Color. Wario se retrouve piégé dans une boîte à musique et c'est à vous de l'aider à sortir de cet enfer. Foncez à travers 24 niveaux et découvrez plus d'une centaine de trésors et de clés cachées. Wario peut se transformer au cours de son périple en Bat-Wario, Wario Zombie, Wario à ressort et beaucoup d'autres encore. Ce soft est exclusivement solo."}, {"id": "gbc_098", "s": "gbc", "n": 98, "t": "Wario Land II", "y": null, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 2, "img": "gbc/098.webp", "shot": "shots/gbc/098.webp", "d": "Wario Land II est un jeu de plates-formes sur Gameboy. L'ennemi de Wario, Captain Syrup, accompagné de plusieurs de ses soldats, se sont introduits dans le château de Wario pendant son sommeil pour y voler son argent. Incarnez Wario et explorez la multitude de niveaux disponibles dans le jeu afin de mettre un terme aux agissements de Captain Syrup."}, {"id": "gbc_099", "s": "gbc", "n": 99, "t": "WCW Mayhem", "y": 2000, "dv": "2N Productions", "p": "Electronic Arts", "g": "Sport", "r": 0, "img": "gbc/099.webp", "shot": "shots/gbc/099.webp", "d": "WCW Mayhem est un jeu de catch sur Gameboy. Le soft offre une douzaine de catcheurs avec des dizaines de coups tels que l'aveuglement, la projection dans les cordes, le coup de la corde à linge de plus, les éléments du décor sont interactifs."}, {"id": "gbc_100", "s": "gbc", "n": 100, "t": "Wendy : Every Witch Way", "y": 2001, "dv": "Wayforward Technologies", "p": "Tdk", "g": "Stratégie, Puzzle-Game", "r": 1, "img": "gbc/100.webp", "shot": "shots/gbc/100.webp", "d": "Wendy : Every Witch Way sur Gameboy est un jeu de plates-formes/réflexion où vous incarnez la petite sorcière vêtue de rouge. L'équilibre du monde est en péril de par votre faute et vous devez maintenant tout faire pour remettre de l'ordre dans ce monde où la gravité n'existe plus."}, {"id": "switch_001", "s": "switch", "n": 1, "t": "A Monsters Expedition", "y": 2020, "dv": "Draknek", "p": "Draknek & Friends", "g": "Reflexion", "r": 0, "img": "switch/001.webp", "shot": "shots/switch/001.webp", "d": "A Monster's Expedition est un jeu de puzzle et de réflexion développé par les créateurs de A Good Snowman Is Hard to Build et Cosmic Express. Le jeu met en scène un petit monstre curieux de découvrir le monde des humains. Pour progresser le monstre doit faire tomber des arbres et les pousser pour franchir des îles et en apprendre plus sur l'humanité."}, {"id": "switch_002", "s": "switch", "n": 2, "t": "Animal Crossing - New Horizons", "y": 2020, "dv": "Nintendo", "p": "Nintendo", "g": "Life Simulation", "r": 3, "img": "switch/002.webp", "shot": "shots/switch/002.webp", "d": "Animal Crossing : New Horizons vous emmène de nouveau dans le monde mignon d'Animal Crossing, sur Nintendo Switch. Cultivez votre potager, pêchez, et faites votre vie avec vos compagnons en temps réel grâce à l'horloge de la console."}, {"id": "switch_003", "s": "switch", "n": 3, "t": "Arkanoid: Eternal Battle", "y": 2022, "dv": "Pastagames", "p": "Microids", "g": "Platform,Indie,Arcade", "r": 0, "img": "switch/003.webp", "shot": "shots/switch/003.webp", "d": "Arkanoid Eternal Battle signe le retour du casse-briques arcade légendaire. Dans ce titre, le principe reste le même aux opus précédents et vous devrez détruire les Space Walls, seul ou à plusieurs, pour parvenir à vous échapper de l'emprise de DOH."}, {"id": "switch_004", "s": "switch", "n": 4, "t": "Astérix & Obélix : Baffez-les Tous !", "y": 2021, "dv": "Mr Nutz Studio", "p": "Microids", "g": "Beat'em All", "r": 0, "img": "switch/004.webp", "shot": "shots/switch/004.webp", "d": "Astérix & Obélix : Baffez-les Tous ! est une nouvelle adaptation vidéoludique de la célèbre série de BD de Goscinny et Uderzo. Il invite le joueur à parcourir les environnements emblématiques de la saga aux commandes des deux irréductibles Gaulois pour y affronter des flopées d'ennemis en tout genre."}, {"id": "switch_005", "s": "switch", "n": 5, "t": "Bayonetta 2", "y": 2018, "dv": "Platinumgames", "p": "Nintendo", "g": "Action", "r": 1, "img": "switch/005.webp", "shot": "shots/switch/005.webp", "d": "Plusieurs mois se sont écoulés depuis la bataille qui a marqué la fin de l'aventure précédente de Bayonetta, et les lumières brillent de mille feux sur la ville en cette saison festive. Soudain, des nuées d'anges descendent des cieux pour s'en prendre aux civils innocents. Bayonetta tente de repousser leurs attaques en invoquant le démon Gomorrah. Mais à son plus grand étonnement, celui-ci se retourne contre elle. La sorcière Jeanne tombe à pic pour la sauver, mais est victime d'une blessure mortelle et son âme se retrouve entrainée dans les profondeurs de l'Enfer. Bayonetta n'a désormais plus que quelques heures devant elle pour sauver l'âme de Jeanne. En suivant une piste d'Enzo, notre héroïne se rend sur une montagne sacrée à la recherche d'une entrée vers l'Enfer. Mais quels dangers l'attendent cette fois ?"}, {"id": "switch_006", "s": "switch", "n": 6, "t": "Cerebrale Academie Bataille de Meninges", "y": 2021, "dv": "Nintendo", "p": "Nintendo", "g": "Party-Game", "r": 0, "img": "switch/006.webp", "shot": "shots/switch/006.webp", "d": "Cérébrale Académie : bataille de méninges est un party-game accessible à tous, à vocation familiale et éducative sur Nintendo Switch. Le titre propose cinq catégories pour entraîner votre cerveau : identification, mémoire, analyse, maths et perception."}, {"id": "switch_007", "s": "switch", "n": 7, "t": "Clubhouse Games - 51 Worldwide Classics", "y": 2020, "dv": "Ndcube", "p": "Nintendo", "g": "Puzzle", "r": 0, "img": "switch/007.webp", "shot": "shots/switch/007.webp", "d": "51 Worldwide Games est une compilation de 51 jeux de plateaux très connus. Certains titres sont multijoueurs et offrent la possibilité à 4 joueurs de s'affronter en mode sans fil local. D'autres peuvent se jouer en multijoueur en ligne."}, {"id": "switch_008", "s": "switch", "n": 8, "t": "Dariusburst Another Chronicle EX+", "y": 2021, "dv": "Taito", "p": "Taito", "g": "Shoot'em Up", "r": 0, "img": "switch/008.webp", "shot": "shots/switch/008.webp", "d": "Dariusburst: Another Chronicle EX+ est le dernier volet de l'impressionnante série Dariusburst qui a débuté en 2009 sur PSP, avec de superbes graphismes en 3D et des fonctionnalités supplémentaires qui viennent enrichir la précédente version d’arcade de 2010. Dans cette toute nouvelle édition de Dariusburst, profitez de graphismes améliorés et d'une action d'arcade authentique comme jamais auparavant !"}, {"id": "switch_009", "s": "switch", "n": 9, "t": "Death's Door", "y": 2021, "dv": "Acid Nerve", "p": "Devolver Digital", "g": "Action", "r": 0, "img": "switch/009.webp", "shot": "shots/switch/009.webp", "d": "Death's Door est un jeu indépendant d'aventure où vous incarnez un Corbeau, un moissonneur d'âmes de défunts. Votre travail est monotone et vous devez pointer à heure fixe comme tout bon salarié, mais reste un boulot fort honnête. Votre petit train de vie est chamboulé lorsque l'âme dont vous avez la garde vous est subtilisée par un voleur désespéré."}, {"id": "switch_010", "s": "switch", "n": 10, "t": "Donkey Kong Country Returns HD", "y": 2010, "dv": "Nintendo", "p": "Retro Studios", "g": "Action, Adventure", "r": 1, "img": "switch/010.webp", "shot": "shots/switch/010.webp", "d": "Plongez dans l'univers vibrant et palpitant de Donkey Kong Country Returns HD, une version remasterisée du célèbre jeu de plateforme. Parcourez des niveaux époustouflants en haute définition, affrontez les Tikis maléfiques et récupérez les précieuses bananes de Donkey Kong. Avec des graphismes améliorés, un gameplay fluide et des défis palpitants, cette aventure vous garantit des heures de fun en solo ou en coop. Préparez-vous à sauter, rouler et explorer des environnements variés, des jungles luxuriantes aux grottes mystérieuses, dans une quête légendaire qui ravira les fans de la première heure comme les nouveaux joueurs."}, {"id": "switch_011", "s": "switch", "n": 11, "t": "Dragon Ball FighterZ", "y": 2018, "dv": "Arc System Works", "p": "BANDAI NAMCO Entertainment", "g": "Action", "r": 0, "img": "switch/011.webp", "shot": "shots/switch/011.webp", "d": "DRAGON BALL FighterZ contient les ingrédients qui ont fait de DRAGON BALL une série célèbre et adulée : des combats spectaculaires à souhait avec des combattants surpuissants."}, {"id": "switch_012", "s": "switch", "n": 12, "t": "Dragon Quest Builders", "y": 2019, "dv": "Square Enix", "p": "Square Enix", "g": "Création", "r": 0, "img": "switch/012.webp", "shot": "shots/switch/012.webp", "d": "Dragon Quest Builders 2 est un jeu d'aventure qui incorpore de nombreux éléments de jeu de construction. Le but est de construire des villages et d'aider les habitants à prospérer, tout en explorant des régions pour trouver de nouveaux ingrédients et de nouvelles recettes. Dragon Quest Builders 2 est aussi jouable à plusieurs en coopération et permet de partager ses créations en ligne."}, {"id": "switch_013", "s": "switch", "n": 13, "t": "Ghosts n Goblins Resurrection", "y": 2021, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 0, "img": "switch/013.webp", "shot": "shots/switch/013.webp", "d": "Ghosts ‘n Goblins Resurrection est un nouvel épisode de la série culte d'action plateformer de Capcom. Ce nouveau titre sert de reboot à la licence en offrant une nouvelle aventure mettant en scène le chevalier Arthur."}, {"id": "switch_014", "s": "switch", "n": 14, "t": "Gris", "y": 2018, "dv": "Nomada Studio", "p": "Devolver Digital", "g": "Plate-Forme", "r": 0, "img": "switch/014.webp", "shot": "shots/switch/014.webp", "d": "Gris est une jeune fille pleine d'espoir perdue dans son propre monde, confrontée à une expérience douloureuse dans sa vie. Son voyage à travers le chagrin se manifeste dans sa robe, qui donne de nouvelles capacités pour mieux naviguer dans sa réalité fanée."}, {"id": "switch_015", "s": "switch", "n": 15, "t": "Harvest Moon Un monde à cultiver", "y": 2021, "dv": "Rising Star Games", "p": "Natsume", "g": "Life Simulation", "r": 0, "img": "switch/015.webp", "shot": "shots/switch/015.webp", "d": "Harvest Moon : Un monde à cultiver est une simulation de vie développée par Natsume et éditée par Rising Star Games. Le jeu dispose d'un nouveau moteur graphique et promet une toute nouvelle façon d'explorer Harvest Moon."}, {"id": "switch_016", "s": "switch", "n": 16, "t": "Harvest Moon: The Winds of Anthos", "y": 2023, "dv": "Natsume", "p": "Natsume", "g": "Strategy", "r": 0, "img": "switch/016.webp", "shot": "shots/switch/016.webp", "d": "Explorez le monde incroyable d'Anthos ! Le pays d'Anthos était une terre paisible et harmonieuse surveillée par la Déesse de la Récolte et les Sprites de la Récolte, qui protégeaient les habitants d'Anthos des catastrophes naturelles telles que les tempêtes, les tremblements de terre, etc. Cependant, un jour, il y a de nombreuses années, Anthos a connu une grave éruption volcanique qui a menacé la vie sur Anthos lui-même, et la Déesse des Récoltes et les Sprites des Récoltes ont dû utiliser tout leur pouvoir restant pour assurer la sécurité des habitants et des animaux d'Anthos. Cela a laissé les différents villages du pays bloqués les uns des autres. Certains malheureux se sont même retrouvés coincés hors de leurs villages et n'ont pas pu revenir... Croyant que les villages et les gens séparés seraient un jour reconnectés, la Déesse de la Moisson envoya une bouteille avec une lettre et une clé magique, puis tomba dans un profond sommeil... Aujourd'hui, 10 ans plus tard, vous avez trouvé le SOS que la Déesse de la Récolte a envoyé au monde sous la forme d'un message dans une bouteille ! Avec l'aide de votre ami inventeur loufoque Doc Jr. et bien d'autres, ce sera à vous de faire…"}, {"id": "switch_017", "s": "switch", "n": 17, "t": "Hyrule Warrior Definitive Edition", "y": 2018, "dv": "Tecmo Koei", "p": "OMEGA Force", "g": "Beat'em All", "r": 0, "img": "switch/017.webp", "shot": "shots/switch/017.webp", "d": "Hyrule Warriors : Definitive Edition sur Switch est un Beat'em all qui mélange les univers de The Legend of Zelda et Dynasty Warriors. Vous avez accès à un mode histoire, puis à un mode aventure. Cette édition donne en plus accès à tous les contenus présents dans les deux versions du jeu mais aussi les DLC."}, {"id": "switch_018", "s": "switch", "n": 18, "t": "Hyrule Warriors - L'Ère du Fléau", "y": 2020, "dv": "Nintendo", "p": "Koei Tecmo", "g": "Action", "r": 1, "img": "switch/018.webp", "shot": "shots/switch/018.webp", "d": "Hyrule Warriors : L'Ère du Fléau est un Beat'em All développé par Koei Tecmo et édité par Nintendo. Il se déroule 100 ans avant les événements de The Legend of Zelda : Breath of The Wild, et intègre comme personnage jouables les Prodiges."}, {"id": "switch_019", "s": "switch", "n": 19, "t": "Kirby et le monde oublie", "y": 2022, "dv": "Nintendo", "p": "Nintendo", "g": "Aventure", "r": 2, "img": "switch/019.webp", "shot": "shots/switch/019.webp", "d": "Kirby et le Monde Oublié est le nouveau jeu de la célèbre licence de Nintendo. Proposant un changement radical de la formule initial, cet opus restera un platformer, mais cette fois-ci en 3D dans un monde ouvert."}, {"id": "switch_020", "s": "switch", "n": 20, "t": "Kirby Star Allies", "y": 2018, "dv": "Nintendo", "p": "Nintendo", "g": "Adventure", "r": 0, "img": "switch/020.webp", "shot": "shots/switch/020.webp", "d": "Dans cette nouvelle aventure de Kirby, vous pourrez toujours aspirer les ennemis afin de gagner des compétences. Mais ce nouvel opus offre une nouvelle fonctionnalité : le recrutement d'allié. En effet, vous pourrez recruter vos ennemis afin d'obtenir de nouvelles capacités."}, {"id": "switch_021", "s": "switch", "n": 21, "t": "Kirbys Dream Buffet", "y": 2022, "dv": "Nintendo", "p": "HAL Laboratory", "g": "Party-Game", "r": 0, "img": "switch/021.webp", "shot": "shots/switch/021.webp", "d": "Affrontez vos amis dans Kirby's Dream Buffet ! Dans cette course déjantée, vous devrez ramasser des fraises pour grandir et gagner en vitesse. Des snacks sont aussi sur votre chemin pour obtenir des pouvoirs. Le Kirby le plus imposant gagne la course."}, {"id": "switch_022", "s": "switch", "n": 22, "t": "Le retour de Détective Pikachu", "y": 2023, "dv": "Creatures, Inc.", "p": "Nintendo", "g": "Adventure, Puzzle", "r": 0, "img": "switch/022.webp", "shot": "shots/switch/022.webp", "d": "Le retour de Détective Pikachu sur Nintendo Switch est un jeu d'aventure. Le joueur incarne Tim Goodman et Pikachu pour élucider une affaire mystérieuse dans Ryme City. Ensemble, ils vont devoir enquêter sur les divers incidents étranges qui ont lieu dans la ville et résoudre l'énigme de la disparition du père de Tim."}, {"id": "switch_023", "s": "switch", "n": 23, "t": "Luigi's Mansion 3", "y": 2019, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 2, "img": "switch/023.webp", "shot": "shots/switch/023.webp", "d": "Luigi's Mansion 3 est la prochaine aventure du frère de Mario. Luigi doit une nouvelle fois affronter ses peurs les plus profondes dans un terrifiant manoir hanté. Il peut pour cela compter sur son aspirateur à fantômes pour l'aider. Un nouveau personnage sera ajouté : Gluigi, un Luigi tout vert, possédant des capacités particulières. Le jeu sera jouable en coopération jusqu'à 8 joueurs."}, {"id": "switch_024", "s": "switch", "n": 24, "t": "Lumo", "y": 2016, "dv": "Triple Eh Ltd", "p": "Triple Eh Ltd", "g": "Aventure", "r": 0, "img": "switch/024.webp", "shot": "shots/switch/024.webp", "d": "Découvrez la résurrection d'un genre avec Lumo, un jeu d'aventure en vue isométrique remis au goût du jour pour les joueurs de tout âge ! Version moderne des jeux de plateforme isométrique qui avaient disparu, Lumo plaira à tous ceux qui souhaitent se lancer dans une aventure captivante et pleine de défis."}, {"id": "switch_025", "s": "switch", "n": 25, "t": "Mario & Sonic aux Jeux Olympiques de Tokyo 2020", "y": 2019, "dv": "Sega", "p": "Sega", "g": "Sports", "r": 0, "img": "switch/025.webp", "shot": "shots/switch/025.webp", "d": "Mario & Sonic aux Jeux Olympiques de Tokyo 2020 est un jeu de multi-épreuves sur Nintendo Switch où les deux célèbres mascottes de Sega et Nintendo s'affrontent dans les épreuves officielles des jeux olympiques. Natation, athlétisme, jeux de balles... Un nombre impressionnant de disciplines olympiques officielles sont reproduites."}, {"id": "switch_026", "s": "switch", "n": 26, "t": "Mario Golf Super Rush", "y": 2021, "dv": "Nintendo", "p": "Nintendo", "g": "Sports", "r": 0, "img": "switch/026.webp", "shot": "shots/switch/026.webp", "d": "Mario Golf : Super Rush est une nouvelle entrée dans la série des jeux Mario Golf. Cet épisode a pour particularité de permettre de choisir entre des contrôles classiques avec les boutons ou des contrôles par mouvements avec le Joycon. Le jeu inclut également un mode inédit où quatre personnes jouent en même temps en courant à travers la carte ainsi qu'un mode histoire avec un aspect RPG."}, {"id": "switch_027", "s": "switch", "n": 27, "t": "Mario Kart 8 Deluxe", "y": 2017, "dv": "Nintendo", "p": "Nintendo", "g": "Racing", "r": 3, "img": "switch/027.webp", "shot": "shots/switch/027.webp", "d": "Mario Kart 8 sur Switch est un jeu de course coloré et délirant qui reprend les personnages phares des grandes licences Nintendo. Le joueur peut y affronter ses amis dans différents modes et types de coupes et a accès à 32 circuits aux environnements variés. Il est possible de jouer jusqu'à 12 simultanément en ligne et 4 en local."}, {"id": "switch_028", "s": "switch", "n": 28, "t": "Mario Luigi Brothership", "y": 2024, "dv": "Nintendo", "p": "Nintendo", "g": "Rpg", "r": 1, "img": "switch/028.webp", "shot": "shots/switch/028.webp", "d": "Mario & Luigi : L'épopée fraternelle sur Nintendo Switch signe le retour de la série après plus de 9 ans d'absence. Combinant plates-formes et jeu de rôle, les frères plombiers voyagent cette fois sur un navire voguant au milieu de différentes îles qu'il leur incombera de visiter."}, {"id": "switch_029", "s": "switch", "n": 29, "t": "Mario Party", "y": 2018, "dv": "Nintendo", "p": "Nintendo", "g": "Party-Game", "r": 0, "img": "switch/029.webp", "shot": "shots/switch/029.webp", "d": "Super Mario Party est la nouvelle itération du célèbre représentant des party-games. Ce dernier introduira l'expérience entre amis que nous connaissons bien avec sa flopée de mini-jeux, mais également, un mode en ligne inédit. Il se composera de 5 épreuves consécutives, déterminant, à son issue, un vainqueur et permettant de grimper dans le classement des joueurs."}, {"id": "switch_030", "s": "switch", "n": 30, "t": "Mario Party Superstars", "y": 2021, "dv": "Nintendo", "p": "Nintendo", "g": "Party-Game", "r": 1, "img": "switch/030.webp", "shot": "shots/switch/030.webp", "d": "Mario Party Superstars est un party-game qui porte bien son nom, puisqu'il réunit plus d'une centaine de mini-jeux issus de tous les épisodes de la série, dont la Nintendo 64 ! Le titre est jouable seul ou bien en multijoueur local et en ligne."}, {"id": "switch_031", "s": "switch", "n": 31, "t": "Mario Strikers Battle League", "y": 2022, "dv": "Nintendo", "p": "Nintendo", "g": "Sports", "r": 0, "img": "switch/031.webp", "shot": "shots/switch/031.webp", "d": "Mario Strikers : Battle League Football est le nouveau volet de la saga Mario Striker. Incarnez les personnages emblématiques de la licence Super Mario Bros et affrontez vous dans des matchs de football endiablés."}, {"id": "switch_032", "s": "switch", "n": 32, "t": "Mario Tennis Aces", "y": 2018, "dv": "Camelot Software Planning", "p": "Nintendo", "g": "Sports", "r": 0, "img": "switch/032.webp", "shot": "shots/switch/032.webp", "d": "Mario Tennis Aces est un jeu de sport, jouable en solo ou à plusieurs sur Switch. Mario retourne sur le terrain dans sa plus élégante tenue de tennis pour des échanges de balles intenses avec différents personnages dans des matchs de tennis impitoyables ! Il y a plus de 15 personnages jouables, chacun possédant son propre style !"}, {"id": "switch_033", "s": "switch", "n": 33, "t": "Marsupilami Le Secret du Sarcophage", "y": 2021, "dv": "Microids", "p": "Ocellus Studio", "g": "Plate-Forme", "r": 0, "img": "switch/033.webp", "shot": "shots/switch/033.webp", "d": "Marsupilami : Le Secret du Sarcophage est un jeu de plateformes inspiré de la célèbre bande dessinée du Marsupilami. Alors que Punch, Twister et Hope, trois Marsupilamis, mènent une vie tranquille en Palombie, ceux-ci découvrent un sarcophage maudit qui libère un fantôme. Colérique, l'esprit jette une malédiction sur tous les animaux. Les Marsupilamis, immunisés à ce sort, vont partir à l'aventure afin de chasser le vil fantôme et conjurer le sort."}, {"id": "switch_034", "s": "switch", "n": 34, "t": "Metroid Dread", "y": 2021, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 3, "img": "switch/034.webp", "shot": "shots/switch/034.webp", "d": "Présenté comme \"Metroid 5\", Metroid Dread est le nouvel opus de la célèbre licence de Nintendo, en 2,5D. L'héroïne Samus Aran devra faire face à une nouvelle menace, au sein d'une aventure qui fait beaucoup penser aux premiers épisodes de la série."}, {"id": "switch_035", "s": "switch", "n": 35, "t": "Minecraft Bedrock Edition", "y": 2017, "dv": "Mojang", "p": "Mojang", "g": "Creation", "r": 1, "img": "switch/035.webp", "shot": "shots/switch/035.webp", "d": "Minecraft est un dit \"jeu bac à sable\" sur Switch, qui permet à l'utilisateur de façonner l'univers qui l'entoure dans les seules limites de son imagination. La Bedrocks parachute le joueur dans un monde généré aléatoirement et dynamiquement, où il doit survivre en exploitant les ressources environnantes."}, {"id": "switch_036", "s": "switch", "n": 36, "t": "Monster Hunter Stories 2 Wings Of Ruin", "y": 2021, "dv": "Capcom", "p": "Capcom", "g": "Rpg", "r": 0, "img": "switch/036.webp", "shot": "shots/switch/036.webp", "d": "Suite directe de son prédécesseur sorti sur 3DS, Monster Hunter Stories 2 : Wings of Ruin est un RPG sur Switch. Faisant partie de la série spin-off de la licence de Capcom, ce nouveau titre propose des combats au tour par tour et un système de lien avec les monstres. Le jeu propose également des bonus pour ceux qui ont joué au nouvel opus de la série principale : Monster Hunter Rise."}, {"id": "switch_037", "s": "switch", "n": 37, "t": "Moving Out", "y": 2020, "dv": "Team 17", "p": "Team 17", "g": "Party-Game", "r": 0, "img": "switch/037.webp", "shot": "shots/switch/037.webp", "d": "Dans Moving Out, jouez seuls ou entre amis. Le but ? Apprendre à déménager, et ce dans des conditions parfois extrêmes. Toutes sortes de situations s'offrent à vous: du simple déchargement de meubles non désirés au trafic de girafes. Résolvez des casse-têtes, comprenez les lois de la physique et vous pourrez peut-être même vous retrouver dans l'espace."}, {"id": "switch_038", "s": "switch", "n": 38, "t": "My Time at Portia", "y": 2019, "dv": "Pathea Games", "p": "Team17", "g": "Aventure", "r": 0, "img": "switch/038.webp", "shot": "shots/switch/038.webp", "d": "Démarrez votre nouvelle vie dans la merveilleuse ville de Portia ! Remettez à neuf l'atelier délabré de votre père en remplissant des commandes, en cultivant des plantes, en élevant des animaux et en interagissant avec les drôles d'habitants de cette charmante terre post-apocalyptique !"}, {"id": "switch_039", "s": "switch", "n": 39, "t": "New Pokémon Snap", "y": 2021, "dv": "Bandai Namco Entertainment", "p": "Nintendo", "g": "Adventure", "r": 0, "img": "switch/039.webp", "shot": "shots/switch/039.webp", "d": "New Pokemon Snap est un jeu d'aventure photographique sur Switch. Replongez dans la peau d'un photographe Pokémon comme en 1999 sur Nintendo 64. Explorez une île inconnue et complétez votre Photodex en prenant vos plus beaux clichés."}, {"id": "switch_040", "s": "switch", "n": 40, "t": "New Super Mario Bros. U Deluxe", "y": 2019, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 1, "img": "switch/040.webp", "shot": "shots/switch/040.webp", "d": "New Super Mario Bros. U Deluxe est à la fois une fusion et un portage. Le jeu contient tous les niveaux de New Super Mario Bros. U et New Super Luigi. U emmenés sur Nintendo Switch. Les personnages secondaires ont également été modifiées par rapport au jeu de base, Nabbit et Toadette sont donc les aventuriers bonus de cet épisode."}, {"id": "switch_041", "s": "switch", "n": 41, "t": "Nickelodeon All-Star Brawl", "y": 2021, "dv": "Game Mill Entertainment", "p": "Ludosity", "g": "Party-Game", "r": 0, "img": "switch/041.webp", "shot": "shots/switch/041.webp", "d": "Nickelodeon All-Star Brawl est un jeu de combat en arène développé par Ludosity et Fair Play Labs et édité par Game Mill Entertainment. Plusieurs personnages issus des univers de Nickelodeon s'affrontent (Bob L'Éponge, Les Tortues Ninja) et doivent sortir leurs adversaires du stage grâce à une palette de coups qui leur est propre."}, {"id": "switch_042", "s": "switch", "n": 42, "t": "Oceanhorn 2 Knights of the Lost Realm", "y": 2020, "dv": "Cornfox & Bros", "p": "Cornfox & Bros", "g": "Action", "r": 0, "img": "switch/042.webp", "shot": "shots/switch/042.webp", "d": "Oceanhorn 2 : Knights of the Lost Realm est un Action-RPG, situé dans une autre période de temps sur la chronologie Oceanhorn. Le jeu a un nouveau héros, un garçon qui a été formé pour devenir un chevalier de Arcadia. Oceanhorn 2 est construit sur les mêmes éléments qui ont été le cœur et l'âme du premier jeu Oceanhorn : explorer un monde coloré, de la musique étonnante et un gameplay classique avec des objets, des puzzles, et des batailles."}, {"id": "switch_043", "s": "switch", "n": 43, "t": "One Piece Unlimited World Édition Deluxe", "y": 2014, "dv": "Bandai Namco", "p": "Ganbarion", "g": "Action / Aventure", "r": 0, "img": "switch/043.webp", "shot": "shots/switch/043.webp", "d": "eu d'action et d'aventure, One Piece Unlimited World Red vous permet de jouer avec tout l'équipage de Chapeau de Paille. L'histoire originale, jouable en mode coopération, voit Luffy se lancer sur les traces du mystérieux Red, en affrontant de nombreux boss présent dans la série."}, {"id": "switch_044", "s": "switch", "n": 44, "t": "One Piece: Pirate Warriors 4", "y": 2020, "dv": "OMEGA Force", "p": "Bandai Namco", "g": "Action / Aventure", "r": 0, "img": "switch/044.webp", "shot": "shots/switch/044.webp", "d": "La saga PIRATE WARRIORS combine avec brio l'univers du célèbre anime ONE PIECE à l'action exaltante des jeux WARRIORS. Vivez une aventure explosive tout droit sortie de l'anime ONE PIECE en affrontant des hordes d'ennemis aux côtés de vos meilleurs alliés ! ONE PIECE : PIRATE WARRIORS 4 est le tout dernier opus des jeux d'action PIRATE WARRIORS ! Plongez dans l'univers de ONE PIECE, au cœur d'un véritable champ de bataille où les bâtiments s'effondrent sous les attaques, dans des nuages de fumée et de poussière ! Des éléments encore jamais vus dans les opus précédents font de PIRATE WARRIORS un jeu d'action encore plus déjanté !"}, {"id": "switch_045", "s": "switch", "n": 45, "t": "Ori and the Will of the Wisps", "y": 2020, "dv": "Moon Studio", "p": "Microsoft", "g": "Action", "r": 1, "img": "switch/045.webp", "shot": "shots/switch/045.webp", "d": "Ori and the Will of the Wisps est la suite du titre originel de Moon Studio : Ori and the Blind Forest. Le fameux personnage accompagné de ses précieux alliés repart à l'aventure pour de nouvelles heures d'émerveillement et de dangers."}, {"id": "switch_046", "s": "switch", "n": 46, "t": "Overcooked! 2", "y": 2018, "dv": "Ghost Town Games", "p": "Team17", "g": "Simulation", "r": 1, "img": "switch/046.webp", "shot": "shots/switch/046.webp", "d": "Overcooked revient avec une toute nouvelle portion d'action culinaire chaotique ! Retournez dans le royaume Oignon et réunissez votre équipe de chefs dans ce jeu de coopération locale ou en ligne jusqu'à 4 joueurs. À vos tabliers... il est l'heure de sauver le monde à nouveau. De la poêle au feu de bois... Vous avez sauvé le monde de l'Insatiable. Désormais, une nouvelle menace a fait surface et il est temps de retourner en cuisine pour repousser l'attaque des zomb'mies ! - Mettez la main à la pâte pour obtenir le meilleur score dans un mode multijoueur chaotique. - Découvrez de nouvelles cuisines : des restaurants de sushis, des écoles de magie et des mines ! - Utilisez des téléporteurs et plateformes mobiles, et gagnez du temps en envoyant vos ingrédients dans des cuisines dynamiques. - Préparez de nouvelles recettes dont des sushis, gâteaux, hamburgers et pizzas."}, {"id": "switch_047", "s": "switch", "n": 47, "t": "Overcooked! All You Can Eat", "y": 2021, "dv": "Team17 Digital", "p": "Team17 Digital", "g": "Occasionnel", "r": 0, "img": "switch/047.webp", "shot": "shots/switch/047.webp", "d": "Profitez de tout ce que le royaume Oignon peut offrir, soit Overcooked! 1 et 2 en splendide 4k et 60 FPS, complètement remasterisé et préparé avec soin. Avec plus de 200 niveaux (7 inédits) et plus de 80 chefs (3 inédits), découvrez l'expérience Overcooked! ultime."}, {"id": "switch_048", "s": "switch", "n": 48, "t": "PAC-MAN MUSEUM+", "y": 2022, "dv": "Bandai Namco", "p": "Bandai Namco", "g": "Plate-Forme", "r": 0, "img": "switch/048.webp", "shot": "shots/switch/048.webp", "d": "Pac-Man Museum + est une compilation de quatorze opus de la fameuse franchise. Retrouvez Pac-Man, Super Pac-Man, Pac & Pal, Pac-Land, Pac-Mania, Pac-Attack, Pac-In-Time, Pac-Man Arrangement Arcade version, Pac-Man Arrangement CS version, Pac-Man Championship Edition, Pac Motos, Pac'N Roll Remix, Pac-Man Battle Royale, Pac-Man 256."}, {"id": "switch_049", "s": "switch", "n": 49, "t": "Paper Mario The Origami King", "y": 2020, "dv": "Nintendo", "p": "Nintendo", "g": "Adventure", "r": 1, "img": "switch/049.webp", "shot": "shots/switch/049.webp", "d": "La série Paper Mario revient avec Paper Mario : The Origami King. Pour sauver la princesse Peach, notre plombier préféré devra se lancer dans une bataille acharnée contre Olly et ses guerriers en papiers..."}, {"id": "switch_050", "s": "switch", "n": 50, "t": "Pico Park 2", "y": 2024, "dv": "Tecopark", "p": "Tecopark", "g": "Platform,Indie,Arcade", "r": 0, "img": "switch/050.webp", "shot": "shots/switch/050.webp", "d": "PICO PARK 2 est un jeu de puzzle et d'action en 2D dans lequel la coopération est la clé ! PICO PARK est de retour avec davantage de niveaux ! Comme dans le premier jeu, vous pouvez jouer entre 2 et 8 joueurs localement ou en ligne. Tous les niveaux sont jouables peu importe le nombre de joueurs, vous permettant ainsi de profiter de tout avec vos amis !"}, {"id": "switch_051", "s": "switch", "n": 51, "t": "Pikmin 1 + 2", "y": 2023, "dv": "Nintendo", "p": "Nintendo", "g": "Adventure, Strategy", "r": 0, "img": "switch/051.webp", "shot": "shots/switch/051.webp", "d": "Revisitez les deux premiers jeux Pikmin sur la console Nintendo Switch™ ! Réintroduisez-vous dans le gameplay stratégique et végétal des Pikmin dans lesquels cette charmante série est ancrée. De la recherche du chemin du retour à la collecte de trésors, Olimar (plus Louie dans le jeu Pikmin 2) doit s'associer à un défilé de Pikmin pour survivre aux conditions les plus difficiles. Les deux jeux prennent en charge les commandes de mouvement en option pour plus d'options lorsque vous guidez vos amis floraux. Rencontrez le capitaine Olimar et un casting compétent de Pikmin rouges, bleus et jaunes dans une terrible mission à travers une planète plus grande que nature. Olimar doit guider ses adorables compagnons feuillus à travers les obstacles, au combat et lors de la récupération des pièces manquantes de son navire. Votre oxygène ne durera que 30 jours, mais les Pikmin vous donnent une lueur d'espoir que vous pourrez rentrer chez vous."}, {"id": "switch_052", "s": "switch", "n": 52, "t": "Pikmin 3 Deluxe", "y": 2020, "dv": "Nintendo", "p": "Nintendo", "g": "Aventure", "r": 1, "img": "switch/052.webp", "shot": "shots/switch/052.webp", "d": "Entrez dans un nouveau monde riche en aventures avec Pikmin 3 Deluxe sur Nintendo Switch ! Dirigez une armée de petites créatures pleines de ressources et explorez une planète hostile dans ce mélange passionnant d'action et de stratégie. Trouvez des objets précieux, résolvez des énigmes et battez de puissants ennemis dans un monde riche en détails et en surprises !"}, {"id": "switch_053", "s": "switch", "n": 53, "t": "Pikmin 4", "y": 2023, "dv": "Nintendo Entertainment Analysis & Development", "p": "Nintendo", "g": "Adventure, Puzzle, Strategy", "r": 1, "img": "switch/053.webp", "shot": "shots/switch/053.webp", "d": "Une nouvelle aventure s'épanouit ! Les Pikmin sont de retour pour une nouvelle grande mission dans Pikmin 4 pour Nintendo Switch ! Ces minuscules créatures ressemblant à des plantes habitent une planète mystérieuse. Développez-les, cueillez-les et commandez-les pendant que vous traversez ce nouveau monde avec leur aide. Que sont les Pikmin ? Les Pikmin existent dans une variété de formes, de tailles et de couleurs ! Par exemple, les Pikmin rouges ne transpirent pas les obstacles enflammés, les Pikmin bleus sont d'excellents nageurs et les Pikmin de glace récemment découverts gardent les choses au frais en gelant les ennemis et l'environnement qui les entoure. Les Pikmin individuels sont peut-être petits et vulnérables, mais ensemble, ils peuvent relever même les plus grands défis ! Utilisez leur puissance miniature et une certaine stratégie pour surmonter tout ce qui se trouve sur votre chemin sur cette étrange nouvelle planète. Un adorable compagnon canin Oatchi, le Space Dog, vous accompagnera également dans votre aventure. Ce compagnon fiable peut briser des obstacles, transporter des objets lourds et porter Pikmin sur son dos tout au long de vos voyages. Ensemble, aucun défi…"}, {"id": "switch_054", "s": "switch", "n": 54, "t": "Pokemon Ecarlate", "y": 2022, "dv": "Game Freak", "p": "Game Freak", "g": "Rpg", "r": 2, "img": "switch/054.webp", "shot": "shots/switch/054.webp", "d": "Pokémon Écarlate/ Violet est un RPG du studio Game Freak. Cet opus introduit la 9ème génération de Pokémon et permet pour la première fois d'explorer le jeu dans un vaste monde ouvert. Combattez en tour par tour et devenez le meilleur dresseur de la région."}, {"id": "switch_055", "s": "switch", "n": 55, "t": "Pokemon Legends Arceus", "y": 2022, "dv": "The Pokémon Company", "p": "Nintendo", "g": "Adventure", "r": 2, "img": "switch/055.webp", "shot": "shots/switch/055.webp", "d": "Légendes Pokémon : Arceus tranche avec les précédents opus Pokémon puisqu'il prend place dans un monde ouvert. Le titre se déroule dans la région de Sinnoh, bien avant sa colonisation par les êtres humains. Le joueur incarnera toujours un dresseur de Pokémon, cette fois-ci chargé de créer le premier Pokédex de Sinnoh."}, {"id": "switch_056", "s": "switch", "n": 56, "t": "Pokemon Lets Go Evoli", "y": 2018, "dv": "Game Freak", "p": "Nintendo", "g": "Rpg", "r": 1, "img": "switch/056.webp", "shot": "shots/switch/056.webp", "d": "Pokémon Let's Go Evoli est un jeu de type RPG dans l'univers des très célèbres Pokémon. Ce dernier n'ajoutera pas de nouvelle génération de petits monstres à capturer, mais nous ramènera aux bases même de la série."}, {"id": "switch_057", "s": "switch", "n": 57, "t": "Pokemon Lets Go Pikachu", "y": 2018, "dv": "Game Freak", "p": "Nintendo", "g": "Rpg", "r": 1, "img": "switch/057.webp", "shot": "shots/switch/057.webp", "d": "Pokémon Let's Go Pikachu est un jeu de type RPG dans l'univers des très célèbres Pokémon. Ce dernier n'ajoutera pas de nouvelle génération de petits monstres à capturer, mais nous ramènera aux bases même de la série."}, {"id": "switch_058", "s": "switch", "n": 58, "t": "Pokemon Perle Scintillante", "y": 2021, "dv": "Game Freak", "p": "Nintendo", "g": "Adventure", "r": 1, "img": "switch/058.webp", "shot": "shots/switch/058.webp", "d": "Pokémon Perle Scintillante est un remake de Pokémon Perle sorti sur Nintendo DS. Avec un nouveau style graphique plutôt enfantin, les joueurs peuvent découvrir ou redécouvrir la région de Sinnoh et retrouver les Pokémons de la quatrième génération."}, {"id": "switch_059", "s": "switch", "n": 59, "t": "Pokemon Violet", "y": 2022, "dv": "Game Freak", "p": "Game Freak", "g": "Rpg", "r": 2, "img": "switch/059.webp", "shot": "shots/switch/059.webp", "d": "Pokémon Écarlate/ Violet est un RPG du studio Game Freak. Cet opus introduit la 9ème génération de Pokémon et permet pour la première fois d'explorer le jeu dans un vaste monde ouvert. Combattez en tour par tour et devenez le meilleur dresseur de la région."}, {"id": "switch_060", "s": "switch", "n": 60, "t": "Pokken Tournament DX", "y": 2017, "dv": "Bandai Namco", "p": "Nintendo", "g": "Combat, Action", "r": 0, "img": "switch/060.webp", "shot": "shots/switch/060.webp", "d": "Pokkén Tournament DX est un jeu de combat sur Switch. En plus de faciliter le jeu à plusieurs, le jeu propose cinq nouveaux combattants : Darkrai, Cradopaud, Cizayox, Pingoléon et Archéduc. Ce qui donne un roster de 21 pokémon jouables."}, {"id": "switch_061", "s": "switch", "n": 61, "t": "Pokémon Bouclier", "y": 2019, "dv": "Game Freak", "p": "Nintendo", "g": "Adventure", "r": 1, "img": "switch/061.webp", "shot": "shots/switch/061.webp", "d": "Pokémon Épée / Bouclier est le nouvel épisode de la série Pokémon, exclusif à la console de salon de Nintendo. Le jeu prend place dans la nouvelle région de Galar et donne accès à trois nouveaux Pokémons de départ : Ouistempo (plante), Flambino (feu) et Larméléon (eau)."}, {"id": "switch_062", "s": "switch", "n": 62, "t": "Pokémon Diamant Etincelant", "y": 2021, "dv": "Game Freak", "p": "Nintendo", "g": "Adventure", "r": 1, "img": "switch/062.webp", "shot": "shots/switch/062.webp", "d": "Pokémon Diamant Étincelant est un remake de Pokémon Version Diamant sorti sur Nintendo DS. Avec un nouveau style graphique plutôt enfantin, les joueurs peuvent découvrir ou redécouvrir la région de Sinnoh et retrouver les Pokémons de la quatrième génération."}, {"id": "switch_063", "s": "switch", "n": 63, "t": "Pokémon Donjon Mystère : Équipe de Secours DX", "y": 2020, "dv": "Nintendo", "p": "Nintendo", "g": "Rpg", "r": 0, "img": "switch/063.webp", "shot": "shots/switch/063.webp", "d": "Pokémon Donjon Mystère : Équipe de Secours DX sur Nintendo Switch est une version bonifiée du jeu GBA paru en 2006. On y incarne un Pokémon, défini après un test de personnalité, dans un monde en proie à des catastrophes naturelles. L'objectif est de parcourir des donjons pour remporter des points de secourisme et atteindre le Grade Or, l'objectif ultime pour les équipes de secours."}, {"id": "switch_064", "s": "switch", "n": 64, "t": "Pokémon Epée", "y": 2019, "dv": "Game Freak", "p": "Nintendo", "g": "Adventure", "r": 1, "img": "switch/064.webp", "shot": "shots/switch/064.webp", "d": "Pokémon Épée / Bouclier est le nouvel épisode de la série Pokémon, exclusif à la console de salon de Nintendo. Le jeu prend place dans la nouvelle région de Galar et donne accès à trois nouveaux Pokémons de départ : Ouistempo (plante), Flambino (feu) et Larméléon (eau)."}, {"id": "switch_065", "s": "switch", "n": 65, "t": "Red Dead Redemption", "y": 2023, "dv": "Take-Two Interactive", "p": "Rockstar Games", "g": "Action", "r": 1, "img": "switch/065.webp", "shot": "shots/switch/065.webp", "d": "Red Dead Redemption sur Switch est un GTA-like qui se déroule au début du XXème siècle, en pleine révolution mexicaine, dans une ambiance western. On y incarne John Marston, un hors-la-loi contraint et forcé de traquer ses anciens \"frères\" qui l'ont laissé pour mort. John peut chasser toutes les espèces animales de l'Ouest Américain et doit remplir une série de missions pour regagner son indépendance."}, {"id": "switch_066", "s": "switch", "n": 66, "t": "Resident Evil", "y": 2019, "dv": "Capcom", "p": "Avalon Interactive", "g": "Horreur", "r": 0, "img": "switch/066.webp", "shot": "shots/switch/066.webp", "d": "Resident Evil est un survival-horror sur Switch. L'équipe Bravo a disparu lors d'un crash d'hélicoptère dans les montagnes d'Arklay non loin de la petite ville de Raccoon City. Vous faites partie de l'équipe alpha chargée de retrouver des survivants. Arrivé à l'épave, une meute de chiens enragés vous oblige à vous retrancher dans un vieux manoir où vous pensez être en sécurité, mais c'est là que le cauchemar va vraiment débuter."}, {"id": "switch_067", "s": "switch", "n": 67, "t": "Rigid Force Redux", "y": 2020, "dv": "Com8com1", "p": "Com8com1", "g": "Shoot'em Up", "r": 0, "img": "switch/067.webp", "shot": "shots/switch/067.webp", "d": "Rigid Force Redux est un shoot'em up 3D. Le joueur, à bord de son vaisseau, sera équipé d'un arsenal évolutif et devra faire attention aux nombreux ennemis et milliers de vaisseaux adversaires qui se dressent devant vous."}, {"id": "switch_068", "s": "switch", "n": 68, "t": "RiMS Racing", "y": 2021, "dv": "Raceward Studio", "p": "Nacon", "g": "Course Automobile", "r": 0, "img": "switch/068.webp", "shot": "shots/switch/068.webp", "d": "La première simulation moto associant les défis d’un pilotage réaliste à ceux de l’ingénierie et de la mécanique ! Enfourchez les motos les plus puissantes au monde et optimisez leurs performances en changeant les pièces et en analysant les données en temps réel."}, {"id": "switch_069", "s": "switch", "n": 69, "t": "RollerCoaster Tycoon 3 Complete Edition", "y": 2020, "dv": "Frontier Developments Ltd.", "p": "Frontier Developments Ltd.", "g": "Simulation", "r": 0, "img": "switch/069.webp", "shot": "shots/switch/069.webp", "d": "Votre parc. Ta façon Quoi que vous souhaitiez créer, RollerCoaster Tycoon 3 vous offre le outils et liberté pour construire le parc d'attractions de vos rêves. Gérez comme un magnat et atteignez le sommet Contrôlez les finances, les magasins, les services et le personnel du parc pour réussir des dizaines de scénarios. Devenez un véritable magnat et lancez-vous dans votre une nouvelle carrière prometteuse, ou créez votre parc idéal sans soucis d'argent en mode bac à sable. Satisfaire les besoins de vos invités et conserver votre parc bien fonctionner pour réussir. Préparez-vous à être « trempé ! » et aventurez-vous dans le « sauvage ! »"}, {"id": "switch_070", "s": "switch", "n": 70, "t": "Saints Row The Third", "y": 2019, "dv": "THQ", "p": "Volition", "g": "Action", "r": 0, "img": "switch/070.webp", "shot": "shots/switch/070.webp", "d": "Le fameux jeu permettant de prendre part à des affrontements sanglants entre gangs est de retour avec Saints Row 3 sur Switch, suite du célèbre jeu ayant maintes fois fait ses preuves jusqu'à présent. Le titre propose de l'action constante avec des guerres de gangs plus explosives que jamais. Forgez-vous une réputation de gros dur pour devenir le mec le plus respecté du quartier."}, {"id": "switch_071", "s": "switch", "n": 71, "t": "Snipperclips", "y": 2017, "dv": "Nintendo", "p": "Nintendo", "g": "Reflexion", "r": 0, "img": "switch/071.webp", "shot": "shots/switch/071.webp", "d": "Snipperclips sur Switch est un jeu de réflexion coopératif jouable en solo ou en multi, basé sur la résolution d'énigmes. Vous devez ainsi découper vos personnages dans des formes différentes afin de résoudre de nombreux puzzles."}, {"id": "switch_072", "s": "switch", "n": 72, "t": "Sonic Colors Ultimate", "y": 2021, "dv": "Sega", "p": "Sega", "g": "Plate-Forme", "r": 0, "img": "switch/072.webp", "shot": "shots/switch/072.webp", "d": "Sonic Colors : Ultimate est une nouvelle version du jeu éponyme de 2010, sorti originellement sur Wii. Les graphismes sont améliorés, le gameplay retravaillé, et le titre se dote de quelques nouvelles fonctionnalités."}, {"id": "switch_073", "s": "switch", "n": 73, "t": "Sonic Origins", "y": 2022, "dv": "Sega", "p": "Headcannon", "g": "Plate-Forme", "r": 0, "img": "switch/073.webp", "shot": "shots/switch/073.webp", "d": "Sonic Origins est une compilation de jeux rétro qui regroupe Sonic, Sonic 2, Sonic 3, Sonic & Knuckles ainsi que Sonic CD. Du nouveau contenu sera au rendez-vous, mais pour le moment très peu d'informations sont connues sur ce sujet."}, {"id": "switch_074", "s": "switch", "n": 74, "t": "Sonic Superstars", "y": 2023, "dv": "Sega", "p": "Sega", "g": "Platform", "r": 0, "img": "switch/074.webp", "shot": "shots/switch/074.webp", "d": "Sonic Superstars est un jeu de plateformes en 2,5D. On y retrouve Sonic et ses amis dans une aventure aussi bien solo que jouable à plusieurs en multijoueur. Les joueurs peuvent exploiter le pouvoir des Émeraudes du Chaos pour profiter de nouvelles capacités."}, {"id": "switch_075", "s": "switch", "n": 75, "t": "Splatoon 2", "y": 2017, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 2, "img": "switch/075.webp", "shot": "shots/switch/075.webp", "d": "Splatoon 2 sur Switch est un jeu de tir à la troisième personne se jouant massivement en multijoueur. La particularité du titre est que vos différentes armes projettent de la peinture et non des balles. Parcourez des environnements entre amis, aspergez-vous de peinture et transformez-vous en calamars pour vous cacher dans les flaques colorées."}, {"id": "switch_076", "s": "switch", "n": 76, "t": "Splatoon 3", "y": 2022, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 2, "img": "switch/076.webp", "shot": "shots/switch/076.webp", "d": "Splatoon 3 est le nouvel épisode la licence de jeu de tir à la troisième personne de Nintendo. Incorporant toujours la peinture au cœur de sa jouabilité, ce troisième épisode intègre de nouvelles techniques et armes ainsi que La Contrée Clabousse, un nouveau lieu d'affrontements."}, {"id": "switch_077", "s": "switch", "n": 77, "t": "Spyro Reignited Trilogy", "y": 2019, "dv": "Toys For Bob", "p": "Activision Blizzard", "g": "Platform", "r": 1, "img": "switch/077.webp", "shot": "shots/switch/077.webp", "d": "Activision remastérise complètement les 3 jeux originaux Spyro en HD dans cette édition incluant \"Spyro the Dragon\", \"Spyro 2 : Ripto's Rage!\" et \"Spyro : Year of the Dragon\". Plus de 100 niveaux ont été refaits pour une amélioration graphique et de gameplay."}, {"id": "switch_078", "s": "switch", "n": 78, "t": "Streets of Rage 4", "y": 2020, "dv": "Guard Crush Games", "p": "Dotemu", "g": "Beat'em All", "r": 1, "img": "switch/078.webp", "shot": "shots/switch/078.webp", "d": "Streets of Rage 4 est un beat 'em up à défilement horizontal. Il s'agit du quatrième épisode de la série de jeux de Sega Streets of Rage, 25 ans après la sortie du dernier épisode. Ce nouvel opus prend place 10 ans après les événements de Streets of Rage 3."}, {"id": "switch_079", "s": "switch", "n": 79, "t": "Subnautica", "y": 2021, "dv": "Unknown Worlds Entertainment", "p": "Grip Games", "g": "Open World", "r": 0, "img": "switch/079.webp", "shot": "shots/switch/079.webp", "d": "Subnautica est un jeu d'aventure dans un monde ouvert sous-marin. Dans la peau d'un scientifique échoué dans ce monde étranger situé sous l'eau, vous allez devoir trouver comment survivre tout en faisant de nouvelles découvertes sur la nature de la faune locale."}, {"id": "switch_080", "s": "switch", "n": 80, "t": "Summer in Mara", "y": 2020, "dv": "Chibig", "p": "Chibig", "g": "Adventure", "r": 0, "img": "switch/080.webp", "shot": "shots/switch/080.webp", "d": "Jeu d'aventure en solo, Summer In Mara vous propose de prendre soin d'une île, sur laquelle vous pourrez cultiver ce dont vous avez besoin, et que vous pourrez aménager comme bon vous semble. Lorsque l'aventure appelle, sautez à bord de votre bateau et partez découvrir de nouveaux lieux et rencontrer de nouveaux personnages sur les îles alentour."}, {"id": "switch_081", "s": "switch", "n": 81, "t": "Super Kickers League", "y": 2020, "dv": "Xaloc Studios", "p": "Just For Games", "g": "Sports", "r": 0, "img": "switch/081.webp", "shot": "shots/switch/081.webp", "d": "Le seul objectif : marquer plus de buts que l’adversaire, peu importe les manières utilisées pour y arriver ! Joue seul ou avec tes amis, forme une équipe de capitaines et combine différentes compétences pour gagner des matchs, des compétitions et débloquer différents modes de jeu et personnages. Fonce droit au but dans Super Kickers League !"}, {"id": "switch_082", "s": "switch", "n": 82, "t": "Super Mario 3D World + Bowser's Fury", "y": 2021, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 2, "img": "switch/082.webp", "shot": "shots/switch/082.webp", "d": "Super Mario 3D World + Bowser's Fury sur Switch est une version deluxe du Super Mario 3D World de la Wii U comportant une nouvelle extension, Bowser's Fury. Jusqu'à quatre personnages peuvent s'entraider dans des niveaux qui mélangent jouabilité 2D et 3D. En récupérant des étoiles cachées, on débloque de nouveaux mondes de plus en plus difficiles."}, {"id": "switch_083", "s": "switch", "n": 83, "t": "Super Mario Bros. 35", "y": 2020, "dv": "Arika", "p": "Nintendo", "g": "Plateforme / Run & Jump", "r": 0, "img": "switch/083.webp", "shot": "shots/switch/083.webp", "d": "De l'action déjantée en multijoueur ! Dans Super Mario Bros. 35, chaque partie donne lieu à une configuration aléatoire de stages tirés du premier Super Mario Bros. Un seul mot d'ordre : attendez-vous à des surprises ! Les joueurs peuvent soumettre leurs suggestions de stage initial et voter pour leur préféré avant la partie, de sorte que vous pourriez très bien commencer par le Château de Bowser du Monde 8-4 !"}, {"id": "switch_084", "s": "switch", "n": 84, "t": "Super Mario Maker 2", "y": 2019, "dv": "Nintendo", "p": "Nintendo", "g": "Plate-Forme", "r": 1, "img": "switch/084.webp", "shot": "shots/switch/084.webp", "d": "Super Mario Maker 2 est un jeu de plates-formes dans lequel le joueur peut créer ses propres niveaux, en plaçant les décors, pièges et ennemis de son choix avant de le partager en ligne. Nintendo promet \"encore plus d'outils, plus d'objets et plus de fonctionnalités\" pour la suite de son jeu de création."}, {"id": "switch_085", "s": "switch", "n": 85, "t": "Super Mario Odyssey", "y": 2017, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 3, "img": "switch/085.webp", "shot": "shots/switch/085.webp", "d": "Super Mario Odyssey est un jeu de plate-forme sur Switch où la princesse Peach a été enlevée par Bowser. Pour la sauver, Mario quitte le royaume Champignon à bord de l'Odyssey. Accompagné de Chappy, son chapeau vivant, il doit parcourir différents royaumes et faire tout pour vaincre, une nouvelle fois, le terrible Bowser."}, {"id": "switch_086", "s": "switch", "n": 86, "t": "Super Mario Party Jamboree", "y": 2024, "dv": "Ndcube", "p": "Nintendo", "g": "Board", "r": 0, "img": "switch/086.webp", "shot": "shots/switch/086.webp", "d": "Rejoignez la dernière fête Mario pour un Jamboree de sept planches et plus de 110 mini-jeux! Préparez-vous pour la plus grande fête à ce jour dans Super Mario Party Jamboree pour Nintendo Switch. De la course à travers des manèges au minigolf de contrôle du mouvement, ce Jamboree est rempli de plus de 110 mini-jeux - le plus de tout jeu de fête Mario à ce jour! Avec sept planches en tout, vous pouvez aller avec le flux à Goomba Lagoon, rechercher des étoiles dans Rainbow Galleria, revoir les classiques de Western Land et le château arc-en-ciel de Mario des titres précédents et plus encore. Race à travers le Board Party à Koopathlon, une compétition en ligne de 20 joueurs en série pour voir qui peut accumuler les scores les plus élevés des mini-jeux comme le changement de voie rapide. Plus votre score à chaque tour est élevé, plus vous atteindrez rapidement le but. Koopathlon n'est que l'un des modes supplémentaires - il y a quelque chose pour tous les types de joueurs de Mario Party! Classification australienne: g"}, {"id": "switch_087", "s": "switch", "n": 87, "t": "Super Mario Wonder", "y": 2023, "dv": "Nintendo", "p": "Nintendo", "g": "Platform", "r": 3, "img": "switch/087.webp", "shot": "shots/switch/087.webp", "d": "Trouvez l'émerveillement dans la prochaine évolution de Mario Fun Le gameplay classique de Mario à défilement latéral est bouleversé avec l’ajout de Wonder Flowers. Ces objets qui changent la donne déclenchent des moments spectaculaires qu'il faut voir pour y croire... Observez les tuyaux prendre vie, faites des ravages comme une boule géante à pointes et assistez à des événements encore plus inattendus appelés Wonder Effects. Choisissez parmi les personnages héroïques et les Power-Ups de Super Mario™ Choisissez parmi des personnages familiers, dont Mario, Luigi, Peach, Daisy, Yoshi et Toad. Transformez-vous en Elephant Mario pour utiliser votre trompe pour écraser les ennemis avec un nouveau Power-Up surprenant ! Partagez l'émerveillement avec vos amis et fans de Mario Faites équipe avec jusqu'à trois amis localement* et rassemblez-vous autour d'une console Nintendo Switch™ pour expérimenter ensemble les effets magiques du jeu tout en affrontant des parcours en équipe et en vous entraidant sur le chemin de l'objectif."}, {"id": "switch_088", "s": "switch", "n": 88, "t": "Super Monkey Ball Banana Mania", "y": 2021, "dv": "Sega", "p": "Sega", "g": "Plate-Forme", "r": 0, "img": "switch/088.webp", "shot": "shots/switch/088.webp", "d": "Super Monkey Ball Banana Mania s'annonce comme le remaster des trois premiers jeux Super Monkey Ball : Super Monkey Ball, Super Monkey Ball 2 et Super Monkey Ball Deluxe. Les joueurs pourront compter sur plus 300 niveaux et labyrinthes recréés et 12 mini-jeux."}, {"id": "switch_089", "s": "switch", "n": 89, "t": "Super Smash Bros. Ultimate", "y": 2018, "dv": "Nintendo", "p": "Nintendo", "g": "Combat", "r": 3, "img": "switch/089.webp", "shot": "shots/switch/089.webp", "d": "Super Smash Bros Ultimate est un jeu de combat sur Switch. Cet opus Ultimate regroupe l'intégralité des combattants déjà apparus dans l'histoire de Super Smash Bros. 75 personnages jouables seront disponibles en comptant le dresseur, ainsi que tous ses Pokémon."}, {"id": "switch_090", "s": "switch", "n": 90, "t": "Team Sonic Racing", "y": 2019, "dv": "Sumo Digital Ltd.", "p": "Sega", "g": "Racing", "r": 0, "img": "switch/090.webp", "shot": "shots/switch/090.webp", "d": "Team Sonic Racing est un jeu de course en provenance de SEGA. Le titre reprend l'univers de son fameux hérisson et marque le retour de cette série de jeux dont le dernier opus date d'il y a six ans. Le jeu repose sur le concept de jeu en équipe où on ne sélectionne pas un seul pilote, mais une équipe de trois as du volant."}, {"id": "switch_091", "s": "switch", "n": 91, "t": "Teenage Mutant Ninja Turtles Shredder's Revenge", "y": 2022, "dv": "Tribute Games", "p": "Dotemu", "g": "Beat'em All", "r": 1, "img": "switch/091.webp", "shot": "shots/switch/091.webp", "d": "Teenage Mutant Ninja Turtles : Shredder’s Revenge est un beat'em all à défilement horizontal s'inspirant des anciens jeux d'arcade au style rétro. Incarnez les célèbres tortues seul où en coopération jusqu'à quatre joueurs afin de déjouer les plans du maléfique Shredder."}, {"id": "switch_092", "s": "switch", "n": 92, "t": "Terminator 2D : NO FATE", "y": 2025, "dv": "Bitmap Bureau", "p": "Reef Entertainment", "g": "Plateforme", "r": 0, "img": "switch/092.webp", "shot": "shots/switch/092.webp", "d": "Vivez les événements animés de «Terminator 2: Le Jugement Dernier» à travers des illustrations pixélisées magnifiques et un gameplay d’arcade rempli d’action! Incarnez Sarah Connor et le T-800 à travers une variété de missions palpitantes où ils affrontent le T-1000 et tentent d’arrêter les plans de Skynet avant que l’humanité ne soit anéantie. Dirigez la Résistance en tant que John Connor dans le futur, combattant en première ligne comme le seul espoir de la race humaine dans la guerre contre les machines. Dans cette histoire unique qui mêle des scènes iconiques de «Terminator 2: Le Jugement Dernier» avec des scénarios originaux et plusieurs fins, le destin de l’humanité est entre vos mains."}, {"id": "switch_093", "s": "switch", "n": 93, "t": "Tetris Effect Connected", "y": 2021, "dv": "Enhance Games", "p": "Enhance Games", "g": "Puzzle", "r": 1, "img": "switch/093.webp", "shot": "shots/switch/093.webp", "d": "Tetris Effect est un jeu de type puzzle qui propose une nouvelle version de la célèbre création d'Alexey Pajitnov. Le concept est simple : il s'agit de mettre à profit le fameux \"effet Tetris\", une observation scientifique conduisant les joueurs à voir encore les blocs tomber plusieurs heures après avoir posé la manette."}, {"id": "switch_094", "s": "switch", "n": 94, "t": "The Legend of Zelda Breath of the Wild", "y": 2017, "dv": "Nintendo", "p": "Nintendo", "g": "Adventure", "r": 4, "img": "switch/094.webp", "shot": "shots/switch/094.webp", "d": "The Legend of Zelda : Breath of the Wild est un jeu d'action/aventure. Link se réveille d'un sommeil de 100 ans dans un royaume d'Hyrule dévasté. Il lui faudra percer les mystères du passé et vaincre Ganon, le fléau. L'aventure prend place dans un gigantesque monde ouvert et accorde ainsi une part importante à l'exploration. Le titre a été pensé pour que le joueur puisse aller où il veut dès le début, s'éloignant de la linéarité habituelle de la série."}, {"id": "switch_095", "s": "switch", "n": 95, "t": "The Legend of Zelda Links Awakening", "y": 2017, "dv": "Nintendo", "p": "Nintendo", "g": "Aventure", "r": 2, "img": "switch/095.webp", "shot": "shots/switch/095.webp", "d": "The Legend of Zelda : Link's Awakening (2019) est un remake de l'épisode culte de la saga paru en 1993 sur Game Boy. Il est cette fois-ci question d'une refonte totale du quatrième opus de la série, dans lequel nous suivons Link, échoué sur l'île mystérieuse de Cocolint."}, {"id": "switch_096", "s": "switch", "n": 96, "t": "The Legend of Zelda Skyward Sword HD", "y": 2021, "dv": "Nintendo", "p": "Nintendo", "g": "Aventure", "r": 2, "img": "switch/096.webp", "shot": "shots/switch/096.webp", "d": "Retraçant l'histoire la plus ancienne dans la chronologie des jeux de la série The Legend of Zelda, découvrez les origines de l'épée de légende dans The Legend of Zelda: Skyward Sword HD sur Nintendo Switch. Originellement sortie sur Wii en 2011, cette aventure conte le récit de Link, qui doit voyager entre un monde situé au-dessus des nuages et les vastes contrées inconnues qui s'étendent sous leur surface pour retrouver son amie d'enfance, Zelda."}, {"id": "switch_097", "s": "switch", "n": 97, "t": "The Legend of Zelda Tears of the Kingdom", "y": 2023, "dv": "Nintendo EPD", "p": "Nintendo", "g": "Action, Adventure", "r": 4, "img": "switch/097.webp", "shot": "shots/switch/097.webp", "d": "Repoussez les limites de l’aventure. Faites le grand saut : la suite de l’aventure en monde ouvert acclamée par la critique vous attend !Après The Legend of Zelda : Breath of The Wild, plongez dans des terres d’Hyrule ravagées par les forces obscures dans The Legend of Zelda : Tears of the Kingdom. Incarnez le héros de la légende, Link, et décidez du chemin que vous voulez suivre à travers les immenses terres d'Hyrule et les vastes cieux qui les surplombent. Créez votre propre aventure dans un monde où vous pouvez donner libre cours à votre imagination. Saurez-vous maîtriser la puissance des nouvelles capacités de Link pour lutter contre les forces maléfiques qui menacent le royaume ?"}, {"id": "switch_098", "s": "switch", "n": 98, "t": "The Legend of Zelda: Echoes of Wisdom", "y": 2024, "dv": "Grezzo", "p": "Nintendo", "g": "Action, Adventure", "r": 2, "img": "switch/098.webp", "shot": "shots/switch/098.webp", "d": "Sauvez le royaume d'Hyrule – cette fois avec la sagesse de la princesse Zelda – dans The Legend of Zelda : Echoes of Wisdom pour Nintendo Switch. Les habitants d'Hyrule sont emportés par d'étranges failles apparues, et avec un certain épéiste parmi les disparus, c'est à la princesse Zelda de sauver son royaume. Faites équipe avec la mystérieuse fée Tri et utilisez le pouvoir du Tri Rod pour apprendre à créer des échos, des imitations d'objets trouvés dans l'environnement. Vous pouvez ensuite recréer ces échos chaque fois que vous le souhaitez pour résoudre des énigmes et vaincre des ennemis. Créez des échos comme des blocs d'eau pour atteindre de nouveaux sommets, construisez des ponts avec de vieux lits, lancez des pierres sur les ennemis ou trouvez votre propre combinaison créative d'échos pour faire les choses à votre façon. Vous pouvez même créer des échos de monstres pour combattre à vos côtés au combat !"}, {"id": "switch_099", "s": "switch", "n": 99, "t": "Xenoblade Chronicles 2", "y": 2017, "dv": "Monolith Soft", "p": "Nintendo", "g": "Role-Playing", "r": 2, "img": "switch/099.webp", "shot": "shots/switch/099.webp", "d": "Xenoblade Chronicles 2 sur Switch est un RPG dans lequel vous explorez un océan de nuages infini où vivent les derniers rescapés d'une civilisation sur le dos de monstres colossaux appelés Titans. Vivez l'histoire de Rex, de sa nouvelle amie Pyra, et d'une mystérieuse créature appelée Lame qui lui confère un pouvoir immense. Partez ensemble en quête du monde perdu de Pyra, Elysium, le paradis ultime pour toute l'humanité."}, {"id": "switch_100", "s": "switch", "n": 100, "t": "Yoshis Crafted World", "y": 2019, "dv": "Nintendo", "p": "Nintendo", "g": "Plate-Forme", "r": 1, "img": "switch/100.webp", "shot": "shots/switch/100.webp", "d": "Yoshi Crafted World sur Switch est un jeu de plate-forme qui prend place dans un univers de carton-pâte. Dans la peau du dinosaure vert Yoshi, vous devrez découvrir ce monde et ses deux facettes : une première, mise en avant et travaillée; et une seconde, qui représente l'envers du décor."}, {"id": "neogeo_001", "s": "neogeo", "n": 1, "t": "3 Count Bout", "y": 1993, "dv": "SNK", "p": "SNK", "g": "Sport / Lutte, Combat / 2D, Sport, Combat", "r": 0, "img": "neogeo/001.webp", "shot": "shots/neogeo/001.webp", "d": "Vous faites partie de la SNK Wrestling Federation et désirez participer au championnat du monde, le SWF Wrestle Festival. Aussi bien sur le ring que dans les rues, vous allez devoir montrer qui est le patron. Il est temps de se lancer dans le championnat. Choisissez parmi dix lutteurs qui ont leurs propres attaques. Il y a dix rounds dans le jeu dans lesquels vous combattrez d'autres lutteurs de plus en plus coriaces. Le but du jeu est de tenir l'adversaire au sol 3 secondes. Il y a également une barre de santé, plus elle est basse, plus il est dur de se dégager d'une prise. Vous pourrez frapper, mordre et effectuer d'autres mouvements spectaculaires (ou illégaux) pour vaincre vos adversaires."}, {"id": "neogeo_002", "s": "neogeo", "n": 2, "t": "Aero Fighters 2", "y": 1994, "dv": "Video System", "p": "SNK", "g": "Shoot'em Up, Shoot'em Up / Vertical", "r": 0, "img": "neogeo/002.webp", "shot": "shots/neogeo/002.webp", "d": "Aero Fighters 2 sur Neo Geo est un shoot'em up dans lequel vous avez le choix entre huit pilotes de nationalités différentes, aux commandes d'avions de guerre célèbres. Vous survolerez huit capitales, disposant d'un tir simple que vous pourrez améliorer grâce aux bonus présents dans les niveaux, ainsi que d'une super-bombe nettoyant le champ de vision de tout ennemi."}, {"id": "neogeo_003", "s": "neogeo", "n": 3, "t": "Aero Fighters 3", "y": 1995, "dv": "Video System", "p": "SNK", "g": "Shoot'em Up / Vertical, Shoot'em Up", "r": 0, "img": "neogeo/003.webp", "shot": "shots/neogeo/003.webp", "d": "Comme il en était question dans le volet précédent, vous devez dans Aero Fighters 3 sur Neo Geo survoler les grandes capitales de ce monde. Cette fois-ci, ce sera à bord de vieux coucous de la Seconde Guerre mondiale, non moins armés pour autant. Aux commandes de votre appareil et grâce aux armes améliorables dont vous disposez, vous aurez pour mission de débarrasser les cieux de tout ennemi."}, {"id": "neogeo_004", "s": "neogeo", "n": 4, "t": "Aggressors of Dark Kombat", "y": 1994, "dv": "ADK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/004.webp", "shot": "shots/neogeo/004.webp", "d": "Aggressors of Dark Kombat est un jeu de combat sur Neo Geo. Celui-ci présente la particularité de gérer le déplacement dans la profondeur. Vous pourrez donc distribuer les coups en long, en large et en travers avec l'un des huit persos proposés. Vous profiterez également des pelles et autres cocktails Molotov leur tombant sous la main pour les envoyer sur la trogne de leur adversaire."}, {"id": "neogeo_005", "s": "neogeo", "n": 5, "t": "Alpha Mission II", "y": 1991, "dv": "SNK", "p": "SNK", "g": "Shoot'em Up / Vertical, Shoot'em Up", "r": 0, "img": "neogeo/005.webp", "shot": "shots/neogeo/005.webp", "d": "En l'an 2525, l'espace est à nouveau menacé. Seul le légendaire Super Jet Plane SYD peut vaincre l'armada envahissante et détruire le Fulvalence Groma. Alpha Mission II est un jeu de tir à défilement vertical descendant et la suite d'Alpha Mission. Lorsque le jeu commence, le joueur choisit deux armures pour son SYD, et des armures supplémentaires peuvent être achetées à la fin de chaque niveau. Les armures ajoutent une puissance de feu supplémentaire au vaisseau lorsqu'elles sont équipées et seront détruites si le vaisseau est touché. Les armes principales du SYD sont un laser direct et des bombes, ells peuvent être améliorées à partir d'icônes larguées par certains ennemis. Comme dans Xevious, les cibles terrestres ne peuvent être touchées que par des bombes, tandis que les cibles aériennes ne peuvent être touchées que par des lasers."}, {"id": "neogeo_006", "s": "neogeo", "n": 6, "t": "Art of Fighting", "y": 1992, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/006.webp", "shot": "shots/neogeo/006.webp", "d": "Art of Fighting sur Neo Geo est un jeu de combat en 2D qui fut le premier à utiliser un système de zoom se déclenchant lorsque les personnages étaient proches. Choisissez parmi 10 personnages au style bien particulier et défoulez-vous sur votre adversaire à coups de pieds et de poings. Il est également possible, pour la première fois dans un jeu de combat, de débloquer des furies pour exécuter des enchaînements dévastateurs."}, {"id": "neogeo_007", "s": "neogeo", "n": 7, "t": "Art of Fighting 2", "y": 1994, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/007.webp", "shot": "shots/neogeo/007.webp", "d": "Art of Fighting 2 sur Neo Geo peaufine ce qui a été amorcé dans le précédent volet. Une quinzaine de personnages sont jouables d'entrée et de nouvelles possibilités de mouvements sont offertes grâce à l'ajout de la jauge de Ki. Vous pourrez ainsi lancer les Desperation Moves en cas critique. Les zooms si impressionnants sont toujours de la partie dans le deuxième volet de Art of Fighting."}, {"id": "neogeo_008", "s": "neogeo", "n": 8, "t": "Art of Fighting 3 : The Path of the Warrior", "y": 1996, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/008.webp", "shot": "shots/neogeo/008.webp", "d": "The Path of the Warrior : Art of Fighting 3 sur Neo Geo possède très peu de liens scénaristiques en rapport avec les deux précédents volets. Qu'importe, l'essentiel i
