"y": 2000, "dv": "Atari", "p": "Midway", "g": "Course, Conduite", "r": 0, "img": "n64/070.webp", "shot": "shots/n64/070.webp", "d": "San Francisco Rush 2049 sur Nintendo 64 est un jeu de courses futuriste. Il vous faudra rallier l'arrivée en tête tout en évitant des crashs meurtriers. De nombreux raccourcis parsèment les circuits vertigineux, à vous de les découvrir. Le mode multijoueur quant à lui, permet à quatre participants de s'opposer."}, {"id": "n64_071", "s": "n64", "n": 71, "t": "Shadow Man", "y": 1999, "dv": "Acclaim", "p": "Acclaim", "g": "Action / Aventure, Action, Combat", "r": 0, "img": "n64/071.webp", "shot": "shots/n64/071.webp", "d": "Vous êtes Shadow Man et avez la capacité de passer du monde des vivants au monde des morts en un claquement de doigts. Dans ce jeu sur Nintendo 64, vous devez empêcher des tueurs en série de plonger le monde dans le chaos. Vous disposez de pouvoirs vaudous afin de vous débarrasser de vos ennemis dans le monde des morts et d'armes à feu pour abattre ceux du monde des vivants."}, {"id": "n64_072", "s": "n64", "n": 72, "t": "Snowboard Kids", "y": 1998, "dv": "Atlus", "p": "Atlus", "g": "Sport / Ski, Sport", "r": 0, "img": "n64/072.webp", "shot": "shots/n64/072.webp", "d": "Si l'appel des cimes se fait trop fort mais que la montagne est trop loin, saisissez votre Nintendo 64 et lancez Snowboard Kids. Dans ce jeu de snowboard, commencez par choisir votre personnage : Koyuki, Brad, Slash... et préparez-vous pour des descentes endiablées pleines de décharges électriques, mines, bazookas et somnifères : tous les moyens sont bons pour être le premier !"}, {"id": "n64_073", "s": "n64", "n": 73, "t": "Space Station Silicon Valley", "y": 1999, "dv": "Rockstar North", "p": "Take 2 Interactive", "g": "Action, Plateforme", "r": 0, "img": "n64/073.webp", "shot": "shots/n64/073.webp", "d": "Space Station : Silicon Valley est un jeu de plates-formes sur Nintendo 64. Silicon Valley a été créé pour être technologiquement le plus évolué des parcs d'attractions spatiaux jamais réalisé. Peu de temps après son décollage, il disparaissait. De nos jours, en l'an 3000, la station est de retour après une collision avec la Terre. C'est maintenant à vous de conquérir les 30 niveaux dans 4 environnements. Prenez le contrôle de plus de 30 personnages et résolvez les énigmes de la Vallée."}, {"id": "n64_074", "s": "n64", "n": 74, "t": "Star Wars - Episode I - Battle for Naboo", "y": 2001, "dv": "Lucasarts", "p": "Lucasarts", "g": "Tir, Action, Simulation", "r": 0, "img": "n64/074.webp", "shot": "shots/n64/074.webp", "d": "Star Wars : Battle for Naboo est un jeu d'action et de simulation sur Nintendo 64. Le jeu vous plonge dans l'univers de l'Episode I de Star Wars et vous propose de voler à la rescousse de la petite planète menacée par la sinistre Fédération du Commerce. Vous incarnez le Lieutenant Gavyn Sykes des Royal Security Forces de Naboo et volez à bord de nombreux vaisseaux et speeders différents."}, {"id": "n64_075", "s": "n64", "n": 75, "t": "Star Wars - Episode I - Racer", "y": 1999, "dv": "Lucasarts", "p": "Nintendo", "g": "Course, Conduite", "r": 1, "img": "n64/075.webp", "shot": "shots/n64/075.webp", "d": "Nombreux sont ceux à avoir été scotchés par la course de pods d'Episode I. LucasArts l'a bien compris et c'est ainsi qu'est né Star Wars Episode I : Racer sur Nintendo 64. Participez à des courses aux quatre coins de la galaxie pour remporter un maximum d'argent et améliorer votre bolide ultra rapide."}, {"id": "n64_076", "s": "n64", "n": 76, "t": "Star Wars - Rogue Squadron", "y": 1999, "dv": "Nintendo", "p": "Lucasarts", "g": "Tir, Action", "r": 1, "img": "n64/076.webp", "shot": "shots/n64/076.webp", "d": "Star Wars : Rogue Squadron est un jeu d'action sur Nintendo 64. Vous jouez le rôle de Luke Skywalker. Avec vos équipiers, vous venez de détruire la terrible Etoile Noire, le repère des troupes de l'Empire. Mais, ce dernier est en train de rassembler toutes ses forces afin de porter une attaque massive sur les forces rebelles. Pour stopper cette contre-offensive, l'escadron Rogue est normé, qui rassemble les meilleurs pilotes de l'Alliance."}, {"id": "n64_077", "s": "n64", "n": 77, "t": "Star Wars - Shadows of the Empire", "y": 1997, "dv": "Nintendo", "p": "Lucasarts", "g": "Action", "r": 1, "img": "n64/077.webp", "shot": "shots/n64/077.webp", "d": "Star Wars : Shadows of the Empire est un jeu d'action sur Nintendo 64. Le soft est divisé en quatre parties différentes qui retracent toutes des parties des divers films Star Wars. Vous incarnez Dash Rendar et vous devez, en compagnie de Luke Skywalker, sauver la jolie princesse Leïa qui est retenue prisonnière par le méchant prince Xizor."}, {"id": "n64_078", "s": "n64", "n": 78, "t": "Super Mario 64", "y": 1997, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme, Action", "r": 4, "img": "n64/078.webp", "shot": "shots/n64/078.webp", "d": "Cette incroyable aventure comprend des combats impitoyables, des niveaux remplis d'obstacles et des explorations sous-marines... Récupérez toutes les étoiles de puissance et affrontez votre ennemi de toujours: Bowser, Roi des Koopas!"}, {"id": "n64_079", "s": "n64", "n": 79, "t": "Super Smash Bros.", "y": 1999, "dv": "Hal Laboratory", "p": "Hal Laboratory", "g": "Action, Combat", "r": 3, "img": "n64/079.webp", "shot": "shots/n64/079.webp", "d": "Super Smash Bros. est un jeu de combat sur Nintendo 64. Vous incarnez l'un des 8 personnages principaux et pouvez en débloquer 4 cachés. Vous retrouvez donc avec joie tous les petits personnages de l'univers de Nintendo : Mario, Link, Yoshi, Kirby, Donkey kong et les autres. Le jeu propose un mode solo ainsi qu'un mode multijoueur jouable jusqu'à 4 joueurs."}, {"id": "n64_080", "s": "n64", "n": 80, "t": "Tarzan", "y": 2000, "dv": "Activision", "p": "Activision", "g": "Plateforme, Action", "r": 0, "img": "n64/080.webp", "shot": "shots/n64/080.webp", "d": "Tarzan est un jeu de plates-formes sur Nintendo 64. Enfilez votre fidèle slip en peau de bête car Tarzan est de retour et c'est à vous que revient le privilège de le contrôler. Vous allez devoir traverser de nombreux niveaux en évitant tous les obstacles qui se dressent sur votre route. Le soft est exclusivement solo."}, {"id": "n64_081", "s": "n64", "n": 81, "t": "Tetrisphere", "y": 1997, "dv": "H20 Interactive", "p": "Nintendo", "g": "Puzzle-Game, Puzzle-Game / Tomber, Course, Conduite", "r": 0, "img": "n64/081.webp", "shot": "shots/n64/081.webp", "d": "Tetrisphère est un puzzle-game sur Nintendo 64. Ainsi vous voici plongé dans une version particulière de Tetris. L'objectif principal est de déplacer différentes formes autour d'une sphère dans le but d'effacer des couches de formes pour atteindre le coeur de la sphère."}, {"id": "n64_082", "s": "n64", "n": 82, "t": "The Legend of Zelda : Majora's Mask", "y": 2000, "dv": "Nintendo", "p": "Nintendo", "g": "Action, Action / Aventure, Jeu De Rôles", "r": 3, "img": "n64/082.webp", "shot": "shots/n64/082.webp", "d": "Une période de troubles. L'océan s'assombrit, les déserts sont infestés de spectres et la lune tombe du ciel. Vous n'avez que trois jours pour arrêter l'apocalypse..."}, {"id": "n64_083", "s": "n64", "n": 83, "t": "The Legend of Zelda : Ocarina of Time", "y": 1998, "dv": "Nintendo", "p": "Nintendo", "g": "Action, Action / Aventure, Jeu De Rôles", "r": 4, "img": "n64/083.webp", "shot": "shots/n64/083.webp", "d": "Et le rêve devient réalité... Mythes, légendes et magie... Plongez au cœur de la légende de Zelda, la série d'aventures la plus connue de tous les temps! Impossible de rompre le charme de cette épopée imaginaire ou de résister à la magie de la magnifique Zelda... La quête de la Triforce d'or, clé du Royaume Sacré, vous conduira dans un monde fantastique, baigné de mystère, dans lequel vous rencontrerez des créatures effrayantes et des êtres surnaturels."}, {"id": "n64_084", "s": "n64", "n": 84, "t": "The New Tetris", "y": 1999, "dv": "Blue Planet Software", "p": "Nintendo", "g": "Puzzle-Game / Tomber, Puzzle-Game", "r": 0, "img": "n64/084.webp", "shot": "shots/n64/084.webp", "d": "The New Tetris sur Nintendo 64 est le célèbre puzzle-game dans lequel il vous faut empiler des briques afin de constituer des lignes qui s'effaceront au fur et à mesure de votre progression. La difficulté est croissante au fil de votre évolution, tout comme le rythme."}, {"id": "n64_085", "s": "n64", "n": 85, "t": "Tony Hawk's Pro Skater 2", "y": 2001, "dv": "Edge Of Reality", "p": "Activision", "g": "Sport / Skateboard, Sport", "r": 1, "img": "n64/085.webp", "shot": "shots/n64/085.webp", "d": "Tony Hawk's Pro Skater 2 sur Nintendo 64 est un jeu de sport proposant trois modes de jeu : Carrière (relevez les défis pour débloquer skates, personnages et tricks), Sessions simples ou Entraînement. Ce second opus des aventures aériennes de Tony intègre un éditeur de parcs pour créer des terrains de jeu à la mesure des inspirations de chacun."}, {"id": "n64_086", "s": "n64", "n": 86, "t": "Tony Hawk's Skateboarding", "y": 2001, "dv": "Edge Of Reality", "p": "Activision", "g": "Sport, Sport / Skateboard", "r": 1, "img": "n64/086.webp", "shot": "shots/n64/086.webp", "d": "Tony Hawk's Skateboarding sur Nintendo 64 est une simulation de sport proposant 4 modes de jeu : Carrer mode, 2 players, Single session et Practice mode. Dans une école, un entrepôt ou dans les rues de San Francisco, tout est prétexte à enfourcher votre bonne vieille planche à roulettes. Enchaînez les tricks pour débloquer les skates et personnages disponibles."}, {"id": "n64_087", "s": "n64", "n": 87, "t": "Top Gear Hyper-Bike", "y": 2000, "dv": "Snowblind Studios", "p": "Kemco", "g": "Course, Conduite / Moto, Course, Conduite", "r": 0, "img": "n64/087.webp", "shot": "shots/n64/087.webp", "d": "Disponible sur Nintendo 64, Top Gear Hyperbike est un jeu de courses de motos. Proposant une gamme variée de véhicules, le jeu se veut le plus accessible possible en proposant de changer de moto selon le circuit sur lequel vous concourez. En gagnant des points grâce à vos tricks, vous pourrez débloquer et customiser vos machines mais vous aurez également la possibilité de créer vos circuits à l'aide d'un éditeur."}, {"id": "n64_088", "s": "n64", "n": 88, "t": "Top Gear Rally", "y": 1997, "dv": "Boss Game Studios", "p": "Boss Game Studios", "g": "Course, Conduite", "r": 0, "img": "n64/088.webp", "shot": "shots/n64/088.webp", "d": "Top Gear Rally est un jeu de courses sur Nintendo 64. Que vos pneus crissent dans un virage en épingle ou qu'ils glissent sur le verglas d'une route de montagne, Top Gear Rally vous fera vivre l'excitation d'une course en 3D. Avec 80 courses, 3 ligues, 5 modes de jeu, dont un mode deux joueurs, les défis vous attendent à chaque tournant."}, {"id": "n64_089", "s": "n64", "n": 89, "t": "Top Gear Rally 2", "y": 2000, "dv": "Saffire", "p": "Kemco", "g": "Course, Conduite, Combat", "r": 0, "img": "n64/089.webp", "shot": "shots/n64/089.webp", "d": "A travers le désert, la jungle, les montagnes, ou les routes escarpées, appuyez sur le champignon dans Top Gear Rally 2 sur Nintendo 64. Ce jeu de courses propose la conduite de quatorze véhicules sur cinquante circuits différents. Pilotez comme un chef en évitant les obstacles qui se trouvent devant vous. Et si vous avez besoin d'aide, une auto-école est là pour vous apprendre toutes les ficelles du métier de pilote de rallye."}, {"id": "n64_090", "s": "n64", "n": 90, "t": "Turok 2 : Seeds Of Evil", "y": 1998, "dv": "Iguana Entertainment", "p": "Acclaim", "g": "Tir, Tir / 1Ere Personne, Shoot'em Up", "r": 1, "img": "n64/090.webp", "shot": "shots/n64/090.webp", "d": "Turok revient dans une nouvelle aventure incroyable: il se retrouve au fin fond d'un monde dément où règne la violence, dans le seul but de retrouver et de détruire le Primagen. Ce jeu met en scène une grande variété d'ennemis horribles, de nouvelles armes explosives et un match à mort multijoueur à vous couper le souffle..."}, {"id": "n64_091", "s": "n64", "n": 91, "t": "Turok: Dinosaur Hunter", "y": 1997, "dv": "Iguana Entertainment", "p": "Acclaim", "g": "Tir, Tir / 1Ere Personne, Shoot'em Up", "r": 1, "img": "n64/091.webp", "shot": "shots/n64/091.webp", "d": "Le flambeau doit être passé. Vous êtes devenu le Protecteur de la Terre. Vous êtes désormais Turok, le chasseur de dinosaures. Faites à nouveau des dinosaures une race éteinte!"}, {"id": "n64_092", "s": "n64", "n": 92, "t": "Wave Race 64", "y": 1997, "dv": "Nintendo", "p": "Nintendo", "g": "Course, Conduite", "r": 2, "img": "n64/092.webp", "shot": "shots/n64/092.webp", "d": "Wave Race 64 sur Nintendo 64 est un jeu de courses aquatiques. Quatre pilotes sont disponibles : Ryota, Dave, Ayumi et Miles, qui s'affrontent dans des décors variés. Le titre a la particularité de proposer de changer la force des vagues et la météo, qui influent sur le pilotage. Quatre modes de jeu sont présentés : course, contre la montre, saut et multijoueur. De quoi ravir les amateurs en manque de sensations fortes."}, {"id": "n64_093", "s": "n64", "n": 93, "t": "WCW nWo Revenge", "y": 1998, "dv": "Asmik", "p": "Asmik", "g": "Sport / Lutte, Sport, Combat", "r": 0, "img": "n64/093.webp", "shot": "shots/n64/093.webp", "d": "Wcw Vs Nwo Revenge est un jeu de catch sur Nintendo 64. Comme son prédécesseur, le soft propose avec des graphismes à couper le souffle, un mode Championnat amélioré ainsi qu'une grande base de données de lutteurs professionnels."}, {"id": "n64_094", "s": "n64", "n": 94, "t": "Wipeout 64", "y": 1998, "dv": "Midway", "p": "Midway", "g": "Course, Conduite", "r": 0, "img": "n64/094.webp", "shot": "shots/n64/094.webp", "d": "WipEout 64 sur Nintendo 64 est un jeu de courses qui vous entraîne sur des pistes aux tracés remarquables. Aux commandes de véhicules capables d'atteindre des vitesses fulgurantes, vous devez ramasser le plus d'armes possible traînant sur le circuit pour en découdre avec vos adversaires."}, {"id": "n64_095", "s": "n64", "n": 95, "t": "World Driver Championship", "y": 1999, "dv": "Boss Game Studios", "p": "Midway", "g": "Course, Conduite", "r": 0, "img": "n64/095.webp", "shot": "shots/n64/095.webp", "d": "World Driver Championship est un jeu de courses sur Nintendo 64. Choisissez parmi 30 voitures disponibles et partez à l'assaut de la multitude de pistes du jeu."}, {"id": "n64_096", "s": "n64", "n": 96, "t": "Worms Armageddon", "y": 1999, "dv": "Team 17", "p": "Infogrames", "g": "Stratégie", "r": 0, "img": "n64/096.webp", "shot": "shots/n64/096.webp", "d": "Worms Armageddon sur Nintendo 64 est un jeu d'action stratégique mettant en scène des équipes de vers de terre combattant dans un environnement en 2D. A tour de rôle, chaque équipe joue un ver qui doit harceler les équipes adverses grâce à son arsenal d'armes, le but consistant à être le dernier survivant à la fin de la partie dans une ambiance loufoque et décalée."}, {"id": "n64_097", "s": "n64", "n": 97, "t": "WWF No Mercy", "y": 2000, "dv": "Aki Corporation", "p": "Thq", "g": "Sport / Lutte, Sport", "r": 0, "img": "n64/097.webp", "shot": "shots/n64/097.webp", "d": "WWF No Mercy est un jeu de combat sur Nintendo 64 dans lequel le joueur peut se battre pour sept titres WWF différents, chaque tournoi possédant sa propre histoire. Jusqu'à quatre joueurs peuvent s'affronter dans différents modes de jeu. Il est également possible de créer son propre mode et son tournoi personnalisé, en arène ou encore en cage."}, {"id": "n64_098", "s": "n64", "n": 98, "t": "WWF WrestleMania 2000", "y": 1999, "dv": "Aki Corporation", "p": "Thq", "g": "Sport, Sport / Lutte, Combat", "r": 0, "img": "n64/098.webp", "shot": "shots/n64/098.webp", "d": "WWF Wrestlemania 2000 est un jeu de combat sur Nintendo 64. Incarnez l'une des stars du catch disponibles dans le jeu et partez affronter vos ennemis sur le ring."}, {"id": "n64_099", "s": "n64", "n": 99, "t": "Xena : Princesse Guerrière - The Talisman of Fate", "y": 1999, "dv": "Saffire", "p": "Titus", "g": "Combat", "r": 0, "img": "n64/099.webp", "shot": "shots/n64/099.webp", "d": "Xena : Princesse Guerrière : The Talisman of Fate est un jeu d'action sur Nintendo 64. Reprenant tous les ingrédients de la série, ce titre permet aux fans de se glisser dans la peau de leurs personnages préférés. Ainsi 11 combattants ont été regroupés parmi lesquels vous retrouvez bien évidemment Xena, mais aussi la belle Gabrielle, César, Ephiny, Ares, Velasca, Callisto, Joxer, Autoclycus, ainsi que d'autres intervenants cachés."}, {"id": "n64_100", "s": "n64", "n": 100, "t": "Yoshi's Story", "y": 1998, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme, Action, Jeu De Rôles", "r": 1, "img": "n64/100.webp", "shot": "shots/n64/100.webp", "d": "Bébé Bowser a pris l'Arbre Magique du Bonheur et a transformé le monde des Yoshis en un livre d'images! Les seuls Yoshis épargnés par le maléfice étaient six frères d'une même portée, encore protégés par leur épaisse coquille. Ils doivent à tout prix sauver l'Arbre Magique du Bonheur! Ce n'est qu'en restaurant la joie que le puissant sortilège de Bowser sera brisé!"}, {"id": "psx_001", "s": "psx", "n": 1, "t": "4x4 World Trophy", "y": 2000, "dv": "Infogrames", "p": "Infogrames", "g": "Course, Conduite", "r": 0, "img": "psx/001.webp", "shot": "shots/psx/001.webp", "d": "4x4 World Trophy est un jeu de courses sur Playstation. 27 véhicules customisables sont disponibles (Jeep Wrangler, Cherokee, Dodge Ram Charger, Hummer...) pour découvrir des environnements pour le moins accidentés, de la Sierra Nevada aux Rocheuses canadiennes en passant par les marécages de Louisiane. Deux pilotes peuvent s'affronter en mode écran partagé."}, {"id": "psx_002", "s": "psx", "n": 2, "t": "Ace Combat 2", "y": 1997, "dv": "Namco", "p": "Namco", "g": "Tir / Avion, 3Eme Personne, Tir, Simulation / Véhicules, Simulation", "r": 0, "img": "psx/002.webp", "shot": "shots/psx/002.webp", "d": "Ace Combat 2 sur Playstation est le deuxième opus du jeu qui vous place aux commandes d'un avion de chasse. Vous incarnez ici un mercenaire engagé par des gouvernements pour lutter contre des terroristes. L'argent récolté lors de l'accomplissement des 30 missions servira à acheter armes et équipement."}, {"id": "psx_003", "s": "psx", "n": 3, "t": "Ace Combat 3 : Electrosphere", "y": 2000, "dv": "Namco", "p": "Namco", "g": "Simulation, Simulation / Véhicules, Tir / Avion, 3Eme Personne, Tir", "r": 0, "img": "psx/003.webp", "shot": "shots/psx/003.webp", "d": "Ace Combat 3 : Electrosphere est un jeu d'avion orienté arcade sur Playstation. Dans le futur proche, deux entreprises supranationales se livrent une guerre économique sans merci... jusqu'à ce que le champ de bataille devienne bien réel. C'est là que vous intervenez. Aux commandes d'un avion de chasse, vous êtes chargé de rétablir la paix. 16 appareils aux caractéristiques différentes (blindage, maniabilité, vitesse) sont disponibles."}, {"id": "psx_004", "s": "psx", "n": 4, "t": "Actua Pool", "y": 1999, "dv": "Infogrames", "p": "Gremlin Interactive", "g": "Sport, Sport / Billard", "r": 0, "img": "psx/004.webp", "shot": "shots/psx/004.webp", "d": "Les meilleures tables de billard vous attendent sur Playstation avec Actua Pool. Préparez-vous à affronter seize adversaires dans les huit clubs les plus élitistes de la ville. Jouez au Jeu de la 8 et au Jeu de la 9 avec les règles officielles. Participez à plusieurs modes différents et mesurez-vous jusqu'à 4 en multi."}, {"id": "psx_005", "s": "psx", "n": 5, "t": "Adibou et L'Ombre Verte", "y": 2001, "dv": "Coktel", "p": "Coktel", "g": "Ludo-Educatif", "r": 0, "img": "psx/005.webp", "shot": "shots/psx/005.webp", "d": "Véritable star des 4-7 ans, Adibou arrive en 2001 sur Playstation. Coktel propose à cette occasion un jeu plus orienté vers l'aventure, sans pour autant négliger les bases qui ont fait le succès de la série."}, {"id": "psx_006", "s": "psx", "n": 6, "t": "Agent Armstrong", "y": 1997, "dv": "King Of The Jungle", "p": "Virgin Interactive", "g": "Plateforme", "r": 0, "img": "psx/006.webp", "shot": "shots/psx/006.webp", "d": "Agent Armstrong sur Playstation est un jeu de plates-formes/action. Vous incarnez ici le brave agent Armstrong qui luttera grâce à son panel d'armes à travers 30 niveaux contre un syndicat qui veut conquérir le monde. Vous traversez 4 continents avec chacun leur patte visuelle propre et affronterez des boss tous les 5 niveaux."}, {"id": "psx_007", "s": "psx", "n": 7, "t": "All Star Tennis '99", "y": 1998, "dv": "Smartdog", "p": "Ubisoft", "g": "Sport, Sport / Tennis", "r": 0, "img": "psx/007.webp", "shot": "shots/psx/007.webp", "d": "Yannick Noah All Star Tennis '99 est un jeu de tennis sur Playstation. Vous contrôlez un des 8 plus grands joueurs mondiaux de tennis en 1999 parmi lesquels on retrouve Mark Philippoussis, Richard Krajicek, Conchita Martinez et Jana Novotna, ainsi que 4 joueurs de fiction. Les matchs se déroulent sur terre battue, gazon, sol dur et autres et vous pourrez effectuer des lobs, volées et smashs dans des tournois qui peuvent se disputer à plusieurs."}, {"id": "psx_008", "s": "psx", "n": 8, "t": "Alone in the Dark : The New Nightmare", "y": 2001, "dv": "Darkworks", "p": "Infogrames", "g": "Aventure, Aventure / Survival Horror", "r": 0, "img": "psx/008.webp", "shot": "shots/psx/008.webp", "d": "The New Nightmare sur Playstation est le quatrième volet de la série Alone In The Dark. Vous incarnez Edward Carnby, maître dans l'étude du paranormal, qui enquête sur la mort mystérieuse de son meilleur ami. Vous menez votre investigation sur Shadow Island, une île pas vraiment réputée pour son atmosphère enchanteresse. Il est également possible de vivre l'aventure à travers les yeux du personnage principal féminin."}, {"id": "psx_009", "s": "psx", "n": 9, "t": "Alundra", "y": 1998, "dv": "Matrix Software", "p": "Psygnosis", "g": "Jeu De Rôles", "r": 0, "img": "psx/009.webp", "shot": "shots/psx/009.webp", "d": "The Adventures of Alundra est un jeu d'action/aventure sur Playstation. Vous incarnez Alundra, un jeune héros qui a le pouvoir d'entrer dans les rêves. Votre mission est de vous rendre dans un village troublé où vous devrez aider les habitants à combattre les forces du mal."}, {"id": "psx_010", "s": "psx", "n": 10, "t": "Ape Escape", "y": 1999, "dv": "Sony Computer Entertainment", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 1, "img": "psx/010.webp", "shot": "shots/psx/010.webp", "d": "Ape Escape est un jeu de plates-formes sorti sur Playstation. Spike est un jeune garçon espiègle qui se retrouve projeté dans le passé à cause du grand singe Specter. Vous devrez retrouver tous les singes disparus dans le passé et les attraper."}, {"id": "psx_011", "s": "psx", "n": 11, "t": "Armored Core", "y": 1998, "dv": "From Software", "p": "Sony Computer Entertainment", "g": "Tir / Vehicule, 3Eme Personne, Tir", "r": 0, "img": "psx/011.webp", "shot": "shots/psx/011.webp", "d": "Armored Core sur Playstation est un jeu d'action vous mettant aux commandes d'un robot géant qui participe à une guerre entre les deux plus grandes cités restantes sur Terre : Chrome et Murakumo Millenium. Cependant, vous n'êtes pas directement impliqué dans ce conflit puisque vous êtes un mercenaire que l'on va engager pour combattre l'un ou l'autre des deux clans. C'est le premier jeu de la longue série des Armored Core."}, {"id": "psx_012", "s": "psx", "n": 12, "t": "Army Men : Air Attack", "y": 2000, "dv": "The 3DO Company", "p": "The 3DO Company", "g": "Tir", "r": 0, "img": "psx/012.webp", "shot": "shots/psx/012.webp", "d": "La guerre entre les différentes troupes de soldats de plastique continue de faire rage et beaucoup de soldats sont laissés blessés sur le champ de bataille. A bord de votre hélicoptère, survolez les lieux pour récupérer vos camarades et sauvez leur vie. Voilà la noble mission proposée par le jeu d'action Army Men : Air Attack sur Playstation. Notez qu'il est possible de jouer en coopératif à deux joueurs."}, {"id": "psx_013", "s": "psx", "n": 13, "t": "Army Men : Sarge's Heroes", "y": 2000, "dv": "The 3DO Company", "p": "The 3DO Company", "g": "Tir", "r": 0, "img": "psx/013.webp", "shot": "shots/psx/013.webp", "d": "Army Men : Sarge's Heroes sur Playstation est un jeu d'action à la troisième personne. Vous incarnez le soldat (en plastique vert !) Sarge, et devez livrer bataille contre les Beige, sur leur territoire. Vous combattez l'infanterie mais aurez aussi à éliminer l'artillerie lourde et les engins volants."}, {"id": "psx_014", "s": "psx", "n": 14, "t": "Army Men : Sarge's Heroes 2", "y": 2000, "dv": "The 3DO Company", "p": "The 3DO Company", "g": "Tir", "r": 0, "img": "psx/014.webp", "shot": "shots/psx/014.webp", "d": "Infatigables, les soldats de plastique déclinent une nouvelle fois leur guerre fratricide opposant les soldats verts aux soldats beiges. Dans le jeu d'action Army Men : Sarge's Heroes 2 sur Playstation, les beiges se sont aussi associés aux bleus. Du coup, K Sarge, le leader vert doit désormais affronter un ennemi deux fois plus fort que dans le passé."}, {"id": "psx_015", "s": "psx", "n": 15, "t": "Assault Rigs", "y": 1996, "dv": "Sony Computer Entertainment", "p": "Sony Computer Entertainment", "g": "", "r": 0, "img": "psx/015.webp", "shot": "shots/psx/015.webp", "d": "Assault Rigs sur Playstation est un jeu d'action vous mettant aux commandes d'un tank évoluant dans des sortes d'arènes, votre but étant de tout détruire sur votre passage ! De très nombreuses améliorations sont disponibles au fil du jeu pour augmenter la puissance de vos tirs, ainsi que leur comportement, vous pouvez tirer des obus qui rebondissent par exemple !"}, {"id": "psx_016", "s": "psx", "n": 16, "t": "Bloody Roar 2 : Bringer of the New Age", "y": 1999, "dv": "Eighting", "p": "Sony Computer Entertainment", "g": "Combat, Combat / 3D", "r": 0, "img": "psx/016.webp", "shot": "shots/psx/016.webp", "d": "Dans la série Bloody Roar, vos combattants peuvent se transformer en versions animales d'eux-mêmes : des hybrides humains-animaux assoiffés de violence. Au cours de chaque round, vous pouvez vous battre en tant qu'humain ou vous transformer en bête lorsque votre jauge de bestialité se remplit. Dans cette forme animale, vous aurez de nouveaux coups et plus de puissance pour terrasser votre adversaire. Cet épisode 2 apporte des graphismes améliorés et des modes de jeu plus variés."}, {"id": "psx_017", "s": "psx", "n": 17, "t": "Breath of Fire III", "y": 1998, "dv": "Capcom", "p": "Infogrames", "g": "Jeu De Rôles", "r": 0, "img": "psx/017.webp", "shot": "shots/psx/017.webp", "d": "Peuplé d'humains et d'animaux anthropomorphiques, le monde connaît de nombreux progrès scientifiques grâce à la découverte du Chrys, un minerai rare aux propriétés magiques trouvé sur les restes fossilisés de dragons. Cependant, les formes supérieures de technologie, telles que les robots et autres machines complexes, sont pour la plupart retrouvées hors service, rejetées par la mer sur diverses plages du monde pour une raison inconnue. Le jeu se déroule dans un monde imaginaire en compagnie de Ryu, un jeune garçon doté de l'étrange capacité de se transformer en dragon, qui doit découvrir la vérité sur ses origines et retrouver ses amis disparus, Rei et Teepo. Le scénario se présente en deux parties : une première concernant l'enfance de Ryu et une seconde son adolescence. Il est accompagné de nombreux alliés qui l'aideront durant le voyage qui les mènera à travers le monde pour finalement affronter une déesse machiavélique."}, {"id": "psx_018", "s": "psx", "n": 18, "t": "Breath of Fire IV", "y": 2001, "dv": "Capcom", "p": "Capcom", "g": "Jeu De Rôles", "r": 0, "img": "psx/018.webp", "shot": "shots/psx/018.webp", "d": "L'histoire débute dans le désert, où la princesse du royaume de Wyndia, Nina, et Cray, un homme bête,se font attaquer par un dragon alors qu'ils sont partis à la recherche d'Elina, la sœur ainée de Nina (et accessoirement dulcinée de Cray) qui a mystérieusement disparu au cours d'un voyage vers l'Empire. Leur moyen de transport anéanti, Nina décide donc de partir seule vers la ville la plus proche pour chercher les pièces nécessaires à la réparation, Cray gardant ce qu'il reste... En chemin, Nina se retrouve nez à nez avec un dragon qui s'enfuit aussitôt, laissant un garçon nu, Ryu, qui semble avoir perdu toute trace de mémoire... Ryu décide d'accompagner Nina dans sa quête des pièces du vaisseau. Mais très vite il va apparaitre que Ryu est recherché par l'empire. Pourquoi ? Dans quel but ? Et cela a t-il un lien avec la mission que mène l'Empire pour tuer un dénommé Fou-lu, qui dispose de pouvoir fascinant ? Vous le saurez très vite..."}, {"id": "psx_019", "s": "psx", "n": 19, "t": "Bust-A-Groove", "y": 1998, "dv": "Enix", "p": "Sony Computer Entertainment", "g": "Musique Et Danse", "r": 0, "img": "psx/019.webp", "shot": "shots/psx/019.webp", "d": "Bust A Groove est un jeu de rythme sur Playstation. Vous êtes dans la peau de l'un des dix meilleurs danseurs du monde et vous devez défier vos homologues dans des duels dansant. Si vous avez le rythme dans le sang, la victoire est quasiment assurée !"}, {"id": "psx_020", "s": "psx", "n": 20, "t": "Castlevania : Symphony of the Night", "y": 1997, "dv": "Konami", "p": "Konami", "g": "Plateforme", "r": 3, "img": "psx/020.webp", "shot": "shots/psx/020.webp", "d": "Retour de la légende. Réveillé de son sommeil éternel par la réapparition de Castlevania, Alucard doit une fois de plus affronter les laquais malfaisants du Prince des ténèbres. Grâce à ton pouvoir de vampire et grâce aux armes, potions et autres reliques magiques que tu trouveras sur ton chemin, fais tout ton possible pour renverser l'issue de la bataille. Cette aventure mêle l'action et le jeu de rôle et comprend de nombreuses zones cachées et de nombreux secrets. Seras-tu capable de tous les retrouver?"}, {"id": "psx_021", "s": "psx", "n": 21, "t": "Colin McRae Rally", "y": 1998, "dv": "Codemasters", "p": "Codemasters", "g": "Course, Conduite", "r": 0, "img": "psx/021.webp", "shot": "shots/psx/021.webp", "d": "Colin McRae Rally est un jeu de courses sorti sur Playstation. Si les circuits ne sont pas votre fort et que la ville vous agace, alors vous allez adorer les circuits de rallye de ce jeu sponsorisé par le célèbre champion Colin McRae."}, {"id": "psx_022", "s": "psx", "n": 22, "t": "Colin McRae Rally 2.0", "y": 2000, "dv": "Codemasters", "p": "Codemasters", "g": "Course, Conduite", "r": 0, "img": "psx/022.webp", "shot": "shots/psx/022.webp", "d": "Colin McRae Rally 2.0 sur Playstation est un jeu de courses proposant de prendre les commandes de 13 véhicules (dont la ford Focus, la Subaru Impreza, et la Peugeot 205 turbo) à travers 8 pays et 80 étapes. Relevez les challenges proposés pour en recevoir de nouveaux plus ardus et terminez par le mode expert. Seul ou jusqu'à 5 joueurs simultanément, peaufinez vos trajectoires pour obtenir le meilleur chrono."}, {"id": "psx_023", "s": "psx", "n": 23, "t": "Command & Conquer : Red Alert", "y": 1997, "dv": "Westwood", "p": "Virgin Interactive", "g": "Stratégie", "r": 0, "img": "psx/023.webp", "shot": "shots/psx/023.webp", "d": "Command & Conquer : Alerte Rouge est un jeu de stratégie sorti sur Playstation. La Seconde Guerre mondiale n'a jamais eu lieu et l'URSS est devenue aussi puissante que les Etats-Unis. La guerre fait rage et vous pourrez choisir entre les deux blocs pour vous affronter entre amis ou suivre les campagnes solos."}, {"id": "psx_024", "s": "psx", "n": 24, "t": "Crash Bandicoot", "y": 1996, "dv": "Naughty Dog", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 3, "img": "psx/024.webp", "shot": "shots/psx/024.webp", "d": "Allez faire un tour dans les îles avec Crash Bandicoot, le bandicoot hyperactif! Traversez des gouffres enflammés, naviguez sur le fleuve et battez-vous, à cheval sur le petit cochon sauvage, contre toutes sortes de bestioles et de marsupiaux militants des antipodes."}, {"id": "psx_025", "s": "psx", "n": 25, "t": "Crash Bandicoot 2 : Cortex Strikes Back", "y": 1997, "dv": "Naughty Dog", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 3, "img": "psx/025.webp", "shot": "shots/psx/025.webp", "d": "Le terrible Dr. Neo Cortex est de retour... est-ce pour sauver le monde cette fois-ci? Et il veut l'aide de son ennemi juré, Crash Bandicoot! Est-ce une machination pour attirer Crash dans une des ignobles expériences de Cortex? Crash triomphera-t-il encore une fois ou finira-t-il par faire partie du zoo de créatures stupides de Cortex?"}, {"id": "psx_026", "s": "psx", "n": 26, "t": "Crash Bandicoot 3 : Warped", "y": 1998, "dv": "Naughty Dog", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 2, "img": "psx/026.webp", "shot": "shots/psx/026.webp", "d": "Plongés dans des décors inédits et aux commandes de tout nouveaux véhicules, des personnages détraqués rejoignent Crash Bandicoot dans une course à travers le temps pour sauver le monde!"}, {"id": "psx_027", "s": "psx", "n": 27, "t": "Crash Bash", "y": 2000, "dv": "Eurocom Developments", "p": "Sony Computer Entertainment", "g": "Casual Game, Plateforme", "r": 0, "img": "psx/027.webp", "shot": "shots/psx/027.webp", "d": "Crash Bash est un party game sur Playstation reprenant l'univers de Crash Bandicoot. Très orienté multijoueur, le titre permet à quatre amis de s'affronter simultanément. Il s'agit de choisir son avatar parmi les huit personnages disponibles puis de participer à l'un des sept mini-jeux proposés, chacun étant décliné en quatre versions différentes."}, {"id": "psx_028", "s": "psx", "n": 28, "t": "Crash Team Racing", "y": 1999, "dv": "Naughty Dog", "p": "Sony Computer Entertainment", "g": "Course, Conduite", "r": 1, "img": "psx/028.webp", "shot": "shots/psx/028.webp", "d": "Que le meilleur gagne! Dans ce jeu, amis et ennemis s'affrontent sur la piste pour remporter le prix suprême: la planète Terre!! Face à Nitros Oxide, son plus grand ennemi à ce jour, Crash Bandicoot est obligé de demander l'aide des ses vieux ennemis. Tous tes personnages préférés doivent alors s'allier dans cette aventure de course de karts ultra-rapide et ultra-prenante!"}, {"id": "psx_029", "s": "psx", "n": 29, "t": "Croc : Legend of the Gobbos", "y": 1997, "dv": "Argonaut Software", "p": "Fox Interactive", "g": "Plateforme", "r": 0, "img": "psx/029.webp", "shot": "shots/psx/029.webp", "d": "Croc est un jeu de plates-formes en 3D sur Playstation dans lequel vous incarnez Croc le crocodile dont les amis gobelins ont été enlevés par l'ignoble Dante Baron. Partez à la recherche de vos amis tout au long des 42 niveaux afin de les retrouver avant qu'il ne soit trop tard."}, {"id": "psx_030", "s": "psx", "n": 30, "t": "Destruction Derby 2", "y": 1997, "dv": "Reflections", "p": "Psygnosis", "g": "Course, Conduite", "r": 0, "img": "psx/030.webp", "shot": "shots/psx/030.webp", "d": "Destruction Derby 2 est un jeu de courses musclées sur Playstation. Vous pouvez conduire de nombreux véhicules qui seront réduits à néant lors des courses puisque dans ce jeu personne ne vous fera de cadeau. Le soft vous propose 7 circuits, 4 arènes de destruction ainsi qu'un mode multijoueur en écran séparé."}, {"id": "psx_031", "s": "psx", "n": 31, "t": "Dino Crisis", "y": 1999, "dv": "Capcom", "p": "Virgin Interactive", "g": "Aventure, Aventure / Survival Horror", "r": 1, "img": "psx/031.webp", "shot": "shots/psx/031.webp", "d": "Vous êtes Regina, un agent secret envoyé en mission sur une île coupée du monde à la recherche d'un professeur menant des expériences bien étranges. Vous découvrirez très vite que cette île est, en réalité, infestée de dinosaures assoiffés de chair et de sang! Il vous faudra déjouer des énigmes parfois difficiles ainsi que maîtriser totalement votre déplacement pour affronter des hordes de dinosaures qui ont une seule idée en tête: vous tailler en morceaux pour mieux vous dévorer..."}, {"id": "psx_032", "s": "psx", "n": 32, "t": "Dino Crisis 2", "y": 2000, "dv": "Capcom", "p": "Capcom", "g": "Aventure, Aventure / Survival Horror, Tir / 3Eme Personne, Tir", "r": 1, "img": "psx/032.webp", "shot": "shots/psx/032.webp", "d": "Ils sont de retour... Plus d'angoisse, plus de dinosaures, plus de panique... Un an s'est écoulé depuis la capture du Dr Kirk et la première aventure dans laquelle Régina luttait pour survivre dans un monde infesté de dinosaures. Des recherches à Edward City sur une nouvelle forme de Tri-énergie ont été poursuivies de manière confidentielle. L'accident était imminent. Edward City disparaît soudain mystérieusement et se voit remplacé par une jungle préhistorique. Une mission de sauvetage commence alors dans le but de récupérer les survivants et les données sur la Tri-énergie. Disposant d'une artillerie lourde, seuls Régina et Dylan ont une idée de ce qui les attend..."}, {"id": "psx_033", "s": "psx", "n": 33, "t": "Disney's Tarzan", "y": 1999, "dv": "Eurocom Developments", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 0, "img": "psx/033.webp", "shot": "shots/psx/033.webp", "d": "Tarzan est un jeu de plates-formes sur Playstation. Enfilez votre fidèle slip en peau de bête car tarzan est de retour et c'est à vous que revient le privilège de le contrôler. Vous allez devoir traverser de nombreux niveaux en évitant tous les obstacles qui se dressent sur votre route. Le soft est exclusivement solo."}, {"id": "psx_034", "s": "psx", "n": 34, "t": "Driver", "y": 1999, "dv": "Reflections", "p": "GT Interactive Software", "g": "Course, Conduite", "r": 1, "img": "psx/034.webp", "shot": "shots/psx/034.webp", "d": "En incarnant Tanner, un flic infiltré dans le syndicat du crime, vous allez devoir accomplir une série de missions où vous aurez à faire preuve de vos talents de pilote pour vous sortir des rues étroites de Miami, des collines tourmentées de San Francisco, des immenses avenues de Los Angeles, ou encore des embouteillages New-Yorkais, avec à vos trousses toutes les patrouilles de la ville. Vous allez vivre une véritable course-poursuite en pleine ville, où vous découvrirez une intrigue à rebondissements faite de corruption et de trahisons, le tout dans une succession de cascades dignes des plus grands classiques d'Hollywood!"}, {"id": "psx_035", "s": "psx", "n": 35, "t": "Driver 2 : Back on the Streets", "y": 2000, "dv": "Reflections Interactive", "p": "Infogrames", "g": "Course, Conduite", "r": 1, "img": "psx/035.webp", "shot": "shots/psx/035.webp", "d": "Comme son prédécesseur, Driver 2 est un jeu de courses et d'action sur PC. Toujours dans la peau de l'inspecteur Tanner, vous devez infiltrer le monde souterrain des criminels en usant de vos compétences de pilote. Les missions se déroulent dans quatre villes différentes : Chicago, Las Vegas, La Havane et Rio. Un mode deux joueurs est implanté."}, {"id": "psx_036", "s": "psx", "n": 36, "t": "Fear Effect", "y": 2000, "dv": "Kronos", "p": "Eidos Interactive", "g": "Aventure", "r": 0, "img": "psx/036.webp", "shot": "shots/psx/036.webp", "d": "Fear Effect est un jeu d'action/aventure profitant de décors précalculés sur Playstation. Avant de pouvoir fêter ses 18 ans, une certaine Wee Ming Lam disparaît dans de mystérieuses circonstances. Des mercenaires souhaitent la retrouver pour rançonner son père, un puissant chef de triade. Au fil de l'histoire, vous incarnerez trois membres d'une même équipe pour tenter de retrouver la jeune fille avant ses poursuivants."}, {"id": "psx_037", "s": "psx", "n": 37, "t": "Final Fantasy IX", "y": 2001, "dv": "Squaresoft", "p": "Squaresoft", "g": "Jeu De Rôles", "r": 1, "img": "psx/037.webp", "shot": "shots/psx/037.webp", "d": "Grâce à sa main mise sur un armement magique extrêmement puissant, la reine Branet d'Alexandrie terrorise les royaumes voisins. Sa fille, la princesse Grenat, décide de s'enfuir du château et devient l'arme d'un groupe de bandits au grand cœur. Leur leader, un voleur talentueux répondant au nom de Djidane, se refuse à accepter les agissements de Branet et décide d'y mettre un terme. Il ne faut hélas que peu de temps à notre groupe d'aventuriers pour découvrir que les menaces de la Reine cachent en réalité un complot bien plus sinistre. Le salut de l'humanité étant en jeu, Djidane et ses amis doivent agir avant que la Reine et ses alliés n'exécutent leur plan diabolique. * Jouez avec huit personnages inoubliables possédant chacun différentes armes, magies et compétences. * Les superbes environnements pré-rendus vous plongeront dans un monde où le mot \"magie\" prend soudain tout son sens ! * Environ une heure de séquences cinématiques à couper le souffle."}, {"id": "psx_038", "s": "psx", "n": 38, "t": "Final Fantasy VII", "y": 1997, "dv": "Squaresoft", "p": "Squaresoft", "g": "Jeu De Rôles", "r": 4, "img": "psx/038.webp", "shot": "shots/psx/038.webp", "d": "La Corporation Shinra pompe toute l'énergie de notre planète. Cloud, un mercenaire impitoyable, accepte une mission pour le compte d'un groupe d'éco-guerriers, sans se douter qu'elle le plongera dans une aventure qui changera non seulement son existence, mais celle de toutes les âmes de l'univers... Bienvenue dans Final Fantasy VII : plongez-vous dans un monde où la sorcellerie et la science cohabitent, où les amitiés se font et se défont, et où un seul homme peut changer à jamais le cours des choses !"}, {"id": "psx_039", "s": "psx", "n": 39, "t": "Final Fantasy VIII", "y": 1999, "dv": "Squaresoft", "p": "Squaresoft", "g": "Jeu De Rôles", "r": 2, "img": "psx/039.webp", "shot": "shots/psx/039.webp", "d": "Squall fait partie d'un escadron militaire d'élite et se voit obligé de participer à un conflit dépassant les limites de l'imagination. Dans sa quête, il sera confronté à un rival acharné, une sorcière aux prodigieux pouvoirs, mais aussi à de biens étranges rêves... Un environnement aux graphismes détaillés et soignés, des personnages réalistes, le tout accompagné d'une musique envoûtante. Une histoire d'amour et de haine, de guerre et de paix, se déroulant dans un monde surprenant. Le nouveau système d'Association (New Junction System) permet, entre autre, d'attribuer aux personnages les pouvoirs magiques récupérés sur l'ennemi. Environ 60 minutes d'incroyables séquences cinématiques parfaitement intégrées au jeu !"}, {"id": "psx_040", "s": "psx", "n": 40, "t": "Gex 3D : Enter the Gecko", "y": 1998, "dv": "Crystal Dynamics", "p": "BMG Interactive", "g": "Plateforme", "r": 0, "img": "psx/040.webp", "shot": "shots/psx/040.webp", "d": "Gex : Enter the Gecko est un jeu de plates-formes en 3D sur Playstation. Le terrible Rez est sur le point de détruire le royaume de la télévision et Gex est le seul à pouvoir l'en empêcher. Dans chaque niveau, notre Gecko favori doit ramasser des télécommandes pour ouvrir de nouvelles zones et affronter le boss."}, {"id": "psx_041", "s": "psx", "n": 41, "t": "Gran Turismo", "y": 1998, "dv": "Polyphony Digital", "p": "Sony Computer Entertainment", "g": "Course, Conduite", "r": 3, "img": "psx/041.webp", "shot": "shots/psx/041.webp", "d": "Gran Turismo sur Playstation fait figure de référence en matière de simulation automobile. Passez vos licences vous ouvrant l'accès aux compétitions, trouvez-vous une bonne occase, et c'est parti pour la gloire. Plus de 600 voitures au choix de quelques 36 constructeurs sont au menu."}, {"id": "psx_042", "s": "psx", "n": 42, "t": "Gran Turismo 2", "y": 2000, "dv": "Polyphony Digital", "p": "Sony Computer Entertainment", "g": "Course, Conduite", "r": 3, "img": "psx/042.webp", "shot": "shots/psx/042.webp", "d": "Le stade ultime de la simulation de course. 600 voitures conçues par 33 des plus grands constructeurs automobile au monde... Trouvez le réglage parfait de vos véhicules. 28 circuits dont le célèbre Laguna Seca. Des compétitions sur circuit, sur route et des rallyes."}, {"id": "psx_043", "s": "psx", "n": 43, "t": "Grandia", "y": 2000, "dv": "Game Arts", "p": "Ubisoft", "g": "Aventure, Jeu De Rôles", "r": 0, "img": "psx/043.webp", "shot": "shots/psx/043.webp", "d": "Grandia est un jeu de rôle sur Playstation. Le bout du monde, frontière inaccessible qui sépare le monde de Grandia en deux parties, l'une habitée pas les humains, l'autre par une race sauvage préférant la magie à la technologie. Evidemment, un grand conflit se prépare entre les deux factions et les secrets d'une race antique et oubliée sont prêts à refaire surface. Vous allez devoir tenter de mettre un terme à cette guerre. Le soft est exclusivement solo."}, {"id": "psx_044", "s": "psx", "n": 44, "t": "Harvest Moon : Back to Nature", "y": 2001, "dv": "Victor Interactive", "p": "Marvelous Interactive", "g": "Jeu De Rôles", "r": 0, "img": "psx/044.webp", "shot": "shots/psx/044.webp", "d": "Harvest Moon : Back to Nature est un jeu de rôle sur Playstation qui se déroule dans un univers rural où le but est de s'occuper en toute tranquillité de son petit carré de jardin et de faire du commerce. Votre vie de fermier vous donne l'occasion de cultiver la terre, de vous occuper du bétail et même de partager vos rêves de bonheur avec votre compagne."}, {"id": "psx_045", "s": "psx", "n": 45, "t": "ISS Pro Evolution", "y": 2000, "dv": "KCET", "p": "Konami", "g": "Sport, Sport / Football", "r": 0, "img": "psx/045.webp", "shot": "shots/psx/045.webp", "d": "ISS Pro Evolution est un jeu de football sur Playstation. Si les licences de joueurs sont aux abonnés absents, les équipes nationales sont bien là ainsi que 10 stades fidèlement représentés. Il est possible de modifier les options météo et l'efficacité de l'intelligence artificielle, sans oublier les 9 angles de caméras différents. Jusqu'à quatre joueurs peuvent s'affronter simultanément."}, {"id": "psx_046", "s": "psx", "n": 46, "t": "Jumping Flash!", "y": 1995, "dv": "Exact", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 0, "img": "psx/046.webp", "shot": "shots/psx/046.webp", "d": "Jumping Flash sur Playstation est un titre de plates-formes dans lequel le joueur dirige Robbit, un lapin-robot capable d'effectuer de gigantesques sauts afin de rejoindre des plates-formes éloignées. Les bonds servent également à détruire certains ennemis lorsque l'on retombe sur eux. Il est également possible de lancer des missiles en forme de carotte. Le tout se joue en vue subjective."}, {"id": "psx_047", "s": "psx", "n": 47, "t": "Klonoa : Door to Phantomile", "y": 1998, "dv": "Namco", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 0, "img": "psx/047.webp", "shot": "shots/psx/047.webp", "d": "Klonoa : Door to Phantomile sur Playstation est un titre de plates-formes dans lequel vous contrôlez Klonoa, un être aux oreilles ailées dans un monde où personne ne peut se souvenir de ses rêves, sauf vous. Un jour, l'un de vos songes devient réalité et vous partez enquêter sur ce phénomène avec votre compagnon Huepow à travers 12 niveaux. Servez-vous des ennemis comme des armes ou utilisez-les pour vous propulser plus haut, et découvrez le secret des rêves emprisonnés."}, {"id": "psx_048", "s": "psx", "n": 48, "t": "Kula World", "y": 1998, "dv": "Game Design Sweden AB.", "p": "Psygnosis", "g": "Puzzle-Game", "r": 0, "img": "psx/048.webp", "shot": "shots/psx/048.webp", "d": "Dans Kula World sur Playstation vous n'êtes pas n'importe qui, ou plutôt n'importe quoi : vous incarnez un ballon. Dans ce jeu de réflexion, vous devez rouler et trouver les clés vous permettant d'atteindre les niveaux suivants."}, {"id": "psx_049", "s": "psx", "n": 49, "t": "Marvel vs. Capcom : Clash of Super Heroes", "y": 2000, "dv": "Capcom", "p": "Virgin", "g": "Combat", "r": 0, "img": "psx/049.webp", "shot": "shots/psx/049.webp", "d": "Marvel vs. Capcom : Clash of the Super Heroes sur Playstation met aux prises les héros de l'éditeur de jeux Capcom et de l'éditeur de comics Marvel, dans un jeu de combat en 2D. Vous devez choisir votre personnage parmi tout ce beau monde et sortir vos meilleurs combos pour vous imposer."}, {"id": "psx_050", "s": "psx", "n": 50, "t": "Medal of Honor", "y": 1999, "dv": "Dreamworks", "p": "Electronic Arts", "g": "Tir, Tir / 1Ere Personne", "r": 1, "img": "psx/050.webp", "shot": "shots/psx/050.webp", "d": "Dans Medal of Honor, un jeu de tir à la première personne sur Playstation, vous incarnez un membre des forces spéciales parachuté derrière les lignes ennemies en 1944. La campagne solo propose 7 missions divisées en 24 niveaux, avec des objectifs allant de la destruction de bâtiment au vol de documents. Deux joueurs peuvent s'affronter sur la même télévision en écran partagé."}, {"id": "psx_051", "s": "psx", "n": 51, "t": "Medal of Honor : Underground", "y": 2000, "dv": "Electronic Arts", "p": "Dreamworks", "g": "Tir, Tir / 1Ere Personne", "r": 1, "img": "psx/051.webp", "shot": "shots/psx/051.webp", "d": "Dans Medal of Honor, un jeu de tir à la première personne sur Playstation, vous incarnez un membre de la Résistance française pendant la Seconde Guerre mondiale. La campagne solo propose 7 missions divisées en 22 niveaux, avec des objectifs allant du sabotage à la récupération de renseignements. Deux joueurs peuvent s'affronter sur la même télévision en écran partagé."}, {"id": "psx_052", "s": "psx", "n": 52, "t": "MediEvil", "y": 1998, "dv": "SCE Studio Cambridge", "p": "Sony Computer Entertainment", "g": "Aventure", "r": 1, "img": "psx/052.webp", "shot": "shots/psx/052.webp", "d": "Perdue dans les limbes temporelles, l'histoire de Gallowmere est celle du pays où la magie a pris le pas sur la science et où Zarok, le sorcier à l'âme torturée, exploite ses pouvoirs les plus sombres. Sir Daniel Fortesque est la seule personne qui puisse l'anéantir. Malheureusement, sa mort remonte à des centaines d'années... Ressuscité en chevalier squelette, Sir Dan doit rassembler un arsenal d'armes qu'il utilisera contre l'ensorceleur à l'esprit tortueux."}, {"id": "psx_053", "s": "psx", "n": 53, "t": "Metal Gear Solid", "y": 1999, "dv": "Konami", "p": "Konami", "g": "Tir", "r": 4, "img": "psx/053.webp", "shot": "shots/psx/053.webp", "d": "Infiltrez un complexe militaire terroriste pour faire échouer une conspiration nucléaire. Concentrez vous, alertez vos sens, restez en vie... Metal Gear Solid: Espionnage, stratégie et action."}, {"id": "psx_054", "s": "psx", "n": 54, "t": "Metal Slug X", "y": 2001, "dv": "SNK", "p": "SNK", "g": "Tir / Run And Gun, Tir", "r": 0, "img": "psx/054.webp", "shot": "shots/psx/054.webp", "d": "Fun fight & Dromadaires ! Armez-vous de courage pour venir à bout de ce shoot explosif et hilarant ! Seul ou à deux, battez-vous contre des hordes d'ennemis aussi loufoques que surarmés. Chevauchez des dromadaires mitrailleurs, abusez de toutes les ruses pour pénétrer les défenses adverses et libérer les otages. Attention pour progresser dans la hiérarchie militaire et débloquer de nouvelles missions il vous faudra plus qu'une bonne dose de sang froid !"}, {"id": "psx_055", "s": "psx", "n": 55, "t": "Micro Machines V3", "y": 1997, "dv": "Midway", "p": "Codemasters", "g": "Course, Conduite", "r": 0, "img": "psx/055.webp", "shot": "shots/psx/055.webp", "d": "Les mini-bolides les plus rapides s'affrontent sur les circuits les plus délirants. Courses folles semée de power-ups explosifs et circuits à dévaler à fond la caisse. C'est géant."}, {"id": "psx_056", "s": "psx", "n": 56, "t": "Need for Speed : Road Challenge", "y": 1999, "dv": "Electronic Arts", "p": "Electronic Arts", "g": "Course, Conduite", "r": 0, "img": "psx/056.webp", "shot": "shots/psx/056.webp", "d": "Need for Speed : Conduite en Etat de Liberté est un jeu de courses sorti sur Playstation. Disputez des courses phénoménales à bord de 18 voitures dont la BMW Z3, Ferrari 550, Mercedes CLK ou encore la Jaguar XKR."}, {"id": "psx_057", "s": "psx", "n": 57, "t": "Need for Speed III : Hot Pursuit", "y": 1998, "dv": "EA Canada", "p": "Electronic Arts", "g": "Course, Conduite", "r": 0, "img": "psx/057.webp", "shot": "shots/psx/057.webp", "d": "Need for Speed 3 : Hot Pursuit est un jeu de courses de voitures sur Playstation. Le soft offre un sentiment de vitesse grisant, de beaux graphismes, et de pur plaisir de conduite. Dans le mode Classique, il y a une douzaine de super-voitures ayant chacune des qualités différentes à montrer. Alors montez dans votre Ferrari ou autre Lamborghini et faites chauffer le moteur."}, {"id": "psx_058", "s": "psx", "n": 58, "t": "Oddworld : L'Exode d'Abe", "y": 1999, "dv": "Oddworld Inhabitants", "p": "GT Interactive Software", "g": "Aventure, Plateforme", "r": 1, "img": "psx/058.webp", "shot": "shots/psx/058.webp", "d": "La légende des terres d'Oddworld continue... Après avoir libéré son peuple Mudokon de l'esclavage, Abe revient dans de nouvelles aventures! Les infâmes Glukkons, actionnaires de Rupture Farm, veulent se venger! Ils s'apprêtent à mettre sur le marché une nouvelle bière d'une composition assez particulière... puisque brassée à partir des os des Mudokons réduits en poudre!"}, {"id": "psx_059", "s": "psx", "n": 59, "t": "PaRappa the Rapper : The Hip Hop Hero", "y": 1997, "dv": "Nanaon-Sha", "p": "Sony Computer Entertainment", "g": "Musique Et Danse, Rythme", "r": 0, "img": "psx/059.webp", "shot": "shots/psx/059.webp", "d": "Parappa the Rapper est un jeu de rythme sur Playstation dans lequel vous incarnez un jeune chien qui trouvera confiance en lui grâce au hip-hop. Le principe est simple et consiste à écouter attentivement une séquence pour la reproduire à l'identique en appuyant en rythme sur les boutons indiqués en haut de l'écran durant les six niveaux différents du titre."}, {"id": "psx_060", "s": "psx", "n": 60, "t": "Parasite Eve II", "y": 2000, "dv": "Squaresoft", "p": "Squaresoft", "g": "Aventure, Aventure / Survival Horror", "r": 1, "img": "psx/060.webp", "shot": "shots/psx/060.webp", "d": "Parasite Eve II est un jeu d'action sur Playstation. Dans la peau de la belle Aya, le soft ne vous invite pas à un cours de cytologie, mais vous jette sur les traces des affreuses créatures pour mettre à jour une terrible affaire. Le gameplay emprunte beaucoup au genre \"survival horror\". Au programme, une enquête à boucler et bien entendu, de nombreuses confrontations avec les mutants."}, {"id": "psx_061", "s": "psx", "n": 61, "t": "Point Blank", "y": 1998, "dv": "TOSE", "p": "Namco", "g": "Tir Avec Accessoire", "r": 0, "img": "psx/061.webp", "shot": "shots/psx/061.webp", "d": "Disponible sur Playstation, Point Blank est un jeu de tir mettant en scène les deux compères Dr. Don et Dr. Dan. A travers des niveaux au style cartoon, vous devrez réaliser des objectifs comme détruire des cibles de couleur ou éliminer un nombre précis d'ennemis en carton. Le jeu se joue entièrement au GunCon, le pistolet optique de la Playstation."}, {"id": "psx_062", "s": "psx", "n": 62, "t": "Pro Evolution Soccer 2", "y": 2002, "dv": "Konami", "p": "Konami", "g": "Sport / Football, Sport", "r": 0, "img": "psx/062.webp", "shot": "shots/psx/062.webp", "d": "Pro Evolution Soccer 2 est un jeu de sport sur Playstation. Incarnez vos joueurs préférés dans cette simulation du ballon rond qui vous permettra de vivre de hauts moments sur le terrain."}, {"id": "psx_063", "s": "psx", "n": 63, "t": "Rayman", "y": 1995, "dv": "Ubisoft", "p": "Ubisoft", "g": "Plateforme", "r": 1, "img": "psx/063.webp", "shot": "shots/psx/063.webp", "d": "Dans le monde de Rayman, la nature et les habitants vivent en paix et Le Grand Protoon maintient l'équilibre et l'harmonie de cet univers. Jusqu'au jour où l'horrible Mister Dark le dérobe, plongeant le monde dans le chaos et les ténèbres. Rayman devra trouver et délivrer tous les toons puis anéantir Mister Dark pour délivrer le Grand Protoon. Rayman sur Playstation est une des références du jeu de plates-formes."}, {"id": "psx_064", "s": "psx", "n": 64, "t": "Resident Evil", "y": 1996, "dv": "Virgin", "p": "Capcom", "g": "Aventure, Aventure / Survival Horror", "r": 2, "img": "psx/064.webp", "shot": "shots/psx/064.webp", "d": "Resident Evil est un survival-horror sur Playstation. L'équipe Bravo a disparu lors d'un crash d'hélicoptère dans les montagnes d'Arklay non loin de la petite ville de Raccoon City. Vous faites partie de l'équipe Alpha chargée de retrouver des survivants. Arrivé à l'épave, une meute de chiens enragés vous oblige à vous retrancher dans un vieux manoir où vous pensez être en sécurité, mais c'est là que le cauchemar va vraiment débuter."}, {"id": "psx_065", "s": "psx", "n": 65, "t": "Resident Evil 2", "y": 1998, "dv": "Capcom", "p": "Capcom", "g": "Aventure / Survival Horror, Aventure", "r": 3, "img": "psx/065.webp", "shot": "shots/psx/065.webp", "d": "Souvenez-vous, tout avait commencé dans le laboratoire d'un sinistre manoir, lieu de développement du Virus-T, une toxine capable de faire muter des gènes et qui devait servir à la fabrication d'armes biologiques. Le virus s'était propagé, transformant hommes et animaux en de monstrueuses créatures. Grâce à l'intervention radicale de l'équipe BRAVO l'affaire fut classée mais les expériences étaient loin d'être terminées... Il vous faut maintenant faire face à la pire des situations possibles: un nouveau virus se propage. Raccoon City est infestée. Zombies assoiffés de sang et créatures mutantes hideuses envahissent la ville. Quand Claire et Léon arrivent en ville leur cauchemar ne fait que commencer..."}, {"id": "psx_066", "s": "psx", "n": 66, "t": "Resident Evil 3 : Nemesis", "y": 2000, "dv": "Capcom", "p": "Capcom", "g": "Aventure / Survival Horror, Aventure", "r": 2, "img": "psx/066.webp", "shot": "shots/psx/066.webp", "d": "Après avoir survécu à l'horreur du laboratoire secret du manoir, Jill Valentine décide de fuir Raccoon City au plus vite. Mais le cauchemar continue: Jill est maintenant prisonnière d'une ville dont la population est contaminée par un terrible virus expérimental créé par Umbrella, la diabolique multinationale bio-technologique. Il lui faudra faire preuve d'ingéniosité et de ténacité pour surmonter toutes les épreuves et, surtout, pour affronter la nouvelle créature génétiquement modifiée issue de l'imagination de chercheurs démoniaques: l'invincible et terrifiant NEMESIS..."}, {"id": "psx_067", "s": "psx", "n": 67, "t": "Ridge Racer", "y": 1995, "dv": "Namco", "p": "Namco", "g": "Course, Conduite", "r": 0, "img": "psx/067.webp", "shot": "shots/psx/067.webp", "d": "Ridge Racer est un jeu de courses sur Playstation. Ce soft vous propose des courses sur plusieurs sections d'un même circuit, une bonne vingtaine de bolides avec chacun leurs propres caractéristiques techniques, 4 modes de jeu plus un mode multijoueur en écran séparé."}, {"id": "psx_068", "s": "psx", "n": 68, "t": "Ridge Racer Type 4", "y": 1999, "dv": "Namco", "p": "Sony Computer Entertainment", "g": "Course, Conduite", "r": 0, "img": "psx/068.webp", "shot": "shots/psx/068.webp", "d": "Ridge Racer Type 4 sur Playstation est un jeu de courses totalement arcade. Vous démarrez avec 8 voitures au choix mais pouvez en débloquer beaucoup plus (un peu plus de 300) en tournant sur les 8 circuits présents et sur leur 8 versions miroir. Défiez vos amis grâce à un mode multi qui permet jusqu'à 4 joueurs de s'affronter."}, {"id": "psx_069", "s": "psx", "n": 69, "t": "Silent Hill", "y": 1999, "dv": "Team Silent", "p": "Konami", "g": "Aventure, Aventure / Survival Horror", "r": 2, "img": "psx/069.webp", "shot": "shots/psx/069.webp", "d": "Un jeune homme à la recherche de sa fille lutte pour survivre dans un monde à cheval entre la réalité et l'enfer, dans une ville renfermant de terribles et sombres secrets. Suivez la trace d'une traînée de sang et passez outre de nombreuses mutilations pour arracher l'être aimé des griffes d'une puissance démoniaque. Entrez dans une autre dimension ou la mort même n'offre aucune échappatoire. Bienvenue dans la folie de Silent Hill..."}, {"id": "psx_070", "s": "psx", "n": 70, "t": "Soul Blade", "y": 1997, "dv": "Namco", "p": "Sony Computer Entertainment", "g": "Combat", "r": 0, "img": "psx/070.webp", "shot": "shots/psx/070.webp", "d": "Soul Blade sur Playstation est un jeu de combat en 3D dans lequel chaque combattant utilise une arme différente. Il est possible d'effectuer des dizaines de mouvements avec son personnage et de gagner directement un round en éjectant ses adversaires des arènes. De nombreux modes de jeu sont disponibles dont un mode Histoire particulièrement riche. Il s'agit du tout premier opus de la série SoulCalibur."}, {"id": "psx_071", "s": "psx", "n": 71, "t": "Spyro 2 : Gateway to Glimmer", "y": 1999, "dv": "Insomniac Games", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 2, "img": "psx/071.webp", "shot": "shots/psx/071.webp", "d": "Le pays d'Avalar est tombé sous le joug du tyrannique sorcier Ripto et de ses acolytes, Crush et Gulp. Le peuple d'Avalar a besoin d'aide et fait appel au pays des Dragons... et devine qui arrive? Rejoins Spyro et son meilleur ami, Sparx, et vole au secours de leurs nouveaux amis pour mettre un terme à cette tyrannie. Ramasse des joyaux, des points de magie et découvre un immense Monde de rêve aux contrées mystérieuses et aux personnages hauts en couleur."}, {"id": "psx_072", "s": "psx", "n": 72, "t": "Spyro : Year of the Dragon", "y": 2000, "dv": "Insomniac Games", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 2, "img": "psx/072.webp", "shot": "shots/psx/072.webp", "d": "Des voleurs ont kidnappé une couvée d'œufs de dragon. Pendant ce temps, au pays des dragons, une porte vers le Monde Oublié a été découverte. Spyro le Dragon et son meilleur ami Sparx ont pour mission de retrouver les œufs et s'embarquent pour un périple vers l'inconnu où ils devront affronter leur redoutable ennemie la sorcière!"}, {"id": "psx_073", "s": "psx", "n": 73, "t": "Spyro the Dragon", "y": 1998, "dv": "Insomniac Games", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 2, "img": "psx/073.webp", "shot": "shots/psx/073.webp", "d": "La terre des Dragons a été envahie par Gnasty Gnorc et son armée de Gnorcs. Tous les dragons ont été transformés en statues de cristal, seul Spyro a été épargné."}, {"id": "psx_074", "s": "psx", "n": 74, "t": "Star Ocean : The Second Story", "y": 2000, "dv": "Tri-Ace", "p": "Sony Computer Entertainment", "g": "Jeu De Rôles", "r": 0, "img": "psx/074.webp", "shot": "shots/psx/074.webp", "d": "Star Ocean : The Second Story est un jeu de rôle sur Playstation. Téléporté par erreur sur une planète au bord du chaos, le jeune Claude va devoir trouver un moyen de rentrer chez lui tout en venant en aide aux autochtones. Les joueurs auront le choix entre deux personnages au début de l'aventure et une dizaine de compagnons pourront être recrutés par la suite pour former des équipes efficaces ou crafter toutes sortes d'objets."}, {"id": "psx_075", "s": "psx", "n": 75, "t": "Street Fighter Alpha 3", "y": 1999, "dv": "Capcom", "p": "Capcom", "g": "Combat", "r": 0, "img": "psx/075.webp", "shot": "shots/psx/075.webp", "d": "Street Fighter Alpha 3 sur Playstation est un jeu de combat en 2D qui réunit bon nombre de personnages connus de la série. Choisissez parmi une trentaine de combattants et débloquez en plusieurs autres totalement inédits."}, {"id": "psx_076", "s": "psx", "n": 76, "t": "Suikoden", "y": 1997, "dv": "Konami", "p": "Konami", "g": "Jeu De Rôles", "r": 1, "img": "psx/076.webp", "shot": "shots/psx/076.webp", "d": "Suikoden est un jeu de rôle sur Playstation. Le soft est inspiré du roman chinois au bord de l'eau. Votre héros ainsi que ses compagnons acquièrent de l'expérience au fur et à mesure de leur progression, augmentant leurs points de magie mais également leurs capacités en termes de force ou de résistance."}, {"id": "psx_077", "s": "psx", "n": 77, "t": "Suikoden II", "y": 2000, "dv": "Konami", "p": "Konami", "g": "Aventure, Jeu De Rôles", "r": 1, "img": "psx/077.webp", "shot": "shots/psx/077.webp", "d": "Suikoden II est un jeu de rôle sur Playstation. Vous y incarnez un jeune orphelin, adopté par un vieil homme et dont le principal souci est de revoir sa ville natale Kyaro. Accompagné de son meilleur ami Jowy il part donc à la découverte de ses origines au mépris des plus grands danger. Votre héros ainsi que ses compagnons acquièrent de l'expérience au fur et à mesure de leur progression, augmentant leurs points de magie mais également leurs capacités en termes de force ou de résistance."}, {"id": "psx_078", "s": "psx", "n": 78, "t": "Syphon Filter", "y": 1999, "dv": "Eidetic", "p": "989", "g": "Tir", "r": 1, "img": "psx/078.webp", "shot": "shots/psx/078.webp", "d": "Les services de renseignements ont découvert qu'une organisation terroriste internationale développe des armes biologiques. Pour éviter un massacre à l'échelle mondiale, effectue des opérations de reconnaissance, des opérations secrètes et ne te laisse pas intimider par des conditions de combats extrêmes. Termine ta mission à n'importe quel prix."}, {"id": "psx_079", "s": "psx", "n": 79, "t": "Syphon Filter 2", "y": 2000, "dv": "Eidetic", "p": "989", "g": "Tir", "r": 1, "img": "psx/079.webp", "shot": "shots/psx/079.webp", "d": "Gabe Logan et Lian Xing sont les deux meilleurs éléments de l'Agence. Ils sont efficaces. Intelligents. Courageux. ... mais ils en savent trop et l'Agence veut les éliminer."}, {"id": "psx_080", "s": "psx", "n": 80, "t": "Tekken 2", "y": 1996, "dv": "Namco", "p": "Namco", "g": "Combat", "r": 2, "img": "psx/080.webp", "shot": "shots/psx/080.webp", "d": "Kazuya s'est vengé de son père à la fin du premier Tekken et a pris le contrôle de Mishima Zaibatsu. Pas pour longtemps car Heihashi est de retour pour se débarrasser de son fils une bonne fois pour toutes. Pour éliminer ses ennemis, Kazuya décide d'organiser le second King of Iron Fist Tournament. Tekken 2 est lancé sur Playstation."}, {"id": "psx_081", "s": "psx", "n": 81, "t": "Tekken 3", "y": 1998, "dv": "Namco", "p": "Namco", "g": "Combat", "r": 2, "img": "psx/081.webp", "shot": "shots/psx/081.webp", "d": "Fin du King of Iron Fist Tournament 2. Heihachi a vaincu Kazuya et reprend la tête de Mishima Zaibatsu. Un jour, il entend parler d'un ancien dieu mexicain, Ogre, qui serait attiré par les âmes fortes. Pour l'appâter, Heihachi décide de lancer la troisième édition du tournoi mondialement connu afin que les combattants servent de leurres. Tel est le début de Tekken 3, jeu de combat sur Playstation."}, {"id": "psx_082", "s": "psx", "n": 82, "t": "Tenchu 2 : Birth of the Stealth Assassins", "y": 2000, "dv": "Acquire", "p": "Activision", "g": "", "r": 0, "img": "psx/082.webp", "shot": "shots/psx/082.webp", "d": "Tenchu 2 est un jeu d'infiltration sur Playstation qui vous amènera dans le Japon médiéval. Vous avez le choix d'incarner deux assassins. Le premier se nomme Rikimaru et utilise son katana de façon destructrice et la seconde s'appelle Ayame et maîtrise ses deux dagues de façon mortelle. vous allez devoir vous fondre dans le décor, la discrétion, la rapidité et le silence seront vos principaux atouts."}, {"id": "psx_083", "s": "psx", "n": 83, "t": "Tenchu : Stealth Assassins", "y": 1998, "dv": "Acquire", "p": "Activision", "g": "Aventure", "r": 0, "img": "psx/083.webp", "shot": "shots/psx/083.webp", "d": "Tenchu : Stealth Assassins est un jeu d'infiltration sur Playstation. Vous jouez un Ninja au choix entre Rikimaru et Ayame. Le soft se décompose en 10 étapes où vous devez accomplir les tâches qui sont présentes. De plus, sachez que tous les niveaux se passent pendant la nuit."}, {"id": "psx_084", "s": "psx", "n": 84, "t": "The Legend of Dragoon", "y": 2001, "dv": "Sony Computer Entertainment", "p": "Sony Computer Entertainment", "g": "Jeu De Rôles", "r": 1, "img": "psx/084.webp", "shot": "shots/psx/084.webp", "d": "The Legend of Dragoon est un jeu de rôle sur Playstation. Incarnez Dart, un jeune héros valeureux. Ajoutez une bande d'aventuriers courageux, une force maléfique mystérieuse, des monstres féroces, du folklore mythique et des scènes de combats épiques et vous obtenez un jeu de rôle de 80 heures. Par contre le soft ne contient pas de mode multijoueur."}, {"id": "psx_085", "s": "psx", "n": 85, "t": "Theme Hospital", "y": 1998, "dv": "Bullfrog", "p": "Electronic Arts", "g": "Simulation, Construction & Management", "r": 0, "img": "psx/085.webp", "shot": "shots/psx/085.webp", "d": "Theme Hospital, disponible sur Playstation, vous confie la lourde tâche de construire le complexe hospitalier le plus performant possible en gérant le moindre employé, du balayeur au chirurgien, et aussi tous les équipements, du distributeur de boissons à la technologie de pointe. Vous devez également trouver le remède à des maladies originales comme l'invisibilité pour accroître votre réputation et ainsi agrandir vos locaux."}, {"id": "psx_086", "s": "psx", "n": 86, "t": "Time Crisis", "y": 1997, "dv": "Namco", "p": "Namco", "g": "Tir, Tir Avec Accessoire", "r": 0, "img": "psx/086.webp", "shot": "shots/psx/086.webp", "d": "Time Crisis est un jeu de tir utilisant un pistolet comme accessoire sur Playstation. Vous faites parti d'un commando d'élite et devez suivre les ordres de vos supérieurs pour une multitude d'interventions. Préparez-vous à livrer une série de combats sans pitié dans cette folle course contre-la-montre."}, {"id": "psx_087", "s": "psx", "n": 87, "t": "Tomb Raider", "y": 1996, "dv": "Core Design", "p": "Eidos Interactive", "g": "Aventure, Plateforme", "r": 1, "img": "psx/087.webp", "shot": "shots/psx/087.webp", "d": "L'aventurière Lara Croft vient d'être engagée par un puissant syndicat pour retrouver les fragments d'une ancienne relique connue sous le nom du Scion. Dans son style acrobatique et intrépide, elle court, saute, nage et grimpe à la recherche de l'origine et des pouvoirs du Scion. Lara va vite et ne laisse que des tombes pillées et des cartouches vides sur son passage."}, {"id": "psx_088", "s": "psx", "n": 88, "t": "Tomb Raider II : Starring Lara Croft", "y": 1997, "dv": "Core", "p": "Eidos Interactive", "g": "Aventure, Plateforme", "r": 1, "img": "psx/088.webp", "shot": "shots/psx/088.webp", "d": "Lara Croft est de retour. Elle part à la découverte du secret de la Dague de Xian. D'après une mystérieuse légende, celui qui découvrira cette dague mythique gagnera le pouvoir du dragon... à condition qu'il ait le courage de la plonger dans son cœur. les aventures de Lara commencent sur la Grande Muraille de Chine, mais elle devra très vite parcourir la Terre entière pour trouver les indices qui la mèneront à la dague de Xian. Mais Lara n'est pas seule à convoiter cet objet mystérieux, et elle devra affronter la mafia italienne et chinoise ainsi que les adorateurs d'un sombre culte Tibétain."}, {"id": "psx_089", "s": "psx", "n": 89, "t": "Tomb Raider III : Les Aventures de Lara Croft", "y": 1998, "dv": "Core", "p": "Eidos Interactive", "g": "Aventure, Plateforme", "r": 1, "img": "psx/089.webp", "shot": "shots/psx/089.webp", "d": "Lara part à la recherche de 4 mystérieux artefacts façonnés dans la roche d'une ancienne météorite. Sa nouvelle mission la mènera au plus profond de la jungle indonésienne, au cœur de l'Inde, dans les glaces de l'Antarctique, sur les toits de Londres et dans la mystérieuse zone 51 au Névada. Au cours de ses voyages Lara devra déjouer de nombreux pièges, résoudre de nouvelles énigmes et affronter une horde d'ennemis sanguinaires. Retrouvez Lara pour sa plus éblouissante et sa plus périlleuse aventure. Vous n'en reviendrez pas!"}, {"id": "psx_090", "s": "psx", "n": 90, "t": "Tony Hawk's Pro Skater 2", "y": 2000, "dv": "Neversoft", "p": "Activision", "g": "Sport, Sport / Skateboard", "r": 2, "img": "psx/090.webp", "shot": "shots/psx/090.webp", "d": "Tony Hawk's Pro Skater 2 sur Playstation est un jeu de sport proposant trois modes de jeu : Carrière (relevez les défis pour débloquer skates, personnages et tricks), Sessions simples ou Entraînement. Ce second opus des aventures aériennes de Tony intègre un éditeur de parcs pour créer des terrains de jeu à la mesure des inspirations de chacun."}, {"id": "psx_091", "s": "psx", "n": 91, "t": "Tony Hawk's Skateboarding", "y": 1999, "dv": "Neversoft", "p": "Activision", "g": "Sport, Sport / Skateboard", "r": 2, "img": "psx/091.webp", "shot": "shots/psx/091.webp", "d": "Tony Hawk's Skateboarding sur Playstation est une simulation de sport proposant 4 modes de jeu : Carrer mode, 2 Players, Single session et Practice mode. Dans une école, un entrepôt ou dans les rues de San Francisco, tout est prétexte à enfourcher votre bonne vieille planche à roulettes. Enchaînez les tricks pour débloquer les skates et personnages disponibles."}, {"id": "psx_092", "s": "psx", "n": 92, "t": "Twisted Metal : World Tour", "y": 1997, "dv": "Sony Computer Entertainment", "p": "Sony Computer Entertainment", "g": "Course, Conduite, Tir / Vehicule, 3Eme Personne, Tir", "r": 0, "img": "psx/092.webp", "shot": "shots/psx/092.webp", "d": "Twisted Metal 2 sur Playstation se déroule 1 an après le premier. Cette fois-ci le tournoi n'a pas lieu à Los Angeles mais dans plusieurs autres grandes villes du monde. Cet opus intègre de nombreux ajouts notamment au niveau des armes et d'options avancées : manoeuvres offensives (mines...), défensives (bouclier...) et même les stations de réparation sont remplacées par des objets."}, {"id": "psx_093", "s": "psx", "n": 93, "t": "Um Jammer Lammy", "y": 1999, "dv": "Nanaon-Sha", "p": "Sony Computer Entertainment", "g": "Musique Et Danse", "r": 0, "img": "psx/093.webp", "shot": "shots/psx/093.webp", "d": "Um Jammer Lammy est un jeu musical sur Playstation. Vous devez suivre une rythmique imposée par la chanson en appuyant quand il le faut sur les bonnes touches et dans le bon rythme quand les icônes s'affichent en haut de l'écran. Si tout se passe bien, le public vous appréciera, sinon c'est tomates pourries."}, {"id": "psx_094", "s": "psx", "n": 94, "t": "Vagrant Story", "y": 2000, "dv": "Squaresoft", "p": "Squaresoft", "g": "Jeu De Rôles", "r": 1, "img": "psx/094.webp", "shot": "shots/psx/094.webp", "d": "L'UNION SACRÉE... - Incarnez Ashley Riot, agent au service des forces royales et tentez de lever le voile sur les terribles secrets que recèlent la cité maudite de Léa Mundis. Vous devez ruser, apprendre à maitriser l'art de la magie et faire montre de vos talents de combattant pour réussir à venir à bout des dangers qui vous guettent. Seulement alors, pourrez-vous cerner les véritables enjeux politiques de votre quête. - Une aventure exceptionnelle basée dans un environnement 3D riche et détaillé. - Un système de combat révolutionnaire permettant des attaques en temps réel et des combos."}, {"id": "psx_095", "s": "psx", "n": 95, "t": "Vib-Ribbon", "y": 2000, "dv": "Nanaon-Sha", "p": "Sony Computer Entertainment", "g": "Plateforme", "r": 0, "img": "psx/095.webp", "shot": "shots/psx/095.webp", "d": "Vib-Ribbon est un jeu d'action sur Playstation. On accompagne Vibri au travers de plusieurs stages pour les trois niveaux de difficulté. Si le lapin blanc passe avec succès les obstacles il parvient à une forme de vie supérieure et si au contraire il échoue lamentablement, celui-ci régresse jusqu'à devenir une grenouille ou pire, un vulgaire ver. Ce soft est exclusivement solo"}, {"id": "psx_096", "s": "psx", "n": 96, "t": "Wild Arms", "y": 1998, "dv": "Media.Vision Entertainment", "p": "Sony Computer Entertainment", "g": "Jeu De Rôles", "r": 0, "img": "psx/096.webp", "shot": "shots/psx/096.webp", "d": "Wild Arms est un jeu de rôle sur Playstation. Un guerrier, une princesse et une crapule traversent les déserts de Filgaia à la recherche de reliques censées pouvoir sauver ce monde, un monde où les légendes deviennent réalité."}, {"id": "psx_097", "s": "psx", "n": 97, "t": "Wip3out", "y": 1999, "dv": "Psygnosis", "p": "Sony Computer Entertainment", "g": "Course, Conduite", "r": 1, "img": "psx/097.webp", "shot": "shots/psx/097.webp", "d": "Avec Wip3out sur Playstation faites monter votre adrénaline au plus haut sur des circuits complètement déjantés à bord de vaisseaux défiant les lois de la gravité et de la vitesse. Les premières places du podium se gagnent grâce à un arsenal dévastateur. Affrontez vos amis grâce au mode multi proposé dans le soft."}, {"id": "psx_098", "s": "psx", "n": 98, "t": "WipEout", "y": 1995, "dv": "Psygnosis", "p": "Sony Computer Entertainment", "g": "Course, Conduite", "r": 1, "img": "psx/098.webp", "shot": "shots/psx/098.webp", "d": "WipEout est un jeu de courses sur Playstation. En 2057, rejoignez une des sept équipes de courses existantes et participez à des courses de véhicules anti-gravité à des vitesses extrêmes. Chaque véhicule a des caractéristiques propres (vitesse, accélération, et virage), et peut utiliser des armes pour stopper ses adversaires."}, {"id": "psx_099", "s": "psx", "n": 99, "t": "WipEout 2097", "y": 1996, "dv": "Psygnosis", "p": "Psygnosis", "g": "Course, Conduite", "r": 1, "img": "psx/099.webp", "shot": "shots/psx/099.webp", "d": "WipEout 2097 sur Playstation installe le joueur aux commandes de vaisseaux de courses ultra-rapides le long de circuits complètement déjantés où la première place ne s'obtient qu'à coups de missiles et autres armes destructrices. Un mode multi est présent afin d'affronter ses amis."}, {"id": "psx_100", "s": "psx", "n": 100, "t": "Worms Armageddon", "y": 1999, "dv": "Team 17", "p": "Microprose", "g": "Stratégie", "r": 0, "img": "psx/100.webp", "shot": "shots/psx/100.webp", "d": "Worms Armageddon sur Playstation est un jeu d'action stratégique mettant en scène des équipes de vers de terre combattant dans un environnement en 2D. A tour de rôle, chaque équipe joue un ver qui doit harceler les équipes adverses grâce à son arsenal d'armes, le but consistant à être le dernier survivant à la fin de la partie dans une ambiance loufoque et décalée."}, {"id": "gba_001", "s": "gba", "n": 1, "t": "Advance Guardian Heroes", "y": 2005, "dv": "Treasure", "p": "Ubisoft", "g": "Action, Combat", "r": 0, "img": "gba/001.webp", "shot": "shots/gba/001.webp", "d": "Advance Guardian Heroes sur GBA est un jeu de rôle/action dans lequel vous incarnez un jeune guerrier qui, avec l'aide de l'âme du héros légendaire, le Guerrier Zombie, affronte le terrible Mage Kanon. Avancez à travers les donjons avec votre groupe. Vous pouvez d'ailleurs jouer seul ou en multi avec le câble link."}, {"id": "gba_002", "s": "gba", "n": 2, "t": "Advance Wars", "y": 2002, "dv": "Intelligent Games", "p": "Nintendo", "g": "Stratégie", "r": 3, "img": "gba/002.webp", "shot": "shots/gba/002.webp", "d": "Advance Wars est un jeu de stratégie tactique sorti sur Gameboy Advance. Celui-ci se joue au tour par tour. Choisissez votre général avec ses capacités différentes puis bâtissez une armée afin d'anéantir vos adversaires."}, {"id": "gba_003", "s": "gba", "n": 3, "t": "Advance Wars 2 : Black Hole Rising", "y": 2003, "dv": "Intelligent Systems", "p": "Nintendo", "g": "Stratégie", "r": 2, "img": "gba/003.webp", "shot": "shots/gba/003.webp", "d": "La suite du célèbre jeu tactique Advance Wars fait son retour sur Gameboy Advance avec Advance Wars 2 : Black Hole Advance. La menace de l'armée Black Hole pèse plus que jamais sur Wars World, et c'est devant l'imminence d'une invasion que les différentes forces vont devoir s'allier. Accomplissez l'objectif qui vous est fixé dans chaque mission, parfois avant un laps de temps donné. A vous de mettre en place la meilleure stratégie pour prendre l'avantage sur votre adversaire."}, {"id": "gba_004", "s": "gba", "n": 4, "t": "Astro Boy : Omega Factor", "y": 2005, "dv": "Sega", "p": "Thq", "g": "Divers", "r": 0, "img": "gba/004.webp", "shot": "shots/gba/004.webp", "d": "Astro Boy : Omega Factor arrive sur la GBA pour de nouvelles aventures. Vous allez encore devoir aider le Dr O'Shay et enchaîner les phases de plates-formes, de vol et de combat pour découvrir qui se cache derrière de mystérieux ennemis qui envahissent la ville. Retrouvez les personnages de la série dans une aventure haute en rayons lasers et autres combos aériens."}, {"id": "gba_005", "s": "gba", "n": 5, "t": "Banjo-kazooie - La Revanche De Grunty", "y": 2003, "dv": "Rarew
