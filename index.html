are", "p": "Thq", "g": "Plateforme", "r": 0, "img": "gba/005.webp", "shot": "shots/gba/005.webp", "d": "Retrouvez les deux acolytes Banjo et Kazooie pour des moments de franches rigolades dans Banjo-Kazooie : La Revanche De Grunty, un jeu de plates-formes sur Gameboy Advance. Le vil Gruntilda est de retour et seuls Banjo et Kazooie peuvent mettre un terme à ses plans maléfiques. Participez à un voyage dans le temps en compagnie des deux amis pour combattre toutes sortes d'ennemis pas très sympas."}, {"id": "gba_006", "s": "gba", "n": 6, "t": "Banjo-Pilot", "y": 2005, "dv": "Rareware", "p": "Thq", "g": "Course, Conduite, Puzzle-Game", "r": 0, "img": "gba/006.webp", "shot": "shots/gba/006.webp", "d": "Banjo & Kazooie, le duo le plus frappé que l'on connaisse, atterrit sur la GBA, Banjo tout du moins. Banjo Pilot donc, est un jeu de courses dans lequel vous allez planer dans un ciel rempli d'obstacles et de surprises, grâce aux nombreux véhicules volants mis à votre disposition. Contrôlez Banjo et ses amis, chacun possédant un véhicule avec ses propres particularités pour des courses pouvant accueillir jusqu'à quatre joueurs en multi."}, {"id": "gba_007", "s": "gba", "n": 7, "t": "Boktai 2 : Solar Boy Django", "y": 2005, "dv": "Konami", "p": "Konami", "g": "Tir", "r": 0, "img": "gba/007.webp", "shot": "shots/gba/007.webp", "d": "Boktai 2 : Solar Boy Django sur GBA est un jeu d'aventure qui a la particularité de proposer un capteur solaire pour vaincre les ennemis, recharger votre personnage en pouvoir magique et même forger des nouvelles armes. Aidez le garçon solaire chasseur de vampires Django à combattre les morts-vivants et découvrez pourquoi malgré la purification du reste du monde, sa ville natale est aux prises de cette funeste malédiction."}, {"id": "gba_008", "s": "gba", "n": 8, "t": "Boktai : The Sun Is in Your Hand", "y": 2004, "dv": "Konami", "p": "Konami", "g": "Action, Simulation", "r": 0, "img": "gba/008.webp", "shot": "shots/gba/008.webp", "d": "Boktai : The Sun is in Your Hand est un jeu de rôle et d'action sur GBA. Le joueur contrôle un chasseur de vampires équipé d'une arme qui fonctionne à l'énergie solaire. Il est donc nécessaire de jouer sous la lumière du soleil pour charger le Solar Gun, seul objet efficace contre les monstres des donjons."}, {"id": "gba_009", "s": "gba", "n": 9, "t": "Bomberman Tournament", "y": 2001, "dv": "Hudson", "p": "Activision", "g": "Puzzle-Game", "r": 0, "img": "gba/009.webp", "shot": "shots/gba/009.webp", "d": "Dans le jeu d'action Bomberman Tournament sur Gameboy Advance, Bomberman part à la recherche de son ami disparu, Max, à cause d'une chute de météorites sur la planète Phantarion. Ce jeu d'aventure est présenté suivant un mode Aventure, où le héros enquête sur la disparition de son ami. En mode Bataille plusieurs joueurs pourront se lancer dans le feu de l'action."}, {"id": "gba_010", "s": "gba", "n": 10, "t": "Breath of Fire", "y": 2002, "dv": "Capcom", "p": "Capcom", "g": "Jeu De Rôles", "r": 0, "img": "gba/010.webp", "shot": "shots/gba/010.webp", "d": "Breath of Fire est un jeu de rôle sur Gameboy Advance adapté d'un titre initialement sorti sur Super NES. De son flash-back introductif à son incroyable dénouement, ce classique vous entraîne dans l'aventure avec Ryu, le chevalier dragon et ses vaillants compagnons. Votre mission : terrasser un terrible démon qui menace le monde !"}, {"id": "gba_011", "s": "gba", "n": 11, "t": "Breath of Fire II", "y": 2002, "dv": "Capcom", "p": "Capcom", "g": "Jeu De Rôles", "r": 0, "img": "gba/011.webp", "shot": "shots/gba/011.webp", "d": "Breath of Fire II est un jeu de rôle sur Gameboy Advance. Vous retrouvez le héros Ryu dans cette suite. Le jeune garçon a toujours le pouvoir du dragon qui sommeille en lui et il peut l'utiliser lors des combats au tour par tour. Le point de départ du scénario pousse Ryu a laver le nom de l'un de ses amis, accusé à tort d'un crime qu'il n'a pas commis."}, {"id": "gba_012", "s": "gba", "n": 12, "t": "Castlevania", "y": 2001, "dv": "Nintendo", "p": "Konami", "g": "Action / Aventure, Action, Jeu De Rôles", "r": 1, "img": "gba/012.webp", "shot": "shots/gba/012.webp", "d": "Castlevania : Circle of the Moon est un jeu d'action/plates-formes sur Gameboy Advance. Aux côtés de Nathan Graves, vous devez délivrer votre maître Morris capturé par les vampires dont le chef n'est autre que le Comte Dracula lui-même. La gestion de l'inventaire, des caractéristiques, des points d'expérience et de l'équipement du personnage est essentielle pour passer les différents niveaux qui jalonnent votre recherche."}, {"id": "gba_013", "s": "gba", "n": 13, "t": "Castlevania : Aria of Sorrow", "y": 2003, "dv": "Konami", "p": "Konami", "g": "Action, Action / Aventure, Combat", "r": 3, "img": "gba/013.webp", "shot": "shots/gba/013.webp", "d": "Lors d'une balade anodine avec une amie qui devait les amener à observer une magnifique éclipse, Soma Cruz perd curieusement connaissance pour se réveiller avec sa compagne dans le château du comte Dracula en personne. Armé d'un simple couteau, Soma va tant bien que mal devoir se frayer un chemin dans l'inquiétante demeure du vampire peuplée de monstres en tout genre. Si dans l'ensemble Aria of Sorrow se joue comme n'importe quel autre Castlevania, il comporte aussi son lot de particularités. Principale innovation de l'opus, le système des âmes à collecter vous donnera tout un tas de pouvoirs aussi intéressants que variés. Pour obtenir une de ces précieuses âmes, il faudra combattre un maximum de monstres car Soma possède la surprenante capacité d'assimiler les talents de ceux qu'il a vaincu. De ce fait, le joueur se retrouvera assez vite avec un vaste choix d'attaques à sa disposition (une bonne centaine au total), ce qui apporte une réelle variété dans la manière de jouer et d'appréhender chaque combat. Beau, maniable et globalement encore plus intéressant que les volets précédents de l'illustre série de Konami, ce jeu s'impose sans mal comme un des tous meilleurs de la GBA."}, {"id": "gba_014", "s": "gba", "n": 14, "t": "Castlevania : Harmony of Dissonance", "y": 2002, "dv": "Konami", "p": "Konami", "g": "Action, Action / Aventure, Jeu De Rôles", "r": 1, "img": "gba/014.webp", "shot": "shots/gba/014.webp", "d": "Castlevania : Harmony of Dissonance est un jeu d'action/plates-formes sorti sur Gameboy Advance. Incarnez le célèbre chasseur de vampires Juste Balmont 50 ans après avoir battu le terrifiant Comte Dracula, et revisitez un château maudit."}, {"id": "gba_015", "s": "gba", "n": 15, "t": "Crash Bandicoot 2 : N-Tranced", "y": 2003, "dv": "Universal", "p": "Vicarious Visions", "g": "Action", "r": 0, "img": "gba/015.webp", "shot": "shots/gba/015.webp", "d": "Le marsupial le plus connu du jeu vidéo revient avec Crash Bandicoot 2 : N-Tranced, un jeu de plates-formes sur Gameboy Advance. Traversez plus de 40 niveaux composés de nouvelles caisses et de diverses énigmes et venez à bout des nombreux ennemis pour dégager le passage. Le jeu vous donne également la possibilité de défier un ami via le cable Link."}, {"id": "gba_016", "s": "gba", "n": 16, "t": "Crash Bandicoot XS", "y": 2002, "dv": "Vicarious Visions", "p": "", "g": "Tir", "r": 0, "img": "gba/016.webp", "shot": "shots/gba/016.webp", "d": "Crash Bandicoot XS est un jeu d'aventure sur Gameboy Advance qui nous met dans la peau du marsupial le plus connu du jeu vidéo : Crash Bandicoot. Dans cette aventure, son ennemi de toujours, Neo Cortex, est de retour avec encore et des intentions toujours aussi malveillantes. On retrouve les mêmes types de niveaux que dans le 3ème épisodes comme les niveaux en plongée, en Jet Pack ou encore les chevauchées sur le dos d'un ours polaire."}, {"id": "gba_017", "s": "gba", "n": 17, "t": "Digimon : Battle Spirit", "y": 2003, "dv": "Bandai", "p": "Atari", "g": "Combat", "r": 0, "img": "gba/017.webp", "shot": "shots/gba/017.webp", "d": "Digimon Battle Spirit sur Gameboy Advance est un jeu de combat/action en 2D. Dans l'univers de la série vous devez traverser les niveaux le plus vite possible en course contre la montre pour débloquer des personnages. Battez-vous aussi à 2 grâce au câble Link reliant deux consoles entre elles."}, {"id": "gba_018", "s": "gba", "n": 18, "t": "Disney Princesse", "y": 2003, "dv": "Thq", "p": "Disney Interactive", "g": "Plateforme, Puzzle-Game", "r": 0, "img": "gba/018.webp", "shot": "shots/gba/018.webp", "d": "Grâce à Disney Princesse sur Gameboy Advance vous pouvez incarner les plus connues des princesses Disney. A leurs côtés, vous vivez des aventures dans des niveaux connus de tous et issus des grands classiques de Disney."}, {"id": "gba_019", "s": "gba", "n": 19, "t": "DK : King of Swing", "y": 2005, "dv": "Nintendo", "p": "Nintendo", "g": "Stratégie", "r": 0, "img": "gba/019.webp", "shot": "shots/gba/019.webp", "d": "DK : King of Swing sur GBA est un jeu d'action/plates-formes dans lequel vous dirigez le fameux gorille et son fils Diddy dans la jungle afin de retrouver les médailles perdues. Balancez-vous de liane en liane avec les gâchettes de la console. A vous d'utiliser les lianes et les mouvements appris à bon escient afin de sauver la fête organisée."}, {"id": "gba_020", "s": "gba", "n": 20, "t": "Donkey Kong Country", "y": 2003, "dv": "Rareware", "p": "Nintendo", "g": "Action", "r": 0, "img": "gba/020.webp", "shot": "shots/gba/020.webp", "d": "Dans Donkey Kong Country sur Gameboy Advance, vous incarnez le célèbre gorille de Nintendo. Le King K. Rool a volé les bananes de Donkey qui décide alors de partir à sa recherche pour les récupérer. Deux personnages sont jouables, Donkey est plus grand et plus fort, alors que Diddy est plus rapide. Il est possible de jouer à deux, soit chacun son tour, soit en équipe. Des animaux vous aideront à franchir certains niveaux et à vaincre les Kremlings."}, {"id": "gba_021", "s": "gba", "n": 21, "t": "Donkey Kong Country 2", "y": 2004, "dv": "Rareware", "p": "Nintendo", "g": "Action", "r": 0, "img": "gba/021.webp", "shot": "shots/gba/021.webp", "d": "Donkey Kong Country 2 : Diddy's Kong Quest sur Gameboy Advance est un jeu d'action/plates-formes bondissant. Guidez Diddy ou Dixie Kong à travers huit mondes d'action délirants sur l'Ile Crocodile. Mais attention aux Kremlings ! Découvrez des secrets, apprenez de nouvelles techniques, rencontrez d'autres membres du clan Kong et contrôlez de nouveaux amis animaux, comme Squitter l'araignée ou Rattly le serpent à sonnette."}, {"id": "gba_022", "s": "gba", "n": 22, "t": "Donkey Kong Country 3", "y": 2005, "dv": "Rareware", "p": "Nintendo", "g": "Plateforme", "r": 0, "img": "gba/022.webp", "shot": "shots/gba/022.webp", "d": "Les Kremlings ont frappé fort cette fois en kidnappant Donkey et Diddy Kong ! Dixie et Kiddy doivent donc s'allier dans Donkey Kong Country 3, dernier volet sur GBA de la trilogie du gorille à cravate. Sautez de branches en rochers pour retrouver vos amis, traquez les oiseaux-bananes, faites-vous aider par d'autres animaux, coopérez à deux joueurs et défaites Kaos, le nouveau maître Kremling."}, {"id": "gba_023", "s": "gba", "n": 23, "t": "Doom", "y": 2001, "dv": "Activision", "p": "Id Software", "g": "Action, Tir", "r": 0, "img": "gba/023.webp", "shot": "shots/gba/023.webp", "d": "Doom sur Gameboy Advance est un jeu de tir à la première personne. La planète Mars est envahie par des créatures de l'enfer à la suite de plusieurs expériences scientifiques. Vous incarnez un Space Marine qui a été condamné à des travaux forcés sur la planète rouge. Se retrouvant seul dans la base humaine, il tente de survivre en éliminant tous les monstres autour de lui."}, {"id": "gba_024", "s": "gba", "n": 24, "t": "Doom II", "y": 2002, "dv": "Activision", "p": "Id Software", "g": "Action, Tir", "r": 0, "img": "gba/024.webp", "shot": "shots/gba/024.webp", "d": "Doom II est un jeu de tir à la première personne sur GBA. Vous incarnez un space marine qui arrive sur Terre pour s'apercevoir que les démons ont envahi la planète. Le jeu propose de nouvelles armes telles que le super shotgun ainsi que de nouveaux ennemis plus dangereux."}, {"id": "gba_025", "s": "gba", "n": 25, "t": "Dragon Ball : Advanced Adventure", "y": 2005, "dv": "Atari", "p": "Dimps", "g": "Action, Action / Aventure, Jeu De Rôles", "r": 0, "img": "gba/025.webp", "shot": "shots/gba/025.webp", "d": "Dragon Ball : Advanced Adventure sur GBA est un jeu d'action/aventure dans lequel vous revivez les aventures du jeune Sangoku, depuis son entraînement avec Tortue Géniale jusqu'à son affrontement avec Piccolo. Dirigez Goku ou Krilin et utilisez le nuage supersonique, le bâton magique et le kamehameha pour sortir des niveaux et ramasser les sept boules de cristal."}, {"id": "gba_026", "s": "gba", "n": 26, "t": "Dragon Ball Z : L'Héritage de Goku 2", "y": 2003, "dv": "Atari", "p": "Webfoot", "g": "Jeu De Rôles", "r": 0, "img": "gba/026.webp", "shot": "shots/gba/026.webp", "d": "Faisant suite directe à son prédécesseur, Dragon Ball Z : L'Héritage de Goku 2 reprend là où l'autre s'est arrêté. Après sa victoire sur Namek, Goku revient sur terre affronter les cyborgs et Cell. Toujours à mi-chemin entre l'action et le jeu de rôle, le titre propose cinq personnages jouables avec les coups et les techniques qui les accompagnent. Devenez suffisamment puissant pour repousser les invasions qui menacent la planète."}, {"id": "gba_027", "s": "gba", "n": 27, "t": "Duke Nukem Advance", "y": 2002, "dv": "Torus Games", "p": "Take 2 Interactive", "g": "Tir, Tir / 1Ere Personne, Action, Jeu De Rôles", "r": 0, "img": "gba/027.webp", "shot": "shots/gba/027.webp", "d": "Duke Nukem Advance est un jeu de tir à la première personne sorti sur Gameboy Advance. Aidez Duke à arrêter les scientifiques qui ont pris possession de la zone 51. Pour cela, vous disposerez de 9 armes surpuissantes dont le rayon réducteur."}, {"id": "gba_028", "s": "gba", "n": 28, "t": "F-Zero : GP Legend", "y": 2004, "dv": "Nintendo", "p": "Nintendo", "g": "Course, Conduite", "r": 0, "img": "gba/028.webp", "shot": "shots/gba/028.webp", "d": "F-Zero : GP Legend est un jeu de courses futuriste sur Gameboy Advance. Incarnez un des huit pilotes disponibles, et entrez dans la compétition pour tenter de remporter le titre de champion. Aux commandes de machines supersoniques, atteignez des vitesses vertigineuses et régalez la foule de vos exploits."}, {"id": "gba_029", "s": "gba", "n": 29, "t": "F-Zero : Maximum Velocity", "y": 2001, "dv": "Nintendo", "p": "Nintendo", "g": "Course, Conduite", "r": 0, "img": "gba/029.webp", "shot": "shots/gba/029.webp", "d": "F-Zero : Maximum Velocity est un jeu de courses futuriste développé sur Gameboy Advance. Avec une concentration sans faille, parcourez 5 tours de piste et gagnez une des quinzaines de courses proposées. Votre résistance à la vitesse est grandement mise à l'épreuve dans ce titre avec plus de 600 km/h dans la vue !"}, {"id": "gba_030", "s": "gba", "n": 30, "t": "Final Fantasy I & II : Dawn of Souls", "y": 2004, "dv": "Nintendo", "p": "Square Enix", "g": "Jeu De Rôles", "r": 1, "img": "gba/030.webp", "shot": "shots/gba/030.webp", "d": "Final Fantasy I & II : Dawn of Souls sur GBA regroupe les deux premiers épisodes des jeux de rôles Final Fantasy dans leur nouvelle version. Aidez les quatre Guerriers de la Lumière à restaurer l'ordre dans leur monde chaotique. Vivez également l'expérience de Renaissance, la saga jamais racontée des héros qui ont donné leur vie pour sauver le monde."}, {"id": "gba_031", "s": "gba", "n": 31, "t": "Final Fantasy IV Advance", "y": 2006, "dv": "Nintendo", "p": "Square Enix", "g": "Jeu De Rôles", "r": 1, "img": "gba/031.webp", "shot": "shots/gba/031.webp", "d": "Final Fantasy IV est la réédition sur Gameboy Advance du jeu de rôle sorti sur Super Nintendo. De puissants cristaux ont été cachés pour éviter qu'ils ne tombent entre de mauvaises mains. Cependant le roi Baron décide de s'en emparer et envoie son loyal chevalier Cécil pour les retrouver. Au cours de sa quête et en rencontrant de nombreux personnages, Cécil s'opposera à la volonté du roi et tentera d'empêcher Golbez de retrouver les cristaux."}, {"id": "gba_032", "s": "gba", "n": 32, "t": "Final Fantasy Tactics Advance", "y": 2003, "dv": "Square Enix", "p": "Nintendo", "g": "Jeu De Rôles", "r": 2, "img": "gba/032.webp", "shot": "shots/gba/032.webp", "d": "Final Fantasy Tactics Advance est un jeu de rôle tactique sorti sur Gameboy Advance. Contrôlez un petit groupe d'aventuriers déambulant dans Ivalice, un pays rempli de créatures étranges et de juges mystérieux qui arbitrent les combats. Faites évoluer votre personnage et votre clan."}, {"id": "gba_033", "s": "gba", "n": 33, "t": "Final Fantasy V Advance", "y": 2007, "dv": "Square Enix", "p": "Square Enix", "g": "Jeu De Rôles", "r": 1, "img": "gba/033.webp", "shot": "shots/gba/033.webp", "d": "Final Fantasy V Advance est un jeu de rôle sur Gameboy Advance. Déjà sorti en 1992 sur Super Famicom, le titre plonge le joueur dans un univers fantastique. Explorez les trois mondes différents qui se présentent à vous en suivant la quête principale du titre, et faites évoluer vos personnages en leur faisant gagner de l'expérience."}, {"id": "gba_034", "s": "gba", "n": 34, "t": "Final Fantasy VI Advance", "y": 2007, "dv": "Square Enix", "p": "Square Enix", "g": "Jeu De Rôles, Combat", "r": 1, "img": "gba/034.webp", "shot": "shots/gba/034.webp", "d": "Final Fantasy VI est la réédition sur GBA du troisième épisode sorti sur Super Nintendo et qui marque un tournant dans la saga des Final Fantasy avec son côté plus sombre et tragique que précédents volets. 1000 ans après une guerre terrible, la magie a presque entièrement disparu au profit de la technologie Magitek qui donne à l'Empire le plein pouvoir sur le Monde. Les Returners, un groupe de rebelles mené par le héros Lock tente de se dresser devant la puissance de l'Empire."}, {"id": "gba_035", "s": "gba", "n": 35, "t": "Fire Emblem", "y": 2004, "dv": "Intelligent Systems", "p": "Nintendo", "g": "Stratégie, Jeu De Rôles", "r": 2, "img": "gba/035.webp", "shot": "shots/gba/035.webp", "d": "Fire Emblem est un jeu de rôle stratégique sur Gameboy Advance. Lin, Eliwood et Hector doivent unir leurs forces pour sauver le monde du chaos. Usez de votre esprit tactique pour les guider dans leur quête. Formez vos troupes et élaborez une stratégie de combat pour venir à bout de vos adversaires et ainsi gagner la bataille."}, {"id": "gba_036", "s": "gba", "n": 36, "t": "Fire Emblem : The Sacred Stones", "y": 2005, "dv": "Intelligent Systems", "p": "Nintendo", "g": "Stratégie, Action", "r": 1, "img": "gba/036.webp", "shot": "shots/gba/036.webp", "d": "Dans le jeu de rôle Fire Emblem : The Sacred Stones sur GBA, vous devez aider Erika et Ephraim à reconstruire Renais et à découvrir la cause de la guerre qui a ravagé leur nation. Naviguez dans le monde avec le système de changement de classe qui vous permet de spécialiser vos personnages dans un ou plusieurs domaines pour les rendre plus forts."}, {"id": "gba_037", "s": "gba", "n": 37, "t": "Gadget Racers", "y": 2004, "dv": "Takara", "p": "Takara", "g": "Course, Conduite", "r": 0, "img": "gba/037.webp", "shot": "shots/gba/037.webp", "d": "Gadget Racers : Prenez votre volant et préparez-vous pour la course de votre vie! Equipez votre voiture avec plus de 120 gadgets, y compris des pièces qui vous aident à planer au-dessus de la concurrence ou à nager comme un poisson. Affrontez des conditions météorologiques difficiles, des sauts défiant la mort, des virages en épingle à cheveux et bien plus encore alors que vous vous dirigez vers la première place. Préparez-vous à brûler du caoutchouc avec Gadget Racers!"}, {"id": "gba_038", "s": "gba", "n": 38, "t": "Golden Sun", "y": 2002, "dv": "Camelot Software", "p": "Nintendo", "g": "Jeu De Rôles", "r": 3, "img": "gba/038.webp", "shot": "shots/gba/038.webp", "d": "Golden Sun est un jeu de rôle sur Gameboy Advance. A l'aide de vos compagnons, vous devrez tenter d'arrêter les forces du mal qui rongent ce monde. Ces dernières tentent de trouver l'alchimie, une science disparue terriblement puissante."}, {"id": "gba_039", "s": "gba", "n": 39, "t": "Golden Sun : L'Âge Perdu", "y": 2003, "dv": "Camelot Software", "p": "Nintendo", "g": "Jeu De Rôles, Sport", "r": 2, "img": "gba/039.webp", "shot": "shots/gba/039.webp", "d": "Golden Sun : L'Age Perdu est un jeu de rôle sorti sur Gameboy Advance. Second volet de la saga Golden Sun, cet opus vous permet de récupérer l'équipe du premier jeu pour terminer celui-ci et aussi d'affronter vos amis en multijoueur grâce au câble link."}, {"id": "gba_040", "s": "gba", "n": 40, "t": "Grand Theft Auto Advance", "y": 2004, "dv": "Rockstar Games", "p": "Take 2 Interactive", "g": "", "r": 0, "img": "gba/040.webp", "shot": "shots/gba/040.webp", "d": "Grand Theft Auto est un jeu d'action sur Gameboy Advance dans lequel vous incarnez un gangster traqué par la police et par nombre d'autres truands de la ville. Votre ami Vinnie a été tué alors qu'il avait avec lui tout l'argent vous permettant de quitter la sombre ville de Liberty City en toute tranquillité. Retrouvez les assassins, et vengez votre compagnon. Vous n'êtes pas encore près d'arrêter vos méfaits..."}, {"id": "gba_041", "s": "gba", "n": 41, "t": "Gunstar Future Heroes", "y": 2005, "dv": "Treasure", "p": "Sega", "g": "Action, Puzzle-Game", "r": 0, "img": "gba/041.webp", "shot": "shots/gba/041.webp", "d": "Gunstar Future Heroes sur GBA est un jeu d'action ultra-rapide dans lequel votre but est de sauver le monde d'un grand méchant pas beau que vos ennemis veulent ramener à la vie grâce à un cristal magique. Incarnez Rouge ou Bleu, deux membres de Gunstars et frayez-vous un passage dans les niveaux en nettoyant le chemin avec vos puissantes armes."}, {"id": "gba_042", "s": "gba", "n": 42, "t": "Hamtaro : Ham-Ham Games", "y": 2004, "dv": "Nintendo", "p": "Alpha Dream", "g": "Puzzle-Game", "r": 0, "img": "gba/042.webp", "shot": "shots/gba/042.webp", "d": "Hamtaro : Ham-Ham Games est un jeu de sport sur GBA destiné aux plus jeunes. Les célèbres hamsters sont bien sûr à l'honneur et devront accomplir une quinzaine d'épreuves telles que le sprint 100 mètres, le tournoi de tennis, le lancer de marteau, le plongeon, le tir à l'arc ou encore le beach-volley."}, {"id": "gba_043", "s": "gba", "n": 43, "t": "Hamtaro : Rainbow Rescue", "y": 2004, "dv": "Nintendo", "p": "Nintendo", "g": "Aventure", "r": 0, "img": "gba/043.webp", "shot": "shots/gba/043.webp", "d": "Hamtaro : Rainbow Rescue est un jeu d'aventure sur GBA. Dans cet épisode, un hamster venu des étoiles débarque sur Terre. Seul souci, il a dispersé les sept couleurs de l'arc-en-ciel pendant sa chute. Les hamsters terriens reçoivent donc la tâche de réunir sept objets qui permettront de reconstituer l'arc-en-ciel."}, {"id": "gba_044", "s": "gba", "n": 44, "t": "Harvest Moon : Friends of Mineral Town", "y": 2004, "dv": "Marvelous Interactive", "p": "Natsume", "g": "Simulation, Action", "r": 0, "img": "gba/044.webp", "shot": "shots/gba/044.webp", "d": "Harvest Moon : Friends of Mineral Town est un jeu de rôle et de gestion sur GBA dans lequel vous devez rajeunir une ferme et vous occuper convenablement de votre entourage (famille et amis). L'héroïne a désormais la possibilité de se marier et d'avoir des enfants. Quelques mini-jeux sont aussi au programme."}, {"id": "gba_045", "s": "gba", "n": 45, "t": "Kingdom Hearts : Chain of Memories", "y": 2005, "dv": "Square Enix", "p": "Nintendo", "g": "Action", "r": 0, "img": "gba/045.webp", "shot": "shots/gba/045.webp", "d": "Kingdom Hearts : Chain of Memories sur GBA est un jeu d'action/aventure faisant le lien entre les deux opus PS2. Ici, le système de combat change légèrement puisqu'il s'agit de combats utilisant des cartes. Vous frappez vos ennemis avec votre keyblade mais la puissance de vos coups dépend de celle de vos cartes. Découvrez donc les évènements qui ont conduit Sora à sombrer dans un sommeil artificiel."}, {"id": "gba_046", "s": "gba", "n": 46, "t": "Kirby & the Amazing Mirror", "y": 2004, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme, Action, Puzzle-Game", "r": 1, "img": "gba/046.webp", "shot": "shots/gba/046.webp", "d": "Kirby and the Amazing Mirror est un jeu de plates-formes sur GBA. En plus de ses habituelles capacités (flotter dans l'air et aspirer ses ennemis), le petite boule rose possède désormais des pouvoirs angéliques qui lui donnent des ailes, un arc et des flèches, ainsi qu'un téléphone portable pour communiquer avec d'autres personnages du jeu."}, {"id": "gba_047", "s": "gba", "n": 47, "t": "Kirby : Nightmare in Dream Land", "y": 2003, "dv": "Hal Laboratory", "p": "Nintendo", "g": "Plateforme, Jeu De Rôles", "r": 1, "img": "gba/047.webp", "shot": "shots/gba/047.webp", "d": "Kirby's Adventure sur Gameboy Advance est un jeu de plates-formes dans lequel vous dirigez une petite boule de gomme rose qui a la faculté d'aspirer ses ennemis pour s'approprier leurs pouvoirs. Votre but est de rassembler les fragments du Bâton Etoile volé par le Roi Dadidou pour que les résidents du Pays des Rêves puissent de nouveau dormir sur leurs deux oreilles."}, {"id": "gba_048", "s": "gba", "n": 48, "t": "Klonoa : Empire of Dreams", "y": 2002, "dv": "Namco", "p": "Namco", "g": "Puzzle-Game", "r": 0, "img": "gba/048.webp", "shot": "shots/gba/048.webp", "d": "Klonoa : Empire of Dreams est un jeu de plates-formes sorti sur Gameboy Advance. Un méchant tyran a décrété que rêver était interdit. Et bien entendu vous incarnez un héros qui a enfreint cette règle et se retrouve enfermé. Vous devrez vous évader et bouter les méchants hors du royaume."}, {"id": "gba_049", "s": "gba", "n": 49, "t": "Kurukuru Kururin", "y": 2001, "dv": "Nintendo", "p": "Nintendo", "g": "Réflexion, Action", "r": 0, "img": "gba/049.webp", "shot": "shots/gba/049.webp", "d": "Kuru Kuru Kururin est un jeu de réflexion sur Gameboy Advance. Dans ce soft, vous dirigez un bâton qui est en rotation permanente sur lui-même à travers divers environnements semés d'embûches. Kuru Kuru Kururin demande au joueur de l'adresse, de la concentration et beaucoup de réflexes."}, {"id": "gba_050", "s": "gba", "n": 50, "t": "Mario & Luigi : Superstar Saga", "y": 2003, "dv": "Alpha Dream", "p": "Nintendo", "g": "Jeu De Rôles, Sport", "r": 2, "img": "gba/050.webp", "shot": "shots/gba/050.webp", "d": "Mario & Luigi : Superstar Saga est un jeu de rôle sorti sur Gameboy Advance. Incarnez les frères Mario et d'autres personnages Nintendo (même Bowser) et aidez-les à sauver la princesse Peach transformée en bombe humaine dans ce jeu aux combats innovants."}, {"id": "gba_051", "s": "gba", "n": 51, "t": "Mario Golf : Advance Tour", "y": 2004, "dv": "Camelot Software", "p": "Nintendo", "g": "Sport, Course, Conduite", "r": 1, "img": "gba/051.webp", "shot": "shots/gba/051.webp", "d": "Jouez au golf avec le célèbre Mario accompagné de toute sa bande dans Mario Golf : Tour Advance. Cet opus sur Gameboy Advance se compose de plusieurs parcours, de nombreux modes de jeu et de différents personnages jouables pour des heures de plaisir seul ou entre amis, via le système link."}, {"id": "gba_052", "s": "gba", "n": 52, "t": "Mario Kart : Super Circuit", "y": 2001, "dv": "Intelligent Systems", "p": "Nintendo", "g": "Course, Conduite", "r": 3, "img": "gba/052.webp", "shot": "shots/gba/052.webp", "d": "Mario revient à fond les manettes dans le jeu de courses Mario Kart : Super Circuit sur Gameboy Advance. Vingt nouveaux circuits, des bonus classiques et des heures de courses sont au programme de ce soft. Le mode Grand Prix, le mode Bataille ainsi que la possibilité d'affronter vos amis sont également présents."}, {"id": "gba_053", "s": "gba", "n": 53, "t": "Mario Party Advance", "y": 2005, "dv": "Nintendo", "p": "Nintendo", "g": "Divers", "r": 1, "img": "gba/053.webp", "shot": "shots/gba/053.webp", "d": "Mario Party débarque en version portable avec cette version Advance sur GBA. Cette fois, vous partirez à l'aventure en solo : Bowser a éparpillé les mini-jeux et les Katatrucs aux quatre coins de Champiville. Trouvez et jouez aux mini-jeux et Katatrucs obtenus et affontez vos amis ! Vous pouvez également vous connecter pour partager vos trouvailles avec eux !"}, {"id": "gba_054", "s": "gba", "n": 54, "t": "Mario Power Tennis", "y": 2005, "dv": "Camelot Software", "p": "Nintendo", "g": "Sport", "r": 1, "img": "gba/054.webp", "shot": "shots/gba/054.webp", "d": "Mario Power Tennis sur GBA met en scène les personnages de l'univers du plombier moustachu. Ils sont tous de retour avec des coups encore plus puissants et des actions propres à chacun. Jetez des bananes comme des boomerang à la manière Donkey Kong et renvoyez la balle avec le marteau de Mario ! En plus des matches classiques, retrouvez une grande variété de mini-jeux en rapport avec le tennis !"}, {"id": "gba_055", "s": "gba", "n": 55, "t": "Mario vs. Donkey Kong", "y": 2004, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 1, "img": "gba/055.webp", "shot": "shots/gba/055.webp", "d": "Mario affronte une nouvelle fois son meilleur ennemi dans Mario vs. Donkey Kong sur Gameboy Advance, un jeu mêlant de la plate-forme et de la réflexion. Véritable hommage au mythique Donkey Kong sorti en arcade dans les années 80, le célèbre plombier moustachu doit franchir de nombreux niveaux à la difficulté accrue afin de récupérer les objets que lui a dérobé le gorille."}, {"id": "gba_056", "s": "gba", "n": 56, "t": "Medal of Honor : Underground", "y": 2003, "dv": "Destination Software", "p": "Ubisoft", "g": "Tir", "r": 0, "img": "gba/056.webp", "shot": "shots/gba/056.webp", "d": "Dans Medal of Honor : Underground, jeu de tir sur Gameboy Advance, vous jouez le rôle d'une résistante, Manon, et devrez contrecarrer les plans du troisième Reich en effectuant plusieurs missions qui vous mèneront de Paris à l'Afrique du Nord. Vos objectifs iront de l'assassinat de hauts dignitaires allemands, à la récupération de reliques, la photographie de documents secrets, etc. Trois modes de difficulté sont au programme pour un total de 17 niveaux à parcourir."}, {"id": "gba_057", "s": "gba", "n": 57, "t": "Mega Man & Bass", "y": 2003, "dv": "Capcom", "p": "Capcom", "g": "Action, Tir", "r": 0, "img": "gba/057.webp", "shot": "shots/gba/057.webp", "d": "Dans le jeu d'action plates-formes Mega Man & Bass sur GBA, un nouveau vilain fait son apparition. Il s'agit de King qui souhaite éliminer les humains pour bâtir un nouveau monde pour les robots. Mega Man s'élève contre ce projet et doit récupérer tous les robots de la base de données du Dr Light avant que King ne s'en empare. Bass, l'un des robots du Dr Wily est aussi sur le coup pour prouver qu'il est meilleur que Mega Man."}, {"id": "gba_058", "s": "gba", "n": 58, "t": "Mega Man Battle Network", "y": 2001, "dv": "Capcom", "p": "Capcom", "g": "Action, Jeu De Rôles", "r": 0, "img": "gba/058.webp", "shot": "shots/gba/058.webp", "d": "Mega Man Battle Network sur GBA marque le point de départ d'une toute nouvelle série basée sur l'univers du robot. Dans celle-ci, le joueur incarne à la fois un petit garçon dans le monde réel et son double virtuel qui évolue dans son ordinateur. Dans ce jeu de rôle tactique, vous devez déjouer les plans du Dr. Wily qui propage des virus dans le réseau mondial. Les combats du titre se déroulent sur un quadrillage et exigent de votre part une grande dose de tactique."}, {"id": "gba_059", "s": "gba", "n": 59, "t": "Mega Man Battle Network 2", "y": 2002, "dv": "Capcom", "p": "Capcom", "g": "Jeu De Rôles", "r": 0, "img": "gba/059.webp", "shot": "shots/gba/059.webp", "d": "Mega Man Battle Network 2 sur GBA se situe trois mois après le premier épisode. Nous retrouvons le jeune Lan et son incarnation virtuelle Mega Man dans ce jeu de rôle tactique. Alternant toujours entre les deux mondes (réel et cybernétique), le joueur doit cette fois arrêter les sombres plans de la NetMafia."}, {"id": "gba_060", "s": "gba", "n": 60, "t": "Mega Man Zero", "y": 2002, "dv": "Inti Creates", "p": "Capcom", "g": "Action", "r": 1, "img": "gba/060.webp", "shot": "shots/gba/060.webp", "d": "Avec Mega Man Zero sur GBA, la célèbre franchise de Capcom démarre une nouvelle série. Celle-ci met en avant le personnage de Zero qui avait combattu aux côtés de X dans les Mega Man X. L'histoire de Zero permet de se plonger au milieu d'un conflit entre Reploids et Mavericks. Via le QG des rebelles Reploids, plusieurs missions vous attendent dans ce jeu d'action/plates-formes."}, {"id": "gba_061", "s": "gba", "n": 61, "t": "Mega Man Zero 2", "y": 2002, "dv": "Inti Creates", "p": "Capcom", "g": "Action", "r": 1, "img": "gba/061.webp", "shot": "shots/gba/061.webp", "d": "Après avoir vaincu Copy X dans le premier volet, Zero doit de nouveau partir au combat puisque la bataille entre Neo Arcadia et la Resistance fait toujours rage. Mega Man Zero 2 est un jeu d'action/plates-formes sur GBA dans lequel vous devrez parcourir plusieurs niveaux thématiques conduisant à des boss différents qu'il faudra bien évidemment vaincre."}, {"id": "gba_062", "s": "gba", "n": 62, "t": "Mega Man Zero 3", "y": 2004, "dv": "Inti Creates", "p": "Capcom", "g": "Action", "r": 1, "img": "gba/062.webp", "shot": "shots/gba/062.webp", "d": "Zero et son sabre laser sont de retour pour faire régner la justice dans le jeu d'action/plates-formes Mega Man Zero 3. Cette cartouche GBA livre le troisième chapitre des aventures du héros dans son combat contre Neo Arcadia. Plusieurs niveaux vous ouvrent leurs portes. Il faudra les parcourir, éliminer les ennemis qui grouillent à l'intérieur et vaincre les boss qui vous attendent à la fin de chaque zone."}, {"id": "gba_063", "s": "gba", "n": 63, "t": "Mega Man Zero 4", "y": 2005, "dv": "Inti Creates", "p": "Capcom", "g": "Action, Simulation", "r": 1, "img": "gba/063.webp", "shot": "shots/gba/063.webp", "d": "Le Dr. Weil dirige Neo Arcadia d'une main de fer conduisant plusieurs humains à s'enfuir vers Aera Zero. Une guerre fratricide éclate finalement entre les deux parties. Zero et la Résistance se rangent du côté d'Area Zero et ferront tout pour éliminer la menace de Neo Arcadia. Ce jeu d'action/plates-formes se compose de plusieurs niveaux remplis d'ennemis et de boss à abattre."}, {"id": "gba_064", "s": "gba", "n": 64, "t": "Metal Slug Advance", "y": 2004, "dv": "Noise Factory", "p": "Snk", "g": "Action, Tir", "r": 0, "img": "gba/064.webp", "shot": "shots/gba/064.webp", "d": "Dans Metal Slug Advance sur Gameboy Advance, vous incarnez Walter et Tyra, deux nouvelles recrues du PF Squad attaquées par des ennemis non identifiés. Prouvez vos techniques de combat et votre capacité à survivre en territoire hostile dans ce jeu orienté action. Déplacez-vous à pied ou dans de nombreux véhicules pour anéantir l'ennemi."}, {"id": "gba_065", "s": "gba", "n": 65, "t": "Metroid : Zero Mission", "y": 2004, "dv": "Nintendo", "p": "Nintendo", "g": "Action, Action / Aventure, Course, Conduite", "r": 2, "img": "gba/065.webp", "shot": "shots/gba/065.webp", "d": "Dans ce nouvel épisode de la saga Metroid, retrouvez la célèbre Samus Aran pour de nouvelles aventures. Metroid : Zero Mission, un jeu d'action/plates-formes, puise sa source dans chacun des épisodes précédents, depuis le volet originel sur NES jusqu'au volet sorti sur Gamecube, et vous propose toujours de venir à bout de nombreux ennemis pas très recommandables."}, {"id": "gba_066", "s": "gba", "n": 66, "t": "Metroid Fusion", "y": 2002, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 3, "img": "gba/066.webp", "shot": "shots/gba/066.webp", "d": "Metroid Fusion est un jeu d'action sorti sur Gameboy Advance. Retrouvez l'héroïne Samus Aran dans une aventure où elle délaisse sa traditionnelle armure orange pour une nouvelle combinaison bleu plus légère. Cette fois-ci, Samus lutte contre une infection intérieure."}, {"id": "gba_067", "s": "gba", "n": 67, "t": "Mr. Driller 2", "y": 2005, "dv": "Atari", "p": "Namco", "g": "Stratégie, Puzzle-Game", "r": 0, "img": "gba/067.webp", "shot": "shots/gba/067.webp", "d": "Mr. Driller 2 est un puzzle-game sur Gameboy Advance. Choisissez d'incarner Susumu ou Anna et partez à l'aventure dans ce jeu mêlant adresse et réflexion. Le but est simple : vous contrôlez un petit personnage qui doit descendre dans le niveau. Pour cela, vous devez vous placer sur une série de cubes de la même couleur, pour qu'ils disparaissent sous vos pieds. Mais attention à ne pas vous faire écraser !"}, {"id": "gba_068", "s": "gba", "n": 68, "t": "Ninja Cop", "y": 2003, "dv": "Konami", "p": "Konami", "g": "Puzzle-Game", "r": 0, "img": "gba/068.webp", "shot": "shots/gba/068.webp", "d": "Incarnez un justicier ninja dans Ninja Cop sur Gameboy Advance. A travers 6 missions réparties dans 20 niveaux, vous devrez lutter contre le crime et maîtriser des techniques de ninja avec ce jeu d'action plates-formes."}, {"id": "gba_069", "s": "gba", "n": 69, "t": "Pac-Man Collection", "y": 2001, "dv": "Namco", "p": "Infogrames", "g": "Action, Puzzle-Game", "r": 0, "img": "gba/069.webp", "shot": "shots/gba/069.webp", "d": "Pac-Man Collection est un jeu d'action sur Gameboy Advance. Jouez avec le glouton Pac-Man et avalez tout sur votre passage : fantômes, billes et fruits. Découvrez le mode Arcade Pac-Man Arrangement spécial, avec des niveaux en 3D, des coups spéciaux, des pouvoirs et des gros fantômes."}, {"id": "gba_070", "s": "gba", "n": 70, "t": "Pokémon : Version Emeraude", "y": 2005, "dv": "Game Freak", "p": "Nintendo", "g": "Jeu De Rôles", "r": 4, "img": "gba/070.webp", "shot": "shots/gba/070.webp", "d": "Pokémon Version Emeraude sur Gameboy Advance est un jeu de rôle prenant pour cadre l'univers chamarré de la célèbre série. Accompagnez un chasseur de ces étranges bestioles et tentez de récupérer un exemplaire de chaque monstre existant. S'il est possible d'en gagner via des duels contre d'autres dresseurs, il vous faudra le plus souvent passer au peigne fin les divers environnements que vous serez amené à parcourir."}, {"id": "gba_071", "s": "gba", "n": 71, "t": "Pokémon : Version Rouge Feu", "y": 2004, "dv": "Game Freak", "p": "Nintendo", "g": "Jeu De Rôles", "r": 4, "img": "gba/071.webp", "shot": "shots/gba/071.webp", "d": "Une nouvelle aventure pleine de mystères vous attend dans le jeu de rôle Pokémon Version Rouge Feu sur Gameboy Advance. ! La région de Kanto réserve bien des épreuves et seuls les vrais dresseurs de Pokémon pourront toutes les surmonter ! Attrapez et dressez un maximum de monstres de poches puis recevez la reconnaissance de la Ligue Pokémon en affrontant seul la redoutable Team Rocket."}, {"id": "gba_072", "s": "gba", "n": 72, "t": "Pokémon : Version Rubis", "y": 2003, "dv": "Game Freak", "p": "Nintendo", "g": "Jeu De Rôles", "r": 2, "img": "gba/072.webp", "shot": "shots/gba/072.webp", "d": "Pokémon Version Rubis est un jeu de rôle sorti sur Gameboy Advance. Dirigez un dresseur de Pokémons qui doit devenir le meilleur d'entre tous. Pour cela, capturez des créatures et faites-les évoluer pour qu'elless deviennent de plus en plus fortes afin de battre la ligue Pokémon."}, {"id": "gba_073", "s": "gba", "n": 73, "t": "Pokémon : Version Saphir", "y": 2003, "dv": "Game Freak", "p": "Nintendo", "g": "Jeu De Rôles", "r": 2, "img": "gba/073.webp", "shot": "shots/gba/073.webp", "d": "Pokémon Version Saphir est un jeu de rôle sorti sur Gameboy Advance. Dirigez un dresseur de Pokémons qui doit devenir le meilleur d'entre tous. Pour cela, capturez des créatures et faites-les évoluer pour qu'elless deviennent de plus en plus fortes afin de battre la ligue Pokémon."}, {"id": "gba_074", "s": "gba", "n": 74, "t": "Pokémon : Version Vert Feuille", "y": 2004, "dv": "Game Freak", "p": "The Pokémon Company", "g": "Jeu De Rôles", "r": 2, "img": "gba/074.webp", "shot": "shots/gba/074.webp", "d": "Une nouvelle aventure pleine de mystères vous attend dans le jeu de rôle Pokémon Version Vert Feuille sur Gameboy Advance ! La région de Kanto réserve bien des épreuves et seuls les vrais dresseurs de Pokémon pourront toutes les surmonter ! Attrapez et dressez un maximum de monstres de poches puis recevez la reconnaissance de la Ligue Pokémon en affrontant seul la redoutable Team Rocket."}, {"id": "gba_075", "s": "gba", "n": 75, "t": "Pokémon Donjon Mystère : Equipe de Secours Rouge", "y": 2006, "dv": "Chunsoft", "p": "Nintendo", "g": "", "r": 0, "img": "gba/075.webp", "shot": "shots/gba/075.webp", "d": "Pokémon Donjon Mystère : Equipe de Secours Rouge sur GBA vous propose une aventure particulière puisque la cartouche vous place dans la peau d'un Pokémon ! Vous vous réveillez un matin transformé en l'une de ces créatures et découvrez un monde ravagé par des catastrophes naturelles inexplicables. Vous décidez de monter un groupe de secours avec votre équipier pour découvrir ce qui se cache derrière tout ça."}, {"id": "gba_076", "s": "gba", "n": 76, "t": "Pokémon Pinball : Rubis & Saphir", "y": 2003, "dv": "Jupiter Corporation", "p": "Nintendo", "g": "Flipper", "r": 0, "img": "gba/076.webp", "shot": "shots/gba/076.webp", "d": "Pokémon Pinball : Rubis & Saphir est un jeu de flipper sur Gameboy Advance. Jouez au flipper comme d'habitude mais remplacez la bille par une Pokéball avec laquelle vous pourrez capturer les quelques 200 Pokémon qui se baladent sur les plateaux de jeu."}, {"id": "gba_077", "s": "gba", "n": 77, "t": "Prince of Persia : The Sands of Time", "y": 2003, "dv": "Ubisoft", "p": "Nintendo", "g": "Action", "r": 0, "img": "gba/077.webp", "shot": "shots/gba/077.webp", "d": "Prince of Persia : Les Sables du Temps est un jeu de plates-formes/action sur Gameboy Advance. Vous incarnez à nouveau le jeune prince qui commet l'erreur d'ouvrir un sablier maléfique condamnant immédiatement les âmes des habitants du palais. Le diabolique Vizir est encore une fois derrière tout ça, et c'est en arpentant le palais secondé par Farah que le joueur devra mettre un terme à la malédiction."}, {"id": "gba_078", "s": "gba", "n": 78, "t": "Puyo Pop", "y": null, "dv": "Sonic Team", "p": "Sega", "g": "Puzzle-Game", "r": 0, "img": "gba/078.webp", "shot": "shots/gba/078.webp", "d": "Aidez Arle et Carbuncle à rentrer chez eux ! Affrontez tous les personnages farfelus que vous rencontrez dans Puyo Pop. C'est une course folle pour effacer Puyo, créer des réactions en chaîne et remplir le terrain de jeu de votre adversaire dans ce puzzle game au rythme effréné."}, {"id": "gba_079", "s": "gba", "n": 79, "t": "Rayman 3", "y": 2003, "dv": "Ubisoft", "p": "Ubisoft", "g": "Action, Plateforme", "r": 0, "img": "gba/079.webp", "shot": "shots/gba/079.webp", "d": "Rayman 3 est un jeu de plates-formes sorti sur Gameboy Advance. Incarnez Rayman, le héros le plus démembré de l'histoire, dans 50 niveaux déjantés, dont 11 jouables en multijoueur avec vos amis."}, {"id": "gba_080", "s": "gba", "n": 80, "t": "Rayman Advance", "y": 2001, "dv": "Ubisoft", "p": "Digital Eclipse", "g": "Plateforme", "r": 0, "img": "gba/080.webp", "shot": "shots/gba/080.webp", "d": "Dans le monde de Rayman, la nature et les habitants vivent en paix et lLe Grand Protoon maintient l'équilibre et l'harmonie de cet univers. Jusqu'au jour où l'horrible Mister Dark le dérobe, plongeant le monde dans le chaos et les ténèbres. Rayman devra trouver et délivrer tous les toons puis anéantir Mister Dark pour délivrer le Grand Protoon. Rayman Advance sur GBA est une adaptation du jeu original sorti sur Playstation."}, {"id": "gba_081", "s": "gba", "n": 81, "t": "Shining Soul II", "y": 2004, "dv": "Thq", "p": "Sega", "g": "Jeu De Rôles", "r": 0, "img": "gba/081.webp", "shot": "shots/gba/081.webp", "d": "Shining Soul II est un jeu de rôle disponible sur Gameboy Advance. L'histoire débute alors que le peuple du royaume de Klantol lutte contre une sécheresse qui dure depuis plusieurs années. La cause de ce problème reste incertain et tout ce qu'on peut entendre (et voir) tourne autour de mystérieux nuages qui se formèrent dans le ciel, obscurcissant le ciel et qui déversent un flot de monstres sur le royaume."}, {"id": "gba_082", "s": "gba", "n": 82, "t": "Sonic Advance", "y": 2002, "dv": "Sega", "p": "Infogrames", "g": "Action, Puzzle-Game", "r": 1, "img": "gba/082.webp", "shot": "shots/gba/082.webp", "d": "Sonic Advance est un jeu de plates-formes sur Gameboy Advance dans lequel vous retrouverez le petit hérisson bleu et sa bande. Le maléfique Dr Eggman a élaboré un plan pour construire un empire surpuissant et c'est à vous que revient la tâche de l'en empêcher. Incarnez au choix Sonic, Amy, Knuckles ou Tails et utilisez au mieux leurs caractéristiques pour franchir de nombreux obstacles. Sonic Advance est jouable à 4 via une connexion multiconsole."}, {"id": "gba_083", "s": "gba", "n": 83, "t": "Sonic Advance 2", "y": 2003, "dv": "Sega", "p": "Sega", "g": "Action", "r": 1, "img": "gba/083.webp", "shot": "shots/gba/083.webp", "d": "Sonic Advance 2 est un jeu de plates-formes 2D sur Gameboy advance. Toujours aussi rapides, le courageux Sonic et ses amis peuvent empêcher les plans machiavéliques du Dr Eggman. Chaque personnage a ses propres capacités, et si vous voulez récupérer toutes les émeraudes du chaos, il faudra trouver toutes les médailles cachés dans les niveaux."}, {"id": "gba_084", "s": "gba", "n": 84, "t": "Sonic Advance 3", "y": 2004, "dv": "Sonic Team", "p": "Thq", "g": "Action", "r": 1, "img": "gba/084.webp", "shot": "shots/gba/084.webp", "d": "Sonic Advance 3 est un jeu de plates-formes 2D disponible sur Gameboy Advance. Dans cette opus, le joueur a la possibilité de choisir son personnage ainsi que son coéquipier. Selon la combinaison, les conséquences sont différentes. Sonic peut propulser à toute vitesse son coéquipier, Tails le lance en l'air, Amy lui donne un marteau, etc. A vous de bien savoir exploiter vos personnages afin de terminer les niveaux."}, {"id": "gba_085", "s": "gba", "n": 85, "t": "Sonic Battle", "y": 2004, "dv": "Sonic Team", "p": "Sega", "g": "Action, Combat", "r": 1, "img": "gba/085.webp", "shot": "shots/gba/085.webp", "d": "Dans Sonic Battle sur Gameboy Advance, retrouvez Sonic et tous ses amis qui font la bagarre dans des arènes en 3D afin de découvrir qui se cache derrière un mystérieux robot. Au début de chaque round, le joueur choisit ses capacités spéciales et part affronter ses adversaires. Celui qui remporte le plus de K.O remporte le match. Sonic Battle peut se jouer jusqu'à 4 joueurs."}, {"id": "gba_086", "s": "gba", "n": 86, "t": "Spyro : Season of Ice", "y": 2001, "dv": "Digital Eclipse", "p": "Universal Interactive", "g": "Plateforme", "r": 0, "img": "gba/086.webp", "shot": "shots/gba/086.webp", "d": "Spyro : Season of Ice est un jeu de plates-formes sur Gameboy Advance. Un redoutable sorcier a capturé 100 fées pour préparer la seule potion capable de le guérir d'une terrible migraine. Vous incarnez alors Spyro, et partez à la recherche des pauvres fées pour les délivrer. Testez votre habilité dans plus de 20 niveaux de jeu ainsi que dans une multitude de mini-jeux."}, {"id": "gba_087", "s": "gba", "n": 87, "t": "Street Fighter Alpha 3", "y": 2002, "dv": "Crawfish Interactive", "p": "Capcom", "g": "Action, Combat", "r": 0, "img": "gba/087.webp", "shot": "shots/gba/087.webp", "d": "Street Fighter Alpha 3 sur Gameboy Advance est un jeu de combat en 2D qui réunit bon nombre de personnages connus de la série. Choisissez parmi une trentaine de combattants et débloquez en plusieurs autres totalement inédits. Le titre permet d'affronter un ami."}, {"id": "gba_088", "s": "gba", "n": 88, "t": "Super Mario Advance", "y": 2001, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme", "r": 1, "img": "gba/088.webp", "shot": "shots/gba/088.webp", "d": "Super Mario Advance est l'adaptation sur GBA de Super Mario Bros 2 sorti sur NES. Cet épisode marque un tournant dans la série puisqu'il introduit la possibilité de choisir son personnage. Incarnez ainsi le célèbre tandem de plombiers moustachus, la princesse Peach ou bien son compagnon Toad dans une aventure magique. Vous devez sauver les habitants du monde des rêves des griffes de l'ignoble Wart, le tyran batracien. Cette version propose en bonus une version remaniée du jeu Mario Bros."}, {"id": "gba_089", "s": "gba", "n": 89, "t": "Super Mario Advance 4: Super Mario Bros. 3", "y": 2003, "dv": "Nintendo Ead", "p": "Nintendo", "g": "Plateforme", "r": 2, "img": "gba/089.webp", "shot": "shots/gba/089.webp", "d": "Super Mario Advance 4 : Super Mario Bros. 3 est un jeu de plates-formes 2D sur Gameboy Advance. Les rois du Monde Champignon ont été transformés en animaux et ce sont les sept enfants de Bowser qui ont fait le coup ! Aidez Mario et Luigi à retrouver les baguettes magiques qui rendront aux rois leur apparence normale. Redécouvrez ce classique de la NES dans une toute nouvelle version adaptée pour la portable."}, {"id": "gba_090", "s": "gba", "n": 90, "t": "Super Mario Ball", "y": 2004, "dv": "Fuse Games Limited", "p": "Nintendo", "g": "Flipper, Simulation", "r": 0, "img": "gba/090.webp", "shot": "shots/gba/090.webp", "d": "Retrouvez l'univers de Mario avec Super Mario Ball, un jeu de flipper sur Gameboy Advance. La princesse Peach a été propulsé par accident dans le château de Bowser, Mario part donc à sa rescousse en se transformant en bille de flipper. Plus de 30 zones seront à explorer librement, avec de nombreux bonus qui permettront par exemple de grossir la taille de la bille, la multiplier par 3, ou bien encore poser un tuyau qui empêchera la bille de tomber."}, {"id": "gba_091", "s": "gba", "n": 91, "t": "Super Mario World: Super Mario Advance 2", "y": 2002, "dv": "Nintendo Ead", "p": "Nintendo", "g": "Plateforme", "r": 1, "img": "gba/091.webp", "shot": "shots/gba/091.webp", "d": "Après avoir sauvé le Royaume Champignon, les frères Mario et Luigi s'accordent des vacances à Dinosaur Land. Alors qu'ils se reposent sur la plage, la Princesse Peach disparaît. Après des heures de recherche, ils tombent sur un ?uf géant dans la forêt. C'est alors qu'il éclot pour donner naissance à un petit dinosaure, Yoshi. Ce dernier prévient Mario et Luigi que ses amis dinosaures ont également été emprisonnés dans des ?ufs par des tortues maléfiques. Les deux frères s'aperçoivent assez vite qu'il doit certainement s'agir de Bowser et de ses Koopalings."}, {"id": "gba_092", "s": "gba", "n": 92, "t": "Super Street Fighter II Turbo : Revival", "y": 2001, "dv": "Capcom", "p": "Capcom", "g": "Combat", "r": 0, "img": "gba/092.webp", "shot": "shots/gba/092.webp", "d": "Super Street Fighter II Turbo Revival est un jeu de combat sur Gameboy Advance. Faites votre choix parmi 16 combattants issus de l'univers Street Fighter puis enchaînez mouvements spéciaux et combinaisons pour vaincre votre adversaire en mode Arcade ou en versus contre un adversaire. Un mode entraînement permet aussi d'améliorer votre tactique avec le mode Entraînement."}, {"id": "gba_093", "s": "gba", "n": 93, "t": "Sword of Mana", "y": 2004, "dv": "Square Enix", "p": "Square Enix", "g": "Jeu De Rôles", "r": 0, "img": "gba/093.webp", "shot": "shots/gba/093.webp", "d": "Sword of Mana est un jeu de rôle disponible sur Gameboy Advance. Choisissez parmi les deux héros de l'histoire, un gladiateur qui veut venger la mort de ses parents, ou une jeune femme qui doit affronter son passé qui la hante. Tous deux devront défendre l'arbre de Mana car le Chevalier Noir du Royaume de Granz veut percer ses secrets pour contrôler la source du Mana."}, {"id": "gba_094", "s": "gba", "n": 94, "t": "Tetris Worlds", "y": 2001, "dv": "Blue Planet Software", "p": "Thq", "g": "Action", "r": 0, "img": "gba/094.webp", "shot": "shots/gba/094.webp", "d": "Tetris Worlds est un puzzle-game sur Gameboy Advance dans lequel des blocs de différentes formes défilent, votre but est de les associer pour créer des lignes. Le soft vous propose 6 modes de jeu différents. Outre le mode classique vous trouverez le sticky, le fusion, le hotline et le mode cascade. Vous avez aussi la possibilité d'affronter 4 de vos amis via le mode multijoueur."}, {"id": "gba_095", "s": "gba", "n": 95, "t": "The Legend of Zelda : A Link to the Past & Four Swords", "y": 2003, "dv": "Nintendo", "p": "Nintendo", "g": "Action, Aventure", "r": 2, "img": "gba/095.webp", "shot": "shots/gba/095.webp", "d": "The Legend of Zelda : A Link to the Past est un jeu d'aventure sur GBA dans lequel vous incarnez Link, jeune garçon d'Hyrule. Vous avez pour mission d'aller sauver la princesse Zelda des griffes du sorcier Agahnim avant qu'il ne libère le sceau des sept sages qui sépare le monde de la lumière et celui des ténèbres. Pour cela vous devez traverser de nombreux donjons remplis de monstres et trouver dans chacun d'eux des objets vous permettant de progresser dans votre quête."}, {"id": "gba_096", "s": "gba", "n": 96, "t": "The Legend of Zelda : The Minish Cap", "y": 2004, "dv": "Capcom", "p": "Nintendo", "g": "Aventure, Action", "r": 3, "img": "gba/096.webp", "shot": "shots/gba/096.webp", "d": "Retrouvez Link dans un jeu d'action/aventure sur Gameboy Advance. Dans cette aventure, Link fait la rencontre avec Exelo, un étrange bonnet, avec lequel il va s'associer pour retrouver Vaati, un mystérieux personnage qui a lancé un sort sur la princesse Zelda. Exelo confère à notre héros le pouvoir de rapetisser, ce qui lui permet d'explorer le monde du microcosme. Ainsi, le joueur va faire la rencontre avec le peuple des Minish."}, {"id": "gba_097", "s": "gba", "n": 97, "t": "Tony Hawk's Pro Skater 2", "y": 2001, "dv": "Neversoft", "p": "Activision", "g": "Sport", "r": 0, "img": "gba/097.webp", "shot": "shots/gba/097.webp", "d": "Tony Hawk's Pro Skater 2 sur Gameboy Advance est un jeu de sport proposant trois modes de jeu : Carrière (relevez les défis pour débloquer skates, personnages et tricks), Sessions simples ou Entraînement."}, {"id": "gba_098", "s": "gba", "n": 98, "t": "Wario Land 4", "y": 2001, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme, Action", "r": 2, "img": "gba/098.webp", "shot": "shots/gba/098.webp", "d": "Wario Land 4 est un jeu de plates-formes/action sur Gameboy Advance. Vous incarnez Wario et partez en quête de la légendaire Pyramide d'Or. Choisissez votre niveau de difficulté, affrontez ennemis et boss peuplant les différentes zones et ramassez le plus de trésors possible."}, {"id": "gba_099", "s": "gba", "n": 99, "t": "WarioWare, Inc. : Minigame Mania", "y": 2003, "dv": "Nintendo", "p": "Nintendo", "g": "Casual Game", "r": 1, "img": "gba/099.webp", "shot": "shots/gba/099.webp", "d": "Wario Ware Inc. : Mega Mini-Jeux est un jeu très particulier sur Gameboy Advance. Le joueur doit remplir divers objectifs dans une succession de mini-jeux qui s'enchaînent à grande vitesse. Plus de 200 mini-jeux vous attendent, alors il faudra comprendre en quelques micro-secondes seulement le but recherché. Ayez les bons réflexes !"}, {"id": "gba_100", "s": "gba", "n": 100, "t": "Yoshi's Island : Super Mario Advance 3", "y": 2002, "dv": "Nintendo Ead", "p": "Nintendo", "g": "Plateforme", "r": 1, "img": "gba/100.webp", "shot": "shots/gba/100.webp", "d": "Yoshi's Island : Super Mario Advance 3 nous fait découvrir l'origine des frères Mario et Luigi. Alors qu'une cigogne amène les deux bébés à leurs parents, le sorcier Kamek la heurte afin de l'empêcher d'arriver à destination car il a prédit que Mario et Luigi poseraient problème à son maître Bowser dans le futur. Kamek arrive à kidnapper Luigi mais Mario échoue sur l'île des Yoshis. Ces derniers s'organisent pour que Mario retrouve son frère."}, {"id": "megadrive_001", "s": "megadrive", "n": 1, "t": "Aladdin", "y": 1993, "dv": "Virgin", "p": "Sega", "g": "Action, Plateforme", "r": 2, "img": "megadrive/001.webp", "shot": "shots/megadrive/001.webp", "d": "Accrochez-vous à votre tapis magique: l'aventure commence! Aladdin manie son cimeterre étincelant pour traverser Agrabah, échapper aux prisons du Sultan, survivre à l'épreuve des flammes de la Grotte des Merveilles, s'emparer de la lampe du Génie et sauver la Princesse Jasmine du diabolique Jafar."}, {"id": "megadrive_002", "s": "megadrive", "n": 2, "t": "Alex Kidd in the Enchanted Castle", "y": 1989, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "megadrive/002.webp", "shot": "shots/megadrive/002.webp", "d": "Dans The Enchanted Castle sur Megadrive, Alex Kidd donne des coups de poing, des coups de pied et saute à travers la planète Papiéroche pour sauver son père, le roi Thor, de l'emprise d'Ashra aux 6 bras. Il en voit de toutes les couleurs tout au long de 11 niveaux. PAPIER ! CISEAUX ! PIERRE ! Alex est entraîné dans un jeu infernal !"}, {"id": "megadrive_003", "s": "megadrive", "n": 3, "t": "Alien Soldier", "y": 1995, "dv": "Treasure", "p": "Sega", "g": "Plateforme", "r": 1, "img": "megadrive/003.webp", "shot": "shots/megadrive/003.webp", "d": "Dans Alien Soldier sur Megadrive, vous incarnez un soldat extraterrestre génétiquement modifié décidant de rompre avec l'organisation qui l'employait jusqu'alors. Affrontez donc vos anciens alliés dans ce jeu d'action à défilement horizontal et servez-vous des six armes à votre disposition pour remonter jusqu'au boss et l'anéantir."}, {"id": "megadrive_004", "s": "megadrive", "n": 4, "t": "Altered Beast", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Beat'em All", "r": 2, "img": "megadrive/004.webp", "shot": "shots/megadrive/004.webp", "d": "Altered Beast sur Megadrive est un beat'em all inspiré de la mythologie grecque. Le joueur incarne un héros ressuscité par Zeus afin de venir en aide à sa soeur Athena. Pour ce faire, vous devez affronter des hordes de morts-vivants et de démons, chaque niveau se ponctuant par un boss. vous pouvez augmenter vos chances en vous transformant en animal sauvage, fort de nouvelles capacités d'attaque et de défense."}, {"id": "megadrive_005", "s": "megadrive", "n": 5, "t": "Another World", "y": 1992, "dv": "Delphine Software International", "p": "Delphine - Virgin", "g": "Action, Aventure", "r": 0, "img": "megadrive/005.webp", "shot": "shots/megadrive/005.webp", "d": "Another World sur Megadrive est un jeu d'action-aventure qui démarre lorsque la foudre s'abat sur le laboratoire de Lester Chaykin qui procède à des expériences. L'explosion projettera le jeune scientifique dans un monde parallèle particulièrement hostile. Rapidement emprisonné par une espèce humanoïde, Lester fait la rencontre d'un compagnon de fortune."}, {"id": "megadrive_006", "s": "megadrive", "n": 6, "t": "Bonanza Bros.", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 0, "img": "megadrive/006.webp", "shot": "shots/megadrive/006.webp", "d": "Bonanza Bros. sur Megadrive est un jeu de plates-formes. Vous dirigez successivement Mobo et Robo, les deux frères Bonanza dans des missions d'infiltration pour tester le système de sécurité d'une entreprise. Pour ce faire, collectez tous les trésors et mettez hors d'état de nuire les gardiens dans le temps imparti."}, {"id": "megadrive_007", "s": "megadrive", "n": 7, "t": "Boogerman : A Pick and Flick Adventure", "y": 1995, "dv": "Interplay", "p": "Interplay", "g": "Action", "r": 0, "img": "megadrive/007.webp", "shot": "shots/megadrive/007.webp", "d": "Dans Boogerman sur Megadrive, vous dirigez un super héros cradingue. C'est un jeu de plates-formes traditionnel où il faut courir et sauter à travers les niveaux, sauf qu'ici pour tuer les ennemis, le héros doit roter, pêter et balancer des crottes de nez. Les niveaux traversés sont d'ailleurs tout aussi dégoutant : Montagne de muqueuse, Marécage flatulent, etc. Emétophobes s'abstenir..."}, {"id": "megadrive_008", "s": "megadrive", "n": 8, "t": "Castle of Illusion Starring Mickey Mouse", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 1, "img": "megadrive/008.webp", "shot": "shots/megadrive/008.webp", "d": "La recherche est commencée! Mickey est sur les traces d'une méchante sorcière nommée Mizrabel, qui a kidnappé Minnie. Mickey doit trouver sept joyaux pour sauver Minnie. Courez, sautez et rebondissez avec Mickey, en lançant des pommes et des blocs de marbre sur les ennemis. Puis, soyez prêt à défier votre plus dangereux ennemi, la sorcière Mizrabel en personne!"}, {"id": "megadrive_009", "s": "megadrive", "n": 9, "t": "Castlevania: The New Generation", "y": 1994, "dv": "Konami", "p": "Konami", "g": "Plateforme", "r": 3, "img": "megadrive/009.webp", "shot": "shots/megadrive/009.webp", "d": "Un cauchemar en 6 épisodes à vous glacer les sangs. En effet, il vous faut à tout prix arrêter un redoutable vampire-femelle, la Comtesse Bartley, dans son entreprise de résurrection du maître de tous les maux, le Comte Dracula."}, {"id": "megadrive_010", "s": "megadrive", "n": 10, "t": "Chiki Chiki Boys", "y": 1993, "dv": "Capcom", "p": "Sega", "g": "Aventure, Plateforme", "r": 0, "img": "megadrive/010.webp", "shot": "shots/megadrive/010.webp", "d": "Chiki Chiki Boys (Mega Twins aux US) est un jeu de plates-formes sur Megadrive. La vie paisible des habitants d'Alurea bascule lorsque le roi est tué par un dragon, répandant par la même occasion des monstres sur les terres. Heureusement les deux fils jumeaux du souverain sont là pour secourir tout le monde. Les jumeaux disposent de deux attaques principales : l'épée et la magie. Faites en bon usage pour espérer l'emporter contre les forces du mal."}, {"id": "megadrive_011", "s": "megadrive", "n": 11, "t": "Columns", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Puzzle-Game", "r": 1, "img": "megadrive/011.webp", "shot": "shots/megadrive/011.webp", "d": "Columns sur Megadrive est un puzzle-game dans lequel votre tâche consiste à disposer des blocs de sorte à les faire disparaître. Les blocs disparaissent lorsque trois éléments de couleur identique, au minimum, sont en contact, ceci de manière horizontale, verticale ou diagonale, cette dernière méthode rapportant le plus de points."}, {"id": "megadrive_012", "s": "megadrive", "n": 12, "t": "Comix Zone", "y": 1995, "dv": "Sega", "p": "Sega", "g": "Action, Beat'em All", "r": 2, "img": "megadrive/012.webp", "shot": "shots/megadrive/012.webp", "d": "Entrez dans la Comix Zone... La première bande dessinée réellement interactive! À la suite d'événements des plus étranges, Sketch se trouve prisonnier dans les pages de sa dernière bande dessinée fantastique; et le crayon à dessin est maintenat dans les mains de sa création la plus machiavélique: Mortus. Frayez-vous un chemin au travers des différentes planches en combattant les ennemis que Mortus dessine sous vos yeux et échappez-vous de la Comix Zone."}, {"id": "megadrive_013", "s": "megadrive", "n": 13, "t": "Cool Spot", "y": 1994, "dv": "Virgin", "p": "Virgin", "g": "Action, Plateforme", "r": 0, "img": "megadrive/013.webp", "shot": "shots/megadrive/013.webp", "d": "Cool Spot sur Megadrive est un jeu de plates-formes coloré où règne la \"cool attitude\". Vous incarnez la mascotte de la marque de boisson 7up. L'objectif est de collecter un maximum de bouchons à travers le niveau pour passer au prochain."}, {"id": "megadrive_014", "s": "megadrive", "n": 14, "t": "Desert Strike: Return to the Gulf", "y": 1992, "dv": "Visual Concepts", "p": "Electronic Arts", "g": "Shoot'em Up", "r": 0, "img": "megadrive/014.webp", "shot": "shots/megadrive/014.webp", "d": "Desert Strike : Return to the Gulf sur Megadrive est le premier jeu de la série Strike. L'histoire prend place un an après la guerre du Golfe alors qu'un général tyrannique menace le Moyen-Orient et les Etats-Unis. Le président vous charge d'abattre le général Kilbaba et ses terroristes, avant qu'ils n'engagent un conflit nucléaire mondial. Vous pilotez un hélicoptère Apache et vos objectifs sont divers : porter secours, détruire des objectifs, détourner des missiles..."}, {"id": "megadrive_015", "s": "megadrive", "n": 15, "t": "Dr. Robotnik's Mean Bean Machine", "y": 1993, "dv": "Compile", "p": "Sega", "g": "Puzzle-Game", "r": 1, "img": "megadrive/015.webp", "shot": "shots/megadrive/015.webp", "d": "Dr. Robotnik's Mean Bean Machine sur Megadrive est un puzzle-game où vous devez arranger des blocs de couleur de manière à les faire disparaître et à réaliser des enchaînements qui auront raison de votre opposant. Sauvez les habitants de BeanVille de la robotisation qu'Eggman veut leur faire subir !"}, {"id": "megadrive_016", "s": "megadrive", "n": 16, "t": "Dragon's Fury", "y": 1992, "dv": "Naxat Soft", "p": "Tengen", "g": "Flipper, Action", "r": 0, "img": "megadrive/016.webp", "shot": "shots/megadrive/016.webp", "d": "Dragon's Fury est un jeu de flipper sur Megadrive. Le jeu se présente comme une aventure dont le héros est une bille de flipper. Visez juste pour défaire tous les monstres qui vous barrent la route et accumulez les bonus pour atteindre le milliard de points et affronter le terrible boss final."}, {"id": "megadrive_017", "s": "megadrive", "n": 17, "t": "Dune II : The Battle for Arrakis", "y": 1994, "dv": "Virgin", "p": "Virgin", "g": "Stratégie", "r": 0, "img": "megadrive/017.webp", "shot": "shots/megadrive/017.webp", "d": "Dune II : La Bataille d'Arrakis est un jeu de stratégie en temps réel sur Megadrive basé sur l'univers de la série Dune de Frank Herbert. Le joueur contrôle l'une des trois maisons et doit remplir différentes missions (rapporter de l'épice, tuez tous les ennemis...) pour remporter la campagne."}, {"id": "megadrive_018", "s": "megadrive", "n": 18, "t": "Dynamite Headdy", "y": 1994, "dv": "Treasure", "p": "Sega", "g": "Action", "r": 1, "img": "megadrive/018.webp", "shot": "shots/megadrive/018.webp", "d": "Le décor est planté! La marionnette à la tête dure est bien décidée à prouver sa valeur. Vous disposez de 14 têtes interchangeables toutes plus délirantes les unes que les autres selon que vous désirez mordre, cogner, sauter, shooter... afin de vous frayer un chemin jusqu'au Château des Démons des Ténèbres."}, {"id": "megadrive_019", "s": "megadrive", "n": 19, "t": "Earthworm Jim", "y": 1994, "dv": "Shiny Entertainment", "p": "Virgin Interactive Entertainment", "g": "Action, Plateforme", "r": 2, "img": "megadrive/019.webp", "shot": "shots/megadrive/019.webp", "d": "Earthworm Jim sur Megadrive met en scène Jim, un ver de terre ayant hérité d'un costume aux pouvoirs extraordinaires. Dans ce classique parmi les jeux de plates-formes, le joueur dispose d'un pistolet laser comme moyen de défense. Jim a aussi une large palette de mouvements pour parvenir à franchir des niveaux variés et colorés."}, {"id": "megadrive_020", "s": "megadrive", "n": 20, "t": "Earthworm Jim 2", "y": 1996, "dv": "Playmates Interactive", "p": "Virgin Interactive Entertainment", "g": "Action, Plateforme", "r": 0, "img": "megadrive/020.webp", "shot": "shots/megadrive/020.webp", "d": "Earthworm Jim 2 sur Megadrive est la suite des aventures du ver de terre extraordinaire. Jim renfile son costume aux pouvoirs magiques pour parcourir les niveaux d'action/plates-formes du titre. Le lombric dispose cette fois-ci de cinq types de munitions différentes pour charger son pistolet. Son habileté pour la course et les sauts lui permettent aussi d'atteindre des endroits gigantesques aux yeux d'un tout petit ver de terre."}, {"id": "megadrive_021", "s": "megadrive", "n": 21, "t": "Ecco : Les Marées du Temps", "y": 1994, "dv": "Novotrade", "p": "Sega", "g": "Aventure", "r": 0, "img": "megadrive/021.webp", "shot": "shots/megadrive/021.webp", "d": "Ecco : The Tides of Time sur Megadrive est la suite de la première aventure du courageux dauphin. L'océan est menacé par la Reine du Vortex et le cours du temps a été divisé en 2 futurs, l'un normal, et un autre où règnent les ténèbres instaurées par la Reine. Votre tâche consiste évidemment à rétablir le plus agréable des deux. La possibilité de se transformer en méduses ou en petits poissons-fourrage pour passer inaperçu a été ajoutée."}, {"id": "megadrive_022", "s": "megadrive", "n": 22, "t": "Ecco the Dolphin", "y": 1992, "dv": "Novotrade", "p": "Sega", "g": "Action, Aventure", "r": 2, "img": "megadrive/022.webp", "shot": "shots/megadrive/022.webp", "d": "Ecco the Dolphin sur Megadrive est un jeu d'action qui a l'originalité de mettre le joueur aux commandes d'un dauphin. L'histoire débute lorsque Ecco assiste impuissant à la disparition de tout l'écosystème, emporté par une mystérieuse tempête. 25 niveaux durant, explorez les abîmes et résolvez de nombreuses énigmes afin de ramener le calme au sein de la crique."}, {"id": "megadrive_023", "s": "megadrive", "n": 23, "t": "Empire of Steel", "y": 1992, "dv": "Flying Edge", "p": "Hot-B", "g": "Action, Puzzle-Game", "r": 0, "img": "megadrive/023.webp", "shot": "shots/megadrive/023.webp", "d": "Empire of Steel est un shoot'em up sur Megadrive. Le joueur peut choisir de voler avec l'avion Striker ou l'Attaquant Z-01 Zeppelin pour lutter contre l'ennemi au travers de sept niveaux progressifs en difficulté, contenant chacun un patron à la fin, qui doit être vaincu pour pouvoir avancer au niveau suivant. Les niveaux comportent également des mini-boss moins puissants, qui apparaissent à la moitié d'un niveau."}, {"id": "megadrive_024", "s": "megadrive", "n": 24, "t": "Eternal Champions", "y": 1993, "dv": "Sega", "p": "Sega", "g": "Action, Combat", "r": 0, "img": "megadrive/024.webp", "shot": "shots/megadrive/024.webp", "d": "Eternal Champions est un jeu de combat sur Megadrive. Au cours de l'histoire, neuf guerriers tués de façon injuste se voient donner une deuxième chance pour protéger la Terre en participant à un tournoi. Chaque personnage dispose de sa propre manière de combattre et il est possible en fin de combat d'envoyer son adversaire au tapis grâce à un super coup final."}, {"id": "megadrive_025", "s": "megadrive", "n": 25, "t": "European Club Soccer", "y": 1992, "dv": "Krisalis Software Ltd.", "p": "Krisalis Software Ltd.", "g": "Sport / Football, Sport", "r": 0, "img": "megadrive/025.webp", "shot": "shots/megadrive/025.webp", "d": "European Club Soccer est un jeu de football sur Megadrive. Les équipes européennes principales sont présentes et jouables dans les trois championnats du jeu. L'arbitre est physiquement présent sur le terrain et le joueur peut choisir entre un mode arcade et simulation qui comprend six formations différentes."}, {"id": "megadrive_026", "s": "megadrive", "n": 26, "t": "F1 : World Championship Edition", "y": 1995, "dv": "Peakstar Software", "p": "Domark", "g": "Course, Conduite", "r": 0, "img": "megadrive/026.webp", "shot": "shots/megadrive/026.webp", "d": "F1 World Championship Edition est un jeu de courses sur Megadrive bénéficiant de la licence officielle de la Formule 1. Choisissez le mode Arcade ou optez pour le Grand Prix pour parcourir les circuits du jeu répartis aux quatre coins du globe (Monaco, France, Japon, Australie...). Un mode deux joueurs est également disponible pour affronter un ami."}, {"id": "megadrive_027", "s": "megadrive", "n": 27, "t": "Fatal Fury 2", "y": 1994, "dv": "Snk", "p": "Takara", "g": "Action, Sport", "r": 0, "img": "megadrive/027.webp", "shot": "shots/megadrive/027.webp", "d": "Fatal Fury 2 sur Megadrive est un jeu de combat innovant dans lequel les personnages peuvent évoluer sur deux plans différents. Il est possible de passer de l'arrière à l'avant de l'écran, pour notamment esquiver les attaques adverses. Les trois personnages jouables disposent de techniques diverses et variées, dont une qui permet d'attaquer les deux plans en même temps afin d'être sûr d'envoyer son rival au tapis."}, {"id": "megadrive_028", "s": "megadrive", "n": 28, "t": "FIFA International Soccer", "y": 1993, "dv": "Extended Play Productions", "p": "Ea Sports", "g": "Sport", "r": 0, "img": "megadrive/028.webp", "shot": "shots/megadrive/028.webp", "d": "FIFA International Soccer sur Megadrive est une simulation de football. Premier titre de la série la plus vendue au monde, FIFA donne la possibilité à 1 ou 2 joueurs de prendre le contrôle d'équipes nationales et internationales lors de matches amicaux, de tournois ou de championnats. Privilégiant les courses et passes courtes, le jeu permet d'adopter une stratégie parmi 5 au choix afin de mieux contrer le jeu de l'adversaire."}, {"id": "megadrive_029", "s": "megadrive", "n": 29, "t": "Frank Thomas Big Hurt Baseball", "y": 1995, "dv": "Acclaim", "p": "Iguana Entertainment", "g": "Sport, Simulation", "r": 0, "img": "megadrive/029.webp", "shot": "shots/megadrive/029.webp", "d": "Frank Thomas Big Hurt Baseball sur Megadrive est un jeu de simulation de Baseball. Au travers de 6 modes de jeu (entraînement, match d'exhibition, saison complète, etc.), vous pourrez incarner plus de 700 joueurs de la Ligue majeure de base-ball américaine."}, {"id": "megadrive_030", "s": "megadrive", "n": 30, "t": "General Chaos", "y": 1993, "dv": "Game Refuge", "p": "Electronic Arts", "g": "Stratégie", "r": 0, "img": "megadrive/030.webp", "shot": "shots/megadrive/030.webp", "d": "General Chaos est un jeu de stratégie en temps réel sur Megadrive. Le joueur contrôle une équipe de 5 soldats dans la grande bataille des Rouges contre les Bleus. Le but est de remporter les petites escarmouches pour, au final, repousser l'ennemi vers ses quartiers. Il y a 5 types de soldats différents, chacun avec ses armes, ses avantages et ses inconvénients."}, {"id": "megadrive_031", "s": "megadrive", "n": 31, "t": "Golden Axe", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Action, Beat'em All", "r": 2, "img": "megadrive/031.webp", "shot": "shots/megadrive/031.webp", "d": "Autrefois, une terrible guerre fit rage entre les Dieux, créateurs du monde, et les Titans. Ces derniers furent vaincus grâce à une arme surpuissante forgée par les Dieux, nommée «Golden Axe». Grâce à elle, les Titans furent bannis, et les Dieux léguèrent la Terre aux humains. Cependant, un Titan avait survécu: Death Adder. Il s'empara de la Golden Axe et s'en servit pour mettre le monde à feu et à sang. Il enleva le roi de Yuria et sa fille et menaça de les exécuter si les habitants ne se soumettaient pas sans condition. Trois héros, décidés à se venger de Death Adder, partent à sa recherche."}, {"id": "megadrive_032", "s": "megadrive", "n": 32, "t": "Golden Axe II", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Action, Beat'em All", "r": 2, "img": "megadrive/032.webp", "shot": "shots/megadrive/032.webp", "d": "Golden Axe II est un beat'em all sur Megadrive. La paix du royaume est menacée par Dark Guld, qui a mis sa main sur la Golden Axe et compte bien s'en servir pour amener le chaos. Prenez le contrôle d'un des trois personnages, Ax-Battler, Tyris-Flare ou Gilius Thunderhead et usez de vos armes et de votre magie pour arrêter Dark Guld et récupérer la Golden Axe."}, {"id": "megadrive_033", "s": "megadrive", "n": 33, "t": "Gunstar Heroes", "y": 1993, "dv": "Treasure", "p": "Sega", "g": "Action, Beat'em All", "r": 3, "img": "megadrive/033.webp", "shot": "shots/megadrive/033.webp", "d": "Le Colonel Red et l'armée de son empire ont décidé de voler la Gemme Mystique et de rendre plus puissant encore le Destructeur, un robot qui avait presque détruit la planète Gunstar, il y a 9 ans déjà. Les jumeaux Gunstar ont promis que, plus jamais, le Destructeur ne menacerait leur planète et maintenant, ils doivent passer à l'action! Etes-vous un héros, prêt à les suivre?"}, {"id": "megadrive_034", "s": "megadrive", "n": 34, "t": "Herzog Zwei", "y": 1990, "dv": "Technosoft", "p": "Sega", "g": "Stratégie", "r": 1, "img": "megadrive/034.webp", "shot": "shots/megadrive/034.webp", "d": "Herzog Zwei est un jeu de stratégie sur Megadrive dont le but estest de gérer le transport de ses troupes pour investir la base adverse. Les deux joueurs qui s'opposent disposent chacun d'un avion ainsi que de troupes au sol. Il faudra bien souvent acheter de nouvelles troupes pour les transporter sur le champs de bataille et ainsi s'assurer la victoire."}, {"id": "megadrive_035", "s": "megadrive", "n": 35, "t": "John Madden Football '93", "y": 1992, "dv": "Electronic Arts", "p": "Electronic Arts", "g": "Sport", "r": 0, "img": "megadrive/035.webp", "shot": "shots/megadrive/035.webp", "d": "John Madden Football'93 est un jeu de football américain sur Megadrive. Choisissez parmi vingt-huit équipes de la saison 92-93 ainsi que huit équipes de légende. Le jeu propose les classiques modes de jeu : pré-saison, saison, mort-subite et playoff. John Madden en personne fera part de son expérience pour commenter tous les matches."}, {"id": "megadrive_036", "s": "megadrive", "n": 36, "t": "Jungle Strike: The Sequel to Desert Strike", "y": 1993, "dv": "High Score Productions", "p": "Electronic Arts", "g": "Action", "r": 0, "img": "megadrive/036.webp", "shot": "shots/megadrive/036.webp", "d": "Jungle Strike sur Megadrive est la suite de Desert Strike sorti en 1993. Kalbaba veut venger son père, tué par les Américains dans le précédent épisode, et s'allie au Sud-Américain Carlos Ortega pour attaquer les Etats-Unis. Vous contrôlez plusieurs types d'engins de guerre pour parcourir la jungle en Amérique du Sud afin de déjouer leurs plans."}, {"id": "megadrive_037", "s": "megadrive", "n": 37, "t": "Kid Chameleon", "y": 1992, "dv": "Sega", "p": "Sega", "g": "Aventure, Plateforme", "r": 0, "img": "megadrive/037.webp", "shot": "shots/megadrive/037.webp", "d": "Beaucoup de jeunes qui jouent à Wild Side, le jeu en vogue, disparaissent. Heady Metal, la crapule du jeu, les capture sans cesse. Seul Kid Chameleon, le jeune le plus courageux peut vaincre Heady Metal et son gang de voyous!"}, {"id": "megadrive_038", "s": "megadrive", "n": 38, "t": "La Légende de Thor", "y": 1995, "dv": "Sega", "p": "Sega", "g": "Jeu De Rôles", "r": 1, "img": "megadrive/038.webp", "shot": "shots/megadrive/038.webp", "d": "Dans le jeu de rôle/action La Légende de Thor sur Megadrive, incarnez le prince Ali, détenteur du bracelet d'or capable d'invoquer les esprits. Vous devez lutter contre le propriétaire du bracelet d'argent qui, lui, sème le chaos et la destruction. Parcourez les terres de votre royaume et apprenez à maîtriser les différents pouvoirs de votre bracelet pour renvoyer les créatures dans l'autre monde."}, {"id": "megadrive_039", "s": "megadrive", "n": 39, "t": "Landstalker : Le Trésor du Roi Nole", "y": 1993, "dv": "Climax Entertainment", "p": "Sega", "g": "Jeu De Rôles", "r": 1, "img": "megadrive/039.webp", "shot": "shots/megadrive/039.webp", "d": "Landstalker sur Megadrive est un jeu de rôle/action en vue isométrique qui raconte les exploits d'un jeune elfe parti à la recherche du trésor du roi Nole. S'échelonnant sur une bonne dizaine d'heures, l'aventure se distingue par ses environnements extérieurs vastes et ses donjons redoutables."}, {"id": "megadrive_040", "s": "megadrive", "n": 40, "t": "Le Livre de la Jungle", "y": 1994, "dv": "Virgin", "p": "Disney Interactive", "g": "Plateforme", "r": 0, "img": "megadrive/040.webp", "shot": "shots/megadrive/040.webp", "d": "Le Livre de la Jungle sur Megadrive est l'adaptation du film de Disney de 1967, lui-même inspiré du livre écrit par Rudyard Kipling. Vous incarnez Mowgli et devez ramasser des fruits, grimper aux arbres et combattre les ennemis de l'histoire comme Sher Khan. Le jeu permet de replonger dans l'univers d'un des classiques de Disney en retrouvant tous ses personnages et ses décors."}, {"id": "megadrive_041", "s": "megadrive", "n": 41, "t": "Le Roi Lion", "y": 1994, "dv": "Westwood Studios", "p": "Virgin Interactive", "g": "Plateforme", "r": 2, "img": "megadrive/041.webp", "shot": "shots/megadrive/041.webp", "d": "Le Roi Lion est l'adaptation sur Megadrive du film de Disney sorti en 1994. Vous parcourez la savane avec Simba, de son plus jeune âge jusqu'à son retour dans la tribu des lions à l'âge adulte. Tous les personnages et passages du film sont présents, de même que les musiques qui permettent aux nostalgiques de plonger pleinement dans l'univers d'un des classiques de Disney."}, {"id": "megadrive_042", "s": "megadrive", "n": 42, "t": "Lemmings", "y": 1991, "dv": "Dma Design", "p": "Psygnosis", "g": "Stratégie, Puzzle-Game", "r": 0, "img": "megadrive/
