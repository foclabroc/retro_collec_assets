042.webp", "shot": "shots/megadrive/042.webp", "d": "Votre tâche dans Lemmings sur Megadrive est de secourir les petites créatures aux cheveux verts sur 120 niveaux. Un pourcentage d'individus à maintenir en vie vous est indiqué pour chaque mission. A vous de vous adapter à la configuration du terrain de jeu en assignant des tâches telles que creuser, construire un escalier ou encore bloquer le passage dans l'optique de ramener à bon port vos infatigables Lemmings."}, {"id": "megadrive_043", "s": "megadrive", "n": 43, "t": "Lemmings 2 : The Tribes", "y": 1993, "dv": "Dma Design", "p": "Psygnosis", "g": "Puzzle-Game", "r": 0, "img": "megadrive/043.webp", "shot": "shots/megadrive/043.webp", "d": "Lemmings 2 : The Tribes est le deuxième épisode de la série Lemmings sur Megadrive. Tout comme dans le précédent opus, il faut diriger les Lemmings d'un point à un autre. Cependant, cette fois-ci, douze tribus de Lemmings différentes sont jouables avec pour chacune des actions et décors différents. Un mode Entraînement permet de tester les 60 compétences disponibles. Encore une fois, le jeu propose en tout 120 niveaux, dix par tribu."}, {"id": "megadrive_044", "s": "megadrive", "n": 44, "t": "Light Crusader", "y": 1995, "dv": "Treasure", "p": "Sega", "g": "Jeu De Rôles", "r": 1, "img": "megadrive/044.webp", "shot": "shots/megadrive/044.webp", "d": "Dans le royaume de Light Crusader sur Megadrive, des disparitions mystérieuses ont lieu. Le roi charge son meilleur chevalier d'enquêter sur ces phénomènes étranges et d'y remédier. Dans ce mélange d'action et de jeu de rôle, explorez les donjons de Green Row, combattez des monstres et résolvez des énigmes afin de retrouver la population."}, {"id": "megadrive_045", "s": "megadrive", "n": 45, "t": "Lotus Turbo Challenge", "y": 1992, "dv": "Gremlin Interactive", "p": "Electronic Arts", "g": "Course, Conduite", "r": 0, "img": "megadrive/045.webp", "shot": "shots/megadrive/045.webp", "d": "Lotus Turbo Challenge est un jeu de courses sur Megadrive. Choisissez votre Lotus préférée et lancez-vous dans des courses endiablées contre 16 concurrents dirigés par l'ordinateur. Le jeu repose sur un système de checkpoint, chaque course est divisée en segments et le joueur dispose d'un temps limité pour passer de l'un à l'autre. Un mode deux joueurs est également de la partie."}, {"id": "megadrive_046", "s": "megadrive", "n": 46, "t": "Mega Bomberman", "y": 1994, "dv": "Westone", "p": "Sega", "g": "Action", "r": 0, "img": "megadrive/046.webp", "shot": "shots/megadrive/046.webp", "d": "Mega Bomberman est un jeu d'action sur Megadrive. Dans le mode solo à vous de distiller vos bombes afin de libérer le passage, détruire vos ennemis et récupérer les bonus qui ornent les niveaux. Différents types de kangourous pourront vous prêter main forte sur certains tableaux et le mode multijoueurs permet de faire son choix parmi neuf personnages différents."}, {"id": "megadrive_047", "s": "megadrive", "n": 47, "t": "Mega Man: The Wily Wars", "y": 1994, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 0, "img": "megadrive/047.webp", "shot": "shots/megadrive/047.webp", "d": "Mega Man : The Wily Wars sur Megadrive est une compilation des trois premiers Mega Man sortis sur Nes. on retrouve donc les premiers combats du héros contre des robots aux pouvoirs destructeurs. La cartouche comprend aussi un mode de jeu inédit : Wily Tower qui voit Mega Man gravir une tour en battant un nouveau robot à chaque étage."}, {"id": "megadrive_048", "s": "megadrive", "n": 48, "t": "Mickey Mania", "y": 1994, "dv": "Travellers Tales", "p": "Sony", "g": "Plateforme", "r": 0, "img": "megadrive/048.webp", "shot": "shots/megadrive/048.webp", "d": "Mickey Mania (aussi appelé Mickey Mania : The Timeless adventures of Mickey Mouse) sur Megadrive est un jeu de plates-formes. Le joueur incarne Mickey Mouse dans sept niveaux inspirés des dessins animés les plus célèbres de son histoire."}, {"id": "megadrive_049", "s": "megadrive", "n": 49, "t": "Micro Machines", "y": 1994, "dv": "Codemasters", "p": "Codemasters", "g": "Course, Conduite", "r": 1, "img": "megadrive/049.webp", "shot": "shots/megadrive/049.webp", "d": "MicroMachines sur Megadrive vous propose de diriger les petits véhicules de la marque, dans des courses fun et variées au beau milieu d'une baignoire, d'un bureau, ou d'une table à manger. Les courses incluant jusqu'à 4 concurrents. Si l'un d'eux tombe du circuit où se fait trop distancer, il perd un point."}, {"id": "megadrive_050", "s": "megadrive", "n": 50, "t": "Micro Machines 2 : Turbo Tournament", "y": 1994, "dv": "Codemasters", "p": "Codemasters", "g": "Course, Conduite, Puzzle-Game, Aventure", "r": 1, "img": "megadrive/050.webp", "shot": "shots/megadrive/050.webp", "d": "MicroMachines 2 : Turbo Tournament est un jeu de courses sur Megadrive. La cartouche du jeu met à votre disposition deux ports manettes supplémentaires, ce qui permet à huit joueurs de s'affronter sur le même écran (deux par manette). Le jeu vous met aux volants des fameux bolides miniatures et le but est d'arriver premier en prenant soin de distancer les autres joueurs pour leur faire perdre des points."}, {"id": "megadrive_051", "s": "megadrive", "n": 51, "t": "Micro Machines : Turbo Tournament 96", "y": 1996, "dv": "Supersonic Software", "p": "Codemasters", "g": "Course, Conduite", "r": 0, "img": "megadrive/051.webp", "shot": "shots/megadrive/051.webp", "d": "MicroMachines Turbo Tournament 96 est un jeu de courses sur Megadrive. La cartouche du jeu permet le branchement de deux manettes supplémentaires ce qui permet à de huit joueurs de s'affronter en simultané (deux joueurs par manette). Le but est toujours de finir premier au volant de son véhicule miniature tout en essayant de distancer ses concurrents. Cette édition amène un éditeur de niveau permettant au joueur de créer et de sauvegarder ses propres circuits."}, {"id": "megadrive_052", "s": "megadrive", "n": 52, "t": "Mortal Kombat", "y": 1993, "dv": "Midway", "p": "Acclaim", "g": "Action, Combat", "r": 0, "img": "megadrive/052.webp", "shot": "shots/megadrive/052.webp", "d": "Battez vos adversaires pour défier le guerrier Shokan nommé Goro, champion du tournoi depuis plus de 500 ans. Adaptation du célébrissime jeu d'arcade, Mortal Kombat sur Megadrive vous permet d'incarner 8 prétendants à la victoire finale, dont les protégés du seigneur Raiden, seuls remparts contre la menace qui pèse sur le Royaume de la Terre."}, {"id": "megadrive_053", "s": "megadrive", "n": 53, "t": "Mortal Kombat II", "y": 1993, "dv": "Midway", "p": "Acclaim", "g": "Action, Combat", "r": 2, "img": "megadrive/053.webp", "shot": "shots/megadrive/053.webp", "d": "Mortal Kombat II, est un jeu de combat sur Megadrive. Combos, fatalités et autres coups spéciaux, tels sont les ingrédients qui fondent le succès d'un jeu réputé pour la violence de ses affrontements. Le joueur incarne l'un des 12 personnages et doit vaincre un par un l'ensemble de ses concurrents directs pour gagner le tournoi et mettre un terme au règne du maléfique Shao Kahn."}, {"id": "megadrive_054", "s": "megadrive", "n": 54, "t": "NBA Jam", "y": 1994, "dv": "Arena Entertainment", "p": "Midway", "g": "Sport / Basketball, Sport, Divers", "r": 0, "img": "megadrive/054.webp", "shot": "shots/megadrive/054.webp", "d": "NBA Jam sur Megadrive est le premier jeu de basket à proposer de jouer avec des joueurs professionnels mais avec les règles de la rue. Les matches se disputent donc en deux contre deux et les fautes sont presque absentes. En revanche, les actions sont volontairement irréalistes, afin de pouvoir admirer ses stars de NBA préférées réaliser des dunks de plusieurs mètres de hauteur, tout en faisant des figures spectaculaires."}, {"id": "megadrive_055", "s": "megadrive", "n": 55, "t": "OutRun", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Course, Conduite, Combat, Action", "r": 0, "img": "megadrive/055.webp", "shot": "shots/megadrive/055.webp", "d": "OutRun sur Megadrive est l'adaptation de la célébrissime version arcade. Vous êtes au volant d'une rutilante Ferrari Testarossa, avec à vos côtés une jolie blonde que vous tenterez d'épater grâce à vos talents de pilote."}, {"id": "megadrive_056", "s": "megadrive", "n": 56, "t": "PGA Tour 96", "y": 1995, "dv": "Hitmen Productions", "p": "Ea Sports", "g": "Sport / Golf, Sport", "r": 0, "img": "megadrive/056.webp", "shot": "shots/megadrive/056.webp", "d": "PGA Tour 96 est un jeu de golf sur Megadrive. Le joueur peut choisir parmi dix joueurs pros de la PGA (Professional Golfers' Association) dont les swings ont été reproduits. Trois parcours complets de dix-huit trous sont disponibles et plusieurs modes de jeu s'offrent au joueur, dont un mode Tournoi. Un mode Entraînement répond également présent pour parfaire son drive."}, {"id": "megadrive_057", "s": "megadrive", "n": 57, "t": "Phantasy Star III : Generations of Doom", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Jeu De Rôles", "r": 0, "img": "megadrive/057.webp", "shot": "shots/megadrive/057.webp", "d": "Phantasy Star III : Generations of Doom est un jeu de rôle sur Megadrive. Alors qu'une grande guerre déchira les royaumes d'Orakio et de Laya, 1000 ans plus tard, Rhys, le jeune prince d'Orakio choisit une magnifique Laya pour épouse. Pendant la cérémonie, d'étranges créatures kidnappent la princesse et Rhys part aussitôt à l'aventure pour la retrouver. Le prince évolue dans un univers médiéval, différent du reste de la série et les combats sont à régler au tour par tour."}, {"id": "megadrive_058", "s": "megadrive", "n": 58, "t": "Phantasy Star IV", "y": 1992, "dv": "Sega", "p": "Sega", "g": "Jeu De Rôles, Aventure, Combat", "r": 3, "img": "megadrive/058.webp", "shot": "shots/megadrive/058.webp", "d": "Dans le jeu de rôle Phantasy Star IV : The End Of The Millennium sur Megadrive, vous dirigez Chaz, un jeune mercenaire appartenant à la guilde d'Aiedo. Alors que Dark Force, une entité maléfique, ressurgit des ténèbres grâce au mage noir Zio, vous avez été choisi pour rassembler une équipe et mettre un terme à cette menace une bonne fois pour toute. Votre route sera parsemée de nombreux combats à régler au tour par tour."}, {"id": "megadrive_059", "s": "megadrive", "n": 59, "t": "Pitfall : The Mayan Adventure", "y": 1994, "dv": "Activision", "p": "Activision", "g": "Plateforme, Plateforme / Run Jump", "r": 0, "img": "megadrive/059.webp", "shot": "shots/megadrive/059.webp", "d": "Pitfall : The Mayan Adventure sur Megadrive est un jeu de plates-formes. Le joueur incarne Pitfall Harry, un explorateur qui doit évoluer dans la jungle en évitant toutes sortes d'obstacles tels que sables mouvants, serpents, tapirs, singes, jaguars, etc. Il peut éviter les trous, sauter par-dessus les obstacles, rebondir sur les toiles d'araignées, se balancer de liane en liane et attraper d'autres lianes élastiques qui lui permettent de monter verticalement."}, {"id": "megadrive_060", "s": "megadrive", "n": 60, "t": "Populous", "y": 1990, "dv": "Bullfrog", "p": "Electronic Arts", "g": "Stratégie", "r": 0, "img": "megadrive/060.webp", "shot": "shots/megadrive/060.webp", "d": "Populous sur Megadrive est un jeu de stratégie qui vous propose de vous mettre dans la peau du Créateur. Commandez une civilisation et venez à bout des populations sous la joute de dieux adverses. En tant que Dieu, vous pouvez modeler les reliefs à votre aise, jeter des sorts, commander vos troupes et fabriquer des héros pour influencer les masses, et ce, dans plus de 500 mondes."}, {"id": "megadrive_061", "s": "megadrive", "n": 61, "t": "Probotector", "y": 1994, "dv": "Konami", "p": "Konami", "g": "Shoot'em Up / Horizontal, Shoot'em Up, Tir, Tir / Run And Gun", "r": 2, "img": "megadrive/061.webp", "shot": "shots/megadrive/061.webp", "d": "Probotector est un jeu d'action sur Megadrive. Un terroriste s'est emparé d'une cellule de Red Falcon (les aliens les plus dangereux ayant jamais existé) et projette de les cloner ! Il ne tient qu'à vous de l'en empêcher et de détruire cette cellule avant qu'il ne soit trop tard. Jouable en solo, ou à deux dans un mode coopératif, Probotector vous propose de traverser plusieurs niveaux en éliminant un maximum d'ennemis grâce à vos puissantes armes à feu."}, {"id": "megadrive_062", "s": "megadrive", "n": 62, "t": "QuackShot Starring Donald Duck", "y": 1991, "dv": "Disney Interactive", "p": "Sega", "g": "Action, Plateforme", "r": 1, "img": "megadrive/062.webp", "shot": "shots/megadrive/062.webp", "d": "Rejoignez Donald dans sa quête du trésor Great Duck de Garuzia! Voyagez à travers les continents remplis d'ennemis perfides. Rassemblez des outils, des indices et des clés dans des territoires remplis de dangers. Enfin, prenez votre courage à deux mains pour l'aventure finale sur l'île au trésor Great Duck!"}, {"id": "megadrive_063", "s": "megadrive", "n": 63, "t": "Ranger X", "y": 1993, "dv": "Gau Entertainment", "p": "Sega", "g": "Action", "r": 0, "img": "megadrive/063.webp", "shot": "shots/megadrive/063.webp", "d": "Ranger X est un shoot'em up sur Megadrive dans lequel le joueur contrôle un robot accompagné d'un engin plus petit lui permettant d'alterner sa façon de tirer. Il est possible de viser en avant comme en arrière et d'utiliser le jet pack pour s'élever dans les airs et éviter de nombreux pièges."}, {"id": "megadrive_064", "s": "megadrive", "n": 64, "t": "Ristar", "y": 1995, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 1, "img": "megadrive/064.webp", "shot": "shots/megadrive/064.webp", "d": "Le démoniaque souverain de Despair s'empare de la constellation de Valjee et il sème terreur et désolation plongeant ainsi le Royaume dans les ténèbres. Mais, du fin fond de la galaxie surgit Ristar, une étoile dotée de pouvoirs extraordinaires. Vis le destin exceptionnel d'une étoile filante à travers 7 niveaux de toute beauté!"}, {"id": "megadrive_065", "s": "megadrive", "n": 65, "t": "Road Rash", "y": 1991, "dv": "Electronic Arts", "p": "Electronic Arts", "g": "Course, Conduite", "r": 1, "img": "megadrive/065.webp", "shot": "shots/megadrive/065.webp", "d": "Road Rash sur Megadrive est un jeu de motos qui sort des sentiers battus. Vous disputez des courses sur le continent américain, le plus souvent sur route, où vous avez la possibilité d'infliger les pires crasses à vos opposants. Les victoires vous rapporteront de l'argent qui vous permettra de vous payer une moto plus puissante."}, {"id": "megadrive_066", "s": "megadrive", "n": 66, "t": "Road Rash 3", "y": 1995, "dv": "Electronic Arts", "p": "Electronic Arts", "g": "Course, Conduite, Aventure, Action", "r": 1, "img": "megadrive/066.webp", "shot": "shots/megadrive/066.webp", "d": "Road Rash 3 est un jeu de courses de motos sur Megadrive. Après avoir conquis les tracés américains dans les précédents volets, le joueur part affronter tous les plus grands champions mondiaux dans des courses toujours plus dangereuses où tous les coups sont permis. De nouvelles armes sont au programme ainsi que des forces de l'ordre plus féroces. Le jeu vous emmènera aux quatre coins du monde (Italie, Japon, Kenya ou encore Australie)."}, {"id": "megadrive_067", "s": "megadrive", "n": 67, "t": "Road Rash II", "y": 1993, "dv": "Electronic Arts", "p": "Electronic Arts", "g": "Course, Conduite", "r": 1, "img": "megadrive/067.webp", "shot": "shots/megadrive/067.webp", "d": "Road Rash II est un jeu de courses de motos sur Megadrive. Vous êtes en compétition avec plusieurs adversaires et vous devez arriver en tête de chaque course pour remporter une grosse somme d'argent. Il est possible d'attaquer ses adversaires avec ses poings ou à l'aide d'armes que l'on peut subtiliser. L'argent gagné vous aidera à acheter une moto plus puissante. Prenez garde à la circulation et aux forces de l'ordre en chemin !"}, {"id": "megadrive_068", "s": "megadrive", "n": 68, "t": "Rocket Knight Adventures", "y": 1993, "dv": "Konami", "p": "Konami", "g": "Action, Plateforme", "r": 1, "img": "megadrive/068.webp", "shot": "shots/megadrive/068.webp", "d": "Sparkster, le seul espoir d'une nation désespérée.nnLe Chevalier noir et son armée de soldats-robots psychotiques ont apporté mort et destruction au pays autrefois tranquille d'Elhorn. Est-ce que Sparkster pourra vaincre le seigneur de la guerre dépravé et rendre la paix à son pays?"}, {"id": "megadrive_069", "s": "megadrive", "n": 69, "t": "Samurai Shodown", "y": 1993, "dv": "Snk", "p": "Saurus Co., Ltd.", "g": "Action, Combat", "r": 0, "img": "megadrive/069.webp", "shot": "shots/megadrive/069.webp", "d": "Samurai Shodown sur Megadrive est un jeu de combat se déroulant au XVIIIème siècle au Japon. Le titre intègre des modifications par rapport aux classiques du genre telles que l'utilisation d'armes blanches, un système de zoom ainsi qu'une jauge POW se remplissant au fil du combat et débloquant des attaques puissantes."}, {"id": "megadrive_070", "s": "megadrive", "n": 70, "t": "Sensible Soccer - International Edition", "y": 1994, "dv": "Renegade Software", "p": "Sensible Software", "g": "Sport / Football, Sport", "r": 0, "img": "megadrive/070.webp", "shot": "shots/megadrive/070.webp", "d": "Sensible World of Soccer sur Megadrive est une version améliorée du jeu de football. Celle-ci comprend à peu près toutes les divisions et les clubs de tous les pays pour la saison 95. Tout y est authentique grâce à tous les noms officiels. Vous pouvez aussi gérer plusieurs équipes pour les mener à la victoire."}, {"id": "megadrive_071", "s": "megadrive", "n": 71, "t": "Shadow Dancer : The Secret of Shinobi", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Beat'em All", "r": 0, "img": "megadrive/071.webp", "shot": "shots/megadrive/071.webp", "d": "Shadow Dancer : The Secret of Shinobi est un jeu d'action/plates-formes sur Megadrive. L'histoire se déroule à New York en 1997 et le Maître Ninja Shinobi doit faire face à une nouvelle menace. La discrétion et la rapidité sont des armes redoutables mais Shinobi peut aussi utiliser la magie tandis que son chien le protège contre de nombreux assaillants. Chaque niveau se termine par l'affrontement d'un boss et plusieurs bonus peuvent être ramassés en cours de route."}, {"id": "megadrive_072", "s": "megadrive", "n": 72, "t": "Shining Force", "y": 1992, "dv": "Climax Entertainment", "p": "Sega", "g": "Stratégie, Jeu De Rôles", "r": 1, "img": "megadrive/072.webp", "shot": "shots/megadrive/072.webp", "d": "Shining Force sur Megadrive est un jeu de rôle tactique dans lequel vous dirigez une équipe de combattants devant lutter contre les Forces du Mal. Le jeu se décompose en deux parties : l'aventure, dans laquelle vous explorez la carte, vendez et achetez des objets et de l'équipement, puis les combats au tour par tour sur un terrain découpé en cases où chacune dispose de caractéristiques affectant le joueur ou l'ennemi."}, {"id": "megadrive_073", "s": "megadrive", "n": 73, "t": "Shining Force II", "y": 1994, "dv": "Camelot Software", "p": "Sega", "g": "Jeu De Rôles", "r": 1, "img": "megadrive/073.webp", "shot": "shots/megadrive/073.webp", "d": "Shining Force II est un RPG tactique sur Mega Drive. L'histoire fait suite aux événements du jeu Shining Force Gaiden : Final Conflict, sorti sur Game Gear. L'aventure débute quand un mystérieux voleur dérobe les reliques sacrées de l'Ancienne Tour, ouvrant ainsi la voie à un puissant démon. Accompagné de vos amis, explorez les secrets du pays de Rune à travers plus de 40 batailles au tour-par-tour et faites triompher la lumière de la Shining Force !"}, {"id": "megadrive_074", "s": "megadrive", "n": 74, "t": "Shinobi III : Return of the Ninja Master", "y": 1993, "dv": "Megasoft", "p": "Sega", "g": "Plateforme", "r": 3, "img": "megadrive/074.webp", "shot": "shots/megadrive/074.webp", "d": "Dans les montagnes du Japon, se trouve un ninja solitaire. Il a senti la présence d'un vieil ennemi devenant à nouveau une menace. Le nom du ninja est Joe Musashi. Son ennemi est Neo Zeed qu'il a déjà vaincu, et qui a un nouveau plan maléfique qui ne peut être arrêté que par Joe Musashi - mieux connu sous le nom de Shinobi!"}, {"id": "megadrive_075", "s": "megadrive", "n": 75, "t": "Sonic & Knuckles", "y": 1994, "dv": "Sega", "p": "Sega", "g": "Shoot'em Up, Action, Plateforme", "r": 3, "img": "megadrive/075.webp", "shot": "shots/megadrive/075.webp", "d": "Sonic & Knuckles unissent leurs forces pour vaincre le Dr. Robotnik dans une nouvelle aventure aux possibilités illimitées. Découvrez la puissance des poings de Knuckles, son super vol plané et son habileté à escalader les murs ou alors utilisez la vitesse légendaire de Sonic."}, {"id": "megadrive_076", "s": "megadrive", "n": 76, "t": "Sonic 3D Flickies' Island", "y": 1996, "dv": "Travellers Tales", "p": "Sega", "g": "Action", "r": 0, "img": "megadrive/076.webp", "shot": "shots/megadrive/076.webp", "d": "Qui aurait cru qu'un Sonic en 3D sortirait sur Mega Drive ? La jouabilité est aussi bonne que les autres opus et les mondes sont très différents. Vous devez sauver des Flickies : ce sont des petits oiseaux aux pouvoirs magiques, mais qui ont été transformés en robots par l'infame docteur Robotnik. Votre mission : sauter sur la tête de ces robots pour qu'ils redeviennent des Flickies, faire en sorte qu'ils vous suivent en vous approchant d'eux (vous entendrez une petite musique si c'est le cas) et enfin vous suspendre aux bords des gros anneaux pour sauver les Flickies. Bref, cette adaptation est une véritable révolution avec plein de nouveautés (et des bonus si vous trouvez Tails et Knuckles avec 50 anneaux sur vous). Même si ce jeu est un peu plus difficile à cause de la 3D, je vous recommande de le télécharger car cela vaut vraiment le coup."}, {"id": "megadrive_077", "s": "megadrive", "n": 77, "t": "Sonic Spinball", "y": 1993, "dv": "Sega", "p": "Sega", "g": "Flipper", "r": 1, "img": "megadrive/077.webp", "shot": "shots/megadrive/077.webp", "d": "Accompagné de son ami Tails, Sonic le hérisson bleu le plus rapide de la galaxie doit à nouveau affronter le Dr Robotnik dans Sonic Spinball sur Megadrive. Le quartier général ennemi est installé en haut d'un volcan, et le mécanisme qui le protège est similaire à celui d'un flipper. Mettez-vous en boule et escaladez le Mont Mobius pour libérer les animaux transformés en robots par votre pire ennemi."}, {"id": "megadrive_078", "s": "megadrive", "n": 78, "t": "Sonic The Hedgehog", "y": 1991, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 4, "img": "megadrive/078.webp", "shot": "shots/megadrive/078.webp", "d": "Franchissez le mur du son avec Sonic The Hedgehog (Sonic l'Hérisson). Crachez du feu avec la \"Formidable Attaque Supersonique\". Faites un looping en défiant la gravité. Vous pouvez même faire un tour de 360° sur vous-même dans un laboratoire circulaire. Vous n'avez jamais rien vu de tel!"}, {"id": "megadrive_079", "s": "megadrive", "n": 79, "t": "Sonic The Hedgehog 3", "y": 1994, "dv": "Sonic Team", "p": "Sega", "g": "Action, Plateforme", "r": 3, "img": "megadrive/079.webp", "shot": "shots/megadrive/079.webp", "d": "Attention, Sonic revient.nnSonic et Tails doivent affronter des épreuves redoutables pleines d'adversaires inédits. Le bonus stage en 3D vous rendra complètement dingue."}, {"id": "megadrive_080", "s": "megadrive", "n": 80, "t": "Sparkster", "y": 1994, "dv": "Konami", "p": "Konami", "g": "Action, Plateforme", "r": 0, "img": "megadrive/080.webp", "shot": "shots/megadrive/080.webp", "d": "Sparkster est la suite sur Megadrive de Rocket Knight Adventures sorti en 1993. La fille du Roi a été enlevée après une attaque ennemie. Seul Sparkster, jeune opossum leader du clan Rocket Knight, peut aller la retrouver. En plus de son habilité au combat, Sparkster possède un propulseur accroché sur son dos qui lui permet de flotter quelques secondes dans les airs. Il sera également amené à piloter différents engins pour arriver jusqu'aux kidnappeurs de la princesse."}, {"id": "megadrive_081", "s": "megadrive", "n": 81, "t": "Spider-Man", "y": 1995, "dv": "Western Technologies", "p": "Acclaim", "g": "Action", "r": 0, "img": "megadrive/081.webp", "shot": "shots/megadrive/081.webp", "d": "Spider-Man est une nouvelle adaptation du comics de Marvel sur Megadrive. Le Bouffon vert, Octopus et Smythe se sont évadés de prison. Peter Parker enfile son costume de Spider-Man pour les retrouver et les y renvoyer. En le contrôlant, vous pouvez utiliser sa toile comme une liane pour traverser des obstacles où en faire des missiles pour éliminer les ennemis. La toile est cependant limitée et il faut trouver des recharges au préalable pour ne pas risquer de tomber à sec en pleine bagarre."}, {"id": "megadrive_082", "s": "megadrive", "n": 82, "t": "Splatterhouse 2", "y": 1992, "dv": "Namco", "p": "Namco", "g": "Action, Beat'em All", "r": 0, "img": "megadrive/082.webp", "shot": "shots/megadrive/082.webp", "d": "Splatterhouse 2 est un beat'em all sur Megadrive. Le joueur contrôle Rick qui est prêt à tout pour sauver sa copine Jennifer, même à mettre un masque maudit qui le transforme en tueur assoiffé de sang. En plus de ses poings et de ses pieds, Rick peut espérer se défendre en ramassant différentes armes (bombes, fusil à pompe, tronçonneuse...) au cours des huit niveaux que compte le jeu."}, {"id": "megadrive_083", "s": "megadrive", "n": 83, "t": "Street Fighter II' : Special Champion Edition", "y": 1993, "dv": "Capcom", "p": "Sega", "g": "Combat", "r": 2, "img": "megadrive/083.webp", "shot": "shots/megadrive/083.webp", "d": "Street Fighter II' : Special Champion Edition sur Megadrive vous lance dans l'arène pour cette nouvelle déclinaison de la saga de Capcom. Dans ce jeu de baston, vous retrouvez huit combattants de légende ainsi que les quatre boss qui sont débloqués dès le début du jeu (Balrog, Sagat, Vega et M. Bison). Maîtrisez chacune des techniques propres aux personnages dans ce titre à la jouabilité nerveuse et aux coups ravageurs."}, {"id": "megadrive_084", "s": "megadrive", "n": 84, "t": "Streets of Rage 3", "y": 1994, "dv": "Sega", "p": "Sega", "g": "Beat'em All, Action", "r": 2, "img": "megadrive/084.webp", "shot": "shots/megadrive/084.webp", "d": "Battez-vous pour la justice! Axel a été arrêté, victime d'une machination, vous seul pouvez prouver son innocence. 8 niveaux tous plus redoutables les uns que les autres, de nouveaux héros, de nouveaux coups; bref un nouvel épisode passionnant de la fabuleuse saga des \"Streets of Rage\"."}, {"id": "megadrive_085", "s": "megadrive", "n": 85, "t": "Streets of Rage II", "y": 1993, "dv": "Sega", "p": "Sega", "g": "Beat'em All", "r": 4, "img": "megadrive/085.webp", "shot": "shots/megadrive/085.webp", "d": "Choisissez un des quatres combattants et plaquez vos ennemis au sol par des super mouvements d'arts martiaux! Tapez-leur dessus avec des tuyaux ou taillez-les en morceaux avec des couteaux et des armes Ninja! Soyez prêt pour un combat incroyable avec Streets of Rage!"}, {"id": "megadrive_086", "s": "megadrive", "n": 86, "t": "Strider", "y": 1990, "dv": "Capcom", "p": "Capcom", "g": "Action, Plateforme", "r": 1, "img": "megadrive/086.webp", "shot": "shots/megadrive/086.webp", "d": "Strider est un jeu d'action/plates-formes sur Megadrive. En l'an 2089, le Grand Maître Meio a mis au point un plan diabolique pour conquérir l'univers tout entier. Vous incarnez Hiryu, un Strider de premier ordre avec pour mission de mettre un terme aux agissements de Meio. Il faudra courir, sauter et tuer vos ennemis grâce à votre épée plasma au cours des cinq niveaux que compte le jeu."}, {"id": "megadrive_087", "s": "megadrive", "n": 87, "t": "Sunset Riders", "y": 1993, "dv": "Konami", "p": "Konami", "g": "Action, Plateforme, Shoot'em Up", "r": 0, "img": "megadrive/087.webp", "shot": "shots/megadrive/087.webp", "d": "Sunset Riders vous envoie vous et votre Megadrive dans le Far West américain, à l'époque des cow-boys et des chasseurs de prime. Richard Rose, l'un des plus grands bandits, a décidé de tout contrôler pour devenir le maître de l'Ouest. Seul les Sunset Riders, quatre justiciers rapides de la gâchette, peuvent l'en empêcher. Vous avez le choix parmi Steve, Bob, Billy et Cormano pour éliminer tous les sous-fifres de Rose. Chacun possède une arme différente, revolver ou fusil."}, {"id": "megadrive_088", "s": "megadrive", "n": 88, "t": "Sword of Vermilion", "y": 1990, "dv": "Sega", "p": "Sega", "g": "Jeu De Rôles, Action, Combat", "r": 0, "img": "megadrive/088.webp", "shot": "shots/megadrive/088.webp", "d": "Sword of Vermilion sur Megadrive est un jeu de rôle dans lequel votre personnage doit retrouver les huit anneaux du Bien afin de sauver son monde. Traversez quatorze villes, étoffez votre inventaire, montez votre niveau en affrontant les monstres qui obstruent votre chemin et parcourez de nombreux donjons pour triompher du mal."}, {"id": "megadrive_089", "s": "megadrive", "n": 89, "t": "Taz-Mania", "y": 1992, "dv": "Sega", "p": "Sega", "g": "Sport, Action", "r": 0, "img": "megadrive/089.webp", "shot": "shots/megadrive/089.webp", "d": "Taz-Mania sur Megadrive est un jeu de plates-formes tiré de l'univers franchement coloré des Looney Tunes. Dans cet opus, Taz est à la recherche d'un oeuf géant, caché dans une vallée perdue. Selon la légende, cet oeuf serait assez gros pour nourrir une famille pendant une année... Composé de 12 niveaux, le jeu restitue entre autres la fameuse attaque tornade de Taz pour se défendre."}, {"id": "megadrive_090", "s": "megadrive", "n": 90, "t": "Teenage Mutant Hero Turtles : The Hyperstone Heist", "y": 1993, "dv": "Konami", "p": "Konami", "g": "Beat'em All", "r": 0, "img": "megadrive/090.webp", "shot": "shots/megadrive/090.webp", "d": "Teenage Mutant Ninja Turtles : The Hyperstone Heist est un jeu d'action sur Megadrive. Shredder, l'ennemi incontournable des Tortues Ninja, a trouvé le moyen de détruire les bâtiments de la ville, grâce aux pouvoirs de l'HyperStone. Heureusement, Leonardo, Michelangelo, Raphael et Donatello ne l'entendent pas de cette oreille ! Avalez une dernière part de pizza et partez défier le sombre Shredder."}, {"id": "megadrive_091", "s": "megadrive", "n": 91, "t": "The Adventures of Batman & Robin", "y": 1995, "dv": "Clockworks Entertainment", "p": "Sega", "g": "Action, Beat'em All", "r": 0, "img": "megadrive/091.webp", "shot": "shots/megadrive/091.webp", "d": "Livrée aux méfaits de M. Freeze et de son canon à glace, Gotham City est sur le point de devoir affronter un destin glacial. Batman et Robin sont les seuls à pouvoir lutter contre M. Freeze, le Joker, le Chapelier fou et bien d'autres ennemis redoutables."}, {"id": "megadrive_092", "s": "megadrive", "n": 92, "t": "Thunder Force IV", "y": 1992, "dv": "Technosoft", "p": "Sega", "g": "Action, Shoot'em Up", "r": 1, "img": "megadrive/092.webp", "shot": "shots/megadrive/092.webp", "d": "Thunder Force IV est un jeu de tir sur Megadrive. Le super ordinateur que l'on croyait détruit et en fait seulement endommagé. La fédération a ainsi décidé de vous envoyer dans un vaisseau pour détruire cette menace."}, {"id": "megadrive_093", "s": "megadrive", "n": 93, "t": "ToeJam & Earl in Panic on Funkotron", "y": 1993, "dv": "Sega", "p": "Sega", "g": "Plateforme", "r": 1, "img": "megadrive/093.webp", "shot": "shots/megadrive/093.webp", "d": "ToeJam & Earl II : Panic on Funkotron est un jeu d'action sur Megadrive. Des terriens ont envahi la paisible planète de Funkotron semant partout la terreur et la confusion. ToeJam & Earl doivent essayer de capturer ces intrus pour les renvoyer sur Terre."}, {"id": "megadrive_094", "s": "megadrive", "n": 94, "t": "Ultimate Mortal Kombat 3", "y": 1995, "dv": "Midway", "p": "Acclaim", "g": "Action, Combat", "r": 0, "img": "megadrive/094.webp", "shot": "shots/megadrive/094.webp", "d": "Les combattants de l'extrême débarquent sur Megadrive avec Ultimate Mortal Kombat 3. Retrouvez le jeu de combat en 2D avec de la violence, du sang et les fameux \"Finish Him\" qui permettent d'achever un adversaire de manière gore. Retrouvez aussi les protagonistes de la série comme Scorpion, Sub-Zero, Raiden, Liu Kang ou encore Kitana pour des affrontements d'anthologie."}, {"id": "megadrive_095", "s": "megadrive", "n": 95, "t": "Universal Soldier", "y": 1992, "dv": "The Code Monkeys", "p": "Accolade", "g": "Action", "r": 0, "img": "megadrive/095.webp", "shot": "shots/megadrive/095.webp", "d": "Universal Soldier est un jeu d'action sur Megadrive tiré du film du même nom. Le joueur incarne Jean Claude Van Damme dans une lutte contre sa propre unité et son gouvernement corrompu. Progressez entre les différents niveaux et accompagnez JCVD dans sa quête pour la vérité."}, {"id": "megadrive_096", "s": "megadrive", "n": 96, "t": "Vectorman", "y": 1995, "dv": "Bluesky Software, Inc.", "p": "Sega", "g": "Plateforme, Puzzle-Game, Action", "r": 1, "img": "megadrive/096.webp", "shot": "shots/megadrive/096.webp", "d": "En l'an 2043, la terre est devenue une véritable décharge de produits toxiques nettoyée progressivement par des mutants appelés les \"orbots\".nnMais, après une explosion nucléaire, leur leader Raster modifie leur comportement. Ils deviennent alors une menace pour la planète. Seul Vectorman, avec ses extraordinaires capacités de métamorphoses pourra les arrêter."}, {"id": "megadrive_097", "s": "megadrive", "n": 97, "t": "Virtua Fighter 2", "y": 1997, "dv": "Sega", "p": "Sega", "g": "Action, Combat", "r": 0, "img": "megadrive/097.webp", "shot": "shots/megadrive/097.webp", "d": "Virtua Fighter 2 est la suite du premier jeu de combat en 3D de l'histoire du jeu vidéo. Les valeureux combattants se réunissent une nouvelle fois pour participer au World Fighting Tournament ! Qui des huit personnages disponibles sera l'élu ? Entrez dans l'arène sur Megadrive pour connaître le nom de celui qui remportera le titre. Testez vos aptitudes et découvrez si vous êtes de la trempe des champions !"}, {"id": "megadrive_098", "s": "megadrive", "n": 98, "t": "Virtua Racing", "y": 1994, "dv": "Sega", "p": "Sega", "g": "Course, Conduite", "r": 0, "img": "megadrive/098.webp", "shot": "shots/megadrive/098.webp", "d": "Virtua Racing sur Megadrive est un jeu de courses proposant trois catégories d'automobiles, des Formule 1, des stock-cars ainsi que des véhicules prototypes. Cinq circuits et trois modes de jeu sont mis à disposition : une Course simple, un Contre-la-montre ainsi qu'un mode Versus qui permet d'affronter un adversaire en écran partagé."}, {"id": "megadrive_099", "s": "megadrive", "n": 99, "t": "World of Illusion Starring Mickey Mouse and Donald", "y": 1992, "dv": "Sega", "p": "Sega", "g": "Action, Plateforme", "r": 1, "img": "megadrive/099.webp", "shot": "shots/megadrive/099.webp", "d": "Alakazam! Et revoici les inoubliables aventures de Disney avec vos amis Mickey Mouse et Donald Duck. Transportés vers un monde de fantaisie, Mickey et Donald doivent accomplir d'étonnantes prouesses de magie pour vaincre un Sorcier habile et retrouver le chemin de leur maison!"}, {"id": "megadrive_100", "s": "megadrive", "n": 100, "t": "Zombies", "y": 1994, "dv": "Lucasarts", "p": "Konami", "g": "Action", "r": 0, "img": "megadrive/100.webp", "shot": "shots/megadrive/100.webp", "d": "Zombies (ou Zombies Ate My Neighbors) sur Megadrive est un jeu d'action où il est possible d'incarner un garçon (Zeke) ou une fille (Julia). Il faut sauver un maximum de gens au cours de la cinquantaine de niveaux du jeu tout en combattant les vampires, momies et autres zombies. Plusieurs armes sont disponibles dont un pistolet à eau et un bazooka. Un mode Coopératif permet de faire l'intégralité du jeu avec un ami."}, {"id": "gbc_001", "s": "gbc", "n": 1, "t": "24 Heures du Mans", "y": null, "dv": "Infogrames", "p": "Infogrames", "g": "Course, Conduite", "r": 0, "img": "gbc/001.webp", "shot": "shots/gbc/001.webp", "d": "24h du Mans est un jeu de courses automobiles sur Gameboy uniquement solo. Plusieurs modes de jeu sont disponibles : championnat, arcade et Le Mans (en temps acceléré). 21 circuits sont disponibles avec des bonus disséminés sur la piste. En tout, le joueur pourra choisir entre 10 voitures différentes : Panoz, Audi, Porsche, Toyota, BMW, etc."}, {"id": "gbc_002", "s": "gbc", "n": 2, "t": "Alone in the Dark : The New Nightmare", "y": 2001, "dv": "Pocket Studios", "p": "Infogrames", "g": "Action, Aventure", "r": 1, "img": "gbc/002.webp", "shot": "shots/gbc/002.webp", "d": "Quatrième volet de la série Alone In The Dark. Vous incarnez Edward Carnby, maître dans l'étude du paranormal, qui enquête sur la mort mystérieuse de son meilleur ami. Vous menez votre investigation sur Shadow Island, une île pas vraiment réputée pour son atmosphère enchanteresse."}, {"id": "gbc_003", "s": "gbc", "n": 3, "t": "Army Men", "y": null, "dv": "Digital Eclipse", "p": "3Do", "g": "Stratégie", "r": 0, "img": "gbc/003.webp", "shot": "shots/gbc/003.webp", "d": "Army Men se propose de vous ramener en enfance, à l'époque où vous jouiez avec vos soldats de plastique. Ce jeu d'action sur Gameboy met en scène la lutte acharnée que mène les verts (menés par Sarge) contre les troupes beiges, bleues et grises."}, {"id": "gbc_004", "s": "gbc", "n": 4, "t": "Asteroids", "y": null, "dv": "Syrox Developments, Ltd.", "p": "Activision", "g": "Action, Tir", "r": 0, "img": "gbc/004.webp", "shot": "shots/gbc/004.webp", "d": "Asteroids est un jeu de tir en 2D sorti sur Gameboy qui nous met aux commandes d'un vaisseau à la forme triangulaire. Sa mission consiste à détruire les extraterrestres et les astéroïdes présents à l'écran sans se faire désintégrer, on peut également utiliser l'hyper espace pour échapper au danger mais avec le risque de voir son vaisseau réapparaître sur un astéroïde."}, {"id": "gbc_005", "s": "gbc", "n": 5, "t": "Bugs Bunny : Crazy Castle 3", "y": 1999, "dv": "Kemco", "p": "Nintendo", "g": "Stratégie, Puzzle-Game", "r": 0, "img": "gbc/005.webp", "shot": "shots/gbc/005.webp", "d": "Bugs Bunny Crazy Castle 3 est la suite du jeu d'action/réflexion sorti sur Gameboy dans lequel vous devez vous échapper d'un château. Pour cela vous devez trouver les clefs de chaque niveau afin de pouvoir continuer à avancer et bien sur de nombreux obstacles viendront gêner votre progression."}, {"id": "gbc_006", "s": "gbc", "n": 6, "t": "Bugs Bunny et Lola Bunny : Opération Carottes", "y": 1999, "dv": "Infogrames", "p": "Infogrames", "g": "Plateforme, Action", "r": 0, "img": "gbc/006.webp", "shot": "shots/gbc/006.webp", "d": "Bugs Bunny & Lola Bunny est un jeu de plates-formes sorti sur Gameboy Color. Aidez les deux tourtereaux mangeurs de carottes à retrouver les carottes voler. Découvrez qui de Elmer, Daffy Duck ou Sam le pirate est à l'origine du forfait."}, {"id": "gbc_007", "s": "gbc", "n": 7, "t": "Bust-A-Move Millennium", "y": 2000, "dv": "Dreams Co., Ltd.", "p": "Acclaim", "g": "Puzzle-Game", "r": 0, "img": "gbc/007.webp", "shot": "shots/gbc/007.webp", "d": "Bust-A-Move Millenium sur Gameboy Color est un jeu de puzzle dont l'objectif est de détruire toutes les bulles à l'écran pour passer au niveau suivant. A l'aide d'un canon, le joueur doit assembler par trois des bulles de couleur identique pour les faire disparaître. Le but du jeu est d'éviter que trop de bulles ne s'accumulent et dépassent une limite en bas de l'écran."}, {"id": "gbc_008", "s": "gbc", "n": 8, "t": "Cannon Fodder", "y": null, "dv": "Sensible Software", "p": "Codemasters", "g": "Stratégie, Sport", "r": 0, "img": "gbc/008.webp", "shot": "shots/gbc/008.webp", "d": "Cannon Fodder est un jeu de stratégie guerrière mais à l'esprit très décalé sur Gameboy. Vous dirigez une petite équipe de soldats, et c'est à vous de la gérer du mieux possible au fil des missions. Il est possible de séparer ses troupes en plusieurs divisions, mais également de recruter de nouveaux hommes lorsque certains de vos soldats viennent à mourir."}, {"id": "gbc_009", "s": "gbc", "n": 9, "t": "Centipede", "y": 1998, "dv": "Morning Star Multimedia", "p": "Majesco", "g": "Action", "r": 0, "img": "gbc/009.webp", "shot": "shots/gbc/009.webp", "d": "Centipede sur Game Boy Color, est exactement le même que celui sorti sur les bornes d’arcade et sur les différentes générations de machines qui ont suivi."}, {"id": "gbc_010", "s": "gbc", "n": 10, "t": "Commander Keen", "y": null, "dv": "David A. Palmer Productions", "p": "Activision", "g": "Aventure, Action", "r": 0, "img": "gbc/010.webp", "shot": "shots/gbc/010.webp", "d": "Billy Blaze, 8 ans. vous êtes le super-héros et c'est à vous de sauver la Terre de la destruction. En enfilant le casque de football de votre frère, vous ferez exploser votre Megarocket vers des mondes spatiaux loin de chez vous. Votre mission: Explorez 3 mondes spatiaux, Affrontez des créatures intergalactiques, récupérez les cristaux de plasma perdus et sauvez l'humanité."}, {"id": "gbc_011", "s": "gbc", "n": 11, "t": "Conker's Pocket Tales", "y": null, "dv": "Rareware", "p": "Rareware", "g": "Aventure, Puzzle-Game", "r": 1, "img": "gbc/011.webp", "shot": "shots/gbc/011.webp", "d": "Conker's Pocket Tales est un jeu d'aventure/réflexion sur Gameboy Color dans lequel vous incarnez Conker qui est à la recherche de sa petite amie qui a été enlevée par Acorn au cours d'une fête. Vous devez donc suivre sa trace en essayant de trouver des indices sur l'endroit où il détient sa fiancée captive."}, {"id": "gbc_012", "s": "gbc", "n": 12, "t": "Croc", "y": null, "dv": "Virtucraft, Ltd.", "p": "Thq", "g": "Plateforme, Action", "r": 0, "img": "gbc/012.webp", "shot": "shots/gbc/012.webp", "d": "Croc est un jeu d'action sur Game Boy Color. Aidez Croc le crocodile à sauver ses amis de l'île de Gobbo qui ont été kidnappés par le maléfique magicien, le Baron Dante. Traversez divers environnements 3D truffés de monstres tels que volcans, forêts, glaciers ou encore grottes inondées. De nombreux obstacles viendront se mettre en travers de votre route."}, {"id": "gbc_013", "s": "gbc", "n": 13, "t": "Daffy Duck : Un Trésor de Canard !", "y": 2000, "dv": "Sunsoft", "p": "Sunsoft", "g": "Plateforme, Action", "r": 0, "img": "gbc/013.webp", "shot": "shots/gbc/013.webp", "d": "Daffy Duck : Un Trésor de Canard ! est un jeu de plates-formes sur Gameboy. Incarnez le cupide palmipède à travers six niveaux variés, démolissez vos ennemis à coups de dynamites et affrontez votre rival Bugs Bunny afin de récupérer votre trésor."}, {"id": "gbc_014", "s": "gbc", "n": 14, "t": "Deja Vu I et II: Les recueils d'Ace Harding", "y": 1999, "dv": "Infinite Ventures, Inc.", "p": "Kemco", "g": "Aventure, Puzzle-Game", "r": 0, "img": "gbc/014.webp", "shot": "shots/gbc/014.webp", "d": "Deja Vu, vous jouez le rôle d'Ace Harding, détective privé de Chicago. Vous vous réveillez groggy dans une pièce que vous ne reconnaissez pas. Vous n'avez pas de mémoire et vous avez été arrêté pour un meurtre que vous n'avez pas commis. Vous devez vous rappeler qui vous êtes et effacer votre nom. Deja Vu 2 ne compte pas trop sur Deja Vu 1 pour le support, donc jouer 2 en premier au lieu de 1 ne ruinera pas complètement l'histoire pour vous. Pas vraiment recommandé cependant, vous ne serez pas en mesure de connaître certains des noms. Dans Deja Vu 2, vous devez retrouver l'argent d'un célèbre gangster de Los Vegas avant que son acolyte ne vous vole. Le jeu est principalement une aventure de texte"}, {"id": "gbc_015", "s": "gbc", "n": 15, "t": "Denki Blocks!", "y": 2001, "dv": "Denki Ltd.", "p": "Rage Games Ltd.", "g": "Stratégie, Puzzle-Game", "r": 0, "img": "gbc/015.webp", "shot": "shots/gbc/015.webp", "d": "Denki Blocks! Un jeu d'adresse qui se joue en faisant glisser des blocs autour d'une planche, en joignant des blocs colorés pour construire des formes et résoudre des énigmes."}, {"id": "gbc_016", "s": "gbc", "n": 16, "t": "Donkey Kong Country", "y": 2000, "dv": "Rareware", "p": "Nintendo", "g": "Action", "r": 2, "img": "gbc/016.webp", "shot": "shots/gbc/016.webp", "d": "Donkey Kong Country sur Gameboy, vous incarnez le célèbre gorille de Nintendo. Le King K. Rool a volé les bananes de Donkey qui décide alors de partir à sa recherche pour les récupérer. Deux personnages sont jouables, Donkey est plus grand et plus fort, alors que Diddy est plus rapide. Il est possible de jouer à deux, soit chacun son tour, soit en équipe. Des animaux vous aideront à franchir certains niveaux et à vaincre les Kremlings."}, {"id": "gbc_017", "s": "gbc", "n": 17, "t": "Dragon Warrior Monsters", "y": 1999, "dv": "Enix", "p": "Eidos Interactive", "g": "Jeu De Rôles", "r": 2, "img": "gbc/017.webp", "shot": "shots/gbc/017.webp", "d": "Dragon Quest Monsters est un jeu de rôle sur Gameboy Color. Vous incarnez Terry, un habitant de Wonderland, pays envahi par des monstres belliqueux. A vous de les capturer, de les dresser puis de les retourner contre leurs congénères."}, {"id": "gbc_018", "s": "gbc", "n": 18, "t": "Driver", "y": 2000, "dv": "Crawfish Interactive", "p": "Infogrames", "g": "Course, Conduite", "r": 0, "img": "gbc/018.webp", "shot": "shots/gbc/018.webp", "d": "Driver sur Gameboy est un jeu de voiture dans lequel vous incarnez Tanner, un flic infiltré dans la mafia. Vous avez la réputation d'être un chauffeur qui n'a pas froid aux yeux et pour réaliser l'arrestation du siècle, vous devez remonter jusqu'aux grands pontes en exécutant les missions qu'on vous confie. Ces dernières se déroulent exclusivement au volant de votre véhicules, d'où le nom du jeu."}, {"id": "gbc_019", "s": "gbc", "n": 19, "t": "F-1 World Grand Prix", "y": 1999, "dv": "Video System", "p": "Video System", "g": "Course, Conduite", "r": 0, "img": "gbc/019.webp", "shot": "shots/gbc/019.webp", "d": "F1 World Grand Prix est une simulation de formule 1 sur Gameboy. Non content de proposer des séances d'essai, des qualifications, 11 écuries, 22 pilotes et 17 circuits de championnat, ce titre offre aussi la possibilité de modifier les pneumatiques des véhicules, de gérer le stock de carburant, la boîte de vitesses et même les ailerons."}, {"id": "gbc_020", "s": "gbc", "n": 20, "t": "Fourmiz", "y": 1999, "dv": "Clce|Light & Shadow Production|Planet Interactive Development", "p": "Infogrames", "g": "Plateforme, Action", "r": 0, "img": "gbc/020.webp", "shot": "shots/gbc/020.webp", "d": "Fourmiz est un jeu de plates-formes sorti sur Gameboy. Lassée de la morosité des fourmilières, Z, fourmi émérite, courageuse et musclée comme ses millions de copines, aspire à plus de liberté. Ce jeu est l'adaptation du film du même nom."}, {"id": "gbc_021", "s": "gbc", "n": 21, "t": "Frogger", "y": 1997, "dv": "Konami", "p": "Majesco", "g": "Action", "r": 0, "img": "gbc/021.webp", "shot": "shots/gbc/021.webp", "d": "C'est dur d'être une grenouille! Pouvez-vous aider Frogger à survivre de certains périls et le ramener à ça maison en toute sécurité? traverser avec vos grenouilles à travers une route très fréquentée. Puis traverser une rivière en furie pour atteindre la sécurité de la maison. Mais vos grenouilles devront sauter d'un danger après l'autre avant d'être en sécurité. Méfiez-vous des tortues ... sautez loin des serpents mangeurs de grenouilles ... sautez au dessus des mâchoires des alligators affamés!"}, {"id": "gbc_022", "s": "gbc", "n": 22, "t": "Game & Watch Gallery 2", "y": 1999, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 1, "img": "gbc/022.webp", "shot": "shots/gbc/022.webp", "d": "Game And Watch Gallery 2 est un jeu développé par Nintendo sur Gameboy. Ce titre est en fait un regroupement de 6 mini-jeux jadis \"électroniques\" mettant en scène Mario et sa joyeuse bande ! On trouve entre autres \"Parachute\" qui met en scène Mario sur un bateau qui doit rattraper Toad et Donkey Kong qui volent en parachute. Les autres mini-jeux sont Helmet, Chef, Vermin, Donkey Kong et Ball."}, {"id": "gbc_023", "s": "gbc", "n": 23, "t": "Game & Watch Gallery 3", "y": 2000, "dv": "Tose", "p": "Nintendo", "g": "Divers", "r": 1, "img": "gbc/023.webp", "shot": "shots/gbc/023.webp", "d": "Game And Watch Gallery 3 est un jeu développé par Nintendo sur Gameboy. Ce titre est en fait une compilation de quelques jeux Nintendo originaux et de remakes avec les personnages de Super Mario Bros. Ici, une dizaine de mini-jeux sont disponibles, de Mario Bros. à Donkey Kong Jr."}, {"id": "gbc_024", "s": "gbc", "n": 24, "t": "Ghosts'n Goblins", "y": null, "dv": "Capcom", "p": "Capcom", "g": "Action, Combat", "r": 1, "img": "gbc/024.webp", "shot": "shots/gbc/024.webp", "d": "Ghosts'n Goblins : Commandez l'héroïque Sir Arthur, alors que vous commencez une quête pour vaincre les forces du mal et sauver votre petite amie kidnappée Guenièvre. Des dizaines d'ennemis maléfiques vous attendent, des zombies aux gargouilles, pendant votre voyage pour la sauver. Survivrez-vous aux périls qui guettent dans cette campagne hantée des gobelins des fantômes?"}, {"id": "gbc_025", "s": "gbc", "n": 25, "t": "Grand Theft Auto", "y": 1999, "dv": "Tarantula Studios", "p": "Take 2 Interactive", "g": "Course, Conduite", "r": 0, "img": "gbc/025.webp", "shot": "shots/gbc/025.webp", "d": "GTA : Expérimentez vous-même chaque course de voitures classique jamais vue. Faites la course à toute allure à travers une immense ville vivante et hors de portée, composée de membres de gangs rivaux, de mercenaires, de tueurs à gages et de toute une force de police. Conduire des dizaines de véhicules variés autour de trois des villes les plus difficiles de l'Amérique. Seuls les meilleurs pourront apprivoiser les voitures les plus rapides. Seul le plus intelligent connaîtra tous les raccourcis et les allées et venues des roues les plus chaudes. Seul le plus dur sera capable de prendre le monde et finir le travail comme un professionnel ..."}, {"id": "gbc_026", "s": "gbc", "n": 26, "t": "Grand Theft Auto 2", "y": null, "dv": "Tarantula Studios", "p": "Rockstar Games", "g": "Course, Conduite", "r": 0, "img": "gbc/026.webp", "shot": "shots/gbc/026.webp", "d": "GTA 2: Sept gangs impitoyables sont impliqués dans une lutte de pouvoir brutale. Fais-toi un nom, mais surveille ton dos. Le respect est gagné pas donné. Système de gangs intelligents - gagner et maintenir le respect des gangs pour obtenir les meilleurs emplois et faveurs spéciales ou jouer les gangs les uns contre les autres dans les guerres de la tourbe. Le gameplay complètement ouvert et non-linéaire vous libère pour vous frayer votre propre chemin vers le haut. Un environnement urbain totalement réactif qui répond à tous vos mouvements."}, {"id": "gbc_027", "s": "gbc", "n": 27, "t": "Guy Roux Manager 2000", "y": null, "dv": "Livemedia Uk", "p": "Ubisoft", "g": "Sport", "r": 0, "img": "gbc/027.webp", "shot": "shots/gbc/027.webp", "d": "Guy Roux Manager 2000 : Gérez plus de 240 équipes réelles issues des deux premières divisions dans six pays européens!"}, {"id": "gbc_028", "s": "gbc", "n": 28, "t": "Hamtaro : Ham-Hams Unite!", "y": null, "dv": "Nintendo", "p": "Nintendo", "g": "Jeu De Rôles, Puzzle-Game", "r": 1, "img": "gbc/028.webp", "shot": "shots/gbc/028.webp", "d": "Hamtaro est un jeu d'aventure sur Gameboy qui vous permet de jouer avec le hamster le plus connu du Japon. Rencontrez les autres ham-ham pour résoudre le mystère du monde d'Hamical et maitrisez aussi le langage secret des rongeurs."}, {"id": "gbc_029", "s": "gbc", "n": 29, "t": "Harvest Moon 2 GBC", "y": 2001, "dv": "Natsume", "p": "Natsume", "g": "Stratégie, Jeu De Rôles", "r": 2, "img": "gbc/029.webp", "shot": "shots/gbc/029.webp", "d": "Harvest Moon 2 GBC est un jeu de rôle sur Gameboy Color, qui se déroule dans un univers rural où le but est de s'occuper en toute tranquillité de son petit carré de jardin et de faire du commerce. Votre vie de fermier vous donne l'occasion de cultiver la terre, de vous occuper du bétail et même de partager vos rêves de bonheur avec votre compagne. Et plus vous trouvez de lutins des moissons, plus vous êtes aidé dans vos diverses tâches quotidiennes."}, {"id": "gbc_030", "s": "gbc", "n": 30, "t": "Harvest Moon GBC", "y": null, "dv": "Victor Interactive", "p": "Natsume", "g": "Simulation", "r": 2, "img": "gbc/030.webp", "shot": "shots/gbc/030.webp", "d": "Harvest Moon GB est un jeu de rôle sur Gameboy, qui se déroule dans un univers rural où le but est de s'occuper en toute tranquillité de son petit carré de jardin et de faire du commerce. Votre vie de fermier vous donne l'occasion de cultiver la terre, de vous occuper du bétail et même de partager vos rêves de bonheur avec votre compagne. Et plus vous trouvez de lutins des moissons, plus vous êtes aidé dans vos diverses tâches quotidiennes."}, {"id": "gbc_031", "s": "gbc", "n": 31, "t": "International Karate 2000", "y": null, "dv": "Studio 3 Interactive", "p": "Studio 3 Interactive", "g": "Action, Course, Conduite", "r": 0, "img": "gbc/031.webp", "shot": "shots/gbc/031.webp", "d": "Remake d'un soft de la fin des années 80, International Karate 2000 est un jeu de combat sur Gameboy. 12 personnages ont été implantés ainsi que 17 adversaires différents, le tout dans une douzaine d'environnements. En plus du tournoi solo et des niveaux bonus entre les duels, il est possible de jouer à deux via la câble."}, {"id": "gbc_032", "s": "gbc", "n": 32, "t": "International Superstar Soccer 99", "y": null, "dv": "Konami", "p": "Konami", "g": "Sport", "r": 0, "img": "gbc/032.webp", "shot": "shots/gbc/032.webp", "d": "International Superstar Soccer 99 sur Gameboy est un jeu de foot offrant quatre modes de jeu. Le mode Exhibition pour jouer un seul match, un mode permettant de jouer seulement des séquences de tirs au but. Enfin, le mode Coupe Internationale, vous permet de participer à une sorte de championnat avec les 32 équipes qui ont participé à la dernière coupe du monde."}, {"id": "gbc_033", "s": "gbc", "n": 33, "t": "International Track & Field : Summer Games", "y": 2000, "dv": "Konami", "p": "Konami", "g": "Sport", "r": 0, "img": "gbc/033.webp", "shot": "shots/gbc/033.webp", "d": "International Track & Field : Summer Games est un jeu de sport sur Gameboy proposant une dizaine de disciplines : le sprint sur 100 mètres, le saut en longueur, le lancer de javelot, le 100 mètres nage libre, le 110 mètres haies, le saut en hauteur, le saut à la perche, le cheval d'arçon, le ball-trap et le tennis de table."}, {"id": "gbc_034", "s": "gbc", "n": 34, "t": "Klax", "y": null, "dv": "Atari", "p": "Midway", "g": "Stratégie, Puzzle-Game", "r": 0, "img": "gbc/034.webp", "shot": "shots/gbc/034.webp", "d": "Le jeu reprend le principe simplissime de Tetris en l'adaptant légèrement quant à la forme. Diverses pièces sont amenées par un tapis roulant et le joueur dispose d'une palette, ainsi que de la possibilité d'accélérer (mais pas ralentir) le mouvement du tapis."}, {"id": "gbc_035", "s": "gbc", "n": 35, "t": "Konami Winter Games", "y": 2000, "dv": "Konami", "p": "Konami", "g": "Sport", "r": 0, "img": "gbc/035.webp", "shot": "shots/gbc/035.webp", "d": "Concourez pour l'or dans 8 sports d'hiver différents sur le thème de l'hiver dans cette série de sports de poche de Konami. Le jeu est similaire aux précédents jeux de sport de Konami dans l'héritage de l'athlétisme, où un mélange d'écrasement de boutons et de chronométrage précis permettra au joueur de remporter les médailles. Le joueur peut soit jouer dans le mode Championnat où les 8 sports sont joués à la suite, soit les jouer tous individuellement. Il y a plusieurs épreuves de ski, de bob, de patinage de vitesse et de snowboard half-pipe que le joueur doit maîtriser."}, {"id": "gbc_036", "s": "gbc", "n": 36, "t": "La Petite Sirène 2 : Pinball Frenzy", "y": 2001, "dv": "Left Field Productions", "p": "Nintendo", "g": "Flipper", "r": 1, "img": "gbc/036.webp", "shot": "shots/gbc/036.webp", "d": "Dans La Petite Sirène 2 : Pinball Frenzy sur Gameboy, rejoignez Mélodie, Ariel et leurs fidèles amis, Sébastien et Polochon, et découvrez des lieux enchantés sous-marins ! Contrairement aux autres versions du jeu, cette édition Gameboy prend la forme d'un flipper. Envoyez la boule vers les bonus pour faire grimper le score."}, {"id": "gbc_037", "s": "gbc", "n": 37, "t": "Le Roi Lion : La Formidable Aventure de Simba", "y": 2001, "dv": "Torus Games", "p": "Activision", "g": "Plateforme", "r": 0, "img": "gbc/037.webp", "shot": "shots/gbc/037.webp", "d": "Le Roi Lion : La Formidable Aventure de Simba est un jeu de plates-formes sur Gameboy. Dans la peau de Simba, le gentil fils du roi Mufasa, vous effectuez un long périple à travers la jungle et les plaines africaines. Êtes-vous prêts à devenir roi de la Terre des Lions ?"}, {"id": "gbc_038", "s": "gbc", "n": 38, "t": "Legend of the River King 2", "y": null, "dv": "Victor Interactive", "p": "Natsume", "g": "Sport", "r": 0, "img": "gbc/038.webp", "shot": "shots/gbc/038.webp", "d": "Legend of the River King 2 est une simulation de pêche sur Gameboy. Vous devez réaliser des mouvements biens précis pour capturer des poissons de plus en plus gros et de plus en plus difficiles à attraper au fur et à mesure des niveaux."}, {"id": "gbc_039", "s": "gbc", "n": 39, "t": "Les Fous du Volant", "y": 2000, "dv": "Velez & Dubail", "p": "Infogrames", "g": "Course, Conduite", "r": 0, "img": "gbc/039.webp", "shot": "shots/gbc/039.webp", "d": "Les Fous du Volant sur Gameboy est un jeu de courses inspiré de la série du même nom. Vous retrouverez donc tous les protagonistes à bord de leurs véhicules tous aussi loufoques les uns que les autres, usant de tous les moyens possibles pour tenter de remporter les courses."}, {"id": "gbc_040", "s": "gbc", "n": 40, "t": "Logical", "y": null, "dv": "Conspiracy Entertainment", "p": "Sunsoft", "g": "", "r": 0, "img": "gbc/040.webp", "shot": "shots/gbc/040.webp", "d": "Logical est un jeu de réflexion dans lequel vous agissez sur des mécanismes en forme de barillets. En haut de l'écran, des billes de quatre couleurs différentes circulent dans un tuyau, de gauche à droite. Le tuyau est percé et sous les trous se trouvent vos barillets. Vous devez jouer sur la rotation de vos différents barillets pour regrouper 4 billes de la même couleur."}, {"id": "gbc_041", "s": "gbc", "n": 41, "t": "Looney Tunes Collector : Alerte aux Martiens !", "y": 2000, "dv": "Infogrames", "p": "Infogrames", "g": "Action, Puzzle-Game", "r": 0, "img": "gbc/041.webp", "shot": "shots/gbc/041.webp", "d": "Alerte aux Martiens ! est un jeu d'action sur Gameboy exploitant la licence des Looney Tunes. Le martien Marvin prévoit de détruire la Terre mais Bugs Bunny et ses amis vont tout faire pour l'en empêcher. Il s'agira donc de récupérer les 10 éléments de téléporteurs dont Marvin a besoin. En tout, on pourra diriger 14 personnages issus de la célèbre série de dessins animés. Des échanges d'objets sont possibles entre joueurs via câble ou liaison infrarouge."}, {"id": "gbc_042", "s": "gbc", "n": 42, "t": "Looney Tunes collector : la revanche des Martiens !", "y": 2000, "dv": "Infogrames", "p": "Inforgrames", "g": "Action, Action / Aventure", "r": 0, "img": "gbc/042.webp", "shot": "shots/gbc/042.webp", "d": "La Revanche des Martiens est un jeu d'action sur Gameboy exploitant la licence des Looney Tunes. Aidé de son fidèle chien K-9, Marvin le Martien va tenter de se venger de son pire ennemi Daffy Duck. Il devra user de sa capacité à prendre le contrôle d'autres personnages, 49 en tout, chacun ayant ses propres spécificités."}, {"id": "gbc_043", "s": "gbc", "n": 43, "t": "Lufia : The Legend Returns", "y": 2001, "dv": "Neverland Co., Ltd.", "p": "Natsume", "g": "Jeu De Rôles", "r": 1, "img": "gbc/043.webp", "shot": "shots/gbc/043.webp", "d": "Lufia : The Legend Returns est un jeu de rôle. Vous devez lutter contre les forces du mal dans un donjon de 200 étages. Vous pouvez combattre les monstres dans des combats au tour par tour et une équipe de neuf compagnons."}, {"id": "gbc_044", "s": "gbc", "n": 44, "t": "Magical Tetris Challenge", "y": 2000, "dv": "Capcom", "p": "Capcom", "g": "Puzzle-Game", "r": 0, "img": "gbc/044.webp", "shot": "shots/gbc/044.webp", "d": "Magical Tetris Challenge mélange la célèbre franchise Tetris avec les personnages et les univers de Disney. Le Tetris original vous est proposé à travers le défi d'endurance habituel ou le nouveau mode histoire, où vous choisissez l'un des nombreux personnages Disney bien connus (Mickey, Minnie, Donald et Goofy) et affrontez les méchants dans un jeu de Tetris pour sauver la mise. Un mode 2 joueurs est également inclus."}, {"id": "gbc_045", "s": "gbc", "n": 45, "t": "Mario Golf", "y": 1999, "dv": "Camelot Software", "p": "Nintendo", "g": "Sport", "r": 2, "img": "gbc/045.webp", "shot": "shots/gbc/045.webp", "d": "Mario Golf est un jeu de sport sorti sur Gameboy. Vous êtes plongé directement dans l'univers de Mario : couleurs vives, ambiance cartoon, musiques de crèche etc. Dans l'interface, rien d'une grosse simulation sérieuse et précise comme on en a l'habitude. Mario Golf se veut éclectique et offre pas moins de 7 modes de jeu. Ces modes comprennent un Tournoi et un mode Entraînement."}, {"id": "gbc_046", "s": "gbc", "n": 46, "t": "Mario Tennis", "y": 2001, "dv": "Camelot Software", "p": "Nintendo", "g": "Sport / Tennis, Sport", "r": 2, "img": "gbc/046.webp", "shot": "shots/gbc/046.webp", "d": "Que vous soyez professionnel ou amateur, Mario Tennis sur Gameboy est là pour vous faire aimer le tennis. Chaque victoire rapporte à votre sportif des points d'expérience qui le font évoluer dans le mode Carrière. Enfin, enchaînez les bonnes performances avec Mario et ses amis dans le mode Mario Tour."}, {"id": "gbc_047", "s": "gbc", "n": 47, "t": "Matchbox: Patrouille d'urgence", "y": null, "dv": "Lucky Chicken Games, Inc.", "p": "Mattel Electronics", "g": "Course, Conduite", "r": 0, "img": "gbc/047.webp", "shot": "shots/gbc/047.webp", "d": "conduisait des camions de pompiers et des voitures de police pour protéger les citoyens de la ville de Matchbox. Le jeu est basé dans une ville qui a 5 parties distinctes reliées par un système d'autoroute. Au fur et à mesure que le joueur accomplit avec succès ses missions, il est promu à de nouveaux rangs comme pompiers et policiers et se voit confier de plus grandes zones de la ville. Il y a plusieurs types de missions pour chaque véhicule. Il existe deux systèmes de contrôle distincts conçus pour rendre le titre jouable pour les jeunes enfants tout en restant difficile pour les joueurs plus âgés."}, {"id": "gbc_048", "s": "gbc", "n": 48, "t": "Mega Man Xtreme", "y": 2001, "dv": "Capcom", "p": "Capcom", "g": "Action, Tir", "r": 1, "img": "gbc/048.webp", "shot": "shots/gbc/048.webp", "d": "Puisqu'un Maverick a réussi à s'infiltrer sur le réseau mondial pour libérer ses congénères robots, X doit reprendre du service et repartir au combat pour arrêter ce nouveau danger. Megaman Xtreme sur Gameboy Color est un jeu d'action plates-formes qui vous fait affronter 8 nouveaux Mavericks répartis dans autant de niveaux. Comme d'habitude, le héros récupère des pouvoirs inédits en détruisant ses ennemis."}, {"id": "gbc_049", "s": "gbc", "n": 49, "t": "Mega Man Xtreme 2", "y": 2002, "dv": "Capcom", "p": "Capcom", "g": "Action, Tir", "r": 1, "img": "gbc/049.webp", "shot": "shots/gbc/049.webp", "d": "Toujours volontaire pour sauver la planète, X est de nouveau envoyé au combat pour venir à bout de nouveaux robots Mavericks. Dans Mega Man Xtreme 2, il n'est cependant pas tout seul à se battre puisque Zero et Iris l'accompagnent. Ce jeu d'action plates-formes sur Gameboy Color introduit 8 robots ennemis inédits, tous s'inspirant d'animaux différents."}, {"id": "gbc_050", "s": "gbc", "n": 50, "t": "Metal Gear Solid", "y": 2000, "dv": "Konami", "p": "Konami", "g": "Action", "r": 2, "img": "gbc/050.webp", "shot": "shots/gbc/050.webp", "d": "Metal Gear Solid : Ghost Babel est un jeu d'infiltration sur Gameboy. Un groupe de terroristes a pris le contrôle d'un avion cargo contenant Metal Gear - l'arme la plus puissante du monde - pour l'emmener dans leur base africaine. Le gouvernement américain dépêche Solid Snake sur place... Deux amis peuvent joueur simultanément via le câble."}, {"id": "gbc_051", "s": "gbc", "n": 51, "t": "Mickey's Racing Adventure", "y": 1999, "dv": "Rareware", "p": "Nintendo", "g": "Course, Conduite", "r": 1, "img": "gbc/051.webp", "shot": "shots/gbc/051.webp", "d": "Mickey's Racing Adventure : Le point principal du jeu est de gagner des courses afin de récupérer ce que Pete a volé. En cours de route, des mises à niveau peuvent être achetées ainsi que des astuces et des jeux bonus. Le bureau de poste et l'imprimerie de la ville natale de Mickey sont débloqués en échangeant des noix et en payant des Dollars Disney à Chip and Dale afin d'obtenir les clés des lieux."}, {"id": "gbc_052", "s": "gbc", "n": 52, "t": "Mickey's Speedway USA", "y": null, "dv": "Rareware", "p": "Nintendo", "g": "Course, Conduite", "r": 1, "img": "gbc/052.webp", "shot": "shots/gbc/052.webp", "d": "Mickey's Speedway USA : Les belettes ont enlever Pluto. c'est à Mickey et au reste de l'équipe Disney de les poursuivre à travers le pays et de ramener le pauvre Pluto. Utilisez les puissants pick-up du Professeur Von Drake - comme le Baseball Chucker ou le Paint Splotcher - pour vous frayer un chemin à travers 20 parcours All-American, de Los Angeles à Washington. Pouvez-vous aider à sauver le chiot volé de Mickey?"}, {"id": "gbc_053", "s": "gbc", "n": 53, "t": "Micro Machines 1 and 2 : Twin Turbo", "y": null, "dv": "Codemasters", "p": "Thq", "g": "Course, Conduite", "r": 0, "img": "gbc/053.webp", "shot": "shots/gbc/053.webp", "d": "Tiny cars race through the house in MICRO MACHINES 1 AND 2: Twin Turbo. Take 15 vehicles including jeeps, helicopters, tanks, speedboats, and sports cars onto 60 different tracks like the breakfast table, the garden, and the pool table. Each track has its own obstacles and hazards, so keep your eyes peeled. For example, watch out for the rubber ducks, soapsuds, and whirlpool drain in the bathtub. The biggest hazard is falling off of the track, which costs time and puts you way behind. As an added bonus, there is a Two-Player mode that can be played on one Game Boy: one player uses direction pad and the other uses the buttons to steer his vehicle left or right, the goal being to push the opposition off of the track. With all of the track and vehicle choices, there is plenty to keep you playing MICRO MACHINES 1 AND 2: Twin Turbo."}, {"id": "gbc_054", "s": "gbc", "n": 54, "t": "Monkey Puncher", "y": 2000, "dv": "Taito", "p": "Evolution Entertainment Srl.", "g": "Stratégie, Combat", "r": 0, "img": "gbc/054.webp", "shot": "shots/gbc/054.webp", "d": "Monkey Puncher est un jeu dont le but est d'entraîner un singe à se battre dans des matchs de boxe afin de sauver votre frère ou votre sœur kidnappé(e). Vous pouvez choisir de jouer un personnage de garçon ou de fille ; celui que vous ne choisissez pas est votre frère ou votre sœur. Peu après le début du jeu, vous recevez votre premier singe, Freddy. Vous pouvez l'entraîner à sauter à la corde, à utiliser un punching-ball, à faire des abdominaux, à courir et même à faire des courses. Il existe également une sixième activité, appelée \"sparring\". Ces activités lui permettent d'améliorer sa vitesse, sa puissance, sa force, son endurance, ses connaissances et (pour cette dernière activité) tout cela, bien que de façon limitée."}, {"id": "gbc_055", "s": "gbc", "n": 55, "t": "Mortal Kombat 4", "y": 1999, "dv": "Digital Eclipse", "p": "Midway", "g": "Action, Combat", "r": 0, "img": "gbc/055.webp", "shot": "shots/gbc/055.webp", "d": "Le joueur incarne l'un des différents personnages et doit vaincre un par un l'ensemble de ses concurrents directs pour gagner le tournoi."}, {"id": "gbc_056", "s": "gbc", "n": 56, "t": "Ms. Pac-Man : Special Colour Edition", "y": null, "dv": "Namco", "p": "Namco", "g": "Action", "r": 1, "img": "gbc/056.webp", "shot": "shots/gbc/056.webp", "d": "Toute l'action et le plaisir du premier jeu d'arcade féministe peuvent être mis dans la paume de la main avec Miss PAC-MAN : Édition spéciale couleur. Vous prenez le contrôle du disque jaune orné de rouge à lèvres et d'un nœud rose, plus connu sous le nom de la charmante Miss Pac-Man. Le but est de la guider dans le labyrinthe et de manger tous les points, en évitant les quatre fantômes qui vous poursuivent. Il y a des pastilles de puissance situées dans chaque coin du labyrinthe qui, lorsqu'elles sont mangées, font virer les fantômes au bleu. Une fois que cela se produit, les fantômes peuvent être mangés. De temps en temps, des fruits flottent dans le labyrinthe, qui peuvent être mangés pour obtenir des points supplémentaires. Si vos amis veulent participer, il existe un mode deux joueurs en parallèle. En bonus supplémentaire, une version complète de SUPER PAC-MAN est incluse dans la cartouche. Jouez en tant que premier héros féminin d'arcade dans Miss PAC-MAN : Édition spéciale couleur."}, {"id": "gbc_057", "s": "gbc", "n": 57, "t": "NBA In the Zone 2000", "y": null, "dv": "Konami", "p": "Konami", "g": "Sport", "r": 0, "img": "gbc/057.webp", "shot": "shots/gbc/057.webp", "d": "NBA in the Zone 2000 sur Gameboy est un jeu de basket proposant la licence officielle américaine. Vous pouvez donc retrouver les 29 équipes et plus de 150 joueurs professionnels. Cinq modes de jeu sont réunis : Exhibition, Saison, Play-off, Concours de 3 Points et All-Star Game."}, {"id": "gbc_058", "s": "gbc", "n": 58, "t": "Pac-Man : Special Colour Edition", "y": null, "dv": "Namco", "p": "Namco", "g": "Action, Puzzle-Game", "r": 1, "img": "gbc/058.webp", "shot": "shots/gbc/058.webp", "d": "Pac-Man: Special Color Edition : guider Pac-Man autour d'un labyrinthe et éviter les fantômes. Lorsque le niveau est effacé, vous faites à nouveau la même chose, mais plus vite."}, {"id": "gbc_059", "s": "gbc", "n": 59, "t": "Perfect Dark", "y": null, "dv": "Rareware", "p": "Rareware", "g": "Aventure, Puzzle-Game", "r": 1, "img": "gbc/059.webp", "shot": "shots/gbc/059.webp", "d": "Vous jouez le rôle de Joanna Dark alias Perfect Dark, une jeune espionne de 23 ans, membre des forces d'élite. Votre première mission vous emmènera au coeur de la jungle sud-américaine où vous devrez détruire une usine clandestine de construction de cyborgs. Votre périple vous conduira rapidement à découvrir l'existence d'un gigantesque complot derrière lequel se cache la DataDyne Corporation."}, {"id": "gbc_060", "s": "gbc", "n": 60, "t": "Pokémon : Version Argent", "y": 2001, "dv": "Game Freak", "p": "Nintendo", "g": "Jeu De Rôles", "r": 3, "img": "gbc/060.webp", "shot": "shots/gbc/060.webp", "d": "Pokémon Version Argent est un jeu de rôle sorti sur Gameboy. Dirigez un dresseur de Pokémons qui doit devenir le meilleur d'entre tous. Pour cela, capturez des créatures et faites-les évoluer pour qu'elles deviennent de plus en plus fortes afin de battre la ligue Pokémon."}, {"id": "gbc_061", "s": "gbc", "n": 61, "t": "Pokémon : Version Cristal", "y": 2001, "dv": "Game Freak", "p": "Nintendo", "g": "Jeu De Rôles", "r": 4, "img": "gbc/061.webp", "shot": "shots/gbc/061.webp", "d": "Pokémon Version Cristal est un jeu de rôle sorti sur Gameboy. Dirigez un dresseur de Pokémons qui doit devenir le meilleur d'entre tous. Pour cela, capturez des créatures et faites-les évoluer pour qu'elles deviennent de plus en plus fortes afin de battre la ligue Pokémon."}, {"id": "gbc_062", "s": "gbc", "n": 62, "t": "Pokémon : Version Or", "y": 2001, "dv": "Game Freak", "p": "Nintendo", "g": "Jeu De Rôles", "r": 4, "img": "gbc/062.webp", "shot": "shots/gbc/062.webp", "d": "Pokémon Version Or est un jeu de rôle sorti sur Gameboy. Dirigez un dresseur de Pokémons qui doit devenir le meilleur d'entre tous. Pour cela, capturez des créatures et faites-les évoluer pour qu'elles deviennent de plus en plus fortes afin de battre la ligue Pokémon."}, {"id": "gbc_063", "s": "gbc", "n": 63, "t": "Pokémon Pinball", "y": 2000, "dv": "Jupiter Corporation", "p": "Nintendo", "g": "Flipper", "r": 2, "img": "gbc/063.webp", "shot": "shots/gbc/063.webp", "d": "Pokémon Pinball est un jeu de flipper sur Gameboy. Jouez au flipper comme d'habitude mais remplacez la bille par une Pokéball avec laquelle vous pourrez capturer les quelques 200 Pokémon qui se baladent sur les plateaux de jeu."}, {"id": "gbc_064", "s": "gbc", "n": 64, "t": "Pokémon Puzzle Challenge", "y": 2000, "dv": "Intelligent Systems", "p": "Nintendo", "g": "Puzzle-Game", "r": 2, "img": "gbc/064.webp", "shot": "shots/gbc/064.webp", "d": "Pokémon Puzzle Challenge est un jeu de réflexion sur Gameboy. Vous êtes assailli par des blocs de couleurs. Votre mission : éviter d'atteindre le haut de l'écran en alignant au moins trois blocs de la même couleur."}, {"id": "gbc_065", "s": "gbc", "n": 65, "t": "Pokémon Trading Card Game", "y": 2000, "dv": "Hudson", "p": "Nintendo", "g": "Jeu De Cartes", "r": 2, "img": "gbc/065.webp", "shot": "shots/gbc/065.webp", "d": "Pokémon Trading Card Game est un jeu de réflexion sur Gameboy Color. Le soft reprend le principe du jeu de cartes à collectionner à l'effigie des Pokémon. Le but du jeu est d'affronter un maximum d'opposants dans des duels de cartes afin d'acquérir un maximum de nouvelles cartes Pokémon. Pokémon Trading Card Game est jouable à plusieurs via le câble link."}, {"id": "gbc_066", "s": "gbc", "n": 66, "t": "Pong : The Next Level", "y": 2000, "dv": "Eastridge Technology|Morning Star Multimedia", "p": "Hasbro Interactive", "g": "Puzzle-Game", "r": 0, "img": "gbc/066.webp", "shot": "shots/gbc/066.webp", "d": "Pong: The Next Level : vous avez le choix entre des parties individuelles ou multi-joueurs et plus de 20 niveaux de compétition . Le meilleur de tous! Pong a maintenant des charges de pagaies pleinement fonctionnelles qui peuvent attraper, lancer et faire tourner la balle. Préparez-vous à porter vos compétences à un tout autre niveau avec Pong!"}, {"id": "gbc_067", "s": "gbc", "n": 67, "t": "R-Type DX", "y": null, "dv": "Bits Studios Ltd.", "p": "Nintendo", "g": "Action, Tir", "r": 0, "img": "gbc/067.webp", "shot": "shots/gbc/067.webp", "d": "R-Type DX sur Gameboy Color est une compilation regroupant les deux premiers volets de la série de shoot'em up R-Type ainsi qu'une version Deluxe du premier jeu."}, {"id": "gbc_068", "s": "gbc", "n": 68, "t": "Rayman", "y": 2000, "dv": "Ubisoft", "p": "Ubisoft", "g": "Action", "r": 1, "img": "gbc/068.webp", "shot": "shots/gbc/068.webp", "d": "Dans le monde de Rayman, la nature et les habitants vivent en paix et Le Grand Protoon maintient l'équilibre et l'harmonie de cet univers. Jusqu'au jour où l'horrible Mister Dark le dérobe, plongeant le monde dans le chaos et les ténèbres. Rayman devra trouver et délivrer tous les toons puis anéantir Mister Dark pour délivrer le Grand Protoon. Rayman sur Gameboy est une des références du jeu de plates-formes."}, {"id": "gbc_069", "s": "gbc", "n": 69, "t": "Rayman 2 : The Great Escape", "y": 2001, "dv": "Ubisoft", "p": "Ubisoft", "g": "Plateforme, Action", "r": 0, "img": "gbc/069.webp", "shot": "shots/gbc/069.webp", "d": "Rayman 2 sur Gameboy Color est un jeu de plates-formes en 2D. Vous incarnez Rayman le personnage sans bras et sans jambes. Sautez, accrochez-vous grâce à votre poing et collectez les boules de lumière (les Lums) pour engranger de nouveaux pouvoirs, dérober à l'amiral et à ses sous-fifres les 4 morceaux du masque de Polokus et sauver les Ptizêtres de leur triste sort."}, {"id": "gbc_070", "s": "gbc", "n": 70, "t": "Ready 2 Rumble Boxing", "y": null, "dv": "Crawfish Interactive Ltd.", "p": "Midway", "g": "Sport", "r": 0, "img": "gbc/070.webp", "shot": "shots/gbc/070.webp", "d": "Ready 2 Rumble Boxing sur Gameboy est un jeu de boxe où priment le fun et la bonne ambiance. Une vingtaine de boxeurs/boxeuses, plus ou moins funkys sont proposés. Sous ses airs légers, le jeu est en réalité d'une grande richesse, les possibilités de mouvements, de parades et d'esquives sont notamment très nombreuses."}, {"id": "gbc_071", "s": "gbc", "n": 71, "t": "Resident Evil Gaiden", "y": 2001, "dv": "M4 Ltd.", "p": "Capcom", "g": "Action, Puzzle-Game", "r": 1, "img": "gbc/071.webp", "shot": "shots/gbc/071.webp", "d": "Resident Evil Gaiden est un jeu d'action et d'aventure sur Gameboy. Les passagers d'un bateau ont été transformés en zombies par un virus mystérieux et Leon, de la police de Racoon, a disparu en menant l'enquête. Vous incarnez Barry Burton et partez à la recherche du disparu."}, {"id": "gbc_072", "s": "gbc", "n": 72, "t": "Shadowgate Classic", "y": null, "dv": "Infinite Ventures, Inc.", "p": "Kemco", "g": "Aventure, Puzzle-Game", "r": 1, "img": "gbc/072.webp", "shot": "shots/gbc/072.webp", "d": "Shadowgate Classic est un jeu d'aventure sur Gameboy Color et c'est le portage de Shadowgate. Vous prenez le contrôle d'un aventurier envoyé à l'ancienne porte Shadowgate. Votre but est de trouver un objet mystique connu sous le nom de \"Staff of Age\". Vous devez aussi tuer le démoniaque Seigneur Warlock pour l'empêcher d'invoquer le terrible démon Behemoth."}, {"id": "gbc_073", "s": "gbc", "n": 73, "t": "Space Invaders", "y": null, "dv": "Z-Axis", "p": "Activision", "g": "Shoot'em Up, Shoot'em Up / Vertical, Action, Tir", "r": 0, "img": "gbc/073.webp", "shot": "shots/gbc/073.webp", "d": "Vous déplacez un navire au bas de l'écran de droite à gauche, en tirant sur des piles de vaisseaux ennemis qui se déplacent également de droite à gauche, bombardant à la fois vous et les trois boucliers que vous pouvez canarder derrière. Les vaisseaux descendent lentement et si vous atteignez le niveau où vous êtes, vous perdez une vie. Plus vous détruisez de vaisseaux, plus les vaisseaux se déplacent rapidement, rendant les derniers vaisseaux de n'importe quel essaim très difficiles à atteindre. Au fur et à mesure que les niveaux progressent, vous affronterez d'énormes vaisseaux de boss et pourrez même débloquer la version originale cachée du jeu. De nouveaux éléments comme de la glace glissante."}, {"id": "gbc_074", "s": "gbc", "n": 74, "t": "Spider-Man", "y": 2000, "dv": "Vicarious Visions, Inc.", "p": "Activision", "g": "Action", "r": 1, "img": "gbc/074.webp", "shot": "shots/gbc/074.webp", "d": "Spider-Man est un jeu d'action et d'aventure sur Gameboy Color. Vous incarnez l'homme araignée et vous êtes accusé d'avoir dérobé la découverte d'Octavius, aussi connu sous le nom de Docteur Octopus. Rapidement, vous vous retrouvez au coeur d'une machination organisée par le scientifique que vous devez déjouer tout en fuyant les forces de l'ordre mais également tous les super-vilains qui ont une dent contre vous."}, {"id": "gbc_075", "s": "gbc", "n": 75, "t": "Spider-Man 2 : The Sinister Six", "y": 2001, "dv": "Torus Games Pty. Ltd.", "p": "Activision", "g": "Action", "r": 1, "img": "gbc/075.webp", "shot": "shots/gbc/075.webp", "d": "Spider-Man 2 : The Sinister Six sur Gameboy est un jeu de plates-formes où vous incarnez Spider-Man, alias Peter Parker, un journaliste-reporter. Docteur Octopus et ses acolytes, Mysterio, Scorpion et Sand-Man, décident de kidnapper votre tante May. Sans perdre une seule seconde, vous partez à leur poursuite pour tenter de retrouver May."}, {"id": "gbc_076", "s": "gbc", "n": 76, "t": "Star Wars Episode 1 : Obi-Wan's Adventures", "y": 2000, "dv": "Hotgen Ltd.", "p": "Thq", "g": "Aventure, Action", "r": 0, "img": "gbc/076.webp", "shot": "shots/gbc/076.webp", "d": "Star Wars Episode 1 : Obi-Wan's Adventures est un jeu d'action sur Gameboy Color qui vous invite à rejouer les grands moments de l'Episode 1 mettant en scène les troubles annonçant l'avènement de l'empire. Vous accompagnerez Obi-Wan dans sa progression et affronterez les nombreux ennemis qui vous barreront la route. De nombreux pièges seront également de la partie et s'efforceront de vous ralentir jusqu'à la confrontation avec Darth Maul, le chevalier Sith. Ce soft est exclusivement solo."}, {"id": "gbc_077", "s": "gbc", "n": 77, "t": "Star Wars Episode I : Racer", "y": 1999, "dv": "Pax Softnica", "p": "Nintendo", "g": "Course, Conduite", "r": 1, "img": "gbc/077.webp", "shot": "shots/gbc/077.webp", "d": "Nombreux sont ceux à avoir été scotchés par la course de pods d'Episode I.
