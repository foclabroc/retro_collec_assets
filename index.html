ci est la baston. Tout d'abord comptez huit persos jouables, plus deux à débloquer. Ajoutez à cela une animation d'une fluidité accrue et bluffante pour l'époque. La clé de la victoire réside dans l'esquive, plus importante que jamais dans un Art of Fighting."}, {"id": "neogeo_009", "s": "neogeo", "n": 9, "t": "Baseball Stars 2", "y": 1992, "dv": "SNK", "p": "SNK", "g": "Sport, Sport / Baseball", "r": 0, "img": "neogeo/009.webp", "shot": "shots/neogeo/009.webp", "d": "Devenez le roi de la batte dans Baseball Stars 2 sur Neo-Geo. Cette simulation de sport agrémentée de quelques images rappelant les comics américains vous permet de tester votre capacité au homerun. Défiez les équipes adverses dans des matchs épiques qui parfois se terminent à coups de poing, litige oblige. 18 équipes vous attendent, réparties en deux ligues correspondant à deux niveaux de difficulté."}, {"id": "neogeo_010", "s": "neogeo", "n": 10, "t": "Baseball Stars Professional", "y": 1990, "dv": "SNK", "p": "SNK", "g": "Sport, Sport / Baseball", "r": 0, "img": "neogeo/010.webp", "shot": "shots/neogeo/010.webp", "d": "Baseball Stars Professional est la suite de Baseball Stars (sorti initialement sur nes) et présente des graphismes de style bande dessinée. Choisissez parmi une variété d'équipes comprenant les Celestial Planets, Celestial Corps, Shadow Demons, Battle Knights, Fabulous Superstarses, et bien d'autres. Sélectionnez ensuite le terrain sur lequel le match doit se dérouler : Le stade SNK ou le dôme SNK. Chaque terrain a les mêmes dimensions, mais leur capacité varie. Le jeu se déroule de la même manière que le baseball normal. Il comprend un mode VS. dans lequel deux joueurs peuvent s'affronter."}, {"id": "neogeo_011", "s": "neogeo", "n": 11, "t": "Blazing Star", "y": 1998, "dv": "Yumekobo", "p": "SNK", "g": "Shoot'em Up / Horizontal, Shoot'em Up", "r": 0, "img": "neogeo/011.webp", "shot": "shots/neogeo/011.webp", "d": "L'armée de Brawshella menace toute la galaxie. La Ligue de Défense Spatiale décide alors d'envoyer plusieurs escadrons afin de restaurer la paix et de vaincre Brawshella. Blazing Star vous fera parcourir plusieurs niveaux à la difficulté très progressive aux commandes de différents vaisseaux. Chaque niveau propose une grande variété d'ennemis différente et se termine par un boss. Il se tue en 2 phases, et davantage pour le boss final. Une fois bien amoché, il subit une transformation ou bien perd des morceaux et change son comportement. Côté graphismes, l'introduction mi-manga mi-images de synthèse est somptueuse. Durant le jeu, les vaisseaux ont un rendu 3D et bon nombre de décors également. L'ambiance sonore est excellente elle aussi : la musique des niveaux change souvent, et est très entrainante. Arrivé au boss, elle change pour devenir encore plus rythmée. Enfin la maniabilité du jeu est irréprochable."}, {"id": "neogeo_012", "s": "neogeo", "n": 12, "t": "Blue's Journey", "y": 1991, "dv": "ADK", "p": "SNK", "g": "Plateforme, Plateforme / Fighter Scrolling", "r": 0, "img": "neogeo/012.webp", "shot": "shots/neogeo/012.webp", "d": "Dans Blue's Journey sur Neo Geo, vous incarnez un personnage au look d'insecte vivant sur une planète végétale. Votre petit monde bascule lorsqu'un grand méchant vient installer sa technologie dans votre petit écosystème. Evoluez seul ou à deux sur un écran à défilement horizontal dans ce jeu de plates-formes, où chaque niveau doit être complété dans un temps imparti. Traversez quatre régions pour atteindre et défaire le boss final."}, {"id": "neogeo_013", "s": "neogeo", "n": 13, "t": "Breakers", "y": 1996, "dv": "Visco", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/013.webp", "shot": "shots/neogeo/013.webp", "d": "Breakers sur Neo Geo est un jeu de combat 2D. Choisissez parmi 9 personnages ayant leur technique propre et tentez les \"chain\", capables de créer une pluie de coups et d'attaques incessantes. A noter que les combattants bénéficient de voix digitalisées."}, {"id": "neogeo_014", "s": "neogeo", "n": 14, "t": "Breakers Revenge", "y": 1998, "dv": "Visco", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/014.webp", "shot": "shots/neogeo/014.webp", "d": "Breaker's Revenge est un jeu a la croisé des chemins : se jouant de manière très old school, il regorge néanmoins de spécificités qui le rendent pratiquement inusable. Doté d'une ambiance décalée et survoltée, il fait partie de ces titres auxquels on s'adonne toujours avec plaisir."}, {"id": "neogeo_015", "s": "neogeo", "n": 15, "t": "Burning Fight", "y": 1991, "dv": "SNK", "p": "SNK", "g": "Beat'em All", "r": 0, "img": "neogeo/015.webp", "shot": "shots/neogeo/015.webp", "d": "Dans le beat'em all Burning Fight sur Neo Geo, vous incarnez deux super détectives qui n'ont rien en commun avec Columbo. Appelés à la rescousse par l'un de leurs collègues aux prises avec une organisation du crime, vous devez les aider à distribuer les tatanes et autres marrons aux nombreux voyous peuplant les rues."}, {"id": "neogeo_016", "s": "neogeo", "n": 16, "t": "Cyber-Lip", "y": 1990, "dv": "SNK", "p": "SNK", "g": "Tir / Run And Gun, Plateforme, Plateforme / Shooter Scrolling, Tir", "r": 0, "img": "neogeo/016.webp", "shot": "shots/neogeo/016.webp", "d": "Il s'agit là d'un des premiers jeux sortis sur Neo Geo. Cyber-Lip est un jeu d'action avec des phases de plates-formes dans lequel vous incarnez deux membres d'une élite spéciale, chargés d'aller zigouiller des extraterrestres dans l'espace."}, {"id": "neogeo_017", "s": "neogeo", "n": 17, "t": "Fatal Fury 2", "y": 1992, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/017.webp", "shot": "shots/neogeo/017.webp", "d": "Fatal Fury 2 sur NeoGeo est un jeu de combat proposant une douzaine de combattants, dont certains issus de précédent opus. Les protagonistes sont cette fois-ci invités à participer à la battle royale, organisée par Wolfang Krauzer."}, {"id": "neogeo_018", "s": "neogeo", "n": 18, "t": "Fatal Fury 3: Road to the Final Victory", "y": 1995, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/018.webp", "shot": "shots/neogeo/018.webp", "d": "A South Town, tout le monde croit Geese Howard mort, mais celui-ci refait surface. C'est l'occasion pour les combattants de Fatal Fury 3 de se mesurer et d'en découdre. Trois nouveaux persos et un système de notation de votre style sont au programme dans ce troisième épisode sur Neo Geo."}, {"id": "neogeo_019", "s": "neogeo", "n": 19, "t": "Fatal Fury : King of Fighters", "y": 1991, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/019.webp", "shot": "shots/neogeo/019.webp", "d": "L'histoire de Fatal Fury se déroule dans la ville américaine fictive de Southtown. Rongée par le crime et la corruption et dirigée de main de fer par le Parrain de la pègre locale Geese Howard, cette ville accueille chaque année le tournoi du King of Fighters, qui permet aux combattants les plus aguerris de se mesurer puis d'affronter le bras droit de Howard, l'invincible Billy Kane. Les frères Terry et Andy Bogard décident de participer au tournoi dans le but de se venger la mort de leur père, l'expert en arts martiaux Jeff Bogard, assassiné dans des conditions mystérieuses par Geese Howard. La principale originalité apportée par Fatal Fury est de permettre de combattre sur deux plans différents. Le joueur a la possibilité de déplacer son personnage de l'avant à l'arrière plan, afin notamment d'esquiver les attaques de l'adversaire. Les trois personnages disposent de coups pouvant porter d'un plan à l'autre ou sur les deux plans à la fois."}, {"id": "neogeo_020", "s": "neogeo", "n": 20, "t": "Fatal Fury Special", "y": 1993, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/020.webp", "shot": "shots/neogeo/020.webp", "d": "Fatal Fury Special sur Neo Geo est un jeu de baston en 2D, qui est une version améliorée de Fatal Fury 2. 16 personnages au style unique s'affrontent ici. Battez-vous dans des décors variables et maîtrisez le système de combo qui permet de vider la barre de vie adverse en un clin d'oeil."}, {"id": "neogeo_021", "s": "neogeo", "n": 21, "t": "Football Frenzy", "y": 1992, "dv": "SNK", "p": "SNK", "g": "Sport, Sport / Football Américain", "r": 0, "img": "neogeo/021.webp", "shot": "shots/neogeo/021.webp", "d": "Football Frenzy sur Neo Geo est une simulation de football américain mélangeant des stratégies complexes et un jeu physique intense. Le but du jeu est de marquer des points en portant le ballon ovale jusqu'à la zone de but de l'équipe adverse au bout du terrain. Pour avancer, le joueur peut porter le ballon en slalomant entre les défenseurs ou le lancer à un coéquipier."}, {"id": "neogeo_022", "s": "neogeo", "n": 22, "t": "Garou: Mark of the Wolves", "y": 1999, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 3, "img": "neogeo/022.webp", "shot": "shots/neogeo/022.webp", "d": "Cela fait plusieurs années que Geese Howard a été vaincu dans une bataille avec Terry Bogard, un jeune homme cherchant à venger son père. Plutôt que de chercher à être sauvé de la mort après être tombé du balcon de son bureau, Geese a plutôt décidé de mourir et a laissé derrière lui son jeune fils, Rock. Terry a accueilli Rock et est devenu comme un grand frère pour lui, élevant le garçon tout au long de sa vie. Maintenant, Rock est un adolescent et Terry est un homme dans la trentaine, et les deux sont sur le point de se retrouver dans un nouvel affrontement... nouveaux visages et anciens se réunissent pour la plus grande bataille à ce jour !"}, {"id": "neogeo_023", "s": "neogeo", "n": 23, "t": "Ghost Pilots", "y": 1991, "dv": "SNK", "p": "SNK", "g": "Shoot'em Up / Vertical, Shoot'em Up", "r": 0, "img": "neogeo/023.webp", "shot": "shots/neogeo/023.webp", "d": "Ghost Pilots sur Neo Geo est un shoot'em up se déroulant durant la Seconde Guerre mondiale. Le joueur dirige un bombardier et peut tirer sur ses adversaires ou lâcher des bombes limitées en nombre. Les tirs peuvent augmenter en puissance à condition de récupérer des bonus estampillés S, lâchés par un groupe d'avions rouges. Gardez un oeil partout car les tirs et avions ennemis proviennent des quatre coins de l'écran."}, {"id": "neogeo_024", "s": "neogeo", "n": 24, "t": "Karnov's Revenge", "y": 1994, "dv": "Data East", "p": "SNK", "g": "Combat / Versus, Combat", "r": 0, "img": "neogeo/024.webp", "shot": "shots/neogeo/024.webp", "d": "Karnov's Revenge, plus connu sous le nom de Fighter's History Dynamite dans d'autres pays, est un jeu de combat en 2D sur Neo Geo et Neo Geo CD. Treize combattants sont proposés. Vous pourrez les faire évoluer dans des modes classiques, à savoir : Versus et Histoire en solo."}, {"id": "neogeo_025", "s": "neogeo", "n": 25, "t": "King of the Monsters", "y": 1991, "dv": "SNK", "p": "SNK", "g": "Combat, Beat'em All", "r": 0, "img": "neogeo/025.webp", "shot": "shots/neogeo/025.webp", "d": "King of the Monsters sur Neo Geo est un jeu de destruction dans lequel des créatures géantes s'affrontent afin d'obtenir le titre de champion du monde des monstres. Les participants varient du dinosaure à la momie, en passant par le gorille ou le coléoptère. Quant aux rings choisis pour ces affrontements titanesques, il s'agit des plus vastes métropoles japonaises."}, {"id": "neogeo_026", "s": "neogeo", "n": 26, "t": "King of the Monsters 2 : The Next Thing", "y": 1992, "dv": "SNK", "p": "SNK", "g": "Beat'em All", "r": 0, "img": "neogeo/026.webp", "shot": "shots/neogeo/026.webp", "d": "King of the Monsters 2 : the Next Thing sur Neo Geo est un jeu d'action dans lequel vous incarnez des créatures géantes. Contrairement au premier épisode, vous ne devez pas semer terreur et la destruction sur votre passage mais défendre les humains d'une invasion de monstres extraterrestres. Les combats se déroulent dans les 4 coins du monde : France, Etats-Unis, Grand Canyon, Volcans, etc."}, {"id": "neogeo_027", "s": "neogeo", "n": 27, "t": "Kizuna Encounter : Super Tag Battle", "y": 1996, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/027.webp", "shot": "shots/neogeo/027.webp", "d": "Kizuna Encounter Super Tag Battle est l'un des nombreux jeux de combat sortis sur la Neo Geo. Celui-ci propose cependant une particularité avec le \"tag battle\". Vous combattez par équipe de deux, avec la possibilité d'interchanger les combattants à tout moment, pourvu que vous soyez sur la zone d'échange. La mise au tapis de l'un des deux entraîne la défaite de l'équipe entière."}, {"id": "neogeo_028", "s": "neogeo", "n": 28, "t": "Last Resort", "y": 1992, "dv": "SNK", "p": "SNK", "g": "Shoot'em Up / Horizontal, Shoot'em Up", "r": 0, "img": "neogeo/028.webp", "shot": "shots/neogeo/028.webp", "d": "Dans un futur lointain, les hommes ont colonisé l'espace. Un virus d'origine inconnue a pris possession de la plupart des intelligences artificielles, les retournant contre l'humanité avec pour unique but de l'anéantir. Vous incarnez l'un des pilotes de l'opération Last Resort dans ce jeu sur Neo Geo, dernier espoir pour les humains."}, {"id": "neogeo_029", "s": "neogeo", "n": 29, "t": "League Bowling", "y": 1990, "dv": "SNK", "p": "SNK", "g": "Sport / Bowling, Sport", "r": 0, "img": "neogeo/029.webp", "shot": "shots/neogeo/029.webp", "d": "League Bowling sur Neo Geo vous propose de dégommer des quilles à tout-va, qui plus est dans la bonne humeur. Jouable jusqu'à 4, ce titre offre de nombreux modes de jeu afin de pimenter le mode classique. Le tout est ponctué de petites scènes dans un look cartoon, venant égayer les parties."}, {"id": "neogeo_030", "s": "neogeo", "n": 30, "t": "Magical Drop II", "y": 1996, "dv": "Data East", "p": "SNK", "g": "Puzzle-Game, Puzzle-Game / Lancer", "r": 0, "img": "neogeo/030.webp", "shot": "shots/neogeo/030.webp", "d": "Dans Magical Drop II sur Neo Geo, vous contrôlez un clown qui attrape et lance des ballons. Vous devez les rassembler par couleurs identiques pour qu'ils explosent et libèrent de la place. Le mode deux joueurs vous permet d'affronter le CPU ou un ami."}, {"id": "neogeo_031", "s": "neogeo", "n": 31, "t": "Magical Drop III", "y": 1997, "dv": "Data East", "p": "Data East", "g": "Puzzle-Game, Puzzle-Game / Lancer", "r": 0, "img": "neogeo/031.webp", "shot": "shots/neogeo/031.webp", "d": "Dans Magical Drop III sur Neo Geo, vous contrôlez un clown qui attrape et lance des ballons. Vous devez les rassembler par couleurs identiques pour qu'ils explosent et libèrent de la place. Le mode deux joueurs vous permet d'affronter le CPU ou un ami, et cette fois-ci, vous pouvez choisir votre personnage, doté d'attaques qui lui sont propres."}, {"id": "neogeo_032", "s": "neogeo", "n": 32, "t": "Magician Lord", "y": 1990, "dv": "ADK", "p": "SNK", "g": "Plateforme / Shooter Scrolling, Plateforme", "r": 0, "img": "neogeo/032.webp", "shot": "shots/neogeo/032.webp", "d": "Magician Lord sur Neo Geo est un jeu mêlant action et aventure où vous incarnez le puissant mage Elta et devez vous frayer un chemin à travers huit niveaux truffés d'ennemis démoniaques. Utilisez vos pouvoirs magiques pour vous transformer en dragon, en samouraï et en bien d'autres choses !"}, {"id": "neogeo_033", "s": "neogeo", "n": 33, "t": "Matrimelee", "y": 2002, "dv": "Noise Factory", "p": "SNK", "g": "Combat / Versus, Combat", "r": 0, "img": "neogeo/033.webp", "shot": "shots/neogeo/033.webp", "d": "Power Instinct Matrimelee sur Neo Geo est un jeu de combat en un contre un. Les personnages disponibles sont issus du jeu Gouketsuji Ichizoku 2, sorti six années auparavant. Lancez-vous dans l'arène, où des actions loufoques surviennent toujours au milieu d'un combat."}, {"id": "neogeo_034", "s": "neogeo", "n": 34, "t": "Metal Slug 2 : Super Vehicle-001/II", "y": 1998, "dv": "SNK", "p": "SNK", "g": "Tir / Run And Gun, Tir, Plateforme, Plateforme / Shooter Scrolling", "r": 2, "img": "neogeo/034.webp", "shot": "shots/neogeo/034.webp", "d": "Vous incarnez Marco, Eri, Tarma ou Fio dans Metal Slug 2 sur Neo Geo. Tout au long des niveaux, vous pouvez collecter de puissantes armes et conduire des véhicules dans le but de barrer la route au General Morden. La recette qui a fait le succès de son prédécesseur est ici reprise, et améliorée."}, {"id": "neogeo_035", "s": "neogeo", "n": 35, "t": "Metal Slug 3", "y": 2001, "dv": "SNK", "p": "SNK", "g": "Tir / Run And Gun, Tir", "r": 3, "img": "neogeo/035.webp", "shot": "shots/neogeo/035.webp", "d": "Metal Slug 3 est un jeu vidéo du type run and gun développé et édité par SNK en 2000 sur Neo-Geo MVS et Neo-Geo AES (NGM 256)1,2,3. C'est le quatrième épisode de la série Metal Slug, il a été porté sur PlayStation 2 en 2003 et sur Xbox en 2004 Xbox."}, {"id": "neogeo_036", "s": "neogeo", "n": 36, "t": "Metal Slug 4", "y": 2002, "dv": "MEGA Enterprise", "p": "SNK", "g": "Tir / Run And Gun, Tir, Plateforme, Plateforme / Shooter Scrolling", "r": 1, "img": "neogeo/036.webp", "shot": "shots/neogeo/036.webp", "d": "Une organisation nommée Amadeus est sur le point de prendre le contrôle des ordinateurs des armées du monde entier grâce à un virus qu'elle a développé. Metal Slug 4 sur Neo Geo présente deux nouveaux héros, Nadia Cassel et Trevor Spacey, que vous devez guider à travers des niveaux fourmillant d'ennemis. Heureusement pour vous, un arsenal copieux est à votre disposition pour blaster à tour de bras."}, {"id": "neogeo_037", "s": "neogeo", "n": 37, "t": "Metal Slug 5", "y": 2003, "dv": "SNK", "p": "SNK", "g": "Tir / Run And Gun, Tir, Plateforme, Plateforme / Shooter Scrolling", "r": 1, "img": "neogeo/037.webp", "shot": "shots/neogeo/037.webp", "d": "Les quatre héros mythiques de la série (Marco, Tarma, Eri et Fio) sont de retour dans Metal Slug 5 sur Neo Geo. Ils traquent cette fois-ci une organisation du crime qui a dérobé les plans des prochains Metal Slug. Trois nouveaux guns, deux véhicules, et un nouveau mouvement qu'est le \"slide\" constituent les améliorations de ce cinquième épisode."}, {"id": "neogeo_038", "s": "neogeo", "n": 38, "t": "Metal Slug : Super Vehicle-001", "y": 1996, "dv": "Nazca", "p": "SNK", "g": "Tir / Run And Gun, Tir, Plateforme, Plateforme / Shooter Scrolling", "r": 4, "img": "neogeo/038.webp", "shot": "shots/neogeo/038.webp", "d": "Metal Slug est un jeu d'action sur Neo Geo. Vous incarnez Marco Rossi et Tarma Roving, membres des Peregrine Falcons, en mission pour libérer de nombreux prisonniers. Face à vous, une horde d'ennemis qui veulent votre peau, et que vous devez donc annihiler, grâce notamment aux armes et véhicules que vous pouvez trouver en chemin."}, {"id": "neogeo_039", "s": "neogeo", "n": 39, "t": "Metal Slug X : Super Vehicle-001", "y": 1999, "dv": "SNK", "p": "SNK", "g": "Tir / Run And Gun, Tir, Shoot'em Up, Shoot'em Up / Horizontal, Plateforme, Plateforme / Shooter Scrolling", "r": 4, "img": "neogeo/039.webp", "shot": "shots/neogeo/039.webp", "d": "Remake de Metal Slug 2, cet opus ne s'est pas contenté de régler le problème de ralentissement, il a aussi apporté quelques nouveautés: -De nouvelles armes font leurs apparitions: Iron Lizard, Drop Shot et ainsi que les versions plus puissantes des armes déjà existante. -Deux nouveau véhicules: le Slug Noid et le Metal Slug Type-R (version plus résistante, plus puissante et plus rapide) -Une refonte de tous les décors. -Une nouvelle mise en scène dans la mission finale."}, {"id": "neogeo_040", "s": "neogeo", "n": 40, "t": "Mutation Nation", "y": 1992, "dv": "SNK", "p": "SNK", "g": "Beat'em All", "r": 0, "img": "neogeo/040.webp", "shot": "shots/neogeo/040.webp", "d": "Des expériences génétiques ont très mal tourné et ont transformé toute la population d'un ville en mutants. Dans Mutation Nation sur Neo Geo, vous incarnez un des deux braves gaillards chargés de ramener l'ordre dans ce village maudit."}, {"id": "neogeo_041", "s": "neogeo", "n": 41, "t": "NAM-1975", "y": 1990, "dv": "SNK", "p": "SNK", "g": "Tir, Tir / 3Eme Personne", "r": 0, "img": "neogeo/041.webp", "shot": "shots/neogeo/041.webp", "d": "Nam 75 reprend le meilleur des deux jeux que sont Operation Wolf et Cabal pour nous en offrir une synthèse plus aboutie. Vous prendrez donc le contrôle d'un soldat vu de dos qui va se déplacer latéralement sur un seul axe horizontal, sans possibilité de monter ou descendre. Le scrolling va défiler indépendamment et s'arrêtera lors d'événements particuliers ou de boss. Vous aurez d'office une arme type mitraillette tirant des balles relativement rapides. Votre armement pourra rapidement s'étoffer en ramassant des grenades, ou des armes secondaires comme une mitrailleuse lourde ou un lance-flammes. Ces armes secondaires auront des munitions limitées, et seront donc à utiliser avec discernement. La destruction des ennemis ou éléments du décor vous permettra de dénicher ces atouts supplémentaires, mais aussi des Speed-ups ou des points pour faire grossir votre score et ainsi gagner des vies."}, {"id": "neogeo_042", "s": "neogeo", "n": 42, "t": "Neo Bomberman", "y": 1997, "dv": "SNK", "p": "Hudson Soft", "g": "Action, Action / Labyrinthe", "r": 0, "img": "neogeo/042.webp", "shot": "shots/neogeo/042.webp", "d": "Neo Bomberman sur Neo Geo est un jeu d'action dans lequel vous incarnez l'un des 12 personnages proposés. Le but du jeu est de faire exploser une bombe près de son adversaire afin de le réduire en cendres. Deux modes sont proposés : un mode normal comprenant 5 environnements différents et un mode battle permettant à 4 joueurs de s'affronter simultanément avec 2 consoles raccordées"}, {"id": "neogeo_043", "s": "neogeo", "n": 43, "t": "Neo Drift Out : New Technology", "y": 1996, "dv": "SNK", "p": "SNK", "g": "Course, Conduite, Course, Conduite / Course", "r": 0, "img": "neogeo/043.webp", "shot": "shots/neogeo/043.webp", "d": "Neo Drift Out sur Neo Geo est un jeu de rallye comprenant 3 véhicules (Toyota Celica, Subaru Impreza et Mitsubishi Lancer) et 6 courses pour autant d'environnements. Le pilotage se fait exclusivement en dérapages et chaque stage doit être terminé dans le temps imparti afin d'accéder au niveau suivant."}, {"id": "neogeo_044", "s": "neogeo", "n": 44, "t": "Neo Turf Masters", "y": 1996, "dv": "Nazca", "p": "SNK", "g": "Sport / Golf, Sport", "r": 0, "img": "neogeo/044.webp", "shot": "shots/neogeo/044.webp", "d": "Neo Turf Masters sur Neo Geo est une simulation de Golf comprenant deux modes de jeu : Solo ou Vs. Le Solo se décline en 3 modes : Entraînement, Handicap (le joueur part avec un handicap variant selon son niveau) et Triple Crown (affrontez les meilleurs). Choisissez l'un des 6 golfeurs au choix selon son style de jeu et lancez-vous dans l'un des 3 parcours au choix en Allemagne, aux USA ou au Japon."}, {"id": "neogeo_045", "s": "neogeo", "n": 45, "t": "Ninja Combat", "y": 1991, "dv": "Alpha Denshi", "p": "SNK", "g": "Beat'em All", "r": 0, "img": "neogeo/045.webp", "shot": "shots/neogeo/045.webp", "d": "Ninja Combat sur Neo Geo est un beat'em all sorti sur la plate-forme de SNK. Seul ou à 2 joueurs, incarnez un ninja et terrassez vos adversaires grâces aux armes blanches, techniques de combat et bonus de puissance disséminés dans les stages. A la moitié de chaque niveau, le joueur affronte un demi-boss qui, une fois battu, devient jouable."}, {"id": "neogeo_046", "s": "neogeo", "n": 46, "t": "Ninja Master's: Haō Ninpō Chō", "y": 1996, "dv": "ADK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 0, "img": "neogeo/046.webp", "shot": "shots/neogeo/046.webp", "d": "Ninja Master's sur Neo Geo est un jeu de combat comprenant 10 personnages aux styles distincts. Pour augmenter l'intensité des duels, le titre privilégie les \"hits\" et autres combos dans le but de mettre en scène des successions d'enchaînements plus sanglants les uns que les autres. Chaque personnage dispose d'une arme blanche et d'un coup unique, déclenchable lorsque la power jauge est remplie."}, {"id": "neogeo_047", "s": "neogeo", "n": 47, "t": "Over Top", "y": 1996, "dv": "ADK", "p": "SNK", "g": "Course, Conduite / Course, Course, Conduite", "r": 0, "img": "neogeo/047.webp", "shot": "shots/neogeo/047.webp", "d": "Over Top sur Neo Geo est un jeu de courses proposant 8 véhicules (Hummer, Ferrari, Moto...) qui s'affrontent dans des environnements divers (ville, désert, campagne...). L'objectif est de terminer les courses avant que le chronomètre n'atteigne zéro. Les virages sont annoncés par des flèches et le joueur peut s'aider d'un radar, notamment pour dénicher les raccourcis."}, {"id": "neogeo_048", "s": "neogeo", "n": 48, "t": "Pop 'n Bounce", "y": 1997, "dv": "SNK", "p": "SNK", "g": "Puzzle-Game, Action, Action / Casse Briques", "r": 0, "img": "neogeo/048.webp", "shot": "shots/neogeo/048.webp", "d": "Pop'n Bounce sur Neo Geo est un jeu de type casse-briques. Le joueur dirige une plate-forme en bas de l'écran sur laquelle rebondit une balle qui doit faire disparaître des cibles. Le titre intègre un mode deux joueurs dans lequel il faut terminer le niveau plus vite que son adversaire. Pour aider le joueur, il existe différents types de bonus : élargissement de planchettes, tirs de missiles, etc."}, {"id": "neogeo_049", "s": "neogeo", "n": 49, "t": "Power Spikes II", "y": 1994, "dv": "Video System", "p": "Taito", "g": "Sport, Sport / Volleyball", "r": 0, "img": "neogeo/049.webp", "shot": "shots/neogeo/049.webp", "d": "Power Spikes 2 sur Neo Geo est un jeu de sport dans lequel vous dirigez l'une des trois catégories d'équipes de volley-ball : sélections internationales masculines, féminines ainsi que des équipes futuristes. Les parties se décomposent en trois phases de jeu : attaque, défense et service. Variez les attaques grâce à la panoplie de coups spéciaux et anticipez ceux de votre adversaire pour sortir vainqueur des différents tournois."}, {"id": "neogeo_050", "s": "neogeo", "n": 50, "t": "Pulstar", "y": 1995, "dv": "Aicom Corporation", "p": "SNK", "g": "Shoot'em Up / Horizontal, Shoot'em Up", "r": 0, "img": "neogeo/050.webp", "shot": "shots/neogeo/050.webp", "d": "Une menace extraterrestre plane sur la galaxie et seuls vous et votre fidèle chasseur stellaire pouvez la vaincre. Pulstar est un jeu de tir à défilement latéral en 2D dans lequel vous contrôlez votre vaisseau qui se fraye un chemin à travers des niveaux remplis de vagues d'ennemis déterminés à vous détruire. Vous pouvez améliorer vos armes principales en collectant des power-ups et le fait de charger de l'énergie vous permet de lancer des attaques surpuissantes au prix de la consommation de power-ups. De plus, votre vaisseau est équipé d'un pod d'armement \"optionnel\" qui flotte autour de votre vaisseau et qui peut être positionné dans plusieurs configurations pour protéger le vaisseau ou augmenter sa puissance de feu. Bien qu'entièrement en 2D, le jeu utilise des sprites 3D pré-calculés et inclut des cutscenes entièrement animés entre chaque niveau. Il permet également de jouer à deux."}, {"id": "neogeo_051", "s": "neogeo", "n": 51, "t": "Puzzle Bobble", "y": 1994, "dv": "Taito", "p": "Taito", "g": "Puzzle-Game / Lancer, Puzzle-Game", "r": 0, "img": "neogeo/051.webp", "shot": "shots/neogeo/051.webp", "d": "Bust-A-Move sur Neo Geo est un puzzle-game dont l'objectif est de détruire toutes les bulles à l'écran pour passer au niveau suivant. Pour ce faire, le joueur dispose d'un canon pour lancer les bulles, chaque rangée de trois de la même couleur disparaissant automatiquement."}, {"id": "neogeo_052", "s": "neogeo", "n": 52, "t": "Puzzle Bobble 2", "y": 1995, "dv": "Taito", "p": "Taito", "g": "Puzzle-Game / Lancer, Puzzle-Game", "r": 0, "img": "neogeo/052.webp", "shot": "shots/neogeo/052.webp", "d": "Dans Bust A Move 2 sur Neo Geo, vous devez faire disparaître toutes les billes en regroupant celles de même couleur, par groupe de 3 ou plus. Ce second opus intègre un mode deux joueurs dans lequel chaque joueur doit défier une intelligence artificielle de plus en plus coriace."}, {"id": "neogeo_053", "s": "neogeo", "n": 53, "t": "Rage of the Dragons", "y": 2002, "dv": "Evoga / Playmore", "p": "Playmore", "g": "Combat, Combat / Versus", "r": 0, "img": "neogeo/053.webp", "shot": "shots/neogeo/053.webp", "d": "Rage of the Dragons est basé sur un système de combat en équipes par TAG, dans lequel le joueur prend le contrôle de deux personnages et peut changer entre l'un ou d'autre pendant la partie. Le personnage qui n'est pas contrôlé pourra récupérer lentement une partie de son énergie tandis que l'autre se bat. Le joueur peut exécuter des combos spéciaux (le « Team Duplex ») dans lesquels les deux personnages attaquent un adversaire en même temps pour des dégâts supplémentaires. En choisissant des partenaires spéciaux, il est possible de réaliser le « Team Duplex Special » qui consiste en une combinaison de 2 Team Duplex."}, {"id": "neogeo_054", "s": "neogeo", "n": 54, "t": "Real Bout Fatal Fury", "y": 1996, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/054.webp", "shot": "shots/neogeo/054.webp", "d": "Real Bout Fatal Fury sur Neo Geo est un jeu de combat se déroulant en milieu urbain. Les combats se déroulent dans le cadre d'un tournoi organisé par la pègre locale, le vainqueur obtenant le droit d'affronter le caïd Billy Kane. Le titre permet de combattre sur plusieurs plans à la fois et offre la possibilité d'éjecter l'adversaire hors du ring."}, {"id": "neogeo_055", "s": "neogeo", "n": 55, "t": "Real Bout Fatal Fury 2 : The Newcomers", "y": 1998, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/055.webp", "shot": "shots/neogeo/055.webp", "d": "Real Bout Fatal Fury 2 : The Newcomers sur Neo Geo est un jeu de combat mettant en scène 22 participants, soit 18 personnages et 4 boss. Ce second opus accentue les systèmes de combos, renforçant l'intensité des duels. De nouveaux personnages font leur apparition, dont Li Xiang Fei, une adepte du Kung-fu."}, {"id": "neogeo_056", "s": "neogeo", "n": 56, "t": "Real Bout Fatal Fury Special", "y": 1997, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/056.webp", "shot": "shots/neogeo/056.webp", "d": "Real Bout Fatal Fury Special sur Neo Geo est un jeu de combat comprenant 20 personnages jouables remodelés pour l'occasion. En plus de la possibilité de détruire des objets du décor, voire le décor en lui-même, vous pourrez déchaîner des puissants coups à force de prendre ou de donner des dégâts ce qui vous permettra de vous libérer de vos adversaires."}, {"id": "neogeo_057", "s": "neogeo", "n": 57, "t": "Riding Hero", "y": 1991, "dv": "SNK", "p": "SNK", "g": "Course, Conduite, Course De Moto Vue 3Eme Pers.", "r": 0, "img": "neogeo/057.webp", "shot": "shots/neogeo/057.webp", "d": "Riding Hero sur Neo Geo est un jeu de courses de motos proposant de faire chauffer l'asphalte dans 10 circuits aux quatre coins du monde. Au-delà du championnat classique, le titre intègre un mode Story qui permet d'incarner un pilote débutant et de le suivre tout au long de sa carrière. Lancez-vous sur route ouverte et enchaînez les performances pour signer chez une écurie renommée."}, {"id": "neogeo_058", "s": "neogeo", "n": 58, "t": "Robo Army", "y": 1991, "dv": "SNK", "p": "SNK", "g": "Beat'em All", "r": 0, "img": "neogeo/058.webp", "shot": "shots/neogeo/058.webp", "d": "Jeed, un scientifique spécialiste de la robotique a levé en cachette une armée de robots et il compte bien prendre ainsi le contrôle de la ville de Neo-Detroit. Ce savant fou utilise les cerveaux humains pour les mettre dans des carcasses de robots et en faire de braves combattants à sa solde. Il robotise tout : humains, oiseaux, chiens, singes... Fort heureusement, son processus d'asservissement a mal fonctionné sur deux policiers devenus robots. Ces derniers vont se dresser contre lui et contrecarrer ses plans."}, {"id": "neogeo_059", "s": "neogeo", "n": 59, "t": "Samurai Shodown", "y": 1993, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 2, "img": "neogeo/059.webp", "shot": "shots/neogeo/059.webp", "d": "Samurai Shodown sur Neo Geo est un jeu de combat se déroulant au XVIIIème siècle au Japon. Le titre intègre des modifications par rapport aux classiques du genre telles que l'utilisation d'armes blanches, un système de zoom ainsi qu'une jauge POW se remplissant au fil du combat et débloquant des attaques puissantes."}, {"id": "neogeo_060", "s": "neogeo", "n": 60, "t": "Samurai Shodown II", "y": 1994, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 3, "img": "neogeo/060.webp", "shot": "shots/neogeo/060.webp", "d": "Samurai Shodown II sur Neo Geo est un jeu de combat se déroulant au Moyen-Age au coeur du pays du soleil levant. Pour ce second opus de la série, 16 combattants s'affrontent et font part de leur talent en ce qui concerne l'usage d'armes blanches. Enchaînez les combos pour faire monter votre jauge de Pow et lancer une attaque fatale."}, {"id": "neogeo_061", "s": "neogeo", "n": 61, "t": "Samurai Shodown III", "y": 1995, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/061.webp", "shot": "shots/neogeo/061.webp", "d": "Samurai Shodown III sur Neo Geo est le troisième opus de la série produite par SNK. Ce jeu de combat se déroule au Japon, lors du moyen-Age. Zankuro Minazuki, surnommé le démon, terrorise les régions provinciales en attaquant et pillant tous les villages isolés. 12 samuraïs, experts dans le maniement de l'arme blanche réunissent leurs forces dans un seul but, neutraliser le démon."}, {"id": "neogeo_062", "s": "neogeo", "n": 62, "t": "Samurai Shodown IV : Amakusa's Revenge", "y": 1996, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/062.webp", "shot": "shots/neogeo/062.webp", "d": "Samurai Shodown IV : Amakusa's Revenge sur Neo Geo est un jeu de combat se déroulant en 1789 au Japon. Anéanti lors du troisième opus, Amakusa est ressuscité et bien décidé à prendre sa revanche. Ce titre apporte quelques modifications au système de jeu, en ajoutant notamment la possibilité de se suicider durant le combat et des combos de fatalités pour achever votre adversaire."}, {"id": "neogeo_063", "s": "neogeo", "n": 63, "t": "Samurai Shodown V", "y": 2003, "dv": "Yuki Enterprise", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/063.webp", "shot": "shots/neogeo/063.webp", "d": "La célèbre licence de jeux de baston en 2D est de retour pour son cinquième opus. 27 personnages sont jouables dont neuf nouveaux venus. Un nouveau système de combat fait également son apparition."}, {"id": "neogeo_064", "s": "neogeo", "n": 64, "t": "Samurai Shodown V Special", "y": 2004, "dv": "Yuki Enterprise", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/064.webp", "shot": "shots/neogeo/064.webp", "d": "Une mise à jour du cinquième épisode de Samurai Shodown. En plus des 24 personnages de base, 4 autres font leur apparition : Amakusa, Gaoh, Zankuro et Mizuki. Il est possible d'avoir recours à des fatalités lorsque votre adversaire est sur le point de mourir. Les trois modes de jeu proposés sont Time Attack, Versus et Entrainement."}, {"id": "neogeo_065", "s": "neogeo", "n": 65, "t": "Savage Reign", "y": 1995, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/065.webp", "shot": "shots/neogeo/065.webp", "d": "Le jeu se situe dans un futur assez proche, le scénario garde un lien avec l'univers habituel de SNK. Quelques dizaines d'années après les événèments de Fatal Fury et Art of Fighting, un nouveau tournoi, le \"God of the Beast Competition\", est organisé par un individu maléfique du nom de King Lion. Chacun des 9 combattants a ses propres raisons d'y prendre part."}, {"id": "neogeo_066", "s": "neogeo", "n": 66, "t": "Sengoku", "y": 1991, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus, Beat'em All", "r": 0, "img": "neogeo/066.webp", "shot": "shots/neogeo/066.webp", "d": "Sengoku sur Neo Geo est un beat'em all se déroulant au pays du soleil levant. L'histoire débute lorsqu'un shogun noir menace d'envahir le monde et lève une armée d'esprits de samouraïs pour asservir l'humanité. Le joueur incarne deux héros adeptes des arts martiaux et possédant des pouvoirs divins. Lancez-vous à l'assaut de l'armée du démon et tentez de pénétrer dans sa forteresse."}, {"id": "neogeo_067", "s": "neogeo", "n": 67, "t": "Sengoku 2", "y": 1993, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / 2D, Beat'em All", "r": 0, "img": "neogeo/067.webp", "shot": "shots/neogeo/067.webp", "d": "Retournez dans le monde des batailles mystiques. Revenir dans le cauchemar qui ne finit jamais. La grande confrontation avec le seigneur de guerre démoniaque dans le château des démons devait signifier la fin, mais la guerre ne fait que commencer ... Le château des démons domine la terre et le maître des ténèbres domine l'imposante forteresse. Les légendaires guerriers samouraïs sont à nouveau convoqués. Ils doivent maintenant voyager dans le temps, mais avec plus d'expérience et de nouveaux pouvoirs. Combattez avec plus de techniques d'attaque, de nouveaux bonus, plus de magie et transformez-vous en l'une des quatre identités dans cette incroyable suite de Sengoku."}, {"id": "neogeo_068", "s": "neogeo", "n": 68, "t": "Sengoku 3", "y": 2001, "dv": "Noise Factory", "p": "SNK", "g": "Combat, Combat / 2D, Beat'em All", "r": 0, "img": "neogeo/068.webp", "shot": "shots/neogeo/068.webp", "d": "Troisième jeu de la série des beat'em up Sengoku, Sengoku 3 vous oppose une fois de plus, avec un ami, aux forces mortes-vivantes de Nobunaga, mais cette fois, vous pouvez choisir librement parmi un groupe de personnages différents, chacun ayant ses propres armes et capacités, et choisir l'endroit du monde auquel vous voulez vous attaquer. Le jeu intègre un système de combat plus complexe, similaire à celui d'un jeu de combat en un contre un, en offrant aux joueurs différents boutons d'attaque, des mouvements spéciaux basés sur des entrées directionnelles, des combos et même une super barre utilisée pour déclencher des super mouvements dévastateurs. Vous ne pouvez pas changer d'arme ou vous transformer en d'autres personnages comme dans les jeux précédents, mais vous pouvez acquérir différentes armes à distance pour des attaques supplémentaires ainsi que débloquer certains boss pour augmenter le nombre de personnages disponibles."}, {"id": "neogeo_069", "s": "neogeo", "n": 69, "t": "Shock Troopers", "y": 1997, "dv": "Saurus", "p": "SNK", "g": "Tir / Run And Gun, Tir", "r": 0, "img": "neogeo/069.webp", "shot": "shots/neogeo/069.webp", "d": "Shock Troopers est un jeu d'action pur et dur. Seul ou à 2, commandez des guerriers prêts à tout et combattez la menace terroriste de plein front. Le jeu propose trois chemins d'accès distincts pour atteindre le quartier général ennemi. Armé d'une mitraillette, d'un bazooka ou d'autres armes du même genre, vous pouvez choisir de traverser la jungle, la vallée ou de passer par les massifs montagneux."}, {"id": "neogeo_070", "s": "neogeo", "n": 70, "t": "Shock Troopers : 2nd Squad", "y": 1999, "dv": "Saurus", "p": "SNK", "g": "Tir / Run And Gun, Tir", "r": 0, "img": "neogeo/070.webp", "shot": "shots/neogeo/070.webp", "d": "Shock Troopers 2nd Squad vous offre à nouveau une série de niveaux dans lesquels vous devrez, seul ou à deux, défaire les sinistres plans du dictateur local. Cette fois-ci l'équipe de commandos doit intervenir au Billberk, une nation menacée par une mystérieux conglomérat produisant des armes de destructions massives, la D.I.C."}, {"id": "neogeo_071", "s": "neogeo", "n": 71, "t": "Spin Master", "y": 1994, "dv": "Data East", "p": "Data East", "g": "Plateforme, Plateforme / Shooter Scrolling, Plateforme", "r": 0, "img": "neogeo/071.webp", "shot": "shots/neogeo/071.webp", "d": "SpinMaster sur Neo Geo est un jeu de plates-formes mettant en scène deux cow-boys, Johnny et Tom. L'histoire débute lorsqu'un professeur fou kidnappe leur amie Mary. D'une pierre deux coups, les deux compères décident d'apporter de l'aide à leur amie, tout en cherchant un trésor caché. Cinq niveaux durant, il vous faut affronter les sbires du professeur tout en récoltant des fragments de cartes qui indiquent le chemin du butin."}, {"id": "neogeo_072", "s": "neogeo", "n": 72, "t": "Stakes Winner", "y": 1995, "dv": "Saurus", "p": "SNK", "g": "Sport Avec Animaux, Course De Chevaux", "r": 0, "img": "neogeo/072.webp", "shot": "shots/neogeo/072.webp", "d": "Stakes Winner sur Neo Geo est une simulation permettant de prendre les commandes du canasson de votre choix lors de courses hippiques tactiques. Tenez le rythme et accélérez au bon moment, tout en prenant en compte l'état de forme de la bête pour éviter un coup de pompe fatal."}, {"id": "neogeo_073", "s": "neogeo", "n": 73, "t": "Strikers 1945 Plus", "y": 1999, "dv": "Psikyo", "p": "SNK", "g": "Shoot'em Up / Vertical, Shoot'em Up", "r": 0, "img": "neogeo/073.webp", "shot": "shots/neogeo/073.webp", "d": "Jeu dans la lignée des 19XX et 3eme volet de la série, Strikers 1945 Plus est un shooter vertical archi classique. 6 engins au choix (dont une soucoupe volante rigolote), à l'armement différent: tir simple, tir secondaire (missile, tête chercheuses, shuriken, etc), tir spécial (laser, explosions, etc) et bombe. La bombe est ici en fait une escorte alliée, qui fait plus ou moins de dégâts et reste plus ou moins longtemps à l'écran (absorbant ainsi les tirs ennemis) suivant le vaisseau choisi."}, {"id": "neogeo_074", "s": "neogeo", "n": 74, "t": "Super Sidekicks", "y": 1992, "dv": "SNK", "p": "SNK", "g": "Sport, Sport / Football", "r": 0, "img": "neogeo/074.webp", "shot": "shots/neogeo/074.webp", "d": "Super Sidekicks sur Neo Geo est une simulation de football permettant de prendre les commandes de 12 équipes internationales et de la super team, une sélection réputée imbattable. Le titre se penche sur l'essentiel avec uniquement deux boutons permettant de faire des passes, frapper, ou le pressing selon la phase de jeu. Jonglez, dribblez, frappez et tentez de battre les redoutables gardiens de but."}, {"id": "neogeo_075", "s": "neogeo", "n": 75, "t": "Super Sidekicks 2 : The World Championship", "y": 1994, "dv": "SNK", "p": "SNK", "g": "Sport, Sport / Football", "r": 0, "img": "neogeo/075.webp", "shot": "shots/neogeo/075.webp", "d": "Super Sidekicks 2 est un jeu de football. Vous avez le choix entre 48 pays (Brésil, Argentine, France, Italie...) qui ont chacun des caractéristiques de jeu propre. Ainsi, les équipes sont notées sur cinq critères : frappe, vitesse, technique, défense et attaque. L'équipe de France sera plus technique alors qu'une équipe comme le Cameroun sera plus rapide. La compétition se déroule sous forme de tournoi : vous commencez en bas de tableau avec des qualifications."}, {"id": "neogeo_076", "s": "neogeo", "n": 76, "t": "Super Sidekicks 3 : The Next Glory", "y": 1995, "dv": "SNK", "p": "SNK", "g": "Sport, Sport / Football", "r": 0, "img": "neogeo/076.webp", "shot": "shots/neogeo/076.webp", "d": "L'une des stars du football arcade du début des années 90 revient avec une troisième mouture. Logiquement appelé Super Sidekicks 3 (et sous-titré \"The Next Glory\"), ce jeu reprend à la fois le flambeau, mais aussi hérite du lourd fardeau de succéder à son illustre aîné."}, {"id": "neogeo_077", "s": "neogeo", "n": 77, "t": "The King of Fighters '94", "y": 1994, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/077.webp", "shot": "shots/neogeo/077.webp", "d": "The King of Fighters '94 sur Neo Geo est un jeu de combat regroupant les meilleurs combattants de l'univers SNK dans un championnat par équipes de trois. Choisissez vos personnages préférés issus de titres comme Art of Fighting, Fatal Fury ou Ikari Warriors. Battez-vous en un contre un et quand un adversaire est mis au tapis, un autre prend son relais. Il est toutefois possible de déclencher des attaques spéciales faisant appel à tous les combattants de votre équipe."}, {"id": "neogeo_078", "s": "neogeo", "n": 78, "t": "The King of Fighters '95", "y": 1995, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/078.webp", "shot": "shots/neogeo/078.webp", "d": "The King of Fighters '95 est un jeu de combat 2D tournant sur Neo Geo. Ici 26 personnages aux styles différents s'affrontent pour obtenir le titre de \"King of Fighters\". Très vite les participants au tournoi vont s'apercevoir que l'enjeu de ce tournoi est très différent de ce qu'ils avaient imaginé."}, {"id": "neogeo_079", "s": "neogeo", "n": 79, "t": "The King of Fighters '96", "y": 1996, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/079.webp", "shot": "shots/neogeo/079.webp", "d": "Après le mort d'Omega Rugal, dont le corps ne supporta pas le pouvoir d'Orochi, un nouveau tournoi est organisé par une certaine Chizuru Kagura. Cette dernière se présente comme la gardienne du miroir qui scelle le démon Orochi mais sent que quelque chose ne tourne pas rond. Elle demande à Kyo et Lori de l'aider à défendre ce sceau en cas d'attaque. Effectivement, Goenitz, messager d'Orochi, est venu libérer son maître. Mais Kyo et Lori rassemblèrent leurs forces pour en venir à bout. Goenitz mort, Iori but de son sang avant d'avoir un comportement étrange. Il entra en Riot of the blood et tua Vice et Mature qui étaient à ses côtés. The King of Fighters '96 est un épisode important dans l'histoire de KOF. La légende d'Orochi est de plus en plus présente et nous avons droit à un des boss les plus coriaces des jeux de baston, Goenitz. Quant au jeu à proprement parlé, il a subi une belle évolution graphique."}, {"id": "neogeo_080", "s": "neogeo", "n": 80, "t": "The King of Fighters '97", "y": 1997, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/080.webp", "shot": "shots/neogeo/080.webp", "d": "King of Fighters '97 sur Neo Geo est le quatrième jeu de baston de la série KOF. La principale nouveauté du titre réside dans l'intégration de modes Extra et Advanced qui influent sur le style de combat. Ce dernier consiste en l'accumulation de boules soit pour faire une furie, soit pour un CD Break en contre-attaque permettant de se dégager d'un combo."}, {"id": "neogeo_081", "s": "neogeo", "n": 81, "t": "The King of Fighters '98 : The Slugfest", "y": 1998, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 3, "img": "neogeo/081.webp", "shot": "shots/neogeo/081.webp", "d": "The King of Fighters'98 est un jeu de combat 2D sur NEO GEO. Cinquième opus de la série, ce volet intitulé au Japon \"Dream Match Never Ends\" se déroule en réalité à l'intérieur d'un rêve du personnage Shingo. Le joueur a le choix d'incarner 36 combattants différents."}, {"id": "neogeo_082", "s": "neogeo", "n": 82, "t": "The King of Fighters '99 : Millennium Battle", "y": 1999, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/082.webp", "shot": "shots/neogeo/082.webp", "d": "Dans King of Fighters '99 sur Neo Geo, incarnez l'un des 32 combattants au choix dans un tournoi sanglant. Cet opus permet d'intégrer dans son équipe un quatrième combattant qui prend le rôle de \"Striker\". Il peut intervenir lors des duels pour améliorer la défense ou pour participer à un combo fatal pour l'adversaire."}, {"id": "neogeo_083", "s": "neogeo", "n": 83, "t": "The King of Fighters 2000", "y": 2000, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/083.webp", "shot": "shots/neogeo/083.webp", "d": "L'histoire se passe juste après que le cartel Nests se soit fait connaître de par ses activités de clonage. K' est parvenu à échapper à l'organisation, avec l'aide de Maxima. Il connaît désormais son statut de clone de Kyô. Heidern et Ling (un autre militaire) organisent un nouveau KOF afin d'enquêter et en finir une bonne fois pour toutes avec le cartel. C'est le septième volet de la série The King of Fighters et le dernier produit par SNK avant que celle-ci ne soit en faillite."}, {"id": "neogeo_084", "s": "neogeo", "n": 84, "t": "The King of Fighters 2001", "y": 2002, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/084.webp", "shot": "shots/neogeo/084.webp", "d": "L'édition 2001 de King of Fighters sur Neo Geo est la première développée par Eolith. Elle regroupe 40 personnages jouables et intègre des fonctionnalités permettant de moduler votre équipe comme bon vous semble. Dès lors, le joueur peut choisir le nombre de strikers (personnages additionnels dans l'équipe), de 1 à 3, au détriment du nombre de personnages jouables."}, {"id": "neogeo_085", "s": "neogeo", "n": 85, "t": "The King of Fighters 2002", "y": 2002, "dv": "SNK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 3, "img": "neogeo/085.webp", "shot": "shots/neogeo/085.webp", "d": "The King of Fighters 2002 est le neuvième épisode de la célèbre série de jeux de combat. Cet épisode est le signe d'un retour aux sources en délaissant le système de strikers instauré dans l'édition 99 pour un retour à la traditionnelle bataille en équipe."}, {"id": "neogeo_086", "s": "neogeo", "n": 86, "t": "The King of Fighters 2003", "y": 2004, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/086.webp", "shot": "shots/neogeo/086.webp", "d": "The King of Fighters 2003 sur Neo Geo est un jeu de combat regroupant pas moins de 35 personnages jouables. Cet épisode fait entrer le système du Tag Battle dans la série qui permet de changer de combattant en plein duel sans que le personnage ne soit forcément KO."}, {"id": "neogeo_087", "s": "neogeo", "n": 87, "t": "The Last Blade", "y": 1998, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 2, "img": "neogeo/087.webp", "shot": "shots/neogeo/087.webp", "d": "Choisissez parmi les 14 protagonistes de The Last Blade sur Neo Geo, une référence du jeu de combat sur cette console. De nombreux combattants disposent d'un sabre, leur maniabilité et leur style requièrent une technique bien distincte de leurs homologues se battant à mains nues, diversifiant ainsi le plaisir de jeu."}, {"id": "neogeo_088", "s": "neogeo", "n": 88, "t": "The Last Blade 2", "y": 1999, "dv": "SNK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 3, "img": "neogeo/088.webp", "shot": "shots/neogeo/088.webp", "d": "The Last Blade 2 sur Neo Geo est un jeu de combat en 2D. Les affrontements se font à l'arme blanche, au club de golf et autres cannes à pêche. Le jeu recèle une très grande variété de mouvements et parades, et requiert donc une certaine technicité."}, {"id": "neogeo_089", "s": "neogeo", "n": 89, "t": "The Ultimate 11: SNK Football Championship", "y": 1996, "dv": "SNK", "p": "SNK", "g": "Sport / Football, Sport", "r": 0, "img": "neogeo/089.webp", "shot": "shots/neogeo/089.webp", "d": "La principale (et seule) série de jeu de football de SNK continue son bonhomme de chemin avec un quatrième épisode. Appelée Tokuten Oh: Honoh no Libero au Japon, le jeu devient The Ultimate 11 en Occident, il perd donc son nom Super Sidekicks. Les modes sont en nombre correct avec Game Start, Exhibition Game (match amical), Grand Championship et Option. Encore une fois, celles-ci peuvent être en Français. La possibilité de jouer la touche au pied disparaît au profit d'une touche classique unique, à la main."}, {"id": "neogeo_090", "s": "neogeo", "n": 90, "t": "Thrash Rally", "y": 1991, "dv": "ADK", "p": "ADK", "g": "Course, Conduite / Course, Course, Conduite", "r": 0, "img": "neogeo/090.webp", "shot": "shots/neogeo/090.webp", "d": "Thrash Rally sur Neo Geo est un jeu de courses proposant de prendre les commandes d'un véhicule tout-terrain dans deux compétitions distinctes, le Paris-Dakar ou le championnat du monde des Rallyes. L'objectif est de passer les checkpoints avant que le temps imparti ne soit écoulé, tout en doublant les autres pilotes."}, {"id": "neogeo_091", "s": "neogeo", "n": 91, "t": "Top Hunter: Roddy & Cathy", "y": 1994, "dv": "SNK", "p": "SNK", "g": "Beat'em All, Plateforme, Plateforme / Fighter Scrolling", "r": 0, "img": "neogeo/091.webp", "shot": "shots/neogeo/091.webp", "d": "Top Hunter est un jeu d'action/plates-formes dans lequel deux personnages sont jouables, chacun ayant son arme de prédilection. Cinq mondes sont à nettoyer de fond en comble dans des environnements différents. Il est possible de se saisir de ses adversaires pour les balancer dans le décor, qui s'étale sur deux plans que l'on alterne pour trouver des bonus et autres zones secrètes."}, {"id": "neogeo_092", "s": "neogeo", "n": 92, "t": "Twinkle Star Sprites", "y": 1997, "dv": "ADK", "p": "SNK", "g": "Shoot'em Up / Vertical, Shoot'em Up", "r": 0, "img": "neogeo/092.webp", "shot": "shots/neogeo/092.webp", "d": "Twinklestar Sprites sur Neo Geo est un shoot'em up dont l'action intense contraste avec un style graphique mignon et coloré. Séparés par une barre verticale, deux joueurs s'affrontent en duel (humain contre humain ou CPU) et doivent éliminer des séries d'ennemis le plus rapidement possible afin d'envoyer des boules de feu dans la zone adverse."}, {"id": "neogeo_093", "s": "neogeo", "n": 93, "t": "Viewpoint", "y": 1992, "dv": "Sammy Corporation", "p": "SNK", "g": "Shoot'em Up / Diagonal, Shoot'em Up", "r": 0, "img": "neogeo/093.webp", "shot": "shots/neogeo/093.webp", "d": "Un ou deux joueurs (en mode hot-seat ou coopératif) contrôlent un vaisseau spatial équipé d'un canon laser qui peut être chargé (en maintenant le bouton de tir enfoncé) pour obtenir une explosion plus puissante. Outre l'arme principale, trois armes spéciales sont disponibles : un mur de feu qui balaye l'écran en une vague, une explosion semblable à une nova et un cercle de missiles verts sphériques à tête chercheuse."}, {"id": "neogeo_094", "s": "neogeo", "n": 94, "t": "Waku Waku 7", "y": 1996, "dv": "Sunsoft", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/094.webp", "shot": "shots/neogeo/094.webp", "d": "Il a été dit que la personne qui collecte les sept WakuWaku Balls légendaires aura son désir le plus cher exaucé. De même, ceux qui trouveront une des balles deviendront obsédés par le désir impitoyable d'obtenir les autres. Vous avez là le prétexte à un jeu de baston 2D sortant des sentiers battus de par les personnages et l'univers graphique qu'il propose."}, {"id": "neogeo_095", "s": "neogeo", "n": 95, "t": "Windjammers", "y": 1994, "dv": "Data East", "p": "SNK", "g": "Sport", "r": 0, "img": "neogeo/095.webp", "shot": "shots/neogeo/095.webp", "d": "Dans Windjammers sur Neo Geo, deux joueurs s'affrontent avec Frisbee dans des arènes closes. Chacun doit garder les trois buts derrière lui. Les parties sont limitées dans le temps. En cas d'égalité le match se termine grâce à la mort subite."}, {"id": "neogeo_096", "s": "neogeo", "n": 96, "t": "World Heroes", "y": 1992, "dv": "ADK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/096.webp", "shot": "shots/neogeo/096.webp", "d": "World Heroes sur Neo Geo est un jeu de baston dans lequel s'affrontent les plus grands champions de l'histoire. Huit personnages uniques sont à votre disposition, prêts à s'en mettre plein la tête pour rien, avec des coups spéciaux jamais vus et des techniques hors du commun. Affrontez-les tous pour vous voir remettre le titre du meilleur combattant."}, {"id": "neogeo_097", "s": "neogeo", "n": 97, "t": "World Heroes 2", "y": 1993, "dv": "ADK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/097.webp", "shot": "shots/neogeo/097.webp", "d": "Les \"héros du monde\" font à nouveau parler d'eux sur Neo·Geo. Faisant suite à un premier opus innovant, mais insuffisamment armé pour inquiéter Street Fighter II, voici une deuxième mouture pour suivre leurs nouvelles aventures. Cette fois-ci, ADK a mis les petits plats dans les grands et le jeu tient sur près de 150 Mbits. L'histoire est on ne peut plus simple. Les héros reviennent avec six nouveaux combattants. Il faut voyager dans le temps et faire face aux assauts des adversaires dans une excitante et éprouvante bataille à différentes époques."}, {"id": "neogeo_098", "s": "neogeo", "n": 98, "t": "World Heroes 2 Jet", "y": 1994, "dv": "ADK", "p": "SNK", "g": "Combat / Versus, Combat", "r": 1, "img": "neogeo/098.webp", "shot": "shots/neogeo/098.webp", "d": "Encore une fois, le monde a été sauvé par les héros, Neo Geegus et Dio ayant été vaincus. Un nouveau tournoi s'ouvre, un an plus tard. Il porte le nom de \"Super Battle\" et ce n'est plus le Dr Brown qui le sponsorise. Celui qui se cache derrière cette nouvelle compétition en a changé les règles : on affronte désormais trois combattants et deux victoires suffisent pour la qualification, le tout se déroulant sur cinq jours."}, {"id": "neogeo_099", "s": "neogeo", "n": 99, "t": "World Heroes Perfect", "y": 1995, "dv": "ADK", "p": "SNK", "g": "Combat, Combat / Versus", "r": 1, "img": "neogeo/099.webp", "shot": "shots/neogeo/099.webp", "d": "L'histoire est, comme toujours dans World Heroes, très superflue, car étroitement dérivée du scénario du premier opus. Cela fait un an que s'est terminé le sinistre tournoi \"Super Battle\", mis en place par Zeus. Chaque participant est revenu à ses affaires dans son époque quand arrive une invitation du Dr Brown. Un nouveau tournoi World Heroes est ouvert aux seize partipants du Super Battle de l'année d'avant. Zeus compte profiter de cette occasion pour se venger de sa cuisante défaite. Ce qu'il ignore, c'est qu'un autre danger au moins aussi grand plane sur ce tournoi."}, {"id": "neogeo_100", "s": "neogeo", "n": 100, "t": "Zed Blade", "y": 1994, "dv": "NMK", "p": "SNK", "g": "Shoot'em Up, Shoot'em Up / Horizontal", "r": 0, "img": "neogeo/100.webp", "shot": "shots/neogeo/100.webp", "d": "Zed Blade est un shoot'em up classique, à scrolling horizontal. Au début du jeu, vous pouvez choisir votre type d'armement parmi trois choix : votre tir principal, les missiles, et le tir à l'arrière de votre vaisseau. Vous pourrez ainsi choisir les directions de vos armes et vous customiser un vaisseau. Les sept niveaux vous feront arpenter un espace apocalyptique rempli d'ennemis avec qui il va falloir en découdre. A chaque vie perdue, vous recommencez au même endroit. Le jeu a donc le look d'un R-Type, mais n'en reprend absolument pas le style puzzle shooting. Les boulettes ne sont pas légion, bien qu'à la fin du jeu elle se font très présentes. Le fait qu'elles soient principalement d'une seule et même couleur facilite bien la chose."}]};const L=['Commune','Peu commune','Rare','Épique','Légendaire'],C=['#9aa0a6','#4caf50','#2196f3','#9c27b0','#ff9800'];
