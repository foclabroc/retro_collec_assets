 Cat", "y": 1992, "dv": "Hudson", "p": "Hudson", "g": "Action", "r": 0, "img": "nes/029.webp", "shot": "shots/nes/029.webp", "d": "Félix le Chat sur Nes est un jeu de plates-formes vous permettant d'incarner le célèbre chat noir ! Le Professeur a kidnappé Kitty, la petite amie de notre héros, qu'il veut échanger contre le sac magique de Félix. Mais ce dernier ne compte pas se laisser faire et part libérer Kitty pour ne pas avoir à donner son sac magique au diabolique Professeur !"}, {"id": "nes_030", "s": "nes", "n": 30, "t": "Four Players' Tennis", "y": 1994, "dv": "Home Data", "p": "Asmik", "g": "Sport", "r": 0, "img": "nes/030.webp", "shot": "shots/nes/030.webp", "d": "Jouez le jeu de vos rêves avec Top Players' Tennis - le seul jeu où vous \"devenez\" Ivan Lendl ou Chris Evert. Mais d'abord, vous avez quatre tournois majeurs à jouer; L'Open d'Australie, l'Open de France, Wimbledon et l'Open des Etats-Unis. Jouer des singles contre un ami, ou l'ordinateur; Doubler avec Lendl ou Evert pour battre l'ordinateur; Ou jouer avec un ami contre l'ordinateur. Il ya de l'excitation, de l'action et de la sueur ! game ... set ... match"}, {"id": "nes_031", "s": "nes", "n": 31, "t": "Freedom Force", "y": 1988, "dv": "Sunsoft", "p": "Sunsoft", "g": "Tir Avec Accessoire", "r": 0, "img": "nes/031.webp", "shot": "shots/nes/031.webp", "d": "Freedom Force est un jeu de tir sur NES. A l'aide du Zapper de la console, vous devez éliminer les nombreux ennemis qui apparaissent aux fenêtres ou par les portes tout en évitant soigneusement de tirer sur les otages."}, {"id": "nes_032", "s": "nes", "n": 32, "t": "Galaga", "y": 1981, "dv": "Namco", "p": "Namco", "g": "Action", "r": 0, "img": "nes/032.webp", "shot": "shots/nes/032.webp", "d": "Dans Galaga sur NES, vous allez devoir piloter un vaisseau pouvant se déplacer uniquement de gauche à droite. Il vous faudra éviter les tirs de vos ennemis tout en les éliminant. Plusieurs boss feront leur apparition."}, {"id": "nes_033", "s": "nes", "n": 33, "t": "Ghosts'n Goblins", "y": 1989, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 1, "img": "nes/033.webp", "shot": "shots/nes/033.webp", "d": "Ghosts'n Goblins est un jeu d'action/plates-formes sur Nes. Arthur le brave chevalier doit sauver sa princesse bien-aimée des griffes du démon King Astaroth. Différents challenges l'attende au fil des niveaux remplis de créatures malfaisantes à abattre."}, {"id": "nes_034", "s": "nes", "n": 34, "t": "Gradius", "y": 1988, "dv": "Konami", "p": "Konami", "g": "Action", "r": 1, "img": "nes/034.webp", "shot": "shots/nes/034.webp", "d": "Gradius sur Nes est un shoot dans lequel vous dirigez un vaisseau suréquipé, dernier rempart de sa planète. L'engin est armé de missiles sol-air, d'un canon double laser, et protégé par un champ de force qui vous permet également de vous téléporter. Traversez les niveaux jusqu'à atteindre le coeur du bastion ennemi pour un affrontement épique."}, {"id": "nes_035", "s": "nes", "n": 35, "t": "Ice Climber", "y": 1986, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 0, "img": "nes/035.webp", "shot": "shots/nes/035.webp", "d": "Partez à la conquête de pics escarpés, franchissez des ravins glacés et assommez des créatures des neiges, en solo ou en duo dans Ice Climber sur Nes. Utilisez votre marteau pour briser les blocs de glace et vous défendre, et sautez de palier en palier jusqu'au sommet. Franchissez le huitième palier pour atteindre le stage bonus, puis ramassez le plus de légumes possible et partez dans les airs avec l'un de vos amis condors."}, {"id": "nes_036", "s": "nes", "n": 36, "t": "Ice Hockey", "y": 1988, "dv": "Nintendo", "p": "Nintendo", "g": "Sport", "r": 0, "img": "nes/036.webp", "shot": "shots/nes/036.webp", "d": "Ice Hockey sur Nes est un jeu de hockey sur glace dans lequel le but est bien entendu, de remporter un maximum de matches possible. Il est possible de mettre en place des schémas tactiques en composant son équipe. Pour chaque membre de votre team, il est possible de sélectionner entre trois types de corpulence. Cela a une influence directe sur la défense et la capacité de votre équipe à effectuer des contre-attaques."}, {"id": "nes_037", "s": "nes", "n": 37, "t": "Indiana Jones et la Derniere Croisade", "y": 1994, "dv": "Nms Software", "p": "Ubisoft", "g": "Action", "r": 0, "img": "nes/037.webp", "shot": "shots/nes/037.webp", "d": "Indiana Jones and the Last Crusade diffère des deux autres jeux du même nom par un hybride de différent genre tel que l'action plateforme, la course à moto, la résolution d'énigme et même certains éléments d'aventure."}, {"id": "nes_038", "s": "nes", "n": 38, "t": "Iron Tank : The Invasion of Normandy", "y": 1988, "dv": "Snk", "p": "Snk", "g": "Action", "r": 0, "img": "nes/038.webp", "shot": "shots/nes/038.webp", "d": "Iron Tank sur Nes est un jeu d'action prenant place lors de la Seconde Guerre mondiale. Alors que les alliés préparent le gros des troupes pour l'assaut final sur les côtes de la Normandie, une unité d'élite est envoyée en éclaireur pour détruire la base principale des ennemis. A bord de votre tank, le Iron Tank, il vous faut secourir les otages et détruire les nombreux soldats et autres engins de guerre qui vous bloquent le passage."}, {"id": "nes_039", "s": "nes", "n": 39, "t": "IronSword : Wizards & Warriors II", "y": 1991, "dv": "Rareware", "p": "Acclaim", "g": "Plateforme, Action", "r": 0, "img": "nes/039.webp", "shot": "shots/nes/039.webp", "d": "Ironsword : Wizards & Warriors II est un jeu de plates-formes sur Nes. Le héros nommé, Kuros, doit tuer encore une fois le méchant Malkil qui a pris le contrôle des quatre éléments : le vent, l'eau, le feu, et la terre. Arriverez-vous à vous débarrasser du diabolique assistant et à libérer les quatre éléments ?"}, {"id": "nes_040", "s": "nes", "n": 40, "t": "Isolated Warrior", "y": 1991, "dv": "Ntvic", "p": "Vap Inc.", "g": "Action", "r": 0, "img": "nes/040.webp", "shot": "shots/nes/040.webp", "d": "Isolated Warrior est un jeu de tir sur Nes en vue isométrique. Partez seul en guerre contre des milliers d'aliens venus envahir notre Planète Bleue. Traversez les niveaux en ramassant diverses armes pour faciliter votre progression. Passwords: Niveau 2: 5963 Niveau 3: 8920 Niveau 4: 0705 Niveau 5: 5826 Niveau 6: 2687 Niveau 7: 3279 Armes puissance max: 6285 10 jauges de vie + max de bombes: 6502"}, {"id": "nes_041", "s": "nes", "n": 41, "t": "Journey to Silius", "y": 1990, "dv": "Sunsoft", "p": "Sunsoft", "g": "Action", "r": 0, "img": "nes/041.webp", "shot": "shots/nes/041.webp", "d": "Journey To Silius est un jeu de plates-formes et de tir sur Nes qui se déroule dans un univers futuriste où la population de la terre est tellement grande que les humains ont dû créer des colonies spatiales. Vous êtes dans la peau de Jay McCray qui est en voie de quitter la Terre quand il apprend que son père a été tué par des terroristes sur la colonie de Silius."}, {"id": "nes_042", "s": "nes", "n": 42, "t": "Kabuki : Quantum Fighter", "y": 1991, "dv": "Human", "p": "Hal Laboratory", "g": "Action", "r": 0, "img": "nes/042.webp", "shot": "shots/nes/042.webp", "d": "Le décor - la Terre, le futur. L'ordinateur du Ministère de la défense chargé de protéger toute notre planète a été contaminé par un virus en constante évolution. Un seul volontaire a le courage d'affronter le virus sur son terrain. Converti en données informatiques élémentaires, puis transféré dans les circuits de l'ordinateur, cet héroïque guerrier voit sa structure moléculaire transformée par le Système de Transfert d'Images, jamais encore testé jusqu'à ce jour. Ce héros innattendu, le Quantum Fighter (Combattant de l'Infiniment Petit), voyage dans les circuits de l'ordinateur. Six niveaux remplis de défis, une maîtrise inégalée du jeu et un arsenal d'armes vous attendent!"}, {"id": "nes_043", "s": "nes", "n": 43, "t": "Kickle Cubicle", "y": 1990, "dv": "Irem", "p": "Nintendo", "g": "Puzzle-Game", "r": 0, "img": "nes/043.webp", "shot": "shots/nes/043.webp", "d": "Le royaume est recouvert de glace! Et il a toutes les chances de le rester si Kickle n'intervient pas! Voilà que le cruel Roi Sorcier s'est introduit dans le Royaume Fantastique et qu'il a recouvert de glace les Quatres Terres. Il s'est emparé de ses habitants et de leurs Palais, et les a cachés au plus profond de la banquise. Et maintenant Kickle, armé de son souffle glacial, se prépare à secourir ses amis. Venez lui prêter main forte pour que le royaume ne soit plus plongé dans un hiver sans fin."}, {"id": "nes_044", "s": "nes", "n": 44, "t": "Kid Icarus", "y": 1987, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 1, "img": "nes/044.webp", "shot": "shots/nes/044.webp", "d": "Une aventure passionnante de la mythologie grecque. Dans le royaume lointain du \"Domaine des Anges\", la méchante Medusa a volé les Trois Trésors Sacrés et emprisonné la déesse de la lumière, Palutena. En tant que Kid Icarus, votre mission consiste à trouver les trésors, détruire Medusa et libérer Palutena. Amassez des armes et de l'énergie tout en voyageant parmi les ruines au cours de votre mission destinée à vaincre Medusa et son armée et à secourir Palutena ainsi que les trésors du Palais Céleste. Si vous y parvenez, vous serez le héros du \"Domaine des Anges\". Pouvez-vous réussir?"}, {"id": "nes_045", "s": "nes", "n": 45, "t": "Kirby's Adventure", "y": 1993, "dv": "Hal Laboratory", "p": "Nintendo", "g": "Action", "r": 2, "img": "nes/045.webp", "shot": "shots/nes/045.webp", "d": "Kirby est de retour! Que serait le Pays des Songes sans rêves? Un cauchemar! Source onirique, la Fontaine des Rêves s'est tarie, privant tout le pays de ses rêves merveilleux! Et c'est Kirby, notre petite boule rondouillarde, qui doit ramener aux Songeurs leurs siestes si agréables! L'appétit de Kirby pour l'aventure est plus énorme que jamais. Son chemin, il le déblaie en gobant et en avalant de nouveaux ennemis. Un vrai festin! Il peut aussi s'emparer de la capacité du brigand qu'il met au tapis! Avec cette puissance, Kirby peut peaufiner vingt astuces toutes nouvelles qui l'aideront à progresser dans le Pays des Songes devenu Cauchemar! Kirby's Adventure regorge de mondes totalement nouveaux à explorer."}, {"id": "nes_046", "s": "nes", "n": 46, "t": "Kung Fu", "y": 1987, "dv": "Irem", "p": "Nintendo", "g": "Beat'em All", "r": 0, "img": "nes/046.webp", "shot": "shots/nes/046.webp", "d": "Kung Fu est un beat'em all sur NES. Le méchant Mr X a capturé une jolie fille nommée Sylvia. Ainsi le valeureux Thomas, maître en kung-fu, se lance à sa recherche. Dans chaque niveau une flopée de soldats ainsi qu'un boss tenteront de barrer la route à notre héros."}, {"id": "nes_047", "s": "nes", "n": 47, "t": "Life Force : Salamander", "y": 1989, "dv": "Konami", "p": "Konami", "g": "Action", "r": 1, "img": "nes/047.webp", "shot": "shots/nes/047.webp", "d": "Shoot Them Up dérivé de la série Gradius de Konami.nnLe joueur dirige le vaisseau Vic Viper à travers six stages alternant scrolling horizontal et scrolling vertical. Il est possible de récupérer des power-up pour améliorer l'armement du vaisseau, par exemple un tir multiple. Les boss doivent être vaincus en détruisant leur c?ur. Une option multijoueur permet de jouer à deux en même temps."}, {"id": "nes_048", "s": "nes", "n": 48, "t": "Little Nemo : The Dream Master", "y": 1991, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 1, "img": "nes/048.webp", "shot": "shots/nes/048.webp", "d": "Little Nemo : The Dream Master sur Nes est un jeu d'action/plates-formes qui se déroule en 2D, avec un défilement vertical. Un enfant nommé Némo parcourt les niveaux en ramassant les clés parsemées ici et là. Pour ce faire, il dispose des compétences de ses ennemis lorsqu'ils ont été suffisamment nourris et endormis."}, {"id": "nes_049", "s": "nes", "n": 49, "t": "Little Samson", "y": 1993, "dv": "Taito", "p": "Sur De Wave", "g": "Action", "r": 1, "img": "nes/049.webp", "shot": "shots/nes/049.webp", "d": "La plus folle de toutes les aventures! La Forge Impériale a été envahie par Ta-Keed le Prince des Ténèbres! Seuls les possesseurs des Cloches Magiques peuvent empêcher son armée de détruire le royaume. Dirigé par le jeune alpiniste, Samson, une équipe de héros improbables est prête à bannir le diable à jamais! Devenez un dragon cracheur de feu, une solide statue de pierre vivante ou une agile et astucieuse souris! Transpercez le ciel et crachez des boules de feu avec Kikira le Seigneur Dragon! Ecrasez les troupes ennemies de vos poings de granit avec Gamm le Seigneur de la Pierre. Echappez aux derniers terribles monstres tout en posant des bombes avec K.O. la souris. Ces créatures rejoignent Samson pour former une alliance unique et puissante, dernier espoir pour la Forge Impériale!"}, {"id": "nes_050", "s": "nes", "n": 50, "t": "Maniac Mansion", "y": 1992, "dv": "Realtime Associates", "p": "Jaleco", "g": "Aventure", "r": 0, "img": "nes/050.webp", "shot": "shots/nes/050.webp", "d": "Maniac Mansion est un jeu d'aventure sur Nes. L'hôtel Edison a toujours été une vieille maison en bordure de la ville. Des rumeurs disent que d'étranges expériences sont en cours et que des créatures vivent parmi la famille Edison. Une fille nommée Sandy a disparu de l'école locale. Son petit copain décide d'aller fouiller la demeure. Il choisit d'embarquer deux autres amis dans son aventure."}, {"id": "nes_051", "s": "nes", "n": 51, "t": "Marble Madness", "y": 1989, "dv": "Milton Bradley Co.", "p": "Atari", "g": "Action", "r": 0, "img": "nes/051.webp", "shot": "shots/nes/051.webp", "d": "Marble Madness sur NES est l'adaptation du hit d'arcade du même nom. Vous devez guider une bille d'un point A à un point B, tout en évitant la chute et les ennemis. Un mode deux joueurs reprend le principe de base du jeu à la différence qu'il vous faut terminer le niveau avant votre adversaire pour remporter la victoire."}, {"id": "nes_052", "s": "nes", "n": 52, "t": "Mario Bros.", "y": 1986, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 0, "img": "nes/052.webp", "shot": "shots/nes/052.webp", "d": "Mario Bros. est un jeu de plateforme d'abord sorti en arcade puis porté sur NES, Atari 2600 et bien d'autres machines. C'est l'occasion de rencontrer Luigi pour la première fois. Dans ce jeu, jouable à 2 simultanément, on doit débarrasser les égouts de vilaines créatures en les renversant puis en leur donnant un coup de pied. Seuls les Shellcreepers persisteront dans l'univers de Mario en devenant les Koopas. Le jeu est très amusant à 2 car on peut jouer en coopération ou se faire des crasses entre joueurs comme se placer sous une créature renversée pour la réactiver au moment où l'autre joueur va pour lui donner un coup de pied."}, {"id": "nes_053", "s": "nes", "n": 53, "t": "Mega Man", "y": 1989, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 1, "img": "nes/053.webp", "shot": "shots/nes/053.webp", "d": "Voici Mega Man, l'homme qui combat les maîtres puissants et les forces de Monsteropolis - cette étrange contrée peuplée de multiples robots - tels que les Humanoïdes du Dr. Wily, espèce dégénérée créée à partir d'expérimentations sur les êtres humains. Mega Man - le défenseur de la race humaine. Pour cette raison, il osera pénétrer dans les sept mondes de Monsteropolis afin de stopper la multiplication de ces horribles représentants humanoïdes."}, {"id": "nes_054", "s": "nes", "n": 54, "t": "Mega Man 2", "y": 1990, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 3, "img": "nes/054.webp", "shot": "shots/nes/054.webp", "d": "Il est de retour! Et cette fois, le diabolique Dr. Wily (autrefois, puissance suprême de l'univers) a créé des robots encore plus sinistres pour développer son attaque. Mais vous, MegaMan, avez aussi accru votre puissance et votre habileté. Pourrez-vous sauver l'humanité des funestes desseins du Dr. Wily? Chacun des 8 empires est gouverné par un Super Robot. Vous devez vaincre chaque adversaire sur son terrain et amasser des armes le long de votre périple. Après avoir détruit les 8 robots, vous devrez affronter le Cerveau lui-même: le malfaisant Dr. Wily. Mais méfiez-vous MegaMan, car le Dr. Wily a des pouvoirs que ses créatures ne possédaient pas. L'Univers compte sur votre adresse et votre courage, assuré de votre victoire finale."}, {"id": "nes_055", "s": "nes", "n": 55, "t": "Mega Man 3", "y": 1992, "dv": "Capcom", "p": "Capcom", "g": "Plateforme, Action", "r": 2, "img": "nes/055.webp", "shot": "shots/nes/055.webp", "d": "Mega Man 3 explose dans un enchainement de combats contre des robots! C'est la révolte des robots et personne n'est en sécurité! Mega Man l'est encore moins que quiconque. Cette fois, notre ami cybernétique superpuissant en découd avec une horde de cinglés métalliques qui en ont par dessus la tête d'obéir! Et ils utilisent tous les destructeurs d'androïdes conçus à ce jour pour que vous en soyez pleinement conscient! La rage saisit Mega Man, qui fonce tête baissée vers une galaxie de centres miniers à la recherche de cristaux d'énergie. Mais il faut plus que du cœur au ventre pour lutter contre les Maîtres Robots phénoménaux qui règnent sur ces mondes. C'est une mission hors du commun, la pire - et la meilleure - que Mega Man a eu à accomplir jusqu'ici!"}, {"id": "nes_056", "s": "nes", "n": 56, "t": "Mega Man 4", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Plateforme, Action", "r": 1, "img": "nes/056.webp", "shot": "shots/nes/056.webp", "d": "Des robots russes en folie! La ville avait été paisible pendant toute une année et voici qu'elle est à nouveau la proie d'une terreur robotique! Un intrigant scientifique, le Dr Cossack vient de débarquer avec huit nouveaux forcenés métalliques plus gros et plus diaboliques que tout ce que le Dr Wily a jamais pu imaginer. Un grand remue-ménage cybernétique se prépare alors que les rues de la cité explosent dans un crépitement de métal en fusion! Armé du nouveau Mega Buster, Mega Man court, saute, esquive pour se frayer un chemin à travers des labyrinthes de mâchoires métalliques et atteindre la citadelle sibérienne du Dr Cossack pour l'ultime affrontement cataclysmique!"}, {"id": "nes_057", "s": "nes", "n": 57, "t": "Mega Man 5", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 1, "img": "nes/057.webp", "shot": "shots/nes/057.webp", "d": "La vengeance de Protoman! Protoman est devenu fou! Détruire la moitié de la ville ne lui semble pas suffisant. Maintenant, il a enlevé le Dr Light et le retient - ainsi que la cité - en otage. Armé de son Mega Buster perfectionné, Mega Man arrive à la rescousse. Mais huit des soldats cybernétiques de Protoman n'ont qu'une idée en tête: le mettre au rebut une bonne fois pour toutes! Tout le poids du monde pèse sur vos épaules alors que vous affrontez Gravity Man! Esquivez les attaques de pierre de Stone Man et réduisez-le en poussière! Chevauchez les vagues et voguez vers la puissance marémotrice de Wave Man. Aidez Mega Man à anéantir les huit robots de Protoman. Enfin, soyez prêt au combat du siècle qui va opposer les frères ennemis!"}, {"id": "nes_058", "s": "nes", "n": 58, "t": "Metal Gear", "y": 1988, "dv": "Konami", "p": "Konami", "g": "Action", "r": 1, "img": "nes/058.webp", "shot": "shots/nes/058.webp", "d": "Metal Gear sur NES est un précurseur du jeu d'infiltration. Le héros, Solid Snake, doit infiltrer Outer Heaven, une base où est construit une nouvelle arme, le Metal Gear. Le jeu mêle un scénario complet à des phases de jeu d'action et d'infiltration. Divers Boss, pièges, armes et équipements parsèment le jeu offrant au joueur une aventure riche et variée."}, {"id": "nes_059", "s": "nes", "n": 59, "t": "Metroid", "y": 1988, "dv": "Nintendo", "p": "Nintendo", "g": "Action", "r": 3, "img": "nes/059.webp", "shot": "shots/nes/059.webp", "d": "Vous êtes seul contre la méchante Mother Brain! A l'intérieur de Zèbes, la planète aux mille passages secrets et interminables, le Metroid se multiplie. Le Metroid, seul , est inoffensif. Mais entre les mains de Mother Brain, il peut détruire la galaxie. Portez votre costume spatial pour pouvoir absorber l'énergie nécessaire à votre quête de Pouvoirs tels les rayons de glace, les rayons ondulés, les bottes de saut et Varia. Procurez-vous ces pouvoirs spéciaux qui vous aideront à vaincre Mother Brain."}, {"id": "nes_060", "s": "nes", "n": 60, "t": "Mighty Final Fight", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Action", "r": 0, "img": "nes/060.webp", "shot": "shots/nes/060.webp", "d": "Mighty Final Fight sur NES est un beat'em all dans lequel vous choisissez parmi trois personnages jouables au style de combat différent pour partir à la d'une fille kidnappée par le gang de malfrats Mad Gear. Traversez six niveaux plus deux niveaux bonus et ramassez des armes pour venir à bout des boss qui concluent chaque stage. Cette mouture propose une version super déformée des personnages."}, {"id": "nes_061", "s": "nes", "n": 61, "t": "Monopoly", "y": 1991, "dv": "Parker Brothers", "p": "Arcadia Systems, Inc.", "g": "Stratégie", "r": 0, "img": "nes/061.webp", "shot": "shots/nes/061.webp", "d": "De la Rue de la paix aux Champs Elysées, en passant par la Gare de Lyon... Exercez vos talents de promoteur immobilier dans Monopoly, l'adaptation sur NES du célèbre jeu de plateau de Parker."}, {"id": "nes_062", "s": "nes", "n": 62, "t": "Mr. Gimmick", "y": 1993, "dv": "Sunsoft", "p": "Sunsoft", "g": "Action", "r": 0, "img": "nes/062.webp", "shot": "shots/nes/062.webp", "d": "Mr. Gimmick est un jeu de plates-formes sur NES. Vous incarnez une peluche verte du nom de Gimmick offerte en cadeau à une fillette, qui va littéralement délaisser tous ses autres jouer pour ne s'occuper que de vous. Les autres jouets, jaloux, vont vous envoyer dans un monde parallèle afin que vous disparaissiez à jamais. Et voilà comment débute votre histoire, vous devez faire tout votre possible pour tenter de revenir auprès de la fillette. Pour se défendre, votre personnage à la capacité de créer une étoile qu'il peut ensuite lancer sur ses ennemis. Vous affronterez toutes sortes d’adversaire durant 6 niveaux pour réussir à retrouver le confort des bras de votre propriétaire."}, {"id": "nes_063", "s": "nes", "n": 63, "t": "Over Horizon", "y": 1992, "dv": "Hot-B", "p": "Hot-B", "g": "Action", "r": 0, "img": "nes/063.webp", "shot": "shots/nes/063.webp", "d": "Over Horizon est un jeu de tir vu de côté sur Nes dans lequel vous guidez un vaisseau spatial. Vos trois armes vous aideront à venir à bout des différents niveaux proposés."}, {"id": "nes_064", "s": "nes", "n": 64, "t": "Pac-Man", "y": 1993, "dv": "Namco", "p": "Namco", "g": "Action", "r": 0, "img": "nes/064.webp", "shot": "shots/nes/064.webp", "d": "Pac-Man sur Nes est l'adaptation d'un des plus grands succès arcades de toute l'histoire du jeu vidéo. Vous contrôlez Pac-Man, petite boule jaune croque-tout, dans des labyrinthes peuplés de fantômes colorés. Le but du jeu consiste à manger tous les petits points jaunes. Le moindre contact avec un des ectoplasmes est fatal."}, {"id": "nes_065", "s": "nes", "n": 65, "t": "Paperboy", "y": 1988, "dv": "Atari", "p": "Mindscape", "g": "Action, Sport", "r": 0, "img": "nes/065.webp", "shot": "shots/nes/065.webp", "d": "Paperboy sur NES est l'adaptation du succès arcade du même nom. Vous incarnez un jeune livreur de journaux à vélo et devez effectuer votre tâche le plus rapidement possible. Prenez garde tout de même aux divers obstacles, à savoir les automobilistes, chiens, skaters et autres trous dans la chaussée."}, {"id": "nes_066", "s": "nes", "n": 66, "t": "Power Blade", "y": 1991, "dv": "Natsume", "p": "Taito", "g": "Action", "r": 0, "img": "nes/066.webp", "shot": "shots/nes/066.webp", "d": "Power Blade sur Nes est le remake du jeu Japonais Power Blazer sorti sur Famicom. D'abord baptisé Power Mission, il fut appelé Power Blade après les dernières modifications. Le jeu est très différent de l'original japonais, le héros style manga ressemblant a Mega Man est remplacé par un sosie de Schwarzenegger, les niveaux ont été totalement repensés, les boss sont différents, le gameplay est enrichi et les cinématiques corrigées et rallongées L'action se déroule en 2191, époque où la Terre est menacée par un ordinateur hors contrôle qui la gouvernait avant. Vous incarnez Nova, un agent secret spécialiste du boomerang qui a pour mission de retrouver 6 agents dans 6 zones différentes. Ceux-ci lui délivreront des cartes à bande afin de parvenir à la dernière zone de jeu, et ainsi détruire l'unité centrale folle."}, {"id": "nes_067", "s": "nes", "n": 67, "t": "Pro Wrestling", "y": 1986, "dv": "Nintendo", "p": "Nintendo", "g": "Sport", "r": 0, "img": "nes/067.webp", "shot": "shots/nes/067.webp", "d": "Pro Wrestling sur Nes est un jeu de catch dans lequel vous incarnez les catcheurs de l'une des équipes suivantes : Mad Soldiers, Orient Express, Great Maskmen et Crush Brothers. Chaque combattant possède ses propres spécificités, par exemple le fait de pouvoir utiliser des objets du décor. Pour finir le jeu, il faut compléter les ligues mexicaines, pacifiques et mondiales."}, {"id": "nes_068", "s": "nes", "n": 68, "t": "Probotector", "y": 1991, "dv": "Konami", "p": "Konami", "g": "Action", "r": 3, "img": "nes/068.webp", "shot": "shots/nes/068.webp", "d": "Vous devez vous mesurer aux plus féroces ennemis de la galaxie. Soyez vigilant, soit vous gagnez, soit le monde est perdu. Nous sommes en l'an 2633 de notre ère. La technologie a atteint un niveau si avancé que la nature et la science coexistent désormais harmonieusement, et que la paix règne sur le monde... mais sous le calme rôde une menace pour l'humanité défiant l'imagination. Alors qu'ils travaillent à une recherche ultra-secrète, une équipe spéciale de scientifiques découvrent qu'un extra-terrestre de la Galaxie de l'Apocalypse prépare l'élimination de la race humaine. Pour protéger la Terre et son peuple, deux robots de combat (Probotector), RD008 et RC011, ont été mis au point. Leur mission, atteindre la forteresse des extra-terrestres dans les Îles Galga, et veiller à ce qu'ils soient exterminés."}, {"id": "nes_069", "s": "nes", "n": 69, "t": "Probotector II : Return of the Evil Forces", "y": 1990, "dv": "Konami", "p": "Konami", "g": "Plateforme, Plateforme / Shooter Scrolling", "r": 0, "img": "nes/069.webp", "shot": "shots/nes/069.webp", "d": "Nous sommes en 2634. La Terre a enfin échappé à l'emprise diabolique de la magie noire, un an après la guerre avec la mystérieuse armée extra-terrestre. Au moment où la paix semble rétablie, le cauchemar recommence. Les mutants extra-terrestres sont de retour. Leur mission: prendre le contrôle du monde. La seule chance de salut de la Terre consiste à faire appel aux Probotector, RD008 et RC011, les robots de combat les plus forts de tous les temps. Ils représentent l'unique espoir de sauver le monde d'une mort certaine. Mais qui survivra? Les extra-terrestres ou les Probotectors?!!!"}, {"id": "nes_070", "s": "nes", "n": 70, "t": "Punch-Out!!", "y": 1991, "dv": "Nintendo", "p": "Nintendo", "g": "Sport / Boxe, Sport", "r": 3, "img": "nes/070.webp", "shot": "shots/nes/070.webp", "d": "\"Punch-Out!! featuring Mr. Dream\" vous permet d'enfiler les gants d'un jeune boxeur, Little Mac, qui doit montrer de quoi il est capable en montant sur le ring pour affronter une série d'adversaires charismatiques venus du monde entier aux court des 3 circuits proposés. Le combat final vous fera affronter le poids lourd Mike Tyson ! Ce jeu est basé sur le jeu d'arcade \"Punch-Out!!\" sorti en 1983 et est la réédition du jeu NES \"Mike Tyson's Punch-Out!!\" qui sera retiré 1990 aux USA et 1991 en Europe avec le remplacement de Myke Tyson par un boxeur semblable (ainsi qu'à Piston Honda) et qui combat de façon identique, avec seulement quelques changements sur son visage et sa couleur de peau et un un plus grand nombre de victoires (99 victoires en 99 matchs dont 99 par KO..): La légende raconte que la modification de ce personnage est due à l'actualité délictueuse du véritable Mike Tyson, auquel Nintendo ne voulait plus associer son image. Nintendo démentit argumentant que l'affaire de viol dans laquelle Mike Tyson a été impliquée (1991) s'est déroulée après la décision de Nintendo de ne pas renouveler son contrat avec Tyson (1990), ce dernier venant de perdre son titre de champion du…"}, {"id": "nes_071", "s": "nes", "n": 71, "t": "R.C. Pro-Am", "y": 1988, "dv": "Rareware", "p": "Nintendo", "g": "Course, Conduite", "r": 1, "img": "nes/071.webp", "shot": "shots/nes/071.webp", "d": "R.C. Pro-Am vous propose de diriger votre voiture radio-commandée dans ce jeu de courses sur Nes. Pour gagner, vous devrez venir à bout de vos trois adversaires sur 32 pistes tout en évitant les obstacles sur votre route."}, {"id": "nes_072", "s": "nes", "n": 72, "t": "Rad Racer", "y": 1987, "dv": "Square", "p": "Sega", "g": "Course, Conduite", "r": 1, "img": "nes/072.webp", "shot": "shots/nes/072.webp", "d": "Rad Racer est un jeu de courses en 3D orienté arcade sur Nes. Il s'agira ici d'atteindre la ligne d'arrivée des 8 courses présentes dans les temps. Pour cela, des checkpoints le long de la route augmenteront votre réserve de temps."}, {"id": "nes_073", "s": "nes", "n": 73, "t": "Rygar", "y": 1990, "dv": "Tecmo", "p": "Tecmo", "g": "Action", "r": 0, "img": "nes/073.webp", "shot": "shots/nes/073.webp", "d": "Le monde d'Argool a besoin d'un héros pour chasser les forces du mal et restaurer la paix. Etes-vous l'élu, celui que tout le monde attend ? Rygar sur NES vous apporte la réponse. Ce jeu combinant action et aventure alterne entre vue de profil durant les scènes d'action et une vue en hauteur lors des phases transitoires."}, {"id": "nes_074", "s": "nes", "n": 74, "t": "Shadow Warriors", "y": 1991, "dv": "Tecmo", "p": "Tecmo", "g": "Action", "r": 2, "img": "nes/074.webp", "shot": "shots/nes/074.webp", "d": "Shadow Warriors (Ninja Gaiden en Amérique du Nord) est un jeu vidéo de plates-formes/action, tout premier épisode de la série et de la trilogie du même nom sur NES. Ryu Hayabusa est le dernier héritier du clan Ninja Dragon. Armé de l'ancestrale épée Dragon du clan, il part aux Etats-Unis enquêter et venger la mort de son père Ken Hayabusa. La mort de ce dernier est liée au secret des deux statuettes démoniaques des ténèbres et de la lumière que Shinobi utilisa pour enfermer le démon. Traqué par la CIA, leur agent Irene Lew et leur chef Forster, Ryu va être dirigé vers les confins de l'Amazonie par l'archéologue Walter Smith. Walter Smith y a découvert les ruines d'un temple vieux de plus de 2000 ans censé être la prison du démon et qui est désormais accaparé par un dénommé Guardia de Mieux alias \"The Jaquio\" qui s'est approprié une des statuettes démoniaques.."}, {"id": "nes_075", "s": "nes", "n": 75, "t": "Shadow Warriors II : Ninja Gaiden II", "y": 1994, "dv": "Tecmo", "p": "Tecmo", "g": "Action, Beat'em All", "r": 0, "img": "nes/075.webp", "shot": "shots/nes/075.webp", "d": "Shadow Warriors II : The Dark Sword of Chaos (Ninja Gaiden II en Amérique du Nord) est un jeu vidéo de plates-formes/action, deuxième épisode de la trilogie du Ninja Gaiden sur NES. Un an après les événements du précédent épisode, Ashtar l'empereur des ténèbres qui avait mandaté Jaquio aprend sa défaite. Il prépare un nouveau plan de conquête du monde par l'ouverture du portail des ténèbres. Una agent de l'U.S. Army Special Intelligence dénommé Robert T. Sturgeon est envoyé requérir l'aide de Ryu Hayabusa afin de combattre Ashtar. Robert informe également Ryu qu'Irene a été capturée et est détenue dans la tour de Lahja."}, {"id": "nes_076", "s": "nes", "n": 76, "t": "Shadowgate", "y": 1991, "dv": "Icom", "p": "Kemco", "g": "Aventure", "r": 0, "img": "nes/076.webp", "shot": "shots/nes/076.webp", "d": "Shadowgate est un jeu d'aventure sur NES. Vous prenez le contrôle d'un aventurier envoyé à l'ancienne porte Shadowgate. Votre but est de trouver un objet mystique connu sous le nom de \"Staff of Age\". Vous devez aussi tuer le démoniaque Seigneur Warlock pour l'empêcher d'invoquer le terrible démon Behemoth."}, {"id": "nes_077", "s": "nes", "n": 77, "t": "Shatterhand", "y": 1991, "dv": "Natsume", "p": "Jaleco", "g": "Action", "r": 0, "img": "nes/077.webp", "shot": "shots/nes/077.webp", "d": "En l'an 2030, le groupe de militaires Metal Command dirigés par le Général Gus Grover veut dominer le monde à l'aide d'une armée de soldats cyborg. Pour le contrer, la division LORD (Law and Order Regulatory Division) envoie Steve Hermann, un ancien policier du Bronx, qui possèdent des mains cybernétiques uniques, à la suite de leurs mutilations dans une embuscade par le Metal Command. L'ajout d'implants cybernétiques à un officier rappelle Robocop.nnLe jeu est composé de 7 niveaux: une usine, une raffinerie, une fête foraine, une station de filtration, un centre de recherche anti-gravitationnelle, une ville en ruine, et le site de lancement de missile du General Grover. Shatterhand est accompagné par 8 robots satellites qui peuvent être appelés en fonction de combinaison de lettres grecques alpha and beta récoltées le long des niveaux. Il s'agit de Yobobot, Laserbot, Swordbot, Ricobot, Grenadebot, Pyrobot, Yoyobot et Bounceobot.nnDans la version japonaise appelé Tokkyuu Shirei - Solbrain, le héros correspond à la série télévisée éponyme rappelant X-OR. Le 3e niveau se déroule à bord d'un sous-marin au lieu d'une fête foraine comme dans les versions américaines et européennes"}, {"id": "nes_078", "s": "nes", "n": 78, "t": "Snake Rattle N Roll", "y": 1991, "dv": "Rareware", "p": "Nintendo", "g": "Plateforme, Action", "r": 1, "img": "nes/078.webp", "shot": "shots/nes/078.webp", "d": "Snake Rattle And Roll est un jeu de plates-formes en 2D isométrique sur Nes. Incarnez Rattle ou Roll, deux serpents qui, pour finir les niveaux qu'ils vont parcourir, devront manger et encore manger, afin de grossir et pouvoir actionner la porte de sortie !"}, {"id": "nes_079", "s": "nes", "n": 79, "t": "StarTropics", "y": 1992, "dv": "Nintendo", "p": "Nintendo", "g": "Aventure, Action", "r": 1, "img": "nes/079.webp", "shot": "shots/nes/079.webp", "d": "Mike Jones est invité par son oncle archéologue à venir le rejoindre sur une île tropicale. Mais une fois arrivé, le jeune garçon se rend compte que son oncle a été kidnappé. Pour le retrouver il va devoir explorer l'île de fond en comble et combattre des monstres grâce à un inventaire bien rempli. StarTropics sur NES commence..."}, {"id": "nes_080", "s": "nes", "n": 80, "t": "Street Gangs", "y": 1991, "dv": "Technos Japan Corp.", "p": "Infogrames", "g": "Beat'em All, Action", "r": 2, "img": "nes/080.webp", "shot": "shots/nes/080.webp", "d": "Street Gangs est le version européenne de River City Ransom aux USA et de Downtown Nekketsu Monogatari au Japon. C'est un Beat Them All faisant suite à Renegade. Il s'agit du troisième épisode de la prolifique série « Nekketsu Koha Kunio-kun » qui peut à peu près être traduit par « le voyou Kunio du lycée Nekketsu » et qui a offert une douzaine de titres à la NES (River City Ransom , Nintendo World Cup, Crash 'n the Boys: Street Challenge, etc..). C'est le premier épisode où Kunio s'allie avec son rival des épisodes précédents : Riki. Ceux-ci vont combattre les lycéens des autres lycées. Beaucoup de personnages reviendront dans les épisodes suivants de la série, notamment ceux. Dans les versions Américaines et Européennes, Kunio est appelé Alex et Riki est renommé Ryan et ils traversent River City pour sauvez Cindy, la petite amie de Ryan qui a été enlevée par un gang de voyous ayant pour boss un dénommé \"Slick\". Les costumes de lycéens sont remplacés par des jeans et t-shirt plus occidentaux et les ennemis sont des gangs portant les noms \"Generic Dudes\", \"Frat Guys\", \"Jocks\" ou \"Squids\"."}, {"id": "nes_081", "s": "nes", "n": 81, "t": "Super Mario Bros.", "y": 1987, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme", "r": 3, "img": "nes/081.webp", "shot": "shots/nes/081.webp", "d": "La Princesse Champignon est prisonnière de la méchante tribu des tortues Koopa. Il ne tient qu'à vous de la sauver avant que le temps ne soit écoulé. Cette nouvelle aventure des frères Mario et Luigi vous réserve de nombreuses heures de plaisir."}, {"id": "nes_082", "s": "nes", "n": 82, "t": "Super Mario Bros. + Duck Hunt", "y": 1989, "dv": "Nintendo", "p": "Nintendo", "g": "Compilation", "r": 0, "img": "nes/082.webp", "shot": "shots/nes/082.webp", "d": "Super Mario Bros. / Duck Hunt est une cartouche multi-jeux sortie sur NES en 1986 aux États-Unis et en 1987 en Europe. Comme son nom l'indique, cette cartouche regroupe les jeux Super Mario Bros. et Duck Hunt."}, {"id": "nes_083", "s": "nes", "n": 83, "t": "Super Mario Bros. + Tetris + Nintendo World Cup", "y": 1990, "dv": "Nintendo", "p": "Nintendo", "g": "Sport, Compilation", "r": 0, "img": "nes/083.webp", "shot": "shots/nes/083.webp", "d": "Super Mario Bros. / Tetris / Nintendo World Cup est une cartouche multi-jeux sortie sur NES en 1992 uniquement en version PAL, regroupant l'Europe, l'Australie et la Nouvelle-Zélande. Comme son nom l'indique, cette cartouche regroupe les jeux Super Mario Bros., Tetris et Nintendo World Cup. La cartouche était soit vendue en boîte dans le commerce, soit en bundle avec la NES Top Loader, ce qui fut le cas pour l'Australie et la Nouvelle-Zélande"}, {"id": "nes_084", "s": "nes", "n": 84, "t": "Super Mario Bros. 2", "y": 1989, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme", "r": 2, "img": "nes/084.webp", "shot": "shots/nes/084.webp", "d": "Mario est de retour! Plus grand et plus fort que jamais! Il s'agit cette fois d'un combat sans merci pour libérer le royaume de Subcon du sortilège que lui a jeté le méchant Wart. Aidé de Mario, de Luigi, de Toad et de la Princesse, vous devez retrouver Wart dans des mondes bizarres aux niveaux multiples et le battre! Vous possédez cette fois un pouvoir très spécial - le pouvoir d'arracher- et, désormais, tout ce que vous trouvez vous sert d'arme. Mais prenez garde! Vous n'avez jamais encore eu affaire à de tels adversaires! Des Shyguy et des Tweeter! Des Ninji et des Beezo! Vous n'avez jamais vécu pareille aventure! Seule votre ruse et votre agilité peuvent vous sauver..."}, {"id": "nes_085", "s": "nes", "n": 85, "t": "Super Mario Bros. 3", "y": 1991, "dv": "Nintendo", "p": "Nintendo", "g": "Plateforme", "r": 4, "img": "nes/085.webp", "shot": "shots/nes/085.webp", "d": "Combattez des monstres et de petits patrons, évitez les fantômes, le soleil brûlant et les boulets de canon et récupérez le sceptre royal. Super Mario 3 compte encore plus de zones accessibles par tuyau, offre plus d'occasions d'obtenir des vies supplémentaires et comporte un élément nouveau: des costumes! Le costume de raton-laveur permet à Mario de voler et de briser des blocs de brique. Le costume de grenouille lui permet de nager plus vite que les poissons meurtriers."}, {"id": "nes_086", "s": "nes", "n": 86, "t": "Super Turrican", "y": 1993, "dv": "Rainbow Arts (Softgold)", "p": "Imagineer", "g": "Action", "r": 0, "img": "nes/086.webp", "shot": "shots/nes/086.webp", "d": "un bon vieux jeu!!! à prendre absolument ... mais pas sur nes , sur SNES!"}, {"id": "nes_087", "s": "nes", "n": 87, "t": "Sword Master", "y": 1993, "dv": "Athena", "p": "Athena", "g": "Action", "r": 0, "img": "nes/087.webp", "shot": "shots/nes/087.webp", "d": "Sword Master sur Nes est un jeu d'action/aventure dans lequel vous incarnez un chevalier prêt à secourir une jeune damoiselle en détresse, capturée par un magicien corrompu et un démon hideux. A travers 7 niveaux différents, notre héros devra faire face à des hordes d'ennemis monstrueux comme des guerriers squelettes, des hommes-lézards ou des chauves-souris géantes. Vous aurez notamment la possibilité de vous transformer en magicien pour terrasser certains boss récalcitrants."}, {"id": "nes_088", "s": "nes", "n": 88, "t": "Teenage Mutant Hero Turtles", "y": 1989, "dv": "Konami", "p": "Konami", "g": "Action", "r": 0, "img": "nes/088.webp", "shot": "shots/nes/088.webp", "d": "Teenage Mutant Ninja Turtles sur Nes est un jeu d'action dans lequel vous dirigez les fameuses tortues ninja Donatello, Michelangelo, Leonardo et Rapahël. Vous pouvez alterner quand vous voulez pour profiter des armes et caractéristiques de chacune et ainsi défaire le maléfique Schredder."}, {"id": "nes_089", "s": "nes", "n": 89, "t": "Teenage Mutant Hero Turtles II : The Arcade Game", "y": 1991, "dv": "Konami", "p": "Konami", "g": "Action", "r": 2, "img": "nes/089.webp", "shot": "shots/nes/089.webp", "d": "TMNT 2 : The Arcade Game est un jeu d'action sur Nes inspiré de la franchise des Tortues Ninja. L'intrigue place nos 4 héros face à Shredder et ses sbires ayant enlevé la jeune reporter April O'Neil. Tout au long du jeu, vous combattrez des hordes d'ennemis mais également des boss connus comme le diabolique Krang. Cette version-ci contient des niveaux supplémentaires, de nouveaux boss ainsi que de nouvelles musiques."}, {"id": "nes_090", "s": "nes", "n": 90, "t": "Tetris", "y": 1990, "dv": "Hitech Software", "p": "Nintendo", "g": "Puzzle-Game", "r": 2, "img": "nes/090.webp", "shot": "shots/nes/090.webp", "d": "Tetris sur Nes est le célèbre puzzle-game dans lequel vous devez empiler des briques afin de constituer des lignes qui s'effaceront au fur et à mesure de votre progression. La difficulté augmente au fil de votre avancée. Cette version de Nintendo propose deux modes : le mode 1 où il faut assemblez les blocs à l'infini et le mode B où il faut simplement réaliser 25 lignes."}, {"id": "nes_091", "s": "nes", "n": 91, "t": "The Adventure Island Part II", "y": 1992, "dv": "Hudson", "p": "Hudson", "g": "Plateforme, Action", "r": 0, "img": "nes/091.webp", "shot": "shots/nes/091.webp", "d": "Plongez dans l'action avec Adventure Island II. Le sorcier guérisseur diabolique vient de kidnapper votre bien-aimée. Vous devrez combattre sur huit îles différentes pour la reprendre! Affrontez des monstres préhistoriques, les créatures cracheuses de feu les plus répugnantes qui soient! Echappez à des volcans en fusion. Esquivez les scorpions géants et les cobras royaux. Aiguisez votre hache, enfilez votre tenue en peau de léopard et partez pour Adventure Island II. Vous allez en voir de toutes les couleurs."}, {"id": "nes_092", "s": "nes", "n": 92, "t": "The Guardian Legend", "y": 1992, "dv": "Irem", "p": "Compile", "g": "Aventure, Action", "r": 0, "img": "nes/092.webp", "shot": "shots/nes/092.webp", "d": "Alyssa est une jeune femme androïde gardienne de la Terre qui a la capacité de se transformer en vaisseau spatial. Elle est envoyée sur Naju afin d'empêcher la planète d'entrer en collision avec la Terre. Après un premier combat contre un système de défense, l'héroïne se pose enfin. En arrivant sur Naju, elle découvre un message d'un habitant enregistré sur un ordinateur. Le message explique qu'il faut lancer le système d'auto-destruction pour annihiler la planète et les extra-terrestres qui l'ont envahie en même temps. Pour cela, il faut détruire les 10 systèmes de sécurité qui permettent de lancer la procédure. Alyssa parcourt alors la planète sur terre et dans les airs pour vaincre tous les extra-terrestres. Après un ultime combat contre leur chef suprême, elle déclenche l'auto-destruction et sauve la Terre de sa fin tragique."}, {"id": "nes_093", "s": "nes", "n": 93, "t": "The Legend of Zelda", "y": 1987, "dv": "Nintendo", "p": "Nintendo", "g": "Jeu De Rôles, Action", "r": 4, "img": "nes/093.webp", "shot": "shots/nes/093.webp", "d": "The Legend of Zelda sur Nes vous présente la première aventure du jeune Link. Débutez votre périple dans le fantastique monde d'Hyrule. A l'aide de votre épée, de votre bouclier et de votre intelligence, retrouvez les huit fragments de la Triforce et sauvez la princesse Zelda."}, {"id": "nes_094", "s": "nes", "n": 94, "t": "Time Lord", "y": 1991, "dv": "Rareware", "p": "Milton Bradley Co.", "g": "Action", "r": 0, "img": "nes/094.webp", "shot": "shots/nes/094.webp", "d": "Jeu vraiment cool où on voyage à travers le temps. Hélas, pas mal de points négatifs aux tableau: Graphismes moyens, difficulté élevée, et une bande son horrible! ) Si on coupe le son, le jeu est agréable quand même Le jeu comprend un niveau préliminaire, suivi de 4 niveaux historiques : l'Angleterre médiévale aux environs de 1250, le Far West américain des années 1860, les Caraïbes aux alentours de 1650, et la France pendant la deuxième guerre mondiale en 1943. La quête doit se terminer dans le vaisseau spatial du Roi de Drakkon avant le début de l'année 3000. Time Lord peut utiliser des armes d'époque pour combattre. Dans chaque niveau, le joueur doit trouver 5 orbes dorées qui permettent à la machine à voyager dans le temps de fonctionner."}, {"id": "nes_095", "s": "nes", "n": 95, "t": "Tiny Toon Adventures", "y": 1992, "dv": "Konami", "p": "Konami", "g": "Plateforme", "r": 0, "img": "nes/095.webp", "shot": "shots/nes/095.webp", "d": "Ces mini Toons ont de gros problèmes. C'esrt vrai. Montana Max, l'ennemi numéro un de la bonne ville d'Acme Acres, vient de kidnapper Babs Bunny, la superbe représentante de la gente lapine. Le destin de cette demoiselle vêtue de fourrure repose maintenant entre les pattes de Buster Bunny et de ses compagnons: Dizzy Devil, Furrball et Plucky Duck. Pour sauver Babs, vous devez vaincre chacun des chefs et dérober les clés des cinq cages. Vous devrez aussi vous frayer un chemin à travers des forêts hantées, de répugnants bateaux de pirates, des pièces cachées, des ruelles sombres, des salles secrètes et Wackyland pour finalement parvenir au Manoir de Monty. Mais pour réussir à vous rendre aussi loin, vous devrez déjouer les pièges et les planchers mouvants, et gardez un oeil sur les interrupteurs et les portes. Aussi, est-il préférable pour vous de continuer à sauter sinon ce pourrait bien être la fin de nos petits amis."}, {"id": "nes_096", "s": "nes", "n": 96, "t": "Ultimate Air Combat", "y": 1992, "dv": "Activision", "p": "Activision", "g": "Simulation", "r": 0, "img": "nes/096.webp", "shot": "shots/nes/096.webp", "d": "Disponible sur Nes, Ultimate Air Combat est un jeu d'action dans lequel vous incarnez le fleuron des pilotes de chasse américains envoyé par la Maison Blanche pour arrêter un certain dictateur Don Gwano. Ce dernier s'apprête à envahir les pays limitrophes, à vous de le stopper grâce à des frappes tactiques sur ses bases militaires. Le soft propose 3 modèles d'avions différents, une dizaine d'armes disponibles et plus d'une trentaine de missions à remplir."}, {"id": "nes_097", "s": "nes", "n": 97, "t": "Wario's Woods", "y": 1994, "dv": "Nintendo", "p": "Nintendo", "g": "Stratégie", "r": 0, "img": "nes/097.webp", "shot": "shots/nes/097.webp", "d": "Wario's Woods sur NES est un puzzle-game du genre Tetris reprenant les personnages Wario, Toad et Birdo de l'univers Mario. En duel, face à l'ordinateur ou à un autre joueur, vous contrôlez Toad et devez déplacer les animaux lancés par Wario et les bombes lancées par Birdo afin de faire correspondre leurs couleurs pour qu'ils disparaissent. Le but étant de ne plus avoir d'animaux et de bombes sur son écran."}, {"id": "nes_098", "s": "nes", "n": 98, "t": "Wizards & Warriors", "y": 1990, "dv": "Rareware", "p": "Acclaim", "g": "Action", "r": 0, "img": "nes/098.webp", "shot": "shots/nes/098.webp", "d": "Wizards & Warriors est un jeu de plates-formes sur NES. Vous dirigez le chevalier Kuros et devez délivrer une princesse captive du terrible sorcier Malkil, qu'on dit être le maître de Merlin en personne. Dans votre traversée de la forêt d'Elrond et des interminables cavernes jusqu'au château d'Ironspire, vous devez aussi délivrer, à l'aide de votre épée Brightsword, plusieurs demoiselles en détresse."}, {"id": "nes_099", "s": "nes", "n": 99, "t": "Xevious", "y": 1988, "dv": "Bandai", "p": "Namco", "g": "Shoot'em Up, Action", "r": 0, "img": "nes/099.webp", "shot": "shots/nes/099.webp", "d": "Xevious est un shoot'em up sur Nes, le premier à proposer un scrolling vertical et la possibilité d'attaquer les ennemis aussi bien sur le sol que dans les airs. Vous devez protéger la Terre de l'impitoyable Xevious, et pour cela, votre seule défense sera le Soulvalou Fighter Plane."}, {"id": "nes_100", "s": "nes", "n": 100, "t": "Zelda II : The Adventure of Link", "y": 1988, "dv": "Nintendo", "p": "Nintendo", "g": "Action, Action / Aventure, Jeu De Rôles", "r": 2, "img": "nes/100.webp", "shot": "shots/nes/100.webp", "d": "Zelda II : The Adventure of Link sur Nes nous fait retrouver les bottes du héros d'Hyrule, le grand Link. Partez à la recherche de la Triforce pour réveiller la princesse Zelda, plongée dans un sommeil profond, tandis que les sbires de Ganon tentent de ressusciter leur maître. Le titre propose une carte du monde, une vue de côté permettant un défilement horizontal et introduit des éléments qui deviendront cultes dans la suite de la série."}, {"id": "snes_001", "s": "snes", "n": 1, "t": "ActRaiser", "y": 1992, "dv": "Quintet", "p": "Enix", "g": "Simulation", "r": 1, "img": "snes/001.webp", "shot": "shots/snes/001.webp", "d": "ActRaiser est un jeu d'action et de gestion sur Super Nintendo dans lequel vous prenez le contrôle d'un dieu devant protéger le monde des forces du mal. Le soft alterne entre les phases d'action/plates-formes en scrolling et les phases de gestion où l'on développe les différents villages suivant le principe (simplifié) d'un Sim City. En dehors du langage utilisé et du changement contextuel, des changements ont eu lieu entre la version japonaise et les versions internationales. Ainsi quelques changements graphique et musicaux ont eu lieu (le logo était plus stylisé et le \"R\" n'était pas en majuscule) et la difficulté des phases d'actions a été rabaissé dans la version US/NTSC et PAL. De même le temps s'écoule beaucoup plus rapidement dans les phases de stratégie, réduisant le temps qu'il faut pour pouvoir les finir et les monstres sur la carte sont bien moins nombreux. Dans la version USA, une version \"Professionnelle\" est alors proposée à la fin du jeu correspondant à la difficulté japonaise, tandis que la version PAL, celle-ci est immédiatement disponible dans l'écran titre."}, {"id": "snes_002", "s": "snes", "n": 2, "t": "Aero the Acro-Bat", "y": 1993, "dv": "Iguana Entertainment", "p": "Sunsoft", "g": "Action, Plateforme", "r": 0, "img": "snes/002.webp", "shot": "shots/snes/002.webp", "d": "Dans Aero the Acro-Bat sur Super Nintendo, le clown Edgar Ektor veut anéantir le cirque dans lequel il travaille. Aero, une chauve-souris rouge qui vit et travaille elle aussi dans ce cirque, va tout faire pour l'en empêcher. A travers plusieurs niveaux dans ce décor, elle saute dans des canons, fait du monocycle, et joue au funambule, jusqu'à arriver à Edgar Ektor pour tenter de déjouer ses plans."}, {"id": "snes_003", "s": "snes", "n": 3, "t": "Aladdin", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Plateforme", "r": 0, "img": "snes/003.webp", "shot": "shots/snes/003.webp", "d": "Reprenant les différentes séquences du film d'animation de Disney, Aladdin sur Super NES permet de retrouver tous les personnages de l'histoire. Ce jeu de plates-formes propose effectivement de suivre Aladdin des rues d'Agrabah aux couloirs du palais royal en passant bien sûr par la célèbre caverne aux merveilles. Le Génie est aussi de la partie et permet de gagner des bonus."}, {"id": "snes_004", "s": "snes", "n": 4, "t": "Another World", "y": 1993, "dv": "Delphine Software International", "p": "Interplay", "g": "Action, Aventure", "r": 0, "img": "snes/004.webp", "shot": "shots/snes/004.webp", "d": "Another World sur Super Nintendo est un jeu d'action-aventure qui démarre lorsque la foudre s'abat sur le laboratoire de Lester Chaykin qui procède à des expériences. L'explosion projettera le jeune scientifique dans un monde parallèle particulièrement hostile. Rapidement emprisonné par une espèce humanoïde, Lester fait la rencontre d'un compagnon de fortune."}, {"id": "snes_005", "s": "snes", "n": 5, "t": "Axelay", "y": 1993, "dv": "Konami", "p": "Konami", "g": "Action, Shoot'em Up", "r": 0, "img": "snes/005.webp", "shot": "shots/snes/005.webp", "d": "Axelay est un shoot'em up sur Super Nintendo. La Terre est encore une fois envahie par des extraterrestres. Ainsi, vous devez, à travers 6 niveaux différents et à l'aide de diverses armes, tuer les étrangers et mettre fin à cette attaque."}, {"id": "snes_006", "s": "snes", "n": 6, "t": "Batman Returns", "y": 1993, "dv": "Konami", "p": "Konami", "g": "Course, Conduite, Beat'em All", "r": 0, "img": "snes/006.webp", "shot": "shots/snes/006.webp", "d": "Dans Batman Returns sur Super NES, vous défendez Gotham City et tentez de faire échouer les plans du Pingouin et ses hommes. Vous évoluez sur terre ainsi que dans les airs grâce aux gadgets que vous assignez à la ceinture de Batman."}, {"id": "snes_007", "s": "snes", "n": 7, "t": "Breath of Fire II", "y": 1996, "dv": "Capcom", "p": "Capcom", "g": "Jeu De Rôles", "r": 1, "img": "snes/007.webp", "shot": "shots/snes/007.webp", "d": "Breath of Fire II est un jeu de rôle sur Super Nintendo. Vous retrouvez le héros Ryu dans cette suite. Le jeune garçon a toujours le pouvoir du dragon qui sommeille en lui et il peut l'utiliser lors des combats au tour par tour. Le point de départ du scénario pousse Ryu a laver le nom de l'un de ses amis, accusé à tort d'un crime qu'il n'a pas commis."}, {"id": "snes_008", "s": "snes", "n": 8, "t": "Castlevania : Vampire's Kiss", "y": 1996, "dv": "Konami", "p": "Konami", "g": "Action, Plateforme", "r": 0, "img": "snes/008.webp", "shot": "shots/snes/008.webp", "d": "Castlevania : Vampire's Kiss est un jeu de plates-formes action sorti sur Super Nintendo. Vous dirigez Richter Belmont et vous devez délivrer Annette et Maria des griffes de Dracula et en profiter pour le renvoyer en Enfer."}, {"id": "snes_009", "s": "snes", "n": 9, "t": "Cool Spot", "y": 1994, "dv": "Virgin", "p": "Virgin", "g": "Action, Plateforme", "r": 0, "img": "snes/009.webp", "shot": "shots/snes/009.webp", "d": "Cool Spot sur Super NES est un jeu de plates-formes coloré où règne la \"cool attitude\". Vous incarnez la mascotte de la marque de boisson 7up. L'objectif est de collecter un maximum de bouchons à travers le niveau pour passer au prochain."}, {"id": "snes_010", "s": "snes", "n": 10, "t": "Donkey Kong Country", "y": 1994, "dv": "Rareware", "p": "Nintendo", "g": "Plateforme, Plateforme / Run Jump, Action", "r": 3, "img": "snes/010.webp", "shot": "shots/snes/010.webp", "d": "Dans Donkey Kong Country sur Super Nintendo, vous incarnez le célèbre gorille de Nintendo. Le King K. Rool a volé les bananes de Donkey qui décide alors de partir à sa recherche pour les récupérer. Deux personnages sont jouables, Donkey est plus grand et plus fort, alors que Diddy est plus rapide. Il est possible de jouer à deux, soit chacun son tour, soit en équipe. Des animaux vous aideront à franchir certains niveaux et à vaincre les Kremlings."}, {"id": "snes_011", "s": "snes", "n": 11, "t": "Donkey Kong Country 2 : Diddy's Kong Quest", "y": 1995, "dv": "Rareware", "p": "Nintendo", "g": "Plateforme, Plateforme / Run Jump", "r": 2, "img": "snes/011.webp", "shot": "shots/snes/011.webp", "d": "Donkey Kong Country 2 : Diddy's Kong Quest sur Super Nintendo est un jeu d'action/plates-formes bondissant. Guidez Diddy ou Dixie Kong à travers huit mondes d'action délirants sur l'Ile Crocodile. Mais attention aux Kremlings ! Découvrez des secrets, apprenez de nouvelles techniques, rencontrez d'autres membres du clan Kong et contrôlez de nouveaux amis animaux, comme Squitter l'araignée ou Rattly le serpent à sonnette."}, {"id": "snes_012", "s": "snes", "n": 12, "t": "Donkey Kong Country 3 : Dixie Kong's Double Troubl", "y": 1996, "dv": "Rareware", "p": "Nintendo", "g": "Plateforme / Run Jump, Plateforme", "r": 2, "img": "snes/012.webp", "shot": "shots/snes/012.webp", "d": "Les Kremlings ont frappé fort cette fois en kidnappant Donkey et Diddy Kong ! Dixie et Kiddy doivent donc s'allier dans Donkey Kong Country 3 : Dixie Kong's Double Trouble, dernier volet sur Super Nes de la trilogie du gorille à cravate. Sautez de branches en rochers pour retrouver vos amis, traquez les oiseaux-bananes, faites-vous aider par d'autres animaux, coopérez à deux joueurs et défaites Kaos, le nouveau maître Kremling."}, {"id": "snes_013", "s": "snes", "n": 13, "t": "Earthworm Jim", "y": 1995, "dv": "Shiny Entertainment", "p": "Virgin", "g": "Plateforme / Run Jump, Action, Plateforme", "r": 1, "img": "snes/013.webp", "shot": "shots/snes/013.webp", "d": "Earthworm Jim sur Super NES met en scène Jim, un ver de terre ayant hérité d'un costume aux pouvoirs extraordinaires. Dans ce classique parmi les jeux de plates-formes, le joueur dispose d'un pistolet laser comme moyen de défense. Jim a aussi une large palette de mouvements pour parvenir à franchir des niveaux variés et colorés."}, {"id": "snes_014", "s": "snes", "n": 14, "t": "Earthworm Jim 2", "y": 1996, "dv": "Shiny Entertainment", "p": "Virgin", "g": "Action, Plateforme", "r": 1, "img": "snes/014.webp", "shot": "shots/snes/014.webp", "d": "Earthworm Jim 2 sur Super Nintendo est la suite des aventures du ver de terre extraordinaire. Jim renfile son costume aux pouvoirs magiques pour parcourir les niveaux d'action/plates-formes du titre. Le lombric dispose cette fois-ci de cinq types de munitions différentes pour charger son pistolet. Son habileté pour la course et les sauts lui permettent aussi d'atteindre des endroits gigantesques aux yeux d'un tout petit ver de terre."}, {"id": "snes_015", "s": "snes", "n": 15, "t": "F-Zero", "y": 1992, "dv": "Nintendo", "p": "Nintendo", "g": "Course Vue 3Eme Pers., Course, Conduite", "r": 2, "img": "snes/015.webp", "shot": "shots/snes/015.webp", "d": "Samouraï Goroh n'a nul besoin de s'entraîner à faire des tours de circuit car il détient déjà tous les records. Le Dr Stuart raffole des champs de mines et autres menus plaisirs de ce genre! Pico adore jouer aux autos tamponneuses. Avec quinze circuits et trois niveaux de difficultés, il va pouvoir s'en donner à cœur joie! Pour maintenir le Capitaine Falcon en haleine, rien de tel qu'une vitesse d'enfer et des virages en épingle à cheveux pris à fond la caisse!"}, {"id": "snes_016", "s": "snes", "n": 16, "t": "Fatal Fury Special", "y": 1995, "dv": "Takuyo", "p": "Snk", "g": "Action, Combat", "r": 0, "img": "snes/016.webp", "shot": "shots/snes/016.webp", "d": "Fatal Fury Special sur Super Nintendo est un jeu de baston en 2D, qui est une version améliorée de Fatal Fury 2. 16 personnages au style unique s'affrontent ici. Battez-vous dans des décors variables et maîtrisez le système de combo qui permet de vider la barre de vie adverse en un clin d'oeil."}, {"id": "snes_017", "s": "snes", "n": 17, "t": "Final Fight", "y": 1992, "dv": "Capcom", "p": "Capcom", "g": "Action, Beat'em All", "r": 1, "img": "snes/017.webp", "shot": "shots/snes/017.webp", "d": "Final Fight sur Super NES est un beat'em all dans lequel vous choisissez parmi trois personnages jouables au style de combat différent pour partir à la recherche d'une fille kidnappée par le gang de malfrats Mad Gear. Traversez six niveaux plus deux niveaux bonus et ramassez des armes pour venir à bout des boss qui concluent chaque stage."}, {"id": "snes_018", "s": "snes", "n": 18, "t": "Final Fight 2", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Action, Beat'em All", "r": 1, "img": "snes/018.webp", "shot": "shots/snes/018.webp", "d": "Dans Final Fight 2 sur Super Nintendo, le gang Mad Gear est de retour et a cette fois-ci kidnappé la fiancée, le père et le mentor de Guy, l'un des personnages du premier épisode sorti en 1991. Vous avez le choix entre Maki, la soeur de la fiancée de Guy, Mike Haggar et Carlos Miyamoto pour partir à la recherche du Mad Gear en traversant les pays et les continents. Des armes et des bonus sont cachés dans des caisses ou barils pour vous aider à éliminer les membres du gang."}, {"id": "snes_019", "s": "snes", "n": 19, "t": "Final Fight 3", "y": 1995, "dv": "Capcom", "p": "Capcom", "g": "Action, Beat'em All", "r": 1, "img": "snes/019.webp", "shot": "shots/snes/019.webp", "d": "Dans Final Fight 3 sur Super Nintendo, Guy et Mike Haggar vont tenter d'en finir une fois pour toutes avec Skull Cross, le boss du gang Mad Gear détruit dans le précédent épisode. Ils sont aidés de Dean et Lucia, deux nouveaux venus dans l'aventure. Il est toujours possible de jouer seul ou à deux. En jouant seul, un deuxième personnage peut être contrôlé par l'ordinateur pour vous aider."}, {"id": "snes_020", "s": "snes", "n": 20, "t": "Flashback", "y": 1993, "dv": "Delphine Software International", "p": "U.S. Gold", "g": "Plateforme, Aventure", "r": 0, "img": "snes/020.webp", "shot": "shots/snes/020.webp", "d": "Flashback sur Super Nintendo est un jeu de plates-formes futuriste. L'histoire débute en 2042 lorsque Conrad B. Hart prend connaissance d'un complot lié à l'existence d'extraterrestres hostiles disséminés parmi la population. Ces derniers le kidnappent mais Hart parvient à s'enfuir. Il est vite rattrapé et atterrit en catastrophe au coeur de la jungle de Titan, un satellite de Saturne. Le joueur doit braver les dangers de la jungle environnante et déjouer le complot en place."}, {"id": "snes_021", "s": "snes", "n": 21, "t": "Goof Troop", "y": 1993, "dv": "Capcom", "p": "Capcom", "g": "Action, Action / Aventure, Puzzle-Game, Aventure", "r": 0, "img": "snes/021.webp", "shot": "shots/snes/021.webp", "d": "Goof Troop est une aventure de Dingo et Max sur Super Nintendo. Dingo et son fils profitent d'une journée de pêche quand ils apprennent que leurs amis Pat Hibulaire et Pat Junior ont été kidnappés par des pirates. Ils partent à leur rescousse en traversant l'île de Spoonerville. Là, de nombreux pièges et énigmes se dressent sur leur passage. En solo ou en coopération avec un ami, vous pouvez mener Dingo et Max dans cette aventure."}, {"id": "snes_022", "s": "snes", "n": 22, "t": "Harvest Moon", "y": 1998, "dv": "Pack In Video", "p": "Natsume", "g": "Simulation, Aventure", "r": 1, "img": "snes/022.webp", "shot": "shots/snes/022.webp", "d": "Harvest Moon ce contrôle comme un RPG classique. On peut y faire ce que l'on veut, mais le but sera tout de même de faire grandir sa ferme, et se marier. Mais, ça se complique un peu plus pour le jardinage. Il faut bêcher, planter, arroser, attendre que ça pousse, puis, enfin, cueillir et vous pourrez aussi faire de l'élevage (cheval, vache ou bien des poulets). C'’est ainsi que vous gagnerez de l’'argent. Avec un peu de chance, vous pouvez tomber sur un trésor en bêchant, mais vous pouvez aussi tomber sur des taupes ! Gare à elles, et mettez-les hors de votre terrain. Il y a trois grandes parties dans Harvest Moon : votre ferme, dont vous devez vous occuper, le village, où vous ferez vos courses et draguerez, et le bois, qui fait office de petit coin bonus, avec notamment son étang à poisson."}, {"id": "snes_023", "s": "snes", "n": 23, "t": "Illusion of Time", "y": 1995, "dv": "Quintet", "p": "Enix", "g": "Jeu De Rôles", "r": 1, "img": "snes/023.webp", "shot": "shots/snes/023.webp", "d": "Illusion of Time est un jeu de rôle sur Super Nintendo, vous propulsant dans un univers médiéval fantastique. Vous incarnez Paul, un jeune orphelin qui a le don de déplacer des objets par la pensée. Celui-ci rencontre la princesse Kara qui doit être mariée de force avec le mystérieux Jackal. Kara, qui ne l'entend pas ainsi, demande à Paul de l'aider à s'échapper, mais ce qui devait être une simple fugue se transforme en aventure extraordinaire."}, {"id": "snes_024", "s": "snes", "n": 24, "t": "International Superstar Soccer Deluxe", "y": 1996, "dv": "Konami", "p": "Konami", "g": "Sport / Football, Sport", "r": 1, "img": "snes/024.webp", "shot": "shots/snes/024.webp", "d": "International Superstar Soccer Deluxe est la version revue de International Superstar Soccer sur Super Nintendo. Outre l'amélioration des menus et des animations, trente-six équipes nationales sont désormais jouables. Après en avoir choisi une, vous pouvez participer à un championnat international ou à la Coupe du Monde, à condition de passer les qualifications. A noter que le mode match simple permet de faire des parties entre quatre joueurs différents grâce à un adaptateur."}, {"id": "snes_025", "s": "snes", "n": 25, "t": "Joe & Mac : Caveman Ninja", "y": 1992, "dv": "Data East", "p": "Data East", "g": "Plateforme", "r": 0, "img": "snes/025.webp", "shot": "shots/snes/025.webp", "d": "Retournez à l'âge des cavernes grâce à Joe & Mac : Caveman Ninja sur Super Nintendo. Seul ou en coopération, vous incarnez Joe et Mac, deux hommes de Cro-Magnon qui vont devoir se battre pour retrouver les femmes capturées par des créatures préhistoriques. Et si les autres hommes des cavernes peuvent être facilement vaincus à coups d'os ou de massues, il faudra ruser pour ne pas se faire croquer par le grand tyrannosaure."}, {"id": "snes_026", "s": "snes", "n": 26, "t": "Killer Instinct", "y": 1995, "dv": "Rareware", "p": "Nintendo", "g": "Combat / Versus, Action, Combat", "r": 1, "img": "snes/026.webp", "shot": "shots/snes/026.webp", "d": "Killer Instinct est un jeu de combat sur Super Nintendo. La société Ultratech, spécialiste dans la fabrication et la vente d'armes, organise un grand tournoi à mort entre plusieurs candidats pour tester ses armes. Vous avez le choix parmi 11 combattants pour tenter de gagner le tournoi. Chacun d'entre eux possède une grande variété de coups et contrairement à la plupart des jeux de combats, les matches se disputent en un seul round."}, {"id": "snes_027", "s": "snes", "n": 27, "t": "King Arthur's World", "y": 1993, "dv": "Argonaut", "p": "Jaleco", "g": "Stratégie, Puzzle-Game", "r": 0, "img": "snes/027.webp", "shot": "shots/snes/027.webp", "d": "Dans King Arthur's World sur Super NES, vous incarnez le roi Arthur et guidez votre armée à la bataille. Vous dirigez chaque membre de l'armée avec un pointeur et leur donnez des ordres en fonction des actions qu'ils peuvent réaliser. Les archers, par exemple, peuvent envoyer des flèches plus ou moins longues. Quelques missions d'entraînement permettent de bien prendre en main le jeu avant de commencer l'aventure."}, {"id": "snes_028", "s": "snes", "n": 28, "t": "Kirby's Dream Course", "y": 1995, "dv": "Hal Laboratory", "p": "Nintendo", "g": "Sport", "r": 1, "img": "snes/028.webp", "shot": "shots/snes/028.webp", "d": "Kirby's Dream Course est un nouveau jeu sur Super Nintendo mettant en vedette Kirby, la petite mascotte rose de Nintendo. Dans ce jeu, Kirby se met en boule et vous devez le diriger dans les trous, comme dans un jeu de golf. Cependant, il faut faire attention à éliminer tous les ennemis à l'écran avant d'atteindre l'objectif. Il y a 64 trous à parcourir au total, répartis en huit courses."}, {"id": "snes_029", "s": "snes", "n": 29, "t": "Kirby's Fun Pak", "y": 1997, "dv": "Hal Laboratory", "p": "Nintendo", "g": "Plateforme", "r": 2, "img": "snes/029.webp", "shot": "shots/snes/029.webp", "d": "Kirby, l'une des mascottes de Nintendo, fait son retour sur Super Nintendo dans Kirby's Super Star. Ce titre est une compilation de huit jeux qu'il faut débloquer progressivement. Chacun d'entre eux est un niveau de plates-formes proposant une manière de jouer différente. Pour parcourir cet univers, Kirby utilise ses capacités spéciales et avale ses adversaires pour s'approprier leurs compétences. A deux, le jeu se transforme en party-game."}, {"id": "snes_030", "s": "snes", "n": 30, "t": "Kirby's Ghost Trap", "y": 1995, "dv": "Hal Laboratory", "p": "Banpresto", "g": "Puzzle-Game", "r": 0, "img": "snes/030.webp", "shot": "shots/snes/030.webp", "d": "Kirby's Avalanche est une version du célèbre puzzle-game Puyo Puyo avec un habillage reprenant les personnages de la maison. Le gameplay n'a pas changé d'un pouce : il s'agit toujours de diriger un duo de 2 blobs colorés tombant du haut de l'écran pour les mettre en contact les uns avec les autres. Si quatre de la même couleur se touchent, alors ils disparaissent. Il faut essayer de réaliser des combinaisons pour faire disparaitre plusieurs groupes de couleurs différentes en un coup. Les modes de jeu disponibles sont les habituels duels (contre le CPU ou un autre joueur) et le mode \"endless\" appelé \"practice\" ici."}, {"id": "snes_031", "s": "snes", "n": 31, "t": "Le Roi Lion", "y": 1994, "dv": "Westwood Studios", "p": "Virgin", "g": "Action, Plateforme", "r": 0, "img": "snes/031.webp", "shot": "shots/snes/031.webp", "d": "Le Roi Lion est l'adaptation sur Super Nintendo du film de Disney sorti en 1994. Vous parcourez la savane avec Simba, de son plus jeune âge jusqu'à son retour dans la tribu des lions à l'âge adulte. Tous les personnages et passages du film sont présents, de même que les musiques qui permettent aux nostalgiques de plonger pleinement dans l'univers d'un des classiques de Disney."}, {"id": "snes_032", "s": "snes", "n": 32, "t": "Lufia", "y": 1996, "dv": "Neverland", "p": "Taito", "g": "Jeu De Rôles", "r": 1, "img": "snes/032.webp", "shot": "shots/snes/032.webp", "d": "Lufia (Lufia II : Rise of the Sinistrals aux US) est le deuxième épisode sur Super NES, bien que son histoire se déroule avant celle du premier volet (jamais sorti en Europe). Le jeune guerrier Maxim, qui avait vaincu les Sinistrals au début du premier volet, part à l'aventure avec d'autres personnages dont Artea, Guy et Selan avec qui il affronte les Sinistrals. La réputation de cette série de jeux de rôle est préservée en ce qui concerne la difficulté des énigmes dans les donjons."}, {"id": "snes_033", "s": "snes", "n": 33, "t": "Mario Paint", "y": 1992, "dv": "Nintendo", "p": "Nintendo", "g": "Ludo-Educatif", "r": 0, "img": "snes/033.webp", "shot": "shots/snes/033.webp", "d": "Mario Paint vous permet de développer vos talents de dessinateur sur votre Super Nintendo. Avec la souris officielle de la console, vous dirigez le pinceau ou l'un des autres outils pour réaliser les dessins à partir d'une feuille blanche ou en reprenant des motifs et des fonds de l'univers de Mario. Un jeu de musique permet de créer vos compositions note par note et pour la détente, un mini-jeu propose de taper sur des mouches avec le curseur de la souris en forme de tapette."}, {"id": "snes_034", "s": "snes", "n": 34, "t": "Mega Man 7", "y": 1995, "dv": "Capcom", "p": "Capcom", "g": "Action, Plateforme", "r": 1, "img": "snes/034.webp", "shot": "shots/snes/034.webp", "d": "Les robots passent de nouveau à l'attaque dans Mega Man 7 sur Super Nes. Ce jeu d'action plate-forme vous permet de retrouver le brave Mega Man dans sa lutte acharnée contre 8 nouvelles créations du Dr Wily. Comme d'habitude, le héros hérite des pouvoirs de ses ennemis détruits."}, {"id": "snes_035", "s": "snes", "n": 35, "t": "Mega Man X", "y": 1994, "dv": "Capcom", "p": "Capcom", "g": "Action, Plateforme", "r": 2, "img": "snes/035.webp", "shot": "shots/snes/035.webp", "d": "À la fin de sa vie, le Dr Light réussit à créer le premier d'une série de robots qui vont révolutionner le monde. Capable de penser et de prendre des décisions, ce robot exclusif représente une menace réelle mais offre aussi de grandes possibilités. Appréhendant de révéler au monde sa création, le Dr Light décide de la sceller dans une capsule et de tester ses systèmes jusqu'à ce qu'ils soient totalement fiables. Le futur devra décider de son sort... Libéré de sa capsule par le Dr Cain, \"X\" naît dans le monde du futur, là où les révoltes des robots ne sont plus qu'un mauvais souvenir. Quand le Dr Cain tente de concrétiser les avant-projets du Dr Light en produisant une série de Réploïdes, l'expérience tourne au cauchemar. Maintenant, le monde est au bord de la destruction. Un nouveau Mega Man doit surgir pour affronter Sigma et ses troupes avant que l'espèce humaine disparaisse de la planète!"}, {"id": "snes_036", "s": "snes", "n": 36, "t": "Mega Man X2", "y": 1995, "dv": "Capcom", "p": "Capcom", "g": "Action, Plateforme", "r": 1, "img": "snes/036.webp", "shot": "shots/snes/036.webp", "d": "X est de retour... Mais cette fois il est encore plus rapide et plus dangereux. Dr. Light donne à Mega Man des capacités nouvelles incroyables qui sont cachées dans des capsules enterrées profondément sous la surface de la terre. C'est avec elles qu'il faut vaincre 21 X-hunter pour rendre la paix à la Terre."}, {"id": "snes_037", "s": "snes", "n": 37, "t": "Mega Man X3", "y": 1996, "dv": "Capcom", "p": "Capcom", "g": "Action, Plateforme", "r": 1, "img": "snes/037.webp", "shot": "shots/snes/037.webp", "d": "Après la défaite des Mavericks dans les épisodes précédents, les robots vivent en paix avec les humains. Mais les Mavericks d'origine reviennent à la charge et menacent l'équilibre. Mega Man et Zero sont rappelés sur le devant de la scène pour contrer la nouvelle attaque. Mega Man X3 sur Super Nes propose 8 niveaux d'action plates-formes qui conduisent tous vers un boss différent à affronter."}, {"id": "snes_038", "s": "snes", "n": 38, "t": "Metal Combat : Falcon's Revenge", "y": 1993, "dv": "Intelligent Systems", "p": "Nintendo", "g": "Tir Avec Accessoire", "r": 0, "img": "snes/038.webp", "shot": "shots/snes/038.webp", "d": "Metal Combat : Falcon's Revenge est la suite de Battle Clash sur Super Nintendo. Le héros du précédent épisode remonte dans son robot appelé Falcon pour affronter une nouvelle fois le Chef de Battle Game. Le joueur ne dirige que le pointeur du fusil du Falcon à l'aide du Super Scope, le bazooka officiel de la console, qui est obligatoire pour pouvoir jouer. Les tirs, qui doivent être gérés avec une jauge, peuvent être accompagnés de bombes et autres canons dans certains niveaux."}, {"id": "snes_039", "s": "snes", "n": 39, "t": "Mortal Kombat", "y": 1993, "dv": "Midway", "p": "Acclaim", "g": "Action, Combat", "r": 0, "img": "snes/039.webp", "shot": "shots/snes/039.webp", "d": "Battez vos adversaires pour défier le guerrier Shokan nommé Goro, champion du tournoi depuis plus de 500 ans. Adaptation du célébrissime jeu d'arcade, Super NES sur Game Gear vous permet d'incarner 8 prétendants à la victoire finale, dont les protégés du seigneur Raiden, seuls remparts contre la menace qui pèse sur le Royaume de la Terre."}, {"id": "snes_040", "s": "snes", "n": 40, "t": "Mortal Kombat II", "y": 1994, "dv": "Midway", "p": "Acclaim", "g": "Action, Combat", "r": 2, "img": "snes/040.webp", "shot": "shots/snes/040.webp", "d": "Mortal Kombat II, est un jeu de combat sur Super NES. Combos, fatalités et autres coups spéciaux, tels sont les ingrédients qui fondent le succès d'un jeu réputé pour la violence de ses affrontements. Le joueur incarne l'un des 12 personnages et doit vaincre un par un l'ensemble de ses concurrents directs pour gagner le tournoi et mettre un terme au règne du maléfique Shao Kahn."}, {"id": "snes_041", "s": "snes", "n": 41, "t": "Mystic Quest Legend", "y": 1994, "dv": "Square Enix", "p": "Square Enix", "g": "Jeu De Rôles", "r": 0, "img": "snes/041.webp", "shot": "shots/snes/041.webp", "d": "Mystic Quest Legend est un épisode hors série de la saga Final Fantasy développé au départ pour le marché américain. Un jeune garçon, a été désigné par l'Oracle pour retrouver les quatre cristaux représentant les éléments afin de rétablir la paix et la lumière dans le monde. Il rencontrera de nombreux personnages au cours de sa quête, à commencer par Kaéli, une jeune bucheronne du village Foresta."}, {"id": "snes_042", "s": "snes", "n": 42, "t": "NBA Jam", "y": 1994, "dv": "Midway", "p": "Acclaim", "g": "Sport", "r": 1, "img": "snes/042.webp", "shot": "shots/snes/042.webp", "d": "NBA Jam sur Super Nintendo est le premier jeu de basket à proposer de jouer avec des joueurs professionnels mais avec les règles de la rue. Les matches se disputent donc en deux contre deux et les fautes sont presque absentes. En revanche, les actions sont volontairement irréalistes, afin de pouvoir admirer ses stars de NBA préférées réaliser des dunks de plusieurs mètres de hauteur, tout en faisant des figures spectaculaires."}, {"id": "snes_043", "s": "snes", "n": 43, "t": "NBA Jam : Tournament Edition", "y": 1995, "dv": "Iguana Entertainment", "p": "Acclaim", "g": "Sport", "r": 0, "img": "snes/043.webp", "shot": "shots/snes/043.webp", "d": "NBA Jam : Tournament Edition sur Super NES reprend le principe de NBA Jam sorti quelques mois plus tôt en ajoutant un mode tournoi. Les matches se disputent toujours en deux contre deux, avec des règles atténuées au profit de l'action. L'intérêt du mode tournoi réside dans les bonus à débloquer, à savoir deux nouveaux joueurs pour pratiquement toutes les équipes ainsi qu'un mode de difficulté supérieur."}, {"id": "snes_044", "s": "snes", "n": 44, "t": "Nigel Mansell's World Championship Racing", "y": 1993, "dv": "Gametek", "p": "Gremlin Interactive", "g": "Course, Conduite", "r": 0, "img": "snes/044.webp", "shot": "shots/snes/044.webp", "d": "Nigel Mansell's World Championship sur Super Nintendo reprend l'intégralité de la saison 1992 de Formule 1, année où Nigel Mansell fut sacré champion du monde. Au volant de la voiture du Britannique, vous disputez le championnat aux côtés des onze autres pilotes, qui ont tous les noms réels de la saison 92 comme Alesi ou Schumacher. A chaque grand prix, on peut régler les ailerons et la transmission de vitesse de la voiture et même choisir ses pneus."}, {"id": "snes_045", "s": "snes", "n": 45, "t": "Pilotwings", "y": 1993, "dv": "Nintendo", "p": "Nintendo", "g": "Simulation", "r": 1, "img": "snes/045.webp", "shot": "shots/snes/045.webp", "d": "Pilotwings vous apprend à piloter votre Super Nintendo. Aux commandes d'un avion ou d'un hélicoptère, vous apprendrez à piloter en suivant les missions, du décollage à l'atterrissage, en passant par le tir. Vous devrez également maîtriser le saut en parachute depuis votre avion en essayant d'atterrir sur une cible au sol."}, {"id": "snes_046", "s": "snes", "n": 46, "t": "Plok", "y": 1993, "dv": "Software Creations", "p": "Nintendo", "g": "Action, Plateforme", "r": 0, "img": "snes/046.webp", "shot": "shots/snes/046.webp", "d": "Plok est le nom d'un petit personnage étrange qui vit ses aventures sur Super Nintendo. Se levant un matin, il découvre que le drapeau accroché à sa maison a disparu. Il va alors parcourir toute l'île à la recherche de ce dernier. Dans les niveaux, il peut éviter les obstacles en sautant normalement ou en faisant un saut spécial. Des coffres lui donnent des costumes lui permettant d'éliminer les ennemis, comme la tenue de chasseur ou la transformation en véhicule."}, {"id": "snes_047", "s": "snes", "n": 47, "t": "Pocky & Rocky", "y": 1993, "dv": "Natsume", "p": "Natsume", "g": "Action, Shoot'em Up", "r": 0, "img": "snes/047.webp", "shot": "shots/snes/047.webp", "d": "Pocky & Rocky sur Super Nintendo est la suite du jeu d'action sorti en 1987 sous le nom Kiki Kaikai. La jeune Pocky et son raton laveur Rocky doivent défendre les temples et sanctuaires d'une invasion de monstres. Pocky attaque avec son bâton et des cartes et possède une attaque spéciale lui permettant de tourner comme une toupie pour terrasser ses adversaires, alors que Rocky se défend avec sa queue et des feuilles et peut se transformer en statue invulnérable."}, {"id": "snes_048", "s": "snes", "n": 48, "t": "Prehistorik Man", "y": 1996, "dv": "Titus", "p": "Titus", "g": "Action, Plateforme", "r": 0, "img": "snes/048.webp", "shot": "shots/snes/048.webp", "d": "Redevenez un homme des cavernes grâce à Prehistorik Man sur Super Nintendo. Toute la nourriture du village a été volée durant la nuit. En tant que héros du village, Sam doit aller chercher des os pour pouvoir les échanger contre de la nourriture. Vous êtes accompagné par le chef et un guide qui vous donneront des conseils, ainsi que par le forgeron et l'inventeur du village qui vous fourniront des objets. En
